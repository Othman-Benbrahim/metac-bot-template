# Catalogue de veille de la carte (bot 0.10.480 ; secours 0.10.481). Décision de l'auteur, 2026-11-23, 19 h 08 - 20 h 10 :
# - au niveau de chaque fiche, une partie « Ressources » : des liens dont le titre indique la source, puis, en dessous,
#   une veille de flux RSS ;
# - des flux RSS dans tous les compartiments qu'on peut remplir de façon cohérente, après recherche par thème ;
# - à ne pas mélanger avec les familles RSS du collecteur des signaux (elles restent à part, au niveau de la fiche).
# Flux et liens proposés par Claude, acceptés par défaut (consigne de l'auteur, 20 h 10). Le collecteur (veille.py)
# respecte robots.txt, ne conserve que titre, lien et date de chaque article, et signale les flux qui ne répondent pas :
# un flux muet n'apparaît pas sur la carte. Équilibre : pour un conflit, des émetteurs des deux côtés, et les médias
# d'État signalés comme tels.
# 0.10.481 (premier passage, 23 nov., 73 flux lisibles sur 100) : chaque flux peut porter des adresses de secours,
# essayées dans l'ordre s'il est muet. Un refus du site (robots.txt, 403) n'est jamais contourné : le secours est alors une
# autre source du même rôle (Times of Israel → Jerusalem Post, Bulletin → Arms Control Association, MINING.COM → Mining
# Technology). 0.10.483 : les flux ONU Info (404 en anglais et en français) et le FMI sont remplacés par d'autres
# sources du même rôle (identifiants conservés pour les fiches) ; AIEA, NASA EO, Arctic Today, Bulletin reçoivent d'autres
# secours. Pour arXiv, le secours est l'adresse des flux que le site indique lui-même (rss.arxiv.org), robots.txt vérifié.

flux:
  # --- ONU : régions et thèmes
  un_monde: {titre: "ONU Info (UN News), toutes les nouvelles", url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml", secours: ["https://news.un.org/feed/subscribe/fr/news/all/rss.xml", {url: "https://reliefweb.int/headlines/rss.xml", titre: "ReliefWeb (OCHA, ONU), titres"}]}
