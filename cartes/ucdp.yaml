# Standard de lecture d'une carte publiée (bot 0.10.470, décision de l'auteur du 2026-11-23, 7 h 38 - 7 h 53 :
# « comme un flux RSS, mais pour les cartes »). Le lecteur générique lecture_cartes.py applique ce fichier : il trouve
# les fichiers sur la page de l'émetteur, les lit, en tire des AGRÉGATS (jamais les lignes ni le texte), garde la
# référence (adresse, date, empreinte), puis supprime le fichier téléchargé.
id: ucdp
nom: UCDP, événements de violence organisée géoréférencés (GED) et événements candidats mensuels
emetteur: Uppsala Conflict Data Program, université d'Uppsala
licence: CC BY 4.0 (citer Sundberg et Melander, 2013, et Davies et al., 2026 pour la GED ; Hegre et al., 2020 pour les candidats)
page: https://ucdp.uu.se/downloads/
frequence: mensuelle            # le jeu candidat paraît chaque mois, avec au plus un mois de retard
fichiers:                       # motif du lien sur la page ; on prend la version la plus récente de chaque rôle
- role: historique
  motif: 'downloads/ged/ged(\d+)-csv\.zip'
  format: csv_zip
- role: cumul_annee
  motif: 'downloads/candidateged/GEDEvent_v(\d+)_01_(\d+)_(\d+)\.csv'
  format: csv
- role: mois
  motif: 'downloads/candidateged/GEDEvent_v(\d+)_0_(\d+)\.csv'
  format: csv
lecture:
  date: date_start              # colonne de date (AAAA-MM-JJ…)
  pays: country                 # nom du pays selon l'UCDP
  code_pays: country_id         # code Gleditsch et Ward
  categorie: type_of_violence   # 1 = étatique, 2 = non étatique, 3 = contre des civils
  somme: best                   # meilleure estimation des morts
  agregat: pays_mois            # une ligne par pays et par mois
  # 0.10.472 (décision de l'auteur, 2026-11-23, 8 h 21) : la matière déjà téléchargée et jusque-là jetée
  somme_par_categorie: true     # morts par type de violence (1, 2, 3), pas seulement le nombre d'événements
  sommes:
    morts_civils: deaths_civilians
  distincts:
    regions: adm_1              # nombre de régions (premier niveau administratif) touchées dans le mois
  principaux:                   # les trois acteurs (camp A ou B) qui pèsent le plus dans les morts du mois
    colonnes: [side_a, side_b]
    nombre: 3
  # 0.10.493 (décision de l'auteur, 2026-11-24, 14 h 58) : comptes par paire de camps et par mois (événements, morts),
  # écrits à part dans registre/cartes/ucdp-dyades-mois.csv ; sert aux questions « A frappera-t-il B avant telle date ? »
  dyades:
    colonnes: [side_a, side_b]
priorite: [mois, cumul_annee, historique]   # pour un même mois, la source la plus récente l'emporte
