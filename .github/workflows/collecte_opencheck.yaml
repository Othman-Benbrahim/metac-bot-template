name: "Collecte OpenCheck (qui détient les groupes de médias et les plateformes ; ombre)"

# 0.10.353 : chaînes de détention (demande de l auteur du 2026-11-19) ; lancée à la main ;
# rien n'entre dans le bot. preenregistrements/sources-hors-cadre.md
on:
  workflow_dispatch:

concurrency:
  group: collecte-opencheck
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_opencheck.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/opencheck-proprietaires.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : OpenCheck du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
