name: "Collecte PA-X (accords de paix, Université d'Édimbourg)"

# 0.10.500 (décision de l'auteur du 2026-11-24, 16 h 16) : métadonnées des accords (processus, stade, date), aucun texte.
# Lancée à la main ; PA-X publie une version par an environ.
on:
  workflow_dispatch:

concurrency:
  group: collecte-pax
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_pax.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -e registre/pax-accords.csv ]; then git add registre/pax-accords.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : PA-X du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
