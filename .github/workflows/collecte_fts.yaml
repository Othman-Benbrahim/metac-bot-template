name: "Collecte FTS (financement des appels humanitaires)"

# 2026-11-25 (source validée par l'auteur à 5 h 57) : OCHA Financial Tracking Service via le Humanitarian Data Exchange.
# Une fois par semaine (les chiffres de l'année bougent lentement) ; aussi à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 1 * * 1"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_fts.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/fts ]; then git add -f registre/fts; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : FTS du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
