name: "Banc : M avec position écosystémique contre M sans (une fois)"

# 2026-11-21 : préenregistrement preenregistrements/position-ecosysteme.md ; Claude Haiku 4.5 sur les crédits Bedrock
# (décision de l'auteur, 14 h 36 ; crédits jusqu'au 23 novembre). Lancé une fois par l'auteur.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "nombre de questions"
        default: "150"
      budget:
        description: "plafond Bedrock (Haiku, crédits) en dollars"
        default: "15"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_position_ecosysteme:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Restaurer la recherche gelée
        uses: actions/cache/restore@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
          restore-keys: recherche-jugement-
      - name: "Banc : M avec position écosystémique contre M sans"
        run: uv run python banc_position_ecosysteme.py --n "${{ github.event.inputs.n || '150' }}" --budget "${{ github.event.inputs.budget || '15' }}"
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GDELT_PONT: ${{ vars.GDELT_PONT }}
          GDELT_PONT_CLE: ${{ secrets.GDELT_PONT_CLE }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Garder la recherche gelée
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-position-ecosysteme.jsonl registre/banc-position-ecosysteme.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc position écosystémique du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
