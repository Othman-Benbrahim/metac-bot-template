name: "Collecte erreur des sondages infranationale (Wikipédia, ombre)"

# 0.10.376 : lit les pages d'élections infranationales passées (API Wikimedia, permise par robots.txt), archive les
# tableaux de sondages extraits et les chiffres de l'encadré (jamais le texte), puis mesure l'erreur par échelle.
# Aucun modèle de langue. Rien n'entre dans le bot. Lancé une fois par l'auteur.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_erreur_regionale:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Lire les pages (réseau)
        run: uv run python erreur_regionale.py --collecter
      - name: Mesurer (hors réseau)
        if: always()
        run: uv run python erreur_regionale.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/erreur-regionale/archives.jsonl registre/erreur-regionale/mesures.json registre/erreur-regionale/mesures.md; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : erreur des sondages infranationale du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
