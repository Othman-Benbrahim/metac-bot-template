name: Reconstruction de la matrice

# 0.10.8 (Wong et al. 2023, §4.2) : un modèle reçoit les seules définitions des 16 cartes et propose les arêtes ; on
# compare à la matrice du skill. Lancement manuel seulement. Résultat : registre/reconstruction-matrice-<date>.json.

on:
  workflow_dispatch:
    inputs:
      essais:
        description: "Nombre d'essais indépendants (majorité)"
        required: false
        default: "3"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconstruire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Contrôle du skill
        run: python alphabet-situationnel/scripts/moteur.py audit
      - name: Reconstruire
        run: uv run python reconstruction_matrice.py
        env:
          RECONSTRUCTION_ESSAIS: ${{ github.event.inputs.essais }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.FANTASY_API_KEY || secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_BASE: ${{ vars.ALPHABET_API_BASE }}
          ALPHABET_LLM: ${{ vars.ALPHABET_LLM }}
          ALPHABET_PETIT_LLM: ${{ vars.ALPHABET_PETIT_LLM }}
      - name: Enregistrer
        run: |
          if [ -n "$(git status --porcelain registre)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add registre
            git commit -m "registre : reconstruction de la matrice du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
