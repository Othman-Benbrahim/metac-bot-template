name: Collecte hebdomadaire ACAPS (risques, INFORM, ombre)

# 0.10.196 : liste des risques et instantané de l'indice INFORM (ACAPS, API gratuite après inscription) ; rien de posté.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: collecte-acaps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 15
        env:
          ACAPS_USER: ${{ secrets.ACAPS_USER || vars.ACAPS_USER }}
          ACAPS_PASSWORD: ${{ secrets.ACAPS_PASSWORD }}
          ACAPS_TOKEN: ${{ secrets.ACAPS_TOKEN }}
        run: uv run python collecte_acaps.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/acaps-risques.csv registre/acaps-inform.csv; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : ACAPS du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
