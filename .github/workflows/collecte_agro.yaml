name: "Collecte agroclimatique (ERA5-Land, US Drought Monitor)"

# 2026-11-21 : écosystème « alimentation mondiale » (décision de l'auteur, 18 h 10-18 h 17) ; aucun modèle ; rien
# n'entre dans le bot. ERA5-Land : clé gratuite du Climate Data Store (secret CDS_API_KEY).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"   # chaque jour

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_agro:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecter
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: uv run python -u collecte_agro.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/era5land-points.csv registre/secheresse-usdm.csv; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : agroclimat du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
