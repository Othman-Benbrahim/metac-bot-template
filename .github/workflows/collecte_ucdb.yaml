name: "Collecte GHS-UCDB (centres urbains)"

# 2026-11-25 (source validée par l'auteur à 10 h 57) : GHS-UCDB R2024A, centres urbains du monde (JRC, CC BY 4.0).
# Une fois par mois (données annuelles et projections) ; aussi à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_ucdb.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/ucdb ]; then git add -f registre/ucdb; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : UCDB du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
