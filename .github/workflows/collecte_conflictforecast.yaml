name: Collecte ConflictForecast (prévisions concurrentes, ombre)

# 0.10.230 : prévisions mensuelles de ConflictForecast (Mueller et Rauh), toutes les versions publiées, fichiers
# nationaux seulement ; API ouverte et gratuite, usage non lucratif, citation obligatoire. Rien de posté.
on:
  schedule:
    - cron: "23 6 25 * *"   # une fois par mois, après la mise à jour du « best model » (après le 20)
  workflow_dispatch:

concurrency:
  group: collecte-conflictforecast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 90
        run: uv run python collecte_conflictforecast.py
      - name: Banc ConflictForecast contre B (0.10.231, aucun modèle de langue)
        timeout-minutes: 15
        run: uv run python banc_conflictforecast.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/conflictforecast.csv registre/banc-conflictforecast.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : ConflictForecast du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
