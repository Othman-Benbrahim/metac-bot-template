name: "Essai : millésimes FRED, couverture des fourchettes sur la première publication (mesure descriptive)"

# 2026-11-21 : essai préenregistré (mesure descriptive (veille ML4T, chapitre 4)), aucun appel de modèle, lancé une fois par l'auteur.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  millesimes_fred:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Lancer
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python mise_au_point/millesimes_fred.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/mise-au-point/millesimes-fred.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : millesimes_fred du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
