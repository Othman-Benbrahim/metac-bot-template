name: Score du bot alphabet

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"   # chaque nuit (décision de l'auteur du 2026-11-24, 21 h 44 ; avant : le lundi) : issues, score, sondes ; avant la carte (2 h 41 UTC)

concurrency:
  group: bot-alphabet-registre   # jamais en même temps qu'une écriture du registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Scorer
        run: |
          if [ -f registre/journal-bot.jsonl ]; then
            uv run python score_registre.py --metaculus --enregistrer
          else
            echo "Registre vide : rien à scorer."
          fi
        env:
          # 0.10.193 : le jeton du compte bot ne voit pas les résolutions (question.resolution = None) ; un jeton de
          # lecture d'un compte personnel (secret METACULUS_TOKEN_LECTURE) est pris en priorité s'il existe
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_LECTURE || secrets.METACULUS_TOKEN }}
      - name: Couverture des fourchettes numériques (0.10.293, descriptif)
        run: uv run python couverture_numerique.py || true
      - name: Choix multiple, mélange 85 % bot + 15 % répartition égale (préenregistré le 2026-11-20)
        run: uv run python choix_multiple_ancre.py || true
      - name: Suivi en avant des liens d'acteurs (observation, 2026-11-20)
        run: uv run python suivi_liens.py || true
      - name: Cotes Polymarket en ombre, bilan (préenregistré le 2026-11-20, 0.10.408)
        run: uv run python cotes_ombre.py --suivi || true
      - name: Sondes de l'écosystème (0.10.509 ; étalon des 6 derniers mois, règle d'arrêt par e-valeurs)
        run: uv run python sondes_etat.py || true
      - name: Juge informé, règle d'arrêt par e-valeur (0.10.510, preenregistrements/dossier-interne.md)
        run: uv run python juge.py || true
      - name: Pépinière de l'arbre (0.10.8)
        run: |
          if [ -f registre/journal-bot.jsonl ]; then uv run python pepiniere.py --enregistrer; fi
          if [ -f registre/journal-bot.jsonl ]; then uv run python episodes.py --enregistrer; fi   # 0.10.9 : N × D
          # 0.10.30 (skill §47) : λ appris en ombre, sur le registre du bot et celui du banc alphabet-chaine (public)
          git clone -q --depth 1 https://github.com/Othman-Benbrahim/alphabet-chaine /tmp/chaine || true
          if [ -d /tmp/chaine/registre ]; then uv run python apprentissage_lambda.py --chaine /tmp/chaine/registre --enregistrer; else uv run python apprentissage_lambda.py --enregistrer; fi
      - name: Enregistrer
        run: |
          if [ -n "$(git status --porcelain registre)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add registre
            git commit -m "registre : issues et score du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
