name: Indicateurs de niche (Wikipedia modifié, prix alimentaires, vols, Telegram) et observatoire inductif

# 0.10.138 : modifications des pages politiques Wikipedia et prix alimentaires WFP, mesurés avant la date de chaque
# question du banc des indicateurs pertinents, puis observatoire inductif (lot après lot). Gratuit, rien de posté.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  indicateurs_niche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Telethon (lecture de Telegram, hors du verrou du bot)
        run: uv pip install "telethon==1.42.0"
      - name: Indicateurs de niche
        timeout-minutes: 90
        run: uv run --no-sync python indicateurs_niche.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || vars.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || vars.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION || vars.TELEGRAM_SESSION }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID || vars.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET || vars.OPENSKY_CLIENT_SECRET }}
      - name: Observatoire inductif
        run: uv run --no-sync python induction.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/indicateurs-niche.jsonl; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : indicateurs de niche du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
