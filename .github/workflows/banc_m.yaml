name: Banc des jugements intermédiaires

# 0.10.124 : jugements intermédiaires avant le jugement global (thèse d'O. Sibony, 2017), questions de conflits jamais lues.
# Trois appels gpt-5-mini et une recherche par question (crédits Azure) ; plafond en dollars. Registre : registre/banc-m.jsonl.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "nombre de questions"
        default: "150"
      budget:
        description: "plafond en dollars pour ce passage"
        default: "3"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc des jugements intermédiaires
        run: uv run python banc_m.py --n "${{ github.event.inputs.n || '150' }}" --budget "${{ github.event.inputs.budget || '3' }}"
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-m.jsonl registre/banc-m.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc du langage du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
