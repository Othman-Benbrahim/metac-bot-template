name: "Collecte Elo (classements de force des compétitions)"

# 2026-11-24 (sources validées par l'auteur à 23 h 24) : Club Elo, résultats internationaux (CC0), tennis Sackmann
# (CC BY-NC-SA 4.0), NFL nflverse (CC BY 4.0). Chaque nuit, avant le score et la carte ; aussi à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "13 1 * * *"

concurrency:
  group: collecte-elo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Grands tournois de tennis récents (Wikipédia, décision de l'auteur du 2026-11-26)
        run: uv run python -u collecte_tennis_wiki.py || true
      - name: Collecte
        run: uv run python -u collecte_elo.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/elo ]; then git add -f registre/elo; fi
          if [ -d registre/tennis-wiki ]; then git add -f registre/tennis-wiki; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : Elo du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
