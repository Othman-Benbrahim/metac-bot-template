name: Veilleur du tournoi (lance le bot dès qu'une question s'ouvre)

# 0.10.278 (décision d'auteur du 2026-11-18, 17 h 12) : jour et nuit, toutes les 15 minutes, aucun coût (veilleur.py).
# Le déclenchement horaire ne sert qu'à le redémarrer s'il s'est arrêté ; un seul veilleur tourne à la fois.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: veilleur
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  veiller:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run python -u veilleur.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
