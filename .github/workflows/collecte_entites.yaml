name: "Collecte des entités (dirigeants, PDG, institutions)"

# 2026-11-25 (sources validées par l'auteur à 13 h 20 : OpenSanctions / CIA World Leaders, Wikidata) : liste des entités
# prioritaires des briefs, mise à jour chaque semaine (lundi, avant les briefs de la nuit) ; aussi à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 1 * * 1"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_entites.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/entites ]; then git add -f registre/entites; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : entités du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
