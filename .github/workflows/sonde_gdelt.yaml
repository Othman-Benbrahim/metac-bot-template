name: "Sonde GDELT (questions sans recherche)"

# 0.10.264 : la vraie réponse de GDELT, sans modèle, sans coût.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Sonde
        run: uv run python -u sonde_gdelt.py
        env:
          GDELT_PONT: ${{ vars.GDELT_PONT }}
          GDELT_PONT_CLE: ${{ secrets.GDELT_PONT_CLE }}
        timeout-minutes: 80
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -e registre/sonde-gdelt.json ]; then git add registre/sonde-gdelt.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : sonde GDELT du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
