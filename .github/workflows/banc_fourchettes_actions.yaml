name: "Banc fourchettes de prix des actions (Twelve Data ; ombre)"

# 0.10.401 : calibrage des fourchettes de prix sur les actions ; cours lus à la demande, jamais enregistrés.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_fourchettes_actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecter
        run: uv run python mise_au_point/fourchettes_essai.py --actions
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -f registre/mise-au-point/fourchettes-actions.json ]; then git add registre/mise-au-point/fourchettes-actions.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc fourchettes actions du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
