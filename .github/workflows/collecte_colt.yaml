name: "Collecte COLT (voyages des dirigeants)"

# 0.10.504 (décision de l'auteur du 2026-11-24, 16 h 52) : voyages des chefs d'État et de gouvernement depuis 1990.
# Lancée à la main ; une version par an.
on:
  workflow_dispatch:

concurrency:
  group: collecte-colt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_colt.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/colt ]; then git add registre/colt; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : COLT du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
