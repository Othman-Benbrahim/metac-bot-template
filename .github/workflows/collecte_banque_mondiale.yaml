name: "Collecte Banque mondiale (indicateurs WDI en bloc ; hors cadre)"

# 0.10.463 (décision de l'auteur, 2026-11-22, 19 h 41) : terrain pour l'observation de H2 (signal × terrain), sans tri
# théorique des variables. Lancée à la main ; rien n'entre dans le bot.
on:
  workflow_dispatch:

concurrency:
  group: collecte-banque-mondiale
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_banque_mondiale.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banque-mondiale-wdi.csv.gz registre/banque-mondiale-indicateurs.csv; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : Banque mondiale du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
