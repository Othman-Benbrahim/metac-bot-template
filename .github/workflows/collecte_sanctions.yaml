name: Collecte quotidienne des sanctions (OFAC, Royaume-Uni, ombre)

# 0.10.178 : nouvelles désignations par pays visé (OFAC, domaine public ; GOV.UK, Open Government Licence) ; rien de
# posté. Premier passage à la main avec « depuis » pour l'historique.
on:
  # 0.10.246 : plus de tâche programmée propre : lancée la nuit par le planificateur (planificateur.yaml)
  workflow_dispatch:
    inputs:
      depuis:
        description: "premier jour à lire (AAAA-MM-JJ) ; vide = les 10 derniers jours"
        default: ""

concurrency:
  group: collecte-sanctions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 30
        run: uv run python collecte_sanctions.py --depuis "${{ github.event.inputs.depuis }}"
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/sanctions.csv registre/sanctions-couverture.txt; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : sanctions du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
