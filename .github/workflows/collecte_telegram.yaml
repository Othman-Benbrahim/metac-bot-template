name: Observatoire Telegram (métadonnées seulement, ombre)

# 0.10.250 : aperçus publics t.me/s/<chaîne> ; on garde l'heure, les vues, les relais et les liens entre chaînes,
# jamais le texte. Liste de chaînes qui se met à jour chaque mois par les relais (collecte_telegram.py).
on:
  # lancée la nuit par le planificateur (planificateur.yaml)
  workflow_dispatch:

concurrency:
  group: collecte-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 40
        run: uv run python collecte_telegram.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/telegram-chaines.csv registre/telegram-messages.csv registre/telegram-releves.csv registre/telegram-liste-journal.csv; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : observatoire Telegram du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
