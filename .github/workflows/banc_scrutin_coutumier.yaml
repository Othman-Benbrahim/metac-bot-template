name: "Banc brique scrutin coutumière (règles sourcées, ombre)"

# 0.10.372 : préenregistrement preenregistrements/scrutin-coutumier.md (essai scrutin_coutumier). Hors réseau, sur les
# archives de banc_scrutin. Une seule exécution, par l'auteur. Aucun modèle de langue. Rien n'entre dans le bot.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_scrutin_coutumier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Couverture (sans les issues)
        run: uv run python brique_coutumiere.py --couverture
      - name: Évaluer
        run: uv run python brique_coutumiere.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          uv run python socle_ecosystemique.py || true
          for f in registre/banc-scrutin-coutumier.json registre/scrutins/detail-coutumier.jsonl registre/socle-ecosystemique.json registre/socle-ecosystemique.md; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc de la brique scrutin coutumière du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
