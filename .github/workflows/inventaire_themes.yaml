name: "Inventaire des thèmes du tournoi (écosystèmes)"

# 0.10.314 : lecture seule côté Metaculus ; gpt-5-mini range chaque question dans un ou deux thèmes. Rien n'entre dans le bot.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "plafond Azure (gpt-5-mini) en dollars"
        default: "0.5"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventaire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Inventaire
        run: uv run python -u inventaire_themes.py --budget "${{ github.event.inputs.budget || '0.5' }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/inventaire-themes.jsonl registre/inventaire-themes.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : inventaire des thèmes du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
