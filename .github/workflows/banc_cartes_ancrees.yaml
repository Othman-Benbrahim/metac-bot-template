name: "Banc jugement : cartes ancrées"

# 0.10.274 : faits cités, vérifiés et notés par le code ; accord gpt-5-mini / Haiku. preenregistrements/cartes-ancrees.md
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "plafond Azure (gpt-5-mini) en dollars"
        default: "1"
      budget_bedrock:
        description: "plafond Bedrock (Haiku, crédits) en dollars"
        default: "3"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ancrees:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Restaurer la recherche gelée
        uses: actions/cache/restore@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
          restore-keys: recherche-jugement-
      - name: "Cartes ancrées"
        run: uv run python -u banc_cartes_ancrees.py --budget "${{ github.event.inputs.budget || '1' }}" --budget-bedrock "${{ github.event.inputs.budget_bedrock || '3' }}"
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GDELT_PONT: ${{ vars.GDELT_PONT }}
          GDELT_PONT_CLE: ${{ secrets.GDELT_PONT_CLE }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Garder la recherche gelée
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-cartes-ancrees.jsonl registre/banc-cartes-ancrees.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc des cartes ancrées du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
