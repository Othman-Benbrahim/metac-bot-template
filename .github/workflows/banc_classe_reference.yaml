name: Banc classe de référence pondérée (ombre)

# 0.10.232 : B par classe de référence pondérée par la ressemblance, contre B, questions fabriquées GDELT. Gratuit.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run python banc_classe_reference.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -e registre/banc-classe-reference.json ]; then git add registre/banc-classe-reference.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : classe de référence du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
