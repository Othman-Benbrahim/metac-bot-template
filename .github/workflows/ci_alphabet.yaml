name: Contrôle du bot alphabet (tests)

# 0.2.0 (audit, rec. 7) : tests hors ligne et audit du skill à chaque push et pull request. Aucun secret, aucun appel
# réseau vers un modèle : gratuit.
on:
  push:
    paths-ignore: ["registre/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Audit du skill (sommes de contrôle)
        run: python alphabet-situationnel/scripts/moteur.py audit
      - name: Tests
        run: uv run python -m unittest discover -s tests -v
        env:
          ALPHABET_SKILL_DIR: alphabet-situationnel
          ALPHABET_REGISTRE: ${{ runner.temp }}/registre-ci
