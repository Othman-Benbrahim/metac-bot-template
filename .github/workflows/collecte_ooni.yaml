name: Collecte quotidienne OONI (censure, ombre)

# 0.10.175 : parts de mesures anormales par pays et par jour (OONI, CC BY-NC-SA 4.0), sites web et messageries ;
# gratuit, sans clé, rien de posté. Premier passage à la main avec « depuis » pour rattraper l'historique.
on:
  schedule:
    - cron: "53 9 * * *"
    - cron: "53 21 * * *"   # second passage : GitHub retarde ou saute des passages programmés
  workflow_dispatch:
    inputs:
      depuis:
        description: "premier jour à lire (AAAA-MM-JJ) ; vide = les 7 derniers jours"
        default: ""

concurrency:
  group: collecte-ooni
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 180
        run: uv run python collecte_ooni.py --depuis "${{ github.event.inputs.depuis }}"
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/ooni-censure.csv registre/ooni-jours.txt; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : OONI censure du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
