name: Banc du taux de base Chronos (modèle de fondation)

# 0.10.132 : B lu sur la distribution prévue par Chronos-2 (modèle de fondation ouvert, sur processeur), contre B, sur les
# questions de séries ForecastBench résolues. Aucun modèle de langue : gratuit. Registre : registre/banc-chronos.jsonl.
on:
  workflow_dispatch:
    inputs:
      apres:
        description: "jeux postérieurs à cette date"
        default: "2026-07-01"
      max:
        description: "questions nouvelles au plus"
        default: "1000"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_chronos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Chronos-2 (torch sur processeur, hors du verrou du bot)
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "chronos-forecasting==2.3.2"
      - name: Banc du taux de base Chronos
        timeout-minutes: 150
        run: uv run --no-sync python banc_chronos.py --apres "${{ github.event.inputs.apres || '2026-07-01' }}" --max "${{ github.event.inputs.max || '1000' }}"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-chronos.jsonl registre/banc-chronos.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc du taux de base Chronos du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
