name: "Collecte Our World in Data"

# 2026-11-25 (source validée par l'auteur à 10 h 57) : graphiques choisis d'Our World in Data (CC BY 4.0).
# Une fois par semaine ; aussi à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 2"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        run: uv run python -u collecte_owid.py
      # 2026-11-25 : réunions eurodéputés - représentants d'intérêts (Integrity Watch EU, ODbL), même rythme hebdomadaire.
      # Placée ici parce que GitHub n'a jamais enregistré un workflow séparé (collecte_lobbying.yaml, retiré).
      - name: Réunions eurodéputés
        if: always()
        run: uv run python -u collecte_lobbying.py
      # 2026-11-25 (validé par l'auteur à 18 h 12) : taux directeurs des banques centrales (BIS, source citée)
      - name: Taux directeurs (BIS)
        if: always()
        run: uv run python -u collecte_bis.py
      # 2026-11-25 (validé par l'auteur à 18 h 29) : élections à venir, liste publique d'IFES ElectionGuide
      - name: Élections à venir (IFES)
        if: always()
        run: uv run python -u collecte_elections_ifes.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/owid ]; then git add -f registre/owid; fi
          if [ -d registre/lobbying ]; then git add -f registre/lobbying; fi
          if [ -d registre/bis ]; then git add -f registre/bis; fi
          if [ -d registre/elections-ifes ]; then git add -f registre/elections-ifes; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : OWID du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
