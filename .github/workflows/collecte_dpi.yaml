name: "Collecte DPI 2023 (acteurs de veto ; ombre)"

# 0.10.397 : Database of Political Institutions 2023 (BID, CC BY 4.0), extrait CHECKS par pays et par année.
# Aucun modèle de langue. Rien n'entre dans le bot.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_dpi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecter
        run: uv run python collecte_dpi.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/dpi ]; then git add registre/dpi; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : DPI 2023 du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
