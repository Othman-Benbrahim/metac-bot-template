name: "Collecte EDGAR et calibrage des résultats d entreprise (ombre)"

# 0.10.405 : résultats trimestriels publiés à la SEC (données publiques) ; adresse de contact en secret, jamais écrite.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"   # chaque jour : un trimestre publié entre dans les données avant la question suivante

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_edgar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecter
        run: uv run python collecte_edgar.py && uv run python mise_au_point/resultats_entreprises_v2_essai.py
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/edgar-trimestres.csv registre/mise-au-point/resultats-entreprises.json registre/mise-au-point/resultats-entreprises-v2.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : EDGAR du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
