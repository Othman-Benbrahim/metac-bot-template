name: Balayage exhaustif des combinaisons (comparé au hasard)

# 0.10.228 : tous les indicateurs seuls, paires et triplets de huit indicateurs, sur les questions fabriquées GDELT,
# comparés à 200 redistributions au hasard. Aucun modèle de langue : gratuit.
# À lancer APRÈS « Calendrier des élections » (historique depuis 2024-06-01).
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  combinaisons_balayage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Combinaisons
        timeout-minutes: 90         # sur l étape, pour que « Enregistrer » garde les lignes écrites
        run: uv run python combinaisons_balayage.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/combinaisons-balayage.json registre/voisins.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : balayage des combinaisons du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
