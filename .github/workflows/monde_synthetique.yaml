name: Monde synthétique

# 0.10.14 (skill §43, d'après LLMMatrix) : situations tirées du programme génératif, racontées sans nommer les cartes,
# relues par le lecteur ; sensibilité et faux positifs mesurés. Manuel. Résultat : registre/monde-synthetique-<date>.json.

on:
  workflow_dispatch:
    inputs:
      situations:
        description: "Nombre de situations tirées"
        required: false
        default: "12"
      narrateur:
        description: "Narrateur : vide = même modèle que le lecteur ; « contradicteur » ; ou un identifiant (ex. bedrock/deepseek.v3.2)"
        required: false
        default: "contradicteur"
      verificateur:
        description: "Vérificateur, d'une troisième famille (ni Claude ni DeepSeek), ex. bedrock/mistral.mistral-large-3-675b-instruct ; vide = petit modèle"
        required: false
        default: "bedrock/mistral.mistral-large-3-675b-instruct"
      strate:
        description: "Strate (7 par défaut, la seule chiffrée)"
        required: false
        default: "7"
      reflexion:
        description: "0.10.36 : relire chaque situation une 2e fois avec la réflexion étendue du lecteur (1 = oui, 0 = non)"
        required: false
        default: "1"
      action:
        description: "mesurer (passage) ; exporter-humain (cahier + grille pour un codeur humain, sans appel de modèle) ; noter-humain (comparer la grille remplie)"
        required: false
        default: "mesurer"
      dossier_humain:
        description: "noter-humain : dossier de la grille remplie, ex. registre/codeur-humain-2026-11-12 ; exporter-humain : nombre de situations (20 par défaut)"
        required: false
        default: ""

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Contrôle du skill
        run: python alphabet-situationnel/scripts/moteur.py audit
      - name: Référence humaine
        if: github.event.inputs.action == 'exporter-humain' || github.event.inputs.action == 'noter-humain'
        run: |
          if [ "${{ github.event.inputs.action }}" = "exporter-humain" ]; then
            uv run python monde_synthetique.py exporter-humain "${{ github.event.inputs.dossier_humain || '20' }}"
          else
            uv run python monde_synthetique.py noter-humain "${{ github.event.inputs.dossier_humain }}" | tee "${{ github.event.inputs.dossier_humain }}/resultat.json"
          fi
      - name: Mesurer le lecteur
        if: github.event.inputs.action == '' || github.event.inputs.action == 'mesurer'
        run: uv run python monde_synthetique.py
        env:
          MONDE_SITUATIONS: ${{ github.event.inputs.situations }}
          MONDE_STRATE: ${{ github.event.inputs.strate }}
          MONDE_NARRATEUR: ${{ github.event.inputs.narrateur }}
          MONDE_VERIFICATEUR: ${{ github.event.inputs.verificateur }}
          MONDE_REFLEXION: ${{ github.event.inputs.reflexion }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.FANTASY_API_KEY || secrets.OPENAI_API_KEY }}
          # 0.10.16 : Amazon Bedrock (provisoire, crédits jusqu'au 23 novembre 2026). Modèles « bedrock/<id> » dans les suites.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_BASE: ${{ vars.ALPHABET_API_BASE }}
          ALPHABET_LLM: ${{ vars.ALPHABET_LLM }}
          ALPHABET_PETIT_LLM: ${{ vars.ALPHABET_PETIT_LLM }}
          ALPHABET_CONTRADICTEUR: ${{ vars.ALPHABET_CONTRADICTEUR }}   # 0.10.24 : sans elle, le narrateur « contradicteur » retombait sur le lecteur
      - name: Enregistrer
        run: |
          if [ -n "$(git status --porcelain registre)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add registre
            git commit -m "registre : monde synthétique du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
