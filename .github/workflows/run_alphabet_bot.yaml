name: Bot alphabet situationnel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tournament, minibench ou test_questions"
        default: "minibench"
      max_questions:
        description: "questions nouvelles au plus pour ce passage (0 = toutes)"
        default: "0"
  # Mode minibench. Les questions ne restent ouvertes que 3 heures, à heure aléatoire.
  # 0.10.278 (2026-11-18) : le déclenchement programmé « toutes les 20 minutes » n'a été honoré que 12 fois en 4 jours
  # (GitHub retarde ou saute ces tâches, et la file partagée avec les bancs les écrasait). C'est désormais le VEILLEUR
  # (veilleur.yaml) qui lance ce bot dès qu'une question nouvelle s'ouvre ; plus de déclenchement programmé ici.
  # 0.6.0 : aucun plafond par défaut (ALPHABET_MAX_QUESTIONS = 0 : toutes les questions ouvertes) ; un plafond
  # quotidien reste possible en donnant un nombre à cette variable. Un contrôle sans question nouvelle ne sonde aucun
  # modèle, ne coûte rien et n'écrit rien dans le dépôt.
concurrency:
  group: bot-alphabet-tournoi   # 0.10.278 : file à part ; les bancs (plusieurs heures) ne bloquent plus le bot
  cancel-in-progress: false

permissions:
  contents: write          # pour enregistrer le registre (journal scellé et dossiers) dans le dépôt

jobs:
  prevoir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Cache du modèle de plongement
        # 0.10.15 : présélection en ombre ; le modèle (~220 Mo) est téléchargé une fois puis gardé en cache.
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Contrôle du skill
        run: python alphabet-situationnel/scripts/moteur.py audit
      - name: GDELT par BigQuery, mise à jour courte (48 h)
        # 0.10.277 : requête groupée pour toutes les questions ouvertes, filtrée chez Google ; sautée sans les secrets
        continue-on-error: true
        timeout-minutes: 10
        run: uv run --with "google-cloud-bigquery==3.27.0" python gdelt_bq.py --mode court
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJET: ${{ vars.GCP_PROJET }}
      - name: Restaurer les recherches capturées (0.10.296)
        uses: actions/cache/restore@v4
        with:
          path: cache/recherche-tournoi
          key: recherche-tournoi-${{ github.run_id }}
          restore-keys: recherche-tournoi-
      - name: Prévoir
        # 0.9.6 : un vrai blocage s'arrête ici, et l'étape « Enregistrer le registre » (if: always()) garde ce qui a été
        # écrit. Un passage de test complet (exploratoire, non binaires) prend 30 à 50 minutes : ne pas l'annuler.
        timeout-minutes: 120
        run: uv run python alphabet_bot.py --mode "${{ github.event.inputs.mode || 'minibench' }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 0.6.0 : avec une passerelle compatible OpenAI (Fantasy AI), sa clé (secret FANTASY_API_KEY) et son adresse
          # (variable ALPHABET_API_BASE) ; les modèles s'écrivent alors « openai/<identifiant> ».
          OPENAI_API_KEY: ${{ secrets.FANTASY_API_KEY || secrets.OPENAI_API_KEY }}
          # 0.10.16 : Amazon Bedrock (provisoire, crédits jusqu'au 23 novembre 2026). Modèles « bedrock/<id> » dans les suites.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
          # 0.9.2 : second fournisseur, en secours quand la clé Fantasy est limitée (modèles « mistral/… » dans les suites)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          OPENAI_API_BASE: ${{ vars.ALPHABET_API_BASE }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GDELT_PONT: ${{ vars.GDELT_PONT }}
          GDELT_PONT_CLE: ${{ secrets.GDELT_PONT_CLE }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}   # 0.10.400 : cours d actions lus à la demande (seuils de prix)
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          ALPHABET_PUITS: ${{ vars.ALPHABET_PUITS }}
          ALPHABET_RECHERCHE_ORDRE: ${{ vars.ALPHABET_RECHERCHE_ORDRE }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ALPHABET_LLM: ${{ vars.ALPHABET_LLM }}
          ALPHABET_CHERCHEUR: ${{ vars.ALPHABET_CHERCHEUR }}
          ALPHABET_CONTRADICTEUR: ${{ vars.ALPHABET_CONTRADICTEUR }}
          ALPHABET_CHERCHEUR_2: ${{ vars.ALPHABET_CHERCHEUR_2 }}
          ALPHABET_VUES: ${{ vars.ALPHABET_VUES }}
          ALPHABET_HISTORIQUE: ${{ vars.ALPHABET_HISTORIQUE }}
          ALPHABET_PETIT_LLM: ${{ vars.ALPHABET_PETIT_LLM }}
          ALPHABET_LECTURE_HORS_STRATE: ${{ vars.ALPHABET_LECTURE_HORS_STRATE }}
          ALPHABET_TRADUCTION: ${{ vars.ALPHABET_TRADUCTION || '1' }}   # 0.10.7 (§37) : allumé par défaut (un appel de plus) ; « 0 » l'éteint
          ALPHABET_PAUSE: ${{ vars.ALPHABET_PAUSE }}             # 0.10.263 : « oui » = aucun passage ne poste
          ALPHABET_POSTER_M: ${{ vars.ALPHABET_POSTER_M }}       # 0.10.263 : « non » = le bras M n'est plus posté
          ALPHABET_ABSTENTION: ${{ vars.ALPHABET_ABSTENTION }}   # 0.10.263 : « oui » = pas de recherche, pas de jugement
          ALPHABET_A_ESSAIS: ${{ vars.ALPHABET_A_ESSAIS }}       # 0.10.5 (§35) : K essais du bras A en ombre (1 = éteint)
          ALPHABET_PRESELECTION: ${{ vars.ALPHABET_PRESELECTION || '1' }}   # 0.10.15 : présélection par plongement, en ombre
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
          ALPHABET_INVARIANCE_TAUX: ${{ vars.ALPHABET_INVARIANCE_TAUX || '0.2' }}
          ALPHABET_NEGATION_TAUX: ${{ vars.ALPHABET_NEGATION_TAUX || '0.2' }}   # 0.10.34 : test de négation, en ombre
          ALPHABET_FIDELITE: ${{ vars.ALPHABET_FIDELITE || '1' }}   # 0.10.35 : relecteur de fidélité du plan, en ombre   # 0.10.11 (§39) : part des questions testées (2 lectures de plus)
          ALPHABET_MAX_QUESTIONS: ${{ github.event.inputs.max_questions || vars.ALPHABET_MAX_QUESTIONS || '0' }}
          # 0.10.33 : budget en dollars depuis une date (vide ou 0 = aucun) ; coûts dans registre/couts.jsonl
          ALPHABET_BUDGET_USD: ${{ vars.ALPHABET_BUDGET_USD }}
          ALPHABET_BUDGET_DEPUIS: ${{ vars.ALPHABET_BUDGET_DEPUIS }}
      - name: Garder les recherches capturées (0.10.296 ; texte jamais publié dans le dépôt)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/recherche-tournoi
          key: recherche-tournoi-${{ github.run_id }}
      - name: Archiver les recherches capturées sur Hugging Face (0.10.297 ; dépôt PRIVÉ, vérifié avant envoi)
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CAPTURES: ${{ vars.HF_CAPTURES }}
        run: uv run --with "huggingface_hub==0.26.2" python archiver_captures.py
      - name: Enregistrer le registre
        if: always()
        run: |
          if [ -n "$(git status --porcelain registre)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add registre
            git commit -m "registre : prévisions du $(date -u +%Y-%m-%dT%H:%MZ)"
            # 0.10.278 : la file du bot n'est plus celle des bancs : un envoi peut croiser le leur ; on retente
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && break
              echo "envoi refusé (essai $i), nouvel essai"; sleep $((i * 10))
            done
          fi
