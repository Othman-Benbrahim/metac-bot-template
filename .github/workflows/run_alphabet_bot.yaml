name: Bot alphabet situationnel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tournament, minibench ou test_questions"
        default: "minibench"
      max_questions:
        description: "questions nouvelles au plus pour ce passage (0 = toutes)"
        default: "0"
  # Mode minibench. Les questions ne restent ouvertes que 3 heures, à heure aléatoire : contrôle toutes les 20 minutes.
  # 0.6.0 : aucun plafond par défaut (ALPHABET_MAX_QUESTIONS = 0 : toutes les questions ouvertes) ; un plafond
  # quotidien reste possible en donnant un nombre à cette variable. Un contrôle sans question nouvelle ne sonde aucun
  # modèle, ne coûte rien et n'écrit rien dans le dépôt.
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: bot-alphabet-registre   # partagé avec le score : une seule écriture du registre à la fois
  cancel-in-progress: false

permissions:
  contents: write          # pour enregistrer le registre (journal scellé et dossiers) dans le dépôt

jobs:
  prevoir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Contrôle du skill
        run: python alphabet-situationnel/scripts/moteur.py audit
      - name: Prévoir
        run: uv run python alphabet_bot.py --mode "${{ github.event.inputs.mode || 'minibench' }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 0.6.0 : avec une passerelle compatible OpenAI (Fantasy AI), sa clé (secret FANTASY_API_KEY) et son adresse
          # (variable ALPHABET_API_BASE) ; les modèles s'écrivent alors « openai/<identifiant> ».
          OPENAI_API_KEY: ${{ secrets.FANTASY_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.ALPHABET_API_BASE }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHABET_RECHERCHE_ORDRE: ${{ vars.ALPHABET_RECHERCHE_ORDRE }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ALPHABET_LLM: ${{ vars.ALPHABET_LLM }}
          ALPHABET_CHERCHEUR: ${{ vars.ALPHABET_CHERCHEUR }}
          ALPHABET_CONTRADICTEUR: ${{ vars.ALPHABET_CONTRADICTEUR }}
          ALPHABET_CHERCHEUR_2: ${{ vars.ALPHABET_CHERCHEUR_2 }}
          ALPHABET_VUES: ${{ vars.ALPHABET_VUES }}
          ALPHABET_HISTORIQUE: ${{ vars.ALPHABET_HISTORIQUE }}
          ALPHABET_PETIT_LLM: ${{ vars.ALPHABET_PETIT_LLM }}
          ALPHABET_LECTURE_HORS_STRATE: ${{ vars.ALPHABET_LECTURE_HORS_STRATE }}
          ALPHABET_MAX_QUESTIONS: ${{ github.event.inputs.max_questions || vars.ALPHABET_MAX_QUESTIONS || '0' }}
      - name: Enregistrer le registre
        if: always()
        run: |
          if [ -n "$(git status --porcelain registre)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add registre
            git commit -m "registre : prévisions du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
