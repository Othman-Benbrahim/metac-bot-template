name: Banc du calendrier (Haiku)

# preenregistrements/calendrier-etapes.md (décisions de l'auteur du 2026-11-26, 15 h 43 et 15 h 46). Une passe,
# 200 questions, Claude Haiku 4.5 sur les crédits Anthropic de l'auteur. Rapport en artefact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc
        run: uv run python banc_calendrier.py
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banc-calendrier
          path: banc_calendrier.json
