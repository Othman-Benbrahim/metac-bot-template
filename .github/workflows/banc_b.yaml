name: Banc du taux de base

# 0.10.104 : B, B autorégressif et B saisonnier calculés par le code sur les questions de séries ForecastBench déjà
# résolues. Aucun modèle de langue : gratuit. Registre à part (registre/banc-b.jsonl, résumé registre/banc-b.json).
on:
  workflow_dispatch:
    inputs:
      apres:
        description: "jeux postérieurs à cette date"
        default: "2026-07-01"
      max:
        description: "questions nouvelles au plus"
        default: "400"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc du taux de base
        run: uv run python banc_b.py --apres "${{ github.event.inputs.apres || '2026-07-01' }}" --max "${{ github.event.inputs.max || '400' }}"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-b.jsonl registre/banc-b.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc du taux de base du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
