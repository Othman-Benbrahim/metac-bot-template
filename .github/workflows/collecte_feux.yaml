name: Collecte quotidienne des feux par pays (NASA FIRMS, ombre)

# 0.10.208 : points chauds détectés par satellite (VIIRS), comptés par pays et par jour. Clé gratuite : secret
# FIRMS_MAP_KEY. Premier passage : « depuis » = 2026-06-01 (rattrapage, plusieurs minutes).
on:
  # 0.10.246 : plus de tâche programmée propre : lancée la nuit par le planificateur (planificateur.yaml)
  workflow_dispatch:
    inputs:
      depuis:
        description: "premier jour à lire (AAAA-MM-JJ) ; vide = les 10 derniers jours"
        default: ""
      sonde:
        description: "oui = essais de l'API, réponses affichées, rien d'écrit"
        default: "non"

concurrency:
  group: collecte-feux
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 60
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ "${{ github.event.inputs.sonde }}" = "oui" ]; then
            uv run python collecte_feux.py --sonde
          else
            uv run --with shapely python collecte_feux.py --depuis "${{ github.event.inputs.depuis }}"
          fi
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/feux.csv registre/feux-jours.txt; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : feux par pays du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
