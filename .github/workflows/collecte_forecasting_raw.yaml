name: "Collecte échantillon de mise au point (forecasting_raw, Hugging Face)"

# 0.10.381 : questions binaires résolues 2015-2024 (Apache-2.0) au format du registre de jugement ; titres, dates et
# issues seulement. Aucun modèle de langue. Rien n'entre dans le bot. Lancé une fois par l'auteur.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_forecasting_raw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Télécharger et convertir
        run: uv run --with pyarrow python collecte_forecasting_raw.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -e registre/mise-au-point/questions.jsonl ]; then git add registre/mise-au-point/questions.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : échantillon de mise au point forecasting_raw du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
