name: Veille d'articles

# Chaque jour (depuis le 2026-11-14 ; chaque lundi avant) : nouveautés arXiv, GitHub et Zenodo des deux derniers jours
# et dernière sélection DAIR.AI, triées par mots-clés (veille/mots-cles.txt), sans modèle, déjà vues écartées. Un ticket
# assigné à l'auteur les liste (notification GitHub par e-mail). Rien n'entre dans le bot.

on:
  # 0.10.246 : lancée la nuit par le planificateur (planificateur.yaml)
  workflow_dispatch:
    inputs:
      jours:
        description: "Fenêtre en jours"
        required: false
        default: "2"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trier les articles
        run: python veille_articles.py --jours "${{ github.event.inputs.jours || '2' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ouvrir le ticket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(ls -t veille/semaine-*.md | head -1)
          if grep -q "Rien de retenu" "$f"; then
            echo "Rien de retenu : pas de ticket."
          else
            # 2026-11-25 : un ticket est limité à 65 536 caractères ; au-delà, début de la liste et lien vers le fichier
            if [ "$(wc -c < "$f")" -gt 60000 ]; then
              { head -c 58000 "$f"; printf '\n\n… liste complète : https://github.com/%s/blob/main/%s\n' "${{ github.repository }}" "$f"; } > /tmp/corps.md
            else
              cp "$f" /tmp/corps.md
            fi
            gh issue create --title "Veille du $(date -u +%Y-%m-%d)" --body-file /tmp/corps.md \
              --assignee "${{ github.repository_owner }}" \
              || echo "::warning::Ticket non créé (onglet Issues désactivé ?) : la liste reste dans $f"
          fi
      - name: Enregistrer
        run: |
          if [ -n "$(git status --porcelain veille)" ]; then
            git config user.name "alphabet-bot"
            git config user.email "alphabet-bot@users.noreply.github.com"
            git add veille
            git commit -m "veille : semaine du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
