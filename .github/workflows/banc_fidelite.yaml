name: Banc de fidélité des synthèses de recherche (mesure seule)

# 0.10.215 : à quelle fréquence le modèle met-il dans une synthèse de recherche des nombres absents de ce qu'il a lu ?
# Questions de séries ForecastBench déjà résolues, recherche bornée à la date d'information, contrôle par le code.
# Borne haute des erreurs de fidélité (May et al., Policing, 2026). Ne change rien au bot.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "questions à résumer"
        default: "30"
      modeles:
        description: "modèles, séparés par des virgules"
        default: "azure_ai/gpt-5-mini"
      budget:
        description: "plafond en dollars pour ce passage"
        default: "1"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_fidelite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc de fidélité
        run: uv run python banc_fidelite.py --n "${{ github.event.inputs.n || '30' }}" --budget "${{ github.event.inputs.budget || '1' }}"
        env:
          ALPHABET_BANC_FIDELITE_MODELES: ${{ github.event.inputs.modeles || 'azure_ai/gpt-5-mini' }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-fidelite.jsonl registre/banc-fidelite.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc de fidélité du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
