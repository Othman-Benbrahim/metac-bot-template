name: Relevé des aéronefs militaires visibles (adsb.fi, ombre)

# 0.10.229 : une requête toutes les 3 heures au point /v2/mil de l'API ouverte d'adsb.fi (usage non commercial, citation
# d'adsb.fi : https://adsb.fi) ; comptes d'aéronefs militaires visibles par pays. Rien de posté.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

concurrency:
  group: collecte-militaires
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 10
        run: uv run python collecte_militaires.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/militaires-adsbfi.csv registre/militaires-adsbfi-releves.txt; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : aéronefs militaires (adsb.fi) du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
