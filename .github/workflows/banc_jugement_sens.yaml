name: "Banc jugement : semblables par le sens"

# 0.10.259 : embeddings locaux (BAAI/bge-small-en-v1.5, fastembed), aucun appel payant.
# preenregistrements/jugement-sens.md
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: "Semblables par le sens"
        run: uv run --with fastembed==0.9.1 python banc_jugement_sens.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -e registre/banc-jugement-sens.json ]; then git add registre/banc-jugement-sens.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : semblables par le sens du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
