name: Collecte quotidienne GDELT (manifestations, ombre)

# 0.10.173 : comptes quotidiens de manifestations et d'émeutes par pays (GDELT, codes CAMEO 14 et 145) ; gratuit, sans
# clé, rien de posté. Premier passage à la main avec « depuis » pour rattraper l'historique.
on:
  schedule:
    - cron: "47 8 * * *"
    - cron: "47 20 * * *"   # second passage : GitHub retarde ou saute des passages programmés
  workflow_dispatch:
    inputs:
      depuis:
        description: "premier jour à lire (AAAA-MM-JJ) ; vide = jours manquants des 7 derniers jours"
        default: ""

concurrency:
  group: collecte-gdelt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 150
        run: uv run python collecte_gdelt.py --depuis "${{ github.event.inputs.depuis }}"
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/gdelt-manifestations.csv registre/gdelt-jours.txt registre/gdelt-hostilites-ru.csv registre/gdelt-hostilites-jours.txt; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : GDELT manifestations du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
