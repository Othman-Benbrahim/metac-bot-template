name: Mécanismes proposés à partir des revues (pilote, Bedrock)

# 0.10.187 : récolte OAI-PMH d'OpenEdition (gratuite), puis extraction de mécanismes par le petit modèle (Bedrock),
# plafonnée par « budget ». Le modèle propose ; rien n'est inscrit au catalogue sans décision d'auteur.
on:
  workflow_dispatch:
    inputs:
      verification:
        description: "oui = vérifier seulement l'accès aux revues (gratuit, rien d'écrit) ; non = pilote complet"
        default: "oui"
      max:
        description: "nombre maximal d'articles envoyés au modèle"
        default: "300"
      budget:
        description: "plafond de dépense en dollars"
        default: "3"

concurrency:
  group: mecanismes-revues
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pilote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Récolte et extraction
        timeout-minutes: 90
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME || 'us-east-1' }}
        run: |
          if [ "${{ github.event.inputs.verification }}" = "non" ]; then
            uv run python mecanismes_revues.py --max "${{ github.event.inputs.max }}" --budget "${{ github.event.inputs.budget }}"
          else
            uv run python mecanismes_revues.py --verifier
          fi
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/mecanismes/articles.jsonl registre/mecanismes/proposes.jsonl registre/mecanismes/resume.md; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : mécanismes proposés (pilote revues) du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
