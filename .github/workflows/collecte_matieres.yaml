name: "Collecte matières stratégiques (Banque mondiale, USGS, Comtrade ; ombre)"

# 0.10.389 : chiffres gratuits et ouverts des matières stratégiques. Aucun modèle de langue. Rien n'entre dans le bot.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte_matieres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecter
        run: uv run --with openpyxl python collecte_matieres.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          if [ -d registre/matieres ]; then git add registre/matieres; fi
          if ! git diff --cached --quiet; then
            git commit -m "registre : matières stratégiques du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || (sleep 20 && git pull --rebase)
            git push || (sleep 20 && git pull --rebase && git push)
          fi
