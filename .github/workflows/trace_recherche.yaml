name: "Trace et gel de la recherche (bancs de jugement)"

# 0.10.258 : recherche seule, aucun modèle de langue. Gèle le texte lu dans le cache de GitHub Actions (jamais
# commité) et publie les métadonnées des sources (registre/trace-recherche-jugement.jsonl) pour le contrôle des fuites.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "nombre de questions"
        default: "309"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Restaurer la recherche gelée
        uses: actions/cache/restore@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
          restore-keys: recherche-jugement-
      - name: Tracer et geler
        run: uv run python trace_recherche.py --n "${{ github.event.inputs.n || '309' }}"
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Garder la recherche gelée
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/recherche-jugement
          key: recherche-jugement-${{ github.run_id }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/trace-recherche-jugement.jsonl registre/trace-recherche-jugement.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : trace de la recherche des bancs de jugement du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
