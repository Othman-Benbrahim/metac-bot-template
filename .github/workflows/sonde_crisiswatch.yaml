name: Sonde CrisisWatch (lecture seule, rien d'enregistré)

# 0.10.230 : lit robots.txt, la page /crisiswatch et le plan du site de Crisis Group (pause de 3 s, une quinzaine de
# requêtes au plus, jamais la pagination interdite) pour préparer un lecteur exact. N'écrit rien dans le dépôt.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Sonde
        timeout-minutes: 10
        run: uv run python sonde_crisiswatch.py
