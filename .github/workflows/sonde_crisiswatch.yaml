name: "Sonde CrisisWatch (structure de la base ; hors cadre)"

# 0.10.469 (décision de l'auteur, 2026-11-23, 7 h 46) : avant d'écrire le lecteur de CrisisWatch, imprimer dans le
# journal la structure de la base (classes, libellés de tendance, liens, filtres), sans conserver de texte. Rien n'est
# écrit dans le dépôt. Lancée à la main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Sonde
        run: uv run python -u sonde_crisiswatch.py
