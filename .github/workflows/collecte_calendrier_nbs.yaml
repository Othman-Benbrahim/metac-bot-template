name: Collecte quotidienne des publications statistiques chinoises (NBS, M15, ombre)

# 0.10.209 : liste des communiqués anglais du Bureau national des statistiques chinois, confrontée au calendrier
# officiel (registre/calendrier-nbs.csv). Premier passage : « pages » = 15 pour remonter plusieurs mois.
on:
  # 0.10.246 : plus de tâche programmée propre : lancée la nuit par le planificateur (planificateur.yaml)
  workflow_dispatch:
    inputs:
      pages:
        description: "pages de la liste à lire (1 = environ trois semaines)"
        default: "1"

concurrency:
  group: collecte-calendrier-nbs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Collecte
        timeout-minutes: 15
        run: uv run python collecte_calendrier_nbs.py --pages "${{ github.event.inputs.pages || '1' }}"
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/publications-nbs.csv registre/publications-nbs-jours.txt; do if [ -s "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "registre : publications du NBS du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
