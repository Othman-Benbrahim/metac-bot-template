name: Banc des indicateurs

# 0.10.119 : signaux faibles par indicateurs indirects (attention Wikipedia, coupures d'internet, conseils aux voyageurs,
# pluie) sur les conflits du banc du bras A ; ajoutés à A recalibré. Aucun modèle de langue : gratuit.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_indicateurs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc des indicateurs
        timeout-minutes: 90          # 0.10.125 : sur l'étape, pour que « Enregistrer » garde les lignes écrites
        run: uv run python banc_indicateurs.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          git add registre/banc-indicateurs.jsonl registre/banc-indicateurs.json || true
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc des indicateurs du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
