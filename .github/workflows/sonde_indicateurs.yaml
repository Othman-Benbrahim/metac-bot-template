name: Sonde des indicateurs

# 0.10.116 : accès gratuit aux indicateurs indirects candidats (change, inflation, prix alimentaires, attention
# médiatique, climat). Rien n'est écrit ; lecture seule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Sonder
        run: uv run python sonde_indicateurs.py
