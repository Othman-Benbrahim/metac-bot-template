name: Banc du jugement aveugle

# 0.10.227 : le modèle juge sans voir le taux de base, puis combinaison mécanique avec B, contre le modèle qui voit B
# (indépendance des sources ; Sinclair, CIA 1984). Deux appels gpt-5-mini et une recherche par question (crédits Azure).
on:
  workflow_dispatch:
    inputs:
      n:
        description: "nombre de questions"
        default: "131"
      budget:
        description: "plafond en dollars pour ce passage"
        default: "4"

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_aveugle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc du jugement aveugle
        run: uv run python banc_aveugle.py --n "${{ github.event.inputs.n || '131' }}" --budget "${{ github.event.inputs.budget || '4' }}"
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE || vars.AZURE_AI_API_BASE }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          ALPHABET_RETRO_ORDRE: ${{ vars.ALPHABET_RETRO_ORDRE }}
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-aveugle.jsonl registre/banc-aveugle.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc du jugement aveugle du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
