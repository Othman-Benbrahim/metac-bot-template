name: Banc des indicateurs pertinents (questions fraîches)

# 0.10.129 : indicateurs placés là où ils ont un sens (pluie → manifestations et émeutes ; conseils aux voyageurs → violence),
# modèle figé, questions ACLED « une fois » jamais lues. Aucun modèle de langue : gratuit.
on:
  workflow_dispatch:

concurrency:
  group: bot-alphabet-registre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banc_indicateurs_frais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Banc des indicateurs pertinents
        timeout-minutes: 90          # 0.10.125 : sur l'étape, pour que « Enregistrer » garde les lignes écrites
        run: uv run python banc_indicateurs_frais.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "alphabet-bot"
          git config user.email "alphabet-bot@users.noreply.github.com"
          for f in registre/banc-indicateurs-frais.jsonl registre/banc-indicateurs-frais.json; do if [ -e "$f" ]; then git add "$f"; fi; done   # 0.10.126 : un fichier absent ne bloque plus les autres
          if ! git diff --cached --quiet; then
            git commit -m "registre : banc des indicateurs pertinents du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
