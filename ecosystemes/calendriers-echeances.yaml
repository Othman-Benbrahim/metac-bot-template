relations:
- de: anticipations
  vers: anticipations
  effet: +
  delai: jours
  force: moyenne
  intensite:
    mesure: jours restant avant l'échéance
    regle: seuil
  coupure: échéance repoussée
  statut: a_verifier
  texte: 'propre au niveau psychologique : plus la date approche, plus l''attente fige les décisions, puis tout se décide à la dernière minute'
- de: elections
  vers: anticipations
  effet: +
  delai: semaines
  force: forte
  intensite:
    mesure: semaines avant le scrutin
    regle: seuil
  coupure: scrutin joué d'avance
  statut: a_verifier
  texte: un scrutin proche gèle les grandes décisions et pousse aux annonces
- de: elections
  vers: parlements
  effet: ±
  delai: semaines à mois
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: 'propre aux conventions et statuts : le résultat recompose les majorités et le calendrier législatif'
- de: banques_centrales
  vers: marches
  effet: ±
  delai: heures
  force: forte
  intensite:
    mesure: écart entre la décision et ce qui était attendu
    regle: proportionnelle
  coupure: décision entièrement anticipée
  statut: a_verifier
  texte: les marchés bougent à la date de réunion selon la surprise, pas selon la décision
- de: publications
  vers: marches
  effet: ±
  delai: heures
  force: moyenne
  intensite:
    mesure: surprise par rapport au consensus
    regle: proportionnelle
  coupure: chiffre conforme
  statut: a_verifier
  texte: une publication surprenante fait bouger les prix le jour même
- de: publications
  vers: publications
  effet: '-'
  delai: mois
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: 'propre à la convention : un chiffre gênant peut être retardé, suspendu ou redéfini, et le silence devient lui-même un signal'
- de: memoire
  vers: anticipations
  effet: +
  delai: jours
  force: moyenne
  intensite:
    mesure: valeur symbolique de la date (anniversaire rond)
    regle: seuil
  coupure: inconnue
  statut: a_verifier
  texte: les dates symboliques sont choisies pour agir, manifester ou réprimer
- de: memoire
  vers: memoire
  effet: +
  delai: années
  force: faible
  coupure: inconnue
  statut: a_verifier
  texte: 'propre à l''idéologie : chaque commémoration renforce la suivante, surtout aux anniversaires ronds'
- de: fetes
  vers: saisons
  effet: '0'
  delai: jours
  force: faible
  coupure: inconnue
  statut: a_verifier
  texte: 'neutralisme : les calendriers religieux et les saisons coexistent sans s''influencer (sauf fêtes agricoles)'
- de: fetes
  vers: marches
  effet: '-'
  delai: jours
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: les longs jours fériés ralentissent l'activité et les échanges, puis rattrapage
- de: saisons
  vers: elections
  effet: ±
  delai: mois
  force: faible
  coupure: inconnue
  statut: a_verifier
  texte: une mauvaise récolte ou une saison de catastrophes avant un scrutin pèse sur le vote
- de: saisons
  vers: anticipations
  effet: +
  delai: semaines
  force: moyenne
  intensite:
    mesure: approche de la saison (gel, pluies, combat)
    regle: seuil
  coupure: inconnue
  statut: a_verifier
  texte: 'la saison de combat ou de récolte impose son rythme : on attend le gel, on agit avant la boue'
- de: dates_limites
  vers: anticipations
  effet: +
  delai: jours
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: une question qui se résout à date fixe juge l'événement à ce jour-là ; ce qui arrive le lendemain ne compte pas
- de: dates_limites
  vers: publications
  effet: ±
  delai: jours
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: la résolution d'une question dépend souvent d'une publication à date ; un retard de publication change l'issue mesurée
