  nom: Échéances électorales
  organisation: convention
  elements:
  - dates de scrutins nationaux
  - campagnes
  - seconds tours
  - mandats
  acteurs:
  - nom: une commission électorale nationale
    taille: méso
    espace: pays
    vitesse: mois
    organisation: statut
    facette: collectif
  - nom: l'électorat d'un pays
    taille: macro
    espace: pays
    vitesse: années
    organisation: societe
    facette: collectif
  niveau:
    espace: pays
    temps: cycles de quatre à sept ans (à vérifier selon les pays)
    vitesse: semaines à années
    taille: macro
  traces:
  - source: élections nationales (Wikidata)
    statut: collecte
    fichier: collecte_elections.py
  - source: jours avant la prochaine élection connue aux États-Unis (Wikidata)
    statut: collecte
