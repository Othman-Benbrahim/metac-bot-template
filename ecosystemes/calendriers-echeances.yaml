theme: calendriers-echeances
nom: Calendriers et échéances (le temps comme structure)
declaration:
  but: 'comprendre comment le calendrier structure les situations : beaucoup de questions se jouent sur une date (scrutin, réunion, publication, anniversaire, date limite), et le temps social impose des
    rythmes que les acteurs anticipent'
  limites: dedans les échéances électorales, les réunions des banques centrales et des producteurs de pétrole, les sessions parlementaires, les publications statistiques, les dates de mémoire, les fêtes
    et jours fériés, les saisons agricoles et de combat, les dates limites des questions ; dehors le contenu des décisions prises à ces dates (fiches voisines)
  observateur: notre bot et nos collectes de calendriers publics, regard extérieur
  date: '2026-11-19'
  espace: les pays et institutions dont nous suivons les calendriers, et le monde pour les saisons
  temps: du jour (une publication) au cycle de plusieurs années (mandats) ; mémoire des anniversaires sur des décennies
  vitesse: le jour (une date tombe), la semaine (l'approche d'une échéance), l'année (cycles électoraux et saisons)
  taille: méso à macro
compartiments:
