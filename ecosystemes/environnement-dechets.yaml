    pétrole a fait échouer Genève en 2025
- de: pollution_chimique
  vers: biodiversite
  effet: '-'
  delai: années
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: pesticides et substances persistantes pèsent sur le vivant
