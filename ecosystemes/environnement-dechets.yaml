# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local). Compartiments seulement ; relations et ponts à établir sur sources.
# 0.10.417 (2026-11-22, décision de l'auteur 3 h 46) : quatrième des « plus gros trous » : couche d'ozone, qualité de
# l'air, plastiques, substances chimiques nouvelles, conventions et traités.
# 0.10.434 (2026-11-22, remarque de l'auteur 6 h 03 : « un peu légère, à compléter ») : déchets ménagers, déchets
# électroniques, eaux usées, pollution des sols, émissions et accords climatiques, droit et contentieux ; acteurs ;
# relations et ponts. Identifiants d'origine gardés.
theme: environnement-dechets
nom: Environnement, pollutions et substances nouvelles
declaration:
  but: situer l'environnement général, la biodiversité, les pollutions de l'air, de l'eau et des sols, les plastiques, les
    substances chimiques nouvelles (limite planétaire franchie selon Persson et al., 2022), la couche d'ozone et les traités
    qui les encadrent
  limites: dedans environnement en général, biodiversité, couche d'ozone, qualité de l'air, plastiques, substances chimiques,
    déchets ménagers et électroniques, eaux usées, pollution des sols, politiques et accords climatiques, droit et
    contentieux de l'environnement, conventions et traités ; dehors le climat (climat-extremes), les cycles (cycles-biogeochimiques), la forêt (foret-et-sols-vivants),
    le corps (corps-humain), l'eau douce (eau-douce-potable), sauf par les ponts
  observateur: notre carte, regard extérieur ; termes relevés dans les étiquettes des flux RSS du bot (lecteur-local), émetteurs
    identifiés dans listes/emetteurs.txt ; aucune personne privée
  date: '2026-11-22'
  espace: du lieu (une décharge) au monde
  temps: de l'année au siècle
  vitesse: le mois (une pollution), l'année, la décennie
  taille: micro à macro
compartiments:
- id: environnement
  nom: Environnement (en général)
  organisation: convention
  elements:
  - environnement
  - politiques environnementales
  acteurs:
  - nom: PNUE (Programme des Nations unies pour l'environnement)
    taille: macro
    espace: monde
    vitesse: années
    organisation: convention
    facette: collectif
  - nom: une agence nationale de l'environnement
    taille: méso
    espace: pays
    vitesse: mois
    organisation: statut
    facette: collectif
  niveau:
    espace: monde
    temps: années
    vitesse: années
    taille: macro
  traces: &id001
  - source: comptes des termes validés dans les flux RSS (dépôt lecteur-local, listes/valides.txt)
    statut: a_brancher
- id: biodiversite
  nom: Biodiversité
  organisation: animal
  elements:
  - nature et biodiversité (détail dans la fiche biodiversite-sols)
  niveau:
    espace: monde
    temps: décennies
    vitesse: années
    taille: macro
  traces: *id001
- id: dechets
  nom: Plastiques (production, déchets, recyclage, fuite)
  organisation: technique
  elements:
  - deux fois plus de déchets plastiques qu'il y a vingt ans, dont 9 % recyclés (OCDE, Global Plastics Outlook)
  - production en hausse de 79 % entre 2000 et 2015 (Persson et al., 2022)
  - déchets, élimination, valorisation
  - économie circulaire
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: méso
  traces:
  - source: OCDE, Global Plastics Outlook (production, déchets, recyclage)
    statut: a_brancher
  - &id002
    source: situations observées (lecteur-local, comptes/situations.jsonl)
    statut: a_brancher
  acteurs:
  - nom: l'industrie chimique et plastique (en agrégat)
    taille: macro
    espace: monde
    vitesse: années
    organisation: economie
    facette: collectif
- id: pollution_chimique
  nom: Substances chimiques nouvelles (PFAS, pesticides, métaux lourds, additifs)
  organisation: chimique
  elements:
  - environ 350 000 substances chimiques fabriquées sur le marché ; production chimique multipliée par 50 depuis 1950 (Persson
    et al., 2022)
  - PFAS (« polluants éternels »)
  - pesticides
  - métaux lourds (mercure, plomb)
  - additifs des plastiques (plus de 10 000 substances)
  - solvants (hexane)
  niveau:
    espace: sites à monde
    temps: années à décennies
    vitesse: années
    taille: micro à macro
  traces:
  - source: registre REACH de l'Agence européenne des produits chimiques (à vérifier)
    statut: a_brancher
  - *id002
  acteurs:
  - nom: une agence de régulation chimique
    taille: méso
    espace: pays ou Union
    vitesse: années
    organisation: statut
    facette: collectif
- id: ozone
  nom: Couche d'ozone
  organisation: chimique
  elements:
  - trou d'ozone 2025 près de 30 % plus petit que le record de 2006, refermé le 1er décembre (OMM)
  - retour aux valeurs de 1980 vers 2066 en Antarctique, 2045 en Arctique, 2040 ailleurs (évaluation de 2022)
  - substances appauvrissant l'ozone en baisse d'environ un tiers depuis le pic de 2000
  niveau:
    espace: stratosphère, pôles et monde
    temps: décennies
    vitesse: saisons à décennies
    taille: macro
  traces:
  - {source: "consommation de substances appauvrissant la couche d'ozone, monde (PNUE, via Our World in Data)", statut: collecte, fichier: collecte_owid.py, adaptateur: "owid:ozone-depleting-substance-consumption:World:somme"}
  - source: bulletins de l'OMM ; surveillance Copernicus (CAMS)
    statut: a_brancher
  - *id002
- id: qualite_air
  nom: Qualité de l'air (particules, ozone au sol, dioxyde d'azote)
  organisation: chimique
  elements:
  - environ 7 millions de décès prématurés par an liés à l'air extérieur et domestique (OMS)
  - 99 % de l'humanité au-dessus de la valeur guide de l'OMS pour les particules fines
  niveau:
    espace: villes et pays
    temps: heures à années
    vitesse: jours
    taille: micro à macro
  traces:
  - source: base de données mondiale des ODD (ONU, unstats.un.org/sdgs/dataportal), indicateur 11.6.2
    statut: a_brancher
    odd: ['11.6.2']
  - source: OpenAQ (licence à vérifier) ; OMS
    statut: a_brancher
  - {source: "concentration de PM2,5 pondérée par la population, centres urbains du monde, 2000-2020 (GHS-UCDB R2024A, JRC)", statut: collecte, fichier: mise_au_point/ucdb_pays.py, adaptateur: "ucdb:WLD:pm25"}
  - {source: "décès prématurés attribués aux PM2,5, centres urbains du monde, 2000-2020 (GHS-UCDB R2024A, JRC)", statut: collecte, fichier: mise_au_point/ucdb_pays.py, adaptateur: "ucdb:WLD:deces_pm25"}
  - *id002
- id: traites
  nom: Conventions et traités (Montréal, Stockholm, Minamata, traité sur le plastique)
  organisation: convention
  elements:
  - protocole de Montréal (1987), ratifié par pratiquement tous les pays (OMM)
  - convention de Stockholm (polluants organiques persistants)
  - convention de Minamata (mercure)
  - 'traité sur le plastique : échec des négociations de Genève le 15 août 2025, sur le plafonnement de la production (Al
    Jazeera)'
  niveau:
    espace: monde
    temps: années à décennies
    vitesse: années
    taille: macro
  traces:
  - source: état des ratifications aux Nations unies ; calendrier des négociations du traité sur le plastique
    statut: a_brancher
  - *id002
  acteurs:
  - nom: la coalition de la haute ambition (Union européenne, Royaume-Uni, Canada, nombreux pays d'Afrique et d'Amérique latine)
    taille: macro
    espace: monde
    vitesse: mois
    organisation: geopolitique
    facette: collectif
  - nom: le groupe des pays producteurs de pétrole (Arabie saoudite, Koweït, Russie, Iran, Malaisie)
    taille: macro
    espace: monde
    vitesse: mois
    organisation: geopolitique
    facette: collectif
- id: dechets_menagers
  nom: Déchets ménagers et municipaux
  organisation: technique
  elements:
  - 2,3 milliards de tonnes de déchets municipaux en 2023, 3,8 milliards attendus en 2050 ; coût direct de leur gestion
    environ 252 milliards de dollars en 2020, jusqu'à 640 milliards par an en 2050 sans action (PNUE, Global Waste
    Management Outlook 2024, 28 février 2024)
  - décharges, brûlage à l'air libre, collecte inégale selon les pays
  niveau:
    espace: ville à monde
    temps: années
    vitesse: mois
    taille: méso à macro
  traces: *id001
- id: dechets_electroniques
  nom: Déchets électroniques
  organisation: technique
  elements:
  - 62 millions de tonnes en 2022, dont 22,3 % collectés et recyclés de façon documentée ; 82 millions attendus en 2030
    (Global E-waste Monitor 2024, UIT et UNITAR, 20 mars 2024)
  - métaux récupérables (cuivre, or, terres rares) et substances toxiques
  niveau:
    espace: monde
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: Global E-waste Monitor (UIT, UNITAR ; données par pays)
    statut: a_brancher
- id: eaux_usees
  nom: Eaux usées et pollution de l'eau
  organisation: eau
  elements:
  - 42 % des eaux usées domestiques rejetées sans traitement sûr en 2022 (ONU-Eau, rapport 2024 sur l'indicateur 6.3.1)
  - nitrates et phosphates agricoles, rejets industriels
  niveau:
    espace: bassin et pays
    temps: années
    vitesse: mois
    taille: méso à macro
  traces:
  - source: ONU-Eau, suivi de l'indicateur 6.3.1 (eaux usées traitées)
    statut: a_brancher
- id: pollution_sols
  nom: Pollution des sols
  organisation: sol_vivant
  elements:
  - surtout d'origine humaine - industrie, mines, déchets, pesticides et engrais, hydrocarbures ; polluants émergents
    (médicaments, perturbateurs endocriniens, plastiques, déchets électroniques) ; aucune évaluation mondiale
    systématique encore faite (FAO, Soil Pollution, a Hidden Reality, 2 mai 2018)
  niveau:
    espace: parcelle à pays
    temps: décennies
    vitesse: années
    taille: micro à macro
  traces: *id001
- id: climat_politique
  nom: Émissions et accords climatiques
  organisation: convention
  elements:
  - émissions mondiales de gaz à effet de serre record en 2024, +2,3 % ; réchauffement attendu de 2,8 °C en 2100 avec les
    politiques actuelles, 2,3 à 2,5 °C si les engagements nationaux sont tenus (PNUE, rapport sur l'écart des émissions
    2025, 4 novembre 2025)
  - COP30 à Belém (clôturée le 22 novembre 2025) - pas de feuille de route de sortie des énergies fossiles dans le texte
    final ; appel à tripler le financement de l'adaptation d'ici 2035 (Carbon Brief)
  niveau:
    espace: monde
    temps: décennies
    vitesse: années (une COP par an)
    taille: macro
  traces:
  - source: PNUE, rapport annuel sur l'écart des émissions
    statut: a_brancher
- id: droit_contentieux
  nom: Droit et contentieux de l'environnement
  organisation: convention
  elements:
  - avis consultatif de la Cour internationale de justice du 23 juillet 2025, rendu à l'unanimité - les États ont
    l'obligation de prévenir les dommages importants à l'environnement et de coopérer contre le changement climatique ;
    y manquer peut être un fait illicite ouvrant droit à réparation (ONU, UNRIC)
  - procès climatiques contre des États et des entreprises
  acteurs:
  - nom: Cour internationale de justice
    taille: macro
    espace: monde
    vitesse: années
    organisation: convention
    facette: collectif
  niveau:
    espace: pays et monde
    temps: années
    vitesse: mois
    taille: macro
  traces: *id001
