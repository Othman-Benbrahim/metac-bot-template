faits:
# 2026-11-21 : faits datés recoupés par au moins deux sources indépendantes ; jamais utilisés par les bancs rétrospectifs.
- date: 2026-06-17
  compartiment: negociations
  fait: "Mémorandum d'entente États-Unis–Iran en 14 points ouvrant 60 jours de négociation pour un accord nucléaire « robuste et vérifiable » ; selon la DGRIS (8 octobre), le délai n'a produit aucun accord (positions maximalistes, confiance très basse, médiation du Pakistan, du Qatar et d'Oman)"
