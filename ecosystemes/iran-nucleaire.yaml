theme: iran-nucleaire
nom: Programme nucléaire iranien et négociations
declaration:
  but: comprendre ce qui fait avancer, geler ou rompre les négociations sur le programme nucléaire iranien, et ce que cela transmet aux sanctions, à Ormuz et aux marchés (questions du tournoi sur un accord
    États-Unis–Iran, les inspections, les sanctions)
  limites: dedans les négociations, les inspections et la vérification, les sanctions liées au programme, les positions des puissances et des voisins, la politique intérieure iranienne en agrégat ; dehors
    tout détail technique du programme (procédés, installations, armement), la guerre au Levant en elle-même (thème voisin, relié par des ponts)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; niveau institutionnel et diplomatique seulement
  date: '2026-11-19'
  espace: l'Iran, les capitales négociatrices, Vienne (agence de vérification), New York (Conseil de sécurité), la région du Golfe
  temps: de la déclaration du jour au cycle de plusieurs années ; mémoire de l'accord de 2015, du retrait américain de 2018 et des rondes suivantes (à vérifier)
  vitesse: le jour (déclarations), la semaine (rondes de négociation), le trimestre (rapports de vérification), l'année (régimes de sanctions)
  taille: une délégation, un État, le système international de non-prolifération
