# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: asie-du-sud-est
nom: Asie du Sud-Est
declaration:
  but: comprendre l'Asie du Sud-Est comme un ensemble de 700 millions d'habitants au carrefour des routes maritimes, entre
    la Chine et les États-Unis, avec une guerre civile (Birmanie) et une mer disputée
  limites: dedans l'ASEAN, la mer de Chine méridionale, la Birmanie, l'Indonésie, les Philippines, le Vietnam, la Thaïlande,
    la Malaisie, Singapour, le Cambodge, le Laos, Brunei, le Timor oriental ; dehors la Chine vue de l'intérieur (economie-chinoise),
    le détroit de Malacca (transport-maritime), sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: la péninsule et les archipels
  temps: de la mousson à la décennie
  vitesse: le jour (incidents en mer), l'année (sommets)
  taille: une province, un État, la région
