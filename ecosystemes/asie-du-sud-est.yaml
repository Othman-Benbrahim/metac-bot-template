    - MMR
  elements:
  - élections par phases en décembre 2025 et janvier 2026 sous la junte ; le parti pro-militaire USDP obtient 339 sièges,
    l'armée en détient d'office un quart (166) ; Parlement réuni le 16 mars 2026 (Al Jazeera)
  - Min Aung Hlaing élu président le 3 avril 2026, après avoir cédé le commandement de l'armée à Ye Win Oo (Reuters, via The
    Nation)
  - état « moyen » en octobre 2026, 132 morts (UCDP, octobre 2026) ; de larges zones échappent à l'armée
  - '19 novembre 2026 : la Cour internationale de justice juge la Birmanie responsable de génocide contre les Rohingya (affaire
    Gambie c. Myanmar), première condamnation d''un État pour génocide par la Cour ; réparations et retour des réfugiés ordonnés,
    sans moyen d''exécution (CIJ, communiqué 2026/178 ; HRW ; RFA, 19 novembre 2026)'
