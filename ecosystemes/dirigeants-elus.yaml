- id: parlementaires
  nom: Parlementaires et élus
  organisation: statut
  elements:
  - femmes à 27,5 % des sièges parlementaires dans le monde, progrès lents (Union interparlementaire et ONU Femmes, mars
    2026)
  - élus locaux, régionaux, européens
  acteurs:
  - nom: Union interparlementaire (UIP)
    taille: macro
