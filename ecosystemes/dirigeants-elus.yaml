    statut: a_brancher
- id: ministres
  nom: Ministres et gouvernements
  organisation: statut
  elements:
  - femmes à 22,4 % des postes de ministre dans le monde (ONU Femmes, 11 mars 2026)
  - remaniements, démissions, coalitions
  niveau:
    espace: pays
    temps: mois à années
    vitesse: semaines
    taille: micro à méso
  traces:
