- id: age_sante
  nom: Âge et santé des dirigeants (déclarations publiques seulement)
  organisation: personne
  elements:
  - âge en fonction, absences et hospitalisations annoncées officiellement ; aucune inférence ni diagnostic
  - "l'écart d'âge avec la population gouvernée : Afrique, âge médian d'environ 19 ans pour sa population et d'environ 63 ans pour ses dirigeants ; le président ougandais avait près de 63 ans de plus que son administré moyen en 2023 (Wilson Center, 14 mars 2023)"
  - "âge moyen des dirigeants en poste : 54,8 ans en 1946, 61,2 ans en 2015 ; en Afrique 65,4 ans en 2015, dont 43 % de 70 ans et plus (Archigos 4.1, calcul du 2026-11-25)"
  - "l'âge situe le dirigeant dans son cycle de vie au pouvoir ; la table des dirigeants du bot donne l'année de naissance et le début du mandat en cours (ecosystemes/dirigeants-maintien.csv)"
  niveau:
    espace: pays
    temps: années
    vitesse: jours à années
    taille: micro
    objet: personnes
  traces:
  - {source: "âge moyen des dirigeants en poste au 1er juillet, monde, 1946-2015 (Archigos 4.1 via peacesciencer)", statut: collecte, fichier: mise_au_point/archigos_ages.py, adaptateur: "ages_dirigeants:monde:age_moyen"}
  - {source: "part des dirigeants africains âgés de 70 ans et plus, 1946-2015 (Archigos 4.1)", statut: collecte, fichier: mise_au_point/archigos_ages.py, adaptateur: "ages_dirigeants:afrique:part70"}
  - *id001
cycles:
- id: vie_au_pouvoir
  nom: Cycle de vie au pouvoir (arrivée, consolidation, usure, succession)
  sorte: endogene
  mecanisme: "un dirigeant arrive, consolide, s'use puis doit passer la main ; l'âge et la durée au pouvoir situent sa position dans ce cycle ; plus il avance en âge sans successeur désigné, plus la succession devient une source d'incertitude"
  periode: "de quelques années à plusieurs décennies selon le régime"
  phase_vulnerable: "la fin du cycle : âge avancé, longue durée au pouvoir, succession non réglée"
  compartiments: [executifs, mandats_succession, departs, age_sante]
  statut: mecanisme
relations:
- de: popularite
  vers: departs
  effet: '-'
  delai: mois
  force: moyenne
  coupure: régime fermé où la popularité ne décide pas
  statut: a_verifier
