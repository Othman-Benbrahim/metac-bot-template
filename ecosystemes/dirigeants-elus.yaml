# 0.10.439 — fiche créée le 2026-11-22 (remarque de l'auteur, 7 h 09 : « autre catégorie écosystémique sous-évaluée, les
# dirigeants et les élus, à développer »). Jusqu'ici un compartiment de politique-interieure (pont « même »). Les
# dirigeants vus par leurs trois facettes (niveaux.yaml : la personne par ses faits publics, le statut, l'idéologie),
# toujours dans leur rôle public ; jamais de diagnostic ni de profil psychologique, jamais de personne privée.
# Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: dirigeants-elus
nom: Dirigeants et élus (rôle public, monde)
declaration:
  but: 'comprendre les dirigeants et les élus comme écosystème : qui gouverne (28 pays dirigés par une femme en 2026, 101
    pays qui ne l''ont jamais été, ONU Femmes), comment on arrive au pouvoir, comment on y reste et comment on le quitte
    (19 % de sorties irrégulières et environ 21 % de dirigeants exilés, emprisonnés ou morts dans l''année qui suit leur
    départ, 1875-2004, base Archigos), ce qui les protège ou les expose (popularité, entourage, justice, immunités)'
  limites: dedans les chefs d'État et de gouvernement, les ministres, les parlementaires, les mandats et successions, les
    départs et ce qui suit, la popularité, l'entourage, les programmes, la justice et les immunités, la diplomatie
    personnelle, l'âge et la santé tels que déclarés publiquement ; dehors les partis et les procédures nationales
    (politique-interieure), les dirigeants américains détaillés (politique-americaine), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (ONU Femmes, UIP, Archigos, presse) ; personnalités
    publiques dans leur rôle public seulement ; aucune inférence psychologique ou médicale
  date: '2026-11-22'
  espace: le pays, l'alliance, le monde
  temps: du jour (une déclaration, une démission) à la décennie (un règne long)
  vitesse: le jour (crise, démission), le mois (sondages, remaniements), le mandat
  taille: micro (une personne dans son rôle) à macro (le pouvoir d'un État)
