    compartiment cible lit ici le maintien au pouvoir)
- de: departs
  vers: mandats_succession
  effet: '-'
  delai: années
  force: inconnue
  coupure: garanties de sortie (amnistie, exil négocié)
  statut: a_verifier
  texte: quand perdre le pouvoir expose à l'exil, à la prison ou à la mort, le dirigeant s'accroche (le compartiment
    source lit ici le risque après le départ, la cible le respect des limites de mandat)
