- id: departs
  nom: Départs du pouvoir et ce qui suit
  organisation: convention
  elements:
  - sur 3 025 dirigeants de 188 pays (1875-2004), 19,07 % sont sortis de façon irrégulière ; dans l'année qui suit leur
    départ, 12,43 % ont été exilés, 5,09 % emprisonnés, 3,83 % sont morts (Goemans, Gleditsch et Chiozza, « Introducing
    Archigos »)
  - démissions, défaites électorales, destitutions, coups d'État, décès en fonction
