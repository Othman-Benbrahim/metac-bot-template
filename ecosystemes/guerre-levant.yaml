  - 'mécanisme : conflit gelé ; l''Arabie saoudite cherche une sortie (trêve d''avril 2022, négociation directe avec les houthistes en 2023) ; le camp loyaliste est fracturé par les séparatistes du Sud soutenus par les Émirats, reflet de la rivalité saoudo-émirienne (Atlas géopolitique mondial 2025, Carto/Areion, rédigé de mai 2023 à avril 2024 ; situation des séparatistes à vérifier pour 2025-2026)'
