- id: iran
  evenements:
    - {"type": "violence armée entre les gouvernements de deux pays (frappe, affrontement)", "termes": ["strike", "strikes", "airstrike", "attack", "attacks", "military action", "clash", "clashes", "deadly clash", "invade", "invasion", "war"], "serie": "ucdp_dyade:{ISO3_A}:{ISO3_B}", "seuil": 1, "pas": "mois", "occurrence": "au moins un événement de violence organisée entre les deux gouvernements dans le mois (UCDP, camps de la GED)", "statut": "valide_auteur_2026-11-24_15h15", "note": "ne couvre pas les camps non étatiques (Hamas, Hezbollah, Houthis, État islamique) ; une invasion et une frappe comptent pareil"}
  geopolitique:
    pays: [IRN]
  organisation: geopolitique
  nom: Iran et son réseau régional
  elements:
  - soutien aux alliés régionaux
  - frappes et ripostes directes (en agrégat)
  - dissuasion
  - contraintes intérieures
  - 'escalade horizontale par mandataires : quand une voie se ferme, la pression se déplace vers les alliés (Houthis, milices irakiennes contre l''Arabie saoudite, Jordanie) ; les frappes depuis l''Irak sur l''oléoduc Est-Ouest visaient à compenser la réouverture partielle d''Ormuz (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
  - 'asymétrie de riposte : l''Iran frappe les États du Golfe et la marine américaine, mais évite de répondre directement à Israël pour ne pas lui donner de prétexte (crête d''Ali al-Taher, Liban, septembre 2026) (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
  - 'déclencheurs d''escalade nommés : pression intérieure due au blocus, élections américaines et israéliennes, débordements depuis le Liban, le Yémen ou l''Irak, pertes humaines américaines (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
