theme: guerre-levant
nom: Guerre au Levant et fronts régionaux
declaration:
  but: comprendre ce qui fait durer, s'étendre ou retomber les conflits entre Israël, Gaza, le Liban, la Syrie, l'Irak, le Yémen et l'Iran, et ce que cela transmet aux routes maritimes, à l'énergie et aux
    négociations (questions du tournoi sur les cessez-le-feu, les frappes, le Liban, la mer Rouge)
  limites: dedans les acteurs étatiques et armés connus publiquement (en agrégat), les médiations, les cessez-le-feu, l'aide humanitaire, les puissances extérieures, les routes de la mer Rouge ; dehors
    tout détail opérationnel ou d'armement, le programme nucléaire iranien en lui-même (thème voisin, relié par un pont)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; ton neutre, niveau institutionnel et diplomatique
  date: '2026-11-19'
  espace: Israël et les territoires palestiniens, le Liban, la Syrie, l'Irak, le Yémen, l'Iran, la mer Rouge et le golfe d'Aden
  temps: de l'incident du jour à la décennie ; mémoire des guerres et des cessez-le-feu successifs depuis 2023 (à vérifier)
  vitesse: l'heure (frappe, incident), la semaine (négociation d'une trêve), le mois (aide, reconstruction), l'année (alliances)
  taille: un groupe armé local, un État, la région, les grandes puissances
