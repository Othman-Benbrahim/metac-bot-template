# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: insularite
nom: Îles et insularité (Pacifique, océan Indien, Atlantique et Caraïbes)
declaration:
  but: 'comprendre ce que l''insularité fait aux États et aux territoires : la montée des eaux, les cyclones, l''isolement,
    des zones maritimes immenses pour de petites populations, des bases et des câbles convoités'
  limites: dedans les petits États insulaires et les territoires d'outre-mer des trois océans, la montée des eaux, les cyclones,
    les zones économiques exclusives, la dépendance aux importations et au tourisme, les câbles sous-marins, les bases militaires,
    les statuts disputés ; dehors les grandes îles traitées ailleurs (Japon, Taïwan, Royaume-Uni, Indonésie, Philippines),
    sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: les îles des trois océans
  temps: de la tempête (heures) à la montée des mers (décennies)
  vitesse: le jour (cyclone), l'année (tourisme, budgets)
  taille: un atoll, un archipel, un bassin océanique
