theme: dette-emergents
nom: Dette des pays émergents et en développement
declaration:
  but: comprendre ce qui pousse un pays émergent ou pauvre vers la crise de dette ou de change (défaut, dévaluation, programme du FMI, contrôle des capitaux), et ce que cela transmet (questions du tournoi
    sur les monnaies, les défauts, les banques en difficulté, les programmes du FMI)
  limites: dedans la dette publique et privée en devises, les monnaies, les réserves de change, les banques locales, les créanciers (marchés, Chine, Club de Paris), le FMI et la Banque mondiale, l'inflation
    locale et la contestation ; dehors la croissance de long terme et la démographie
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; pays lus en agrégat, jamais de personne privée
  date: '2026-11-19'
  espace: les pays émergents et en développement, et les marchés financiers mondiaux (dollar, taux américains)
  temps: de la séance (change) à la décennie (restructurations) ; mémoire des crises de 1982, 1994, 1997-1998, 2001, 2013, 2022
  vitesse: le jour (attaque sur la monnaie, retraits bancaires), le mois (échéances, revues du FMI), l'année (restructurations)
  taille: un déposant, une banque, un pays, le système financier mondial
