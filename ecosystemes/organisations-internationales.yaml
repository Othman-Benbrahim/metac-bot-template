# 0.10.453 — fiche créée le 2026-11-22 (angle mort signalé, accord de l'auteur 9 h 23) : organisations internationales et droit
# international comme écosystème, jusque-là éparpillés. Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: organisations-internationales
nom: Organisations internationales et droit international
declaration:
  but: 'voir le système multilatéral comme un écosystème sous tension : budget ordinaire de l''ONU ramené à 3,45 milliards de dollars pour 2026 (−15 %, près de 19 % des postes supprimés) ; retrait des États-Unis de l''OMS (janvier 2026) et de 66 organisations ; sanctions américaines contre la Cour pénale internationale et départs de cinq États en un an'
  limites: 'dedans l''ONU et son budget, le Conseil de sécurité, la justice internationale, les institutions financières, le commerce mondial, la santé mondiale, le climat, les retraits, les clubs de puissances, le droit international ; dehors le régime nucléaire (non-proliferation), l''Union européenne (union-europeenne), sauf par les ponts'
  observateur: 'notre carte, regard extérieur ; sources publiques (ONU, OMS, presse) ; aucune personne privée'
  date: '2026-11-22'
  espace: 'le monde'
  temps: 'de l''année au siècle'
  vitesse: 'le mois (une résolution), l''année (un budget), la décennie'
  taille: 'macro'
