# 2026-11-22 (décisions de l'auteur, 3 h 33 - 3 h 38) : compartiment « psychologie du prévisionniste » retiré ; l'écosystème de
# notre recherche décrit par ce qui a été fixé et produit, daté (questions, mathématiques, algorithmique, ontologie,
# résultats, lectures, vocabulaire et son évolution), mesuré par recherche_evolution.py sur l'historique Git.
theme: observateur-mesure
nom: L'observateur et la mesure
declaration:
  but: 'traiter l''observateur comme un élément du système : nos sources, nos modèles de langue, nos bancs et nous-mêmes déforment
    ce que nous voyons ; savoir ce que nous voyons mal et ce que nous voyons trop'
  limites: dedans nos sources et leurs biais, les statistiques et leurs définitions, la jeunesse de nos séries, les modèles
    de langue comme lecteurs, la fuite des recherches rétrospectives, nos contrôles, l'écosystème de notre recherche (questions, méthodes, outils, ontologie, résultats, lectures, vocabulaire) ; dehors
    le monde lui-même (toutes les autres fiches)
  observateur: nous-mêmes, regard réflexif ; fiche fondée sur nos propres résultats publiés
  date: '2026-11-19'
  espace: nos données et le monde qu'elles couvrent ou ne couvrent pas
  temps: depuis le début de nos collectes (2026) ; mémoire de nos erreurs publiées
  vitesse: jours (une collecte), semaines (un banc), mois (une série qui mûrit)
  taille: micro (un chiffre recopié) à macro (la couverture mondiale de nos sources)
compartiments:
- id: biais
  nom: Biais des sources
  organisation: technique
  elements:
  - GDELT lit surtout la presse anglophone
  - l'attention suit les médias, pas les faits
  - pays et sujets peu couverts
  - sources qui changent de format
  acteurs:
  - nom: GDELT
    taille: macro
    espace: mondial
    vitesse: heures
    organisation: technique
    facette: collectif
  niveau:
    espace: mondial
    temps: permanent
    vitesse: années
    taille: macro
  traces:
  - source: santé des flux RSS et des sources (registre)
    statut: collecte
    fichier: collecte_rss.py
  - source: volume quotidien des chaînes suivies
    statut: collecte
    adaptateur: telegram:tout
- id: definitions
  nom: Définitions et statistiques (convention)
  organisation: convention
  elements:
  - ce qui est compté comme un cas, une victime, une récession
  - révisions
  - statistiques suspendues ou redéfinies
  niveau:
    espace: pays
    temps: calendriers de publication
    vitesse: mois
    taille: macro
  traces:
  - source: calendrier et publications des statistiques chinoises
    statut: collecte
    fichier: collecte_calendrier_nbs.py
- id: jeunesse_series
  nom: Jeunesse des séries
  organisation: technique
  elements:
  - collectes commencées en 2026
  - habitude mesurée en pleine crise
  - pas de référence d'avant-crise
  niveau:
    espace: nos registres
    temps: quelques mois
    vitesse: mois
    taille: micro à méso
  traces:
  - source: passages de PortWatch à Ormuz (série commencée en pleine crise)
    statut: collecte
    fichier: collecte_portwatch.py
    adaptateur: portwatch:ormuz:navires
- id: lecteurs_ia
  nom: Modèles de langue comme lecteurs
  organisation: technique
  elements:
  - désaccord entre codeurs (κ mesuré faible au banc de couverture)
  - lecteur qui recopie la matrice qu'on lui montre
  - refus des filtres
  - variabilité d'un tirage à l'autre
  acteurs:
  - nom: un modèle de langue lecteur
    taille: micro
    espace: local
    vitesse: secondes
    organisation: technique
    facette: non_humain
  niveau:
    espace: nos bancs
    temps: chaque appel
    vitesse: secondes
    taille: micro
  traces:
  - source: registres des bancs (accords, refus)
    statut: collecte
    fichier: banc_couverture_alphabet.py
- id: fuite
  nom: Fuite des recherches rétrospectives
  organisation: technique
  elements:
  - une recherche relancée après l'issue laisse filtrer l'avenir
  - capture en direct comme remède
  niveau:
    espace: nos bancs
    temps: après coup
    vitesse: jours
    taille: méso
  traces:
  - source: banc de la fuite des recherches
    statut: collecte
    fichier: banc_fuite_recherche.py
- id: controles
  nom: Contrôles et préenregistrement
  organisation: statut
  elements:
  - préenregistrement daté
  - contrôle automatique des chiffres des fiches
  - correction pour essais multiples
  - publication des erreurs
  acteurs:
  - nom: la règle d'adoption du projet
    taille: méso
    espace: local
    vitesse: semaines
    organisation: statut
    facette: statut
  niveau:
    espace: nos dépôts
    temps: chaque essai
    vitesse: jours
    taille: méso
  traces:
  - source: essais et fiches contrôlées (registre public)
    statut: collecte
    fichier: controle_chiffres.py
- id: couverture
  nom: Ce que nous ne voyons pas
  organisation: convention
  elements:
  - compartiments sans trace
  - niveaux presque vides (personne, entourage)
  - pays et langues absents de nos sources
  niveau:
    espace: mondial
    temps: permanent
    vitesse: mois
    taille: macro
  traces:
  - source: liste de travail des écosystèmes (compartiments sans trace collectée)
    statut: collecte
    fichier: ecosystemes.py
- id: monde
  nom: Le monde observé
  organisation: geopolitique
  elements:
  - les situations réelles, que nos mesures ne font qu'approcher
  niveau:
    espace: mondial
    temps: permanent
    vitesse: heures à décennies
    taille: macro
  traces:
  - source: toutes les autres fiches
    statut: inconnue
- id: questions_traitees
  nom: Questions traitées (Metaculus et bancs)
  organisation: convention
  elements:
  - questions du tournoi par forme (binaire, choix multiple, numérique) et par thème
  - questions des bancs rétrospectifs
  - "rattachement des questions aux compartiments : liste validée par l'auteur le 2026-11-24 (lecteur-local, listes/proposes-rattachement.txt) ; 88 % des questions résolues rattachées, 245 sur 272 pour Metaculus"
  - "part de « oui » selon la forme (272 questions Metaculus) : « avant telle date » 19 %, « annoncera / déposera / lancera » 8 %, « nouveau record » 0 sur 7, « encore une fois » 46 %, « restera / quittera son poste » 36 %"
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: jours
    taille: micro à méso
  traces:
  - source: registres des questions du bot (registre/)
    statut: collecte
  - source: inventaire de rendement de la carte (questions × compartiments × séries)
    statut: collecte
    fichier: mise_au_point/inventaire_rendement.py
- id: questionneur_metaculus
  nom: "Le questionneur : focus et subjectivité de Metaculus"
  organisation: convention
  elements:
  - "l'actualité fait la question : une question naît d'un changement en discussion (frappe, démission, loi, record), pas de ce qui est probable"
  - "biais de sélection du rédacteur : ce dont on parle paraît plus probable que ce qui arrive ; 70 % des questions du fil principal se résolvent par non (Metaculus), 71 % dans notre corpus"
  - "tranchabilité : source publique indiscutable et horizon court (semaines pour les bots) ; favorise calendriers institutionnels, déclarations officielles, séries de données"
  - "incertitude voulue à l'écriture : le rédacteur évite le presque sûr, ce qui renforce le biais de sélection"
  - "regard d'une communauté (rationalistes, altruisme efficace) : IA de pointe surreprésentée (13 % des questions), risques majeurs, public anglophone tourné vers les États-Unis, la finance et la technologie"
  - "origine des questions du tournoi des bots : surtout importées du fil principal ; MiniBench fabriquée depuis des données publiques (FRED, Google Trends, Bourse)"
  - "critère de la carte (validé par l'auteur le 2026-11-24, 14 h 25) : un compartiment ou un mécanisme n'entre que s'il aide à juger si un changement d'actualité aura lieu à court terme et sera tranchable par une source publique — freins, déclencheurs, calendriers, repères mesurés"
  acteurs:
  - nom: Metaculus
    taille: méso
    espace: mondial
    vitesse: jours
    organisation: convention
    facette: collectif
  niveau:
    espace: mondial (anglophone)
    temps: depuis 2015 ; tournois des bots depuis 2024
    vitesse: semaines
    taille: méso
  traces:
  - source: "annonces des tournois (Metaculus, LessWrong : Spring 2026 AI Forecasting Benchmark ; résultats du deuxième trimestre)"
    statut: a_brancher
- id: mathematiques
  nom: Mathématiques et statistiques employées
  organisation: convention
  elements:
  - score logarithmique (règle de Metaculus) et score de Brier
  - bootstrap et intervalles par question
  - tests de permutation, correction pour essais multiples (Holm)
  - régressions, filtre de Kalman
  - seuils, hystérésis, masse critique
  - intervalles de Wilson
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - &id001
    source: registre/recherche-evolution.json (historique Git, semaine par semaine ; recherche_evolution.py)
    statut: collecte
    fichier: recherche_evolution.py
- id: algorithmique
  nom: Algorithmique et outils
  organisation: technique
  elements:
  - Python, workflows GitHub
  - BigQuery (GDELT)
  - listes de mots validées et comptage sans modèle
  - graphes (types de situation, carte des écosystèmes)
  - modèles de langue employés comme lecteurs
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - *id001
- id: ontologie_projet
  nom: Ontologie du projet (alphabet, fiches, règles, graphe des types)
  organisation: convention
  elements:
  - 'alphabet : cartes et strates'
  - fiches d'écosystèmes (compartiments, quatre variables)
  - règles coutumières (type de situation → type d'événement, indices)
  - termes validés et émetteurs identifiés
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - *id001
- id: resultats
  nom: Résultats (adopté, non adopté, clos)
  organisation: convention
  elements:
  - essais préenregistrés et leur verdict
  - mécanismes adoptés dans le bot
  - pistes closes (par exemple la tendance de l'attention GDELT)
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - *id001
- id: lectures
  nom: Lectures et références intégrées
  organisation: ideologie
  elements:
  - ouvrages et articles lus et confrontés au projet (mémos de lecture, documents de référence)
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - source: documents de référence du projet (claude.ai) et dossier lectures/ du bot
    statut: collecte
- id: vocabulaire
  nom: Vocabulaire du projet et son évolution
  organisation: convention
  elements:
  - termes qui apparaissent, se répandent ou disparaissent dans nos messages (liste fixée dans recherche_evolution.py)
  - semaine de première apparition de chaque terme
  niveau:
    espace: nos dépôts et nos documents
    temps: depuis le début du dépôt du bot (2026-10-30)
    vitesse: semaines
    taille: micro à méso
  traces:
  - *id001
relations:
- de: questionneur_metaculus
  vers: questions_traitees
  effet: +
  delai: jours
  force: forte
  statut: a_verifier
  source: "Metaculus (70 % de non au fil principal ; 80 % au tournoi du deuxième trimestre) ; corpus du bot (71 % de non sur 272 questions)"
  texte: "le rédacteur choisit les changements discutés ; la plupart n'ont pas lieu dans le délai : le statu quo est le point de départ, le changement doit être justifié par un frein levé, un déclencheur ou une échéance"
- de: biais
  vers: questionneur_metaculus
  effet: +
  delai: jours
  force: moyenne
  statut: a_verifier
  texte: "l'attention suit les médias, pas les faits ; les questions suivent l'attention (52 questions sur 272 en mars 2026, au moment de la guerre avec l'Iran)"
- de: biais
  vers: monde
  effet: ±
  delai: permanent
  force: forte
