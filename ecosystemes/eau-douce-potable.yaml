# 0.10.413 — fiche créée le 2026-11-22 (décision de l'auteur, 3 h 05 - 3 h 08) : premier des « plus gros trous » de la carte
# (eau douce et potable à l'échelle du monde ; la guerre comme relation, remarque de l'auteur). Relations à vérifier sur sources.
theme: eau-douce-potable
nom: Eau douce et potable (monde)
declaration:
  but: 'comprendre l''eau douce comme milieu vital à l''échelle du monde : ressources, prélèvements, accès, assainissement,
    qualité, maladies, besoins du corps, gouvernance et tensions ; 2,1 milliards de personnes sans eau potable gérée en sécurité
    et 3,4 milliards sans assainissement géré en sécurité (OMS et UNICEF, rapport 2025)'
  limites: dedans l'eau douce de surface et souterraine, ses usages, son accès, sa qualité, ses maladies, l'eau du corps humain,
    sa gouvernance et les conflits qu'elle déclenche ou subit ; dehors les océans (oceans-et-fleuves), le cas du Moyen-Orient
    détaillé (eau-moyen-orient), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (OMS, UNICEF, FAO, WRI, Pacific Institute) ; aucune personne
    privée
  date: '2026-11-22'
  espace: le monde, par pays et par bassin versant
  temps: de l'heure (la soif) à la décennie (l'épuisement d'une nappe)
  vitesse: l'heure (déshydratation), la semaine (épidémie de choléra), l'année (prélèvements, accès), la décennie (nappes)
  taille: micro (une personne, un puits) à macro (un bassin, le monde)
compartiments:
- id: ressources
  nom: Ressources en eau douce (fleuves, lacs, nappes renouvelables)
  organisation: eau
  elements:
  - eau renouvelable disponible par habitant (en baisse de 7 % en dix ans, FAO AQUASTAT 2025)
  - fleuves et lacs
  - nappes renouvelables
  niveau:
    espace: monde et bassins
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: FAO AQUASTAT (ressources en eau renouvelables par pays)
    statut: a_brancher
  - &id001
    source: situations observées (lecteur-local, comptes/situations.jsonl)
    statut: a_brancher
- id: stress
  nom: Stress hydrique (eau prélevée rapportée à l'eau disponible)
  organisation: eau
  elements:
  - stress hydrique de base
  - variabilité d'une année à l'autre
  - sécheresses
  niveau:
    espace: bassins
    temps: années
    vitesse: saisons à années
    taille: méso à macro
  traces:
  - source: WRI Aqueduct 4.0 (stress hydrique de base ; usage libre, citation demandée)
    statut: a_brancher
  - *id001
- id: nappes
  nom: Nappes souterraines (épuisement)
  organisation: eau
  elements:
  - épuisement des nappes
  - pompage au-delà de la recharge
  - affaissement des sols
  niveau:
    espace: bassins
    temps: années à décennies
    vitesse: années
    taille: méso à macro
  traces:
  - source: WRI Aqueduct 4.0 (épuisement) ; satellites GRACE-FO de la NASA (masse d'eau)
    statut: a_brancher
  - *id001
- id: prelevements
  nom: Prélèvements par usage (agriculture, industrie, villes)
  organisation: economie
  elements:
  - agriculture (environ 72 % des prélèvements, FAO AQUASTAT 2025)
  - industrie et énergie (refroidissement)
  - eau des villes
  niveau:
    espace: pays
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: FAO AQUASTAT (prélèvements par secteur)
    statut: a_brancher
  - *id001
- id: acces
  nom: Accès à l'eau potable
  organisation: societe
  elements:
  - 2,1 milliards de personnes sans eau potable gérée en sécurité, dont 106 millions buvant une eau de surface non traitée
    (OMS, UNICEF, 2025)
  - écarts entre villes et campagnes
  acteurs:
  - nom: des ménages sans accès à l'eau potable (en agrégat)
    taille: macro
    espace: pays
    vitesse: années
    organisation: societe
    facette: collectif
  niveau:
    espace: pays
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: base de données mondiale des ODD (ONU, unstats.un.org/sdgs/dataportal), indicateur 6.1.1
    statut: a_brancher
    odd: ['6.1.1']
  - source: JMP OMS/UNICEF (washdata.org), accès à l'eau potable par pays
    statut: a_brancher
  - *id001
- id: assainissement
  nom: Assainissement et hygiène
  organisation: societe
  elements:
  - 3,4 milliards de personnes sans assainissement géré en sécurité, dont 354 millions en défécation à l'air libre
  - 1,7 milliard sans installation d'hygiène de base à domicile (OMS, UNICEF, 2025)
  niveau:
    espace: pays
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: base de données mondiale des ODD (ONU, unstats.un.org/sdgs/dataportal), indicateur 6.2.1
    statut: a_brancher
    odd: ['6.2.1']
  - source: JMP OMS/UNICEF (washdata.org), assainissement et hygiène par pays
    statut: a_brancher
  - *id001
- id: qualite
  nom: Qualité et pollution de l'eau
  organisation: chimique
  elements:
  - nitrates (engrais)
  - arsenic et fluor naturels
  - rejets urbains et industriels
  - plastiques et substances nouvelles
  niveau:
    espace: sites à bassins
    temps: mois à années
    vitesse: mois
    taille: micro à méso
  traces:
  - source: GEMStat (PNUE), qualité de l'eau douce
    statut: a_brancher
  - *id001
- id: maladies
  nom: Maladies hydriques (choléra, diarrhées, typhoïde)
  organisation: microbiologique
  elements:
  - choléra
  - maladies diarrhéiques
  - typhoïde
  - parasitoses liées à l'eau
  acteurs:
  - nom: un agent pathogène hydrique (Vibrio cholerae, en agrégat)
    taille: micro
    espace: villes et camps
    vitesse: semaines
    organisation: microbiologique
    facette: non_humain
  niveau:
    espace: pays et villes
    temps: semaines à années
    vitesse: semaines
    taille: micro à méso
  traces:
  - source: bulletins d'épidémies de l'OMS (déjà collectés par le bot, collecte_rss)
    statut: collecte
    fichier: collecte_rss.py
  - *id001
- id: corps
  nom: L'eau du corps (besoins vitaux, déshydratation, chaleur)
  organisation: corps
  elements:
  - besoins quotidiens en eau
  - déshydratation
  - coups de chaleur
  - vulnérabilité des enfants et des personnes âgées
  niveau:
    espace: la personne, en agrégat
    temps: heures à jours
    vitesse: heures
    taille: micro
  traces:
  - source: aucune trace directe ; lisible par la chaleur (ERA5-Land, collecte_agro) et la mortalité en agrégat
    statut: inconnue
- id: gouvernance
  nom: Gouvernance et prix de l'eau
  organisation: convention
  elements:
  - droit à l'eau et à l'assainissement (reconnu par l'Assemblée générale des Nations unies en 2010)
  - régies publiques et concessions privées
  - tarifs
  - partage des eaux entre États
  acteurs:
  - nom: une autorité de bassin
    taille: méso
    espace: bassin
    vitesse: années
    organisation: statut
    facette: collectif
  - nom: une compagnie des eaux (publique ou privée)
    taille: méso
    espace: villes
    vitesse: mois
    organisation: economie
    facette: collectif
  niveau:
    espace: pays et bassins
    temps: années
    vitesse: années
    taille: méso à macro
  traces:
  - *id001
- id: tensions
  nom: Tensions et conflits liés à l'eau
  organisation: geopolitique
  elements:
  - l'eau comme déclencheur de violence (accès, contrôle)
  - l'eau comme arme (coupures, contamination)
  - les installations d'eau comme victimes des guerres
  - plus de 1 300 événements recensés depuis l'Antiquité (Pacific Institute, mise à jour de 2022)
  niveau:
    espace: bassins, pays et régions
    temps: jours à décennies
    vitesse: jours à années
    taille: micro à macro
  traces:
  - source: Pacific Institute, Water Conflict Chronology (événements datés, catégories déclencheur, arme, victime)
    statut: a_brancher
  - *id001
