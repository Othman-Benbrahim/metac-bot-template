# 0.10.413 — fiche créée le 2026-11-22 (décision de l'auteur, 3 h 05 - 3 h 08) : premier des « plus gros trous » de la carte
# (eau douce et potable à l'échelle du monde ; la guerre comme relation, remarque de l'auteur). Relations à vérifier sur sources.
theme: eau-douce-potable
nom: Eau douce et potable (monde)
declaration:
  but: 'comprendre l''eau douce comme milieu vital à l''échelle du monde : ressources, prélèvements, accès, assainissement,
    qualité, maladies, besoins du corps, gouvernance et tensions ; 2,1 milliards de personnes sans eau potable gérée en sécurité
    et 3,4 milliards sans assainissement géré en sécurité (OMS et UNICEF, rapport 2025)'
  limites: dedans l'eau douce de surface et souterraine, ses usages, son accès, sa qualité, ses maladies, l'eau du corps humain,
    sa gouvernance et les conflits qu'elle déclenche ou subit ; dehors les océans (oceans-et-fleuves), le cas du Moyen-Orient
    détaillé (eau-moyen-orient), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (OMS, UNICEF, FAO, WRI, Pacific Institute) ; aucune personne
    privée
  date: '2026-11-22'
  espace: le monde, par pays et par bassin versant
  temps: de l'heure (la soif) à la décennie (l'épuisement d'une nappe)
  vitesse: l'heure (déshydratation), la semaine (épidémie de choléra), l'année (prélèvements, accès), la décennie (nappes)
  taille: micro (une personne, un puits) à macro (un bassin, le monde)
