# 0.10.326 — deuxième : Micromotives and Macrobehavior (Schelling, 1978 ; éd. 2006), mémo lectures/schelling-micromotives.md.
# Ordre des compartiments = l'ordre de Sapolsky : un acte s'explique par ce qui s'est passé une seconde avant, puis des
# minutes, des heures, des mois, l'adolescence, l'enfance, les gènes, la culture, l'évolution. Chaque ouvrage suivant
# ajoute ou corrige des compartiments et des relations ici, et son mémo dit lesquels.
# Fiche GÉNÉRIQUE : ses compartiments sont des mécanismes, pas des lieux ; ses ponts vers les fiches situées sont donc
# des influences (partielles, sens à lire), jamais des « meme », pour qu'un stress américain ne devienne pas un front
# ukrainien. La paire de séries de calibration est imposée (clé « series ») quand il faut le même lieu aux deux bouts.
# Règles : agrégats seulement (une population, une cohorte, un camp), jamais la vie intérieure d'une personne nommée ;
# chaque relation se lit dans des actes ou des traces datées ; « parametres » = valeurs de départ que calibrer.py
# remplace par la mesure quand les deux bouts ont une série (registre/calibration.json).
declaration:
  but: "relier les causes de l'action humaine, du corps à la culture, aux actes collectifs que les questions observent (manifestations, violences, votes, trêves, migrations, confiance), pour qu'un état mesuré du milieu dise quels seuils sont abaissés"
  limites: "dedans : le corps en agrégat, les indices du milieu, le stress, les âges de la vie, les gènes en interaction, la culture et l'écologie d'origine, la réciprocité, le nous contre eux, la hiérarchie, la morale, l'empathie, les symboles, le passage à l'acte et la trêve ; dehors : tout diagnostic, toute personne privée, toute prédiction sur un individu"
  observateur: "notre carte, regard extérieur, sources publiques ; Sapolsky rappelle que presque tous ces faits sont des MOYENNES avec une large variation individuelle : la carte ne vaut que pour des populations"
  date: "2026-11-19"
  espace: "d'un corps (en agrégat) à une civilisation"
  temps: "de la seconde avant l'acte aux millénaires de l'évolution et de l'écologie d'origine"
  vitesse: "secondes (réflexe), heures (hormones), mois (stress, plasticité), années (adolescence), décennies (enfance, culture)"
  taille: "micro (le corps, en agrégat) à macro (une culture, un camp)"
