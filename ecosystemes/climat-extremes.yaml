  - méthane
  - aérosols soufrés qui refroidissent
  - vapeur d'eau
  acteurs:
  - nom: le stock de dioxyde de carbone de l'atmosphère
    taille: macro
    espace: mondial
    vitesse: siècle
    organisation: chimique
    facette: non_humain
  - nom: un panache volcanique
    taille: méso
    espace: continent
    vitesse: mois
    organisation: chimique
    facette: non_humain
  niveau:
    espace: mondial
    temps: décennies à siècles
    vitesse: années à siècles
    taille: macro
  traces:
  - source: concentrations mondiales de CO2 et de méthane (NOAA, publiques)
    statut: a_brancher
- id: rayonnement
