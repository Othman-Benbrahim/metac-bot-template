theme: climat-extremes
nom: Climat et extrêmes saisonniers
declaration:
  but: comprendre comment se forment les saisons anormales (chaleurs, sécheresses, pluies, tempêtes, hivers rudes) et ce qu'elles transmettent aux autres écosystèmes (énergie, alimentation, eau, santé,
    infrastructures)
  limites: dedans les océans, l'atmosphère, les oscillations climatiques, les extrêmes, les sols et la végétation qui les amplifient, les feux ; dehors la politique climatique et les émissions en détail
    (tendance de fond seulement)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement
  date: '2026-11-19'
  espace: la planète, lue en quelques régions clés
  temps: du jour (une tempête) à la décennie (réchauffement de fond) ; mémoire des grands épisodes El Niño (à vérifier)
  vitesse: l'heure (orage), la semaine (vague de chaleur), la saison (oscillation), la décennie (tendance)
  taille: une cellule orageuse, une masse d'air, un bassin océanique, le climat mondial
compartiments:
- id: oceans
  organisation: ocean
  nom: Océans
  elements:
  - températures de surface
  - chaleur stockée
  - courants
  acteurs:
  - nom: le Pacifique équatorial
    taille: macro
    espace: océan
    vitesse: mois
    organisation: ocean
    facette: non_humain
  niveau:
    espace: bassins océaniques
    temps: mois à décennies
    vitesse: mois
    taille: macro
  traces:
  - source: températures de surface de la mer (NOAA, publiques)
    statut: a_brancher
- id: oscillations
  organisation: climat
  nom: Oscillations climatiques
  elements:
  - El Niño et La Niña
  - dipôle de l'océan Indien
  - oscillation nord-atlantique
  acteurs:
  - nom: El Niño-oscillation australe
    taille: macro
    espace: mondial
    vitesse: mois
    organisation: climat
    facette: non_humain
  niveau:
    espace: mondial
    temps: cycles de quelques années
    vitesse: mois à saisons
    taille: macro
  traces:
  - source: indice ENSO mensuel (NOAA, public)
    statut: a_brancher
- id: atmosphere
  organisation: meteo
  nom: Circulation atmosphérique
  elements:
  - courants-jets
  - blocages anticycloniques
  - masses d'air
  acteurs:
  - nom: un anticyclone de blocage
    taille: méso
    espace: région
    vitesse: semaines
    organisation: meteo
    facette: non_humain
  niveau:
    espace: régional à hémisphérique
    temps: semaines
    vitesse: jours à semaines
    taille: méso à macro
  traces:
  - source: réanalyses atmosphériques (publiques)
    statut: a_brancher
- id: saisons
  organisation: meteo
  nom: Saisons anormales
  elements:
  - vagues de chaleur
  - hivers rudes
  - saisons trop sèches ou trop humides
  acteurs:
  - nom: une vague de chaleur
    taille: méso
    espace: région
    vitesse: semaines
    organisation: meteo
    facette: non_humain
  niveau:
    espace: régional
    temps: saisons
    vitesse: semaines à saisons
    taille: méso
  traces:
  - source: anomalie de température à Berlin (NASA POWER)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:berlin
  - source: anomalie de température à Delhi (NASA POWER)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:delhi
  - source: anomalie de température à Houston (NASA POWER)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:houston
- id: secheresses
  organisation: eau
  nom: Sécheresses
  elements:
  - déficit de pluie
  - dessèchement des sols
  - étiages
  acteurs:
  - nom: un bassin agricole en sécheresse
    taille: méso
    espace: région
    vitesse: mois
    organisation: eau
    facette: non_humain
  niveau:
    espace: régional
    temps: mois à années
    vitesse: mois
    taille: méso à macro
  traces:
  - source: indices de sécheresse (moniteurs publics)
    statut: a_brancher
- id: tempetes
  organisation: meteo
  nom: Tempêtes et pluies extrêmes
  elements:
  - cyclones tropicaux
  - moussons extrêmes
  - inondations
  acteurs:
  - nom: un cyclone tropical
    taille: méso
    espace: région
    vitesse: jours
    organisation: meteo
    facette: non_humain
  niveau:
    espace: régional
    temps: saison cyclonique
    vitesse: heures à jours
    taille: méso
  traces:
