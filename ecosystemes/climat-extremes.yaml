    facette: non_humain
  niveau:
    espace: région à continent
    temps: permanent à l'échelle humaine
    vitesse: millénaire
    taille: méso à macro
  traces:
  - source: modèles numériques de terrain publics
    statut: a_brancher
relations:
- de: oceans
  vers: oscillations
  effet: ±
  delai: mois
  force: forte
  coupure: inconnue
  statut: a_verifier
  texte: la chaleur du Pacifique équatorial fait basculer El Niño ou La Niña
- de: oscillations
  vers: atmosphere
  effet: ±
  delai: mois
  force: forte
  intensite:
    mesure: force de l'épisode El Niño ou La Niña
    regle: proportionnelle
  coupure: régions non télé-connectées
  statut: a_verifier
  texte: les oscillations déplacent pluies et chaleurs sur plusieurs continents (télé-connexions)
- de: atmosphere
  vers: saisons
  effet: ±
  delai: jours à semaines
  force: forte
  intensite:
    mesure: durée du blocage anticyclonique
    regle: seuil
  coupure: rupture du blocage
  statut: a_verifier
  texte: un blocage qui dure transforme un temps chaud en vague de chaleur
- de: atmosphere
  vers: tempetes
  effet: ±
  delai: jours
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: la circulation dirige et nourrit les tempêtes
- de: oceans
  vers: tempetes
  effet: +
  delai: jours à semaines
  force: forte
  intensite:
    mesure: température de surface de la mer
    regle: seuil
  coupure: cisaillement des vents
  statut: a_verifier
  texte: une mer chaude au-delà d'un seuil nourrit des cyclones plus intenses
- de: saisons
  vers: secheresses
  effet: +
  delai: semaines à mois
  force: forte
  coupure: retour des pluies
  statut: a_verifier
  texte: chaleur et absence de pluie installent la sécheresse
- de: secheresses
  vers: vegetation
  effet: '-'
  delai: semaines
  force: forte
  intensite:
    mesure: déficit d'humidité du sol
    regle: seuil
  coupure: irrigation
  statut: a_verifier
  texte: la végétation tient puis décroche d'un coup
- de: vegetation
  vers: saisons
  effet: '-'
  retour: '-'
  forme: competition
  delai: jours à semaines
  force: moyenne
  coupure: pluie
  statut: a_verifier
  texte: 'boucle : des sols secs chauffent plus l''air, et l''air plus chaud assèche les sols (rétroaction qui entretient la chaleur)'
- de: vegetation
  vers: feux
  effet: +
  delai: jours
  force: forte
  intensite:
    mesure: sécheresse de la végétation
    regle: seuil
  coupure: pluie, coupe-feux
  statut: a_verifier
  texte: une végétation desséchée devient combustible
- de: feux
  vers: vegetation
  effet: '-'
  delai: jours à années
  force: forte
  intensite:
    mesure: surface brûlée
    regle: hysteresis
  coupure: repousse
  statut: a_verifier
  texte: les feux détruisent la végétation, qui met des années à revenir (ou ne revient pas à l'identique)
- de: tendance
  vers: saisons
  effet: +
  delai: décennies
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: le réchauffement de fond rend les extrêmes chauds plus fréquents
- de: saisons
  vers: exposes
  effet: '-'
  delai: jours
  force: forte
  intensite:
    mesure: anomalie de température du moment
    regle: seuil
  coupure: climatisation, réseaux dimensionnés
  statut: a_verifier
  texte: au-delà d'un seuil de chaleur ou de froid, réseaux et santé cèdent
- de: tempetes
  vers: exposes
  effet: '-'
  delai: heures à jours
  force: forte
  coupure: alerte et protection
  statut: a_verifier
  texte: cyclones et inondations frappent infrastructures et récoltes
- de: exposes
  vers: vegetation
  effet: '-'
  delai: années
  force: faible
  coupure: protection des milieux
  statut: a_verifier
  texte: urbanisation et défrichement réduisent la végétation qui tamponnait les extrêmes
- de: chimie_atmosphere
  vers: rayonnement
  effet: +
  delai: années à décennies
  force: forte
  coupure: aérosols qui masquent une partie du réchauffement
  statut: a_verifier
  texte: 'les gaz à effet de serre retiennent la chaleur : le bilan d''énergie penche vers le réchauffement'
- de: rayonnement
  vers: tendance
  effet: +
  delai: décennies
  force: forte
  coupure: chaleur absorbée par les océans
  statut: a_verifier
  texte: un bilan d'énergie positif fait monter les températures de fond
- de: rayonnement
  vers: rayonnement
  effet: +
  delai: années
  force: moyenne
  intensite:
    mesure: recul de la banquise et de la neige
    regle: hysteresis
  coupure: inconnue
  statut: a_verifier
  texte: 'au sein du niveau physique : moins de glace, moins de lumière renvoyée, plus de chaleur, encore moins de glace (rétroaction d''albédo)'
- de: oceans
  vers: chimie_atmosphere
  effet: '-'
  retour: +
  delai: décennies
  force: moyenne
  intensite:
    mesure: température des eaux de surface
    regle: saturation
  coupure: océans plus chauds qui absorbent moins
  statut: a_verifier
  texte: les océans absorbent une part du CO2 ; plus chauds et plus acides, ils en absorbent moins
- de: relief
  vers: secheresses
  effet: +
  delai: permanent
  force: forte
  coupure: vents changeant de direction
  statut: a_verifier
  texte: 'une chaîne de montagnes arrête les pluies : un versant arrosé, l''autre sec (ombre pluviométrique)'
- de: relief
  vers: atmosphere
  effet: ±
  forme: contrainte
  delai: permanent
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: le relief canalise les vents et fixe la place des blocages et des moussons
- de: tendance
  vers: oscillations
  effet: ±
  delai: décennies
  force: inconnue
  intensite:
    mesure: réchauffement de fond accumulé
    regle: seuil
  coupure: inconnue
  statut: a_verifier
  texte: le climat de fond peut changer la fréquence des épisodes El Niño (débat scientifique, à vérifier)
