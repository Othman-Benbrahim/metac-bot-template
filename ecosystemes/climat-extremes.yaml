    statut: collecte
    fichier: collecte_feux.py
    adaptateur: feux:US
  - source: feux actifs au Brésil (FIRMS)
    statut: collecte
    fichier: collecte_feux.py
    adaptateur: feux:BR
- id: tendance
  organisation: climat
  nom: Réchauffement de fond
  elements:
  - hausse des températures moyennes
  - fréquence croissante des extrêmes
  niveau:
    espace: mondial
    temps: décennies
    vitesse: décennies
    taille: macro
  traces:
  - source: anomalies mondiales de température (publiques)
    statut: a_brancher
  - source: dérive annuelle de la température à Delhi (NASA POWER, anomalie glissante sur 365 jours)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: climat:delhi
  - source: dérive annuelle de la température à Berlin (NASA POWER)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: climat:berlin
- id: exposes
  organisation: technique
  nom: Sociétés et infrastructures exposées
  elements:
  - réseaux électriques
  - récoltes
  - villes
  - santé
  - transports
  acteurs:
  - nom: un réseau électrique régional
    taille: méso
    espace: région
    vitesse: heures
    organisation: technique
    facette: collectif
  - nom: une ville en vague de chaleur
    taille: méso
    espace: local
    vitesse: jours
    organisation: societe
    facette: collectif
  niveau:
    espace: local à national
    temps: jours à saisons
    vitesse: heures à semaines
    taille: micro à macro
  traces:
  - source: coupures d'internet par pays (OONI, signe indirect de coupures de courant)
    statut: collecte
    fichier: collecte_ooni.py
    adaptateur: ooni:IN
  - source: interdictions de survol pour danger (feux, catastrophes ; FAA)
    statut: collecte
    adaptateur: tfr:HAZARDS
- id: chimie_atmosphere
