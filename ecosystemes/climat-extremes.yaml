    statut: a_brancher
- id: vegetation
  organisation: vegetal
  nom: Sols et végétation
  elements:
  - humidité des sols
  - couvert végétal
  - albédo
  acteurs:
  - nom: une forêt sèche
    taille: méso
    espace: région
    vitesse: saisons
    organisation: vegetal
    facette: non_humain
  niveau:
    espace: local à régional
    temps: saisons
    vitesse: semaines à saisons
    taille: micro à méso
  traces:
  - source: indices de végétation par satellite (publics)
    statut: a_brancher
- id: feux
  organisation: vegetal
  nom: Feux de végétation
  elements:
  - feux de forêt
  - feux de brousse
  - fumées
  acteurs:
  - nom: un foyer de feu
    taille: micro
    espace: site
    vitesse: heures
    organisation: vegetal
    facette: non_humain
  - nom: une saison des feux
    taille: méso
    espace: région
    vitesse: mois
    organisation: climat
    facette: non_humain
  niveau:
    espace: local à régional
    temps: saison des feux
    vitesse: heures à semaines
    taille: micro à méso
  traces:
