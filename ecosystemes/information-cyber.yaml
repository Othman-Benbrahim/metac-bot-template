- id: langage_performatif
  nom: 'Langage performatif (dire, c''est faire)'
  organisation: ideologie
  elements:
  - 'un énoncé d''autorité fait être ce qu''il dit : décret, proclamation, renommage (J. L. Austin, How to Do Things with Words, 1962 ; B. Cassin, La Guerre des mots, 2025)'
  - 'renommer par décret : golfe du Mexique devenu « golfe d''Amérique », mont Denali redevenu « mont McKinley » (décret américain « Restoring Names That Honor American Greatness », 20 janvier 2025)'
  - 'slogans répétés, éléments de langage, flou du sens (« nous », « grand », « spécial ») (Cassin, 2025)'
  - 'écart entre annoncer et faire : une annonce tenue (« ils font ce qu''ils disent qu''ils feront », Cassin) ou suivie d''un retrait (« TACO », R. Armstrong, Financial Times, 2025)'
  niveau:
    espace: pays et langues
    temps: d'un décret (jour) à une génération (mémoire)
    vitesse: jours à années
    taille: macro
- id: effacement_mots
  nom: 'Effacement et interdiction de mots'
  organisation: convention
  elements:
  - 'environ 200 mots et sigles à éviter dans les documents fédéraux américains, dont « diversité », « crise climatique », « pollution » (liste du New York Times, 7 mars 2025, citée par Cassin)'
  - 'Russie : « opération militaire spéciale » au lieu de « guerre » ; peine pouvant aller jusqu''à 15 ans de prison pour les « fausses informations » sur l''armée (loi de mars 2022) ; loi d''avril 2013 contre le lexique « contraire à la décence » dans les médias (Cassin)'
  - 'taire le nom d''un opposant (Navalny, rarement nommé par le président russe, selon Cassin)'
  - 'autres cas cités par Cassin : « Judée-Samarie » pour la Cisjordanie (Israël), refus du mot « génocide » (Turquie), interdiction des études de genre (Hongrie) et du langage inclusif (Argentine, Italie)'
  - 'un mot retiré des textes officiels disparaît des comptes sans que la chose disparaisse'
  niveau:
    espace: pays et langues
    temps: d'un décret (jour) à une génération (mémoire)
    vitesse: jours à années
    taille: macro
- id: inversion_reecriture
  nom: 'Inversion de l''accusation et réécriture du passé'
  organisation: ideologie
  elements:
  - 'retourner l''accusation : l''agresseur se présente comme agressé (Cassin, 2025)'
  - 'réécrire l''histoire par décret ou par loi : décret américain « Restoring Truth and Sanity to American History » (27 mars 2025, visant la Smithsonian) ; lois russes contre la critique de l''Armée rouge ; dissolution de l''ONG Mémorial (Cassin)'
  - '« faits alternatifs » (Kellyanne Conway, janvier 2017)'
  niveau:
    espace: pays et langues
    temps: d'un décret (jour) à une génération (mémoire)
    vitesse: jours à années
    taille: macro
- id: resilience_informationnelle
  nom: Résilience informationnelle (la société qui encaisse)
  organisation: societe
  elements:
  - "la guerre cognitive exploite surtout les fragilités de la société visée : confiance faible dans les institutions, messages officiels contradictoires (« dissonance d'autorité »), sens partagé fragmenté (Russo et al., Defense & Security Analysis, 2026, doi 10.1080/14751798.2026.2714711, CC BY 4.0 ; cadre conceptuel, non validé)"
  - "cinq mécanismes en chaîne : exposition, interprétation, activation affective, amplification sociale, réponse collective ; chacun est une faille et un point d'intervention (même source)"
  - "ce qui protège : canaux de confiance redondants, cohérence entre autorités, reconnaissance de l'incertitude, principes CERC (être premier, juste, crédible, empathique, pousser à l'action, respecter)"
  - "Arcom, mars 2026 (2 000 personnes, novembre 2025) : 22 % jugent exactes au moins quatre de sept fausses affirmations, 23 % les repèrent toutes ; les moins perméables s'informent davantage par la télévision et la presse, les plus vulnérables par les médias algorithmiques (réseaux sociaux, plateformes, IA)"
  - "un effet mesuré de la riposte : la vérification par l'AFP réduit d'environ 8 % la circulation d'une fausse information sur Facebook (Cagé, Gallo, Hengel, Henry, Huang, CEPR Discussion Paper 20895, décembre 2025)"
  - "confiance dans l'actualité, 2026 : la plus forte au Kenya et au Nigeria (68 %), en Finlande (63 %) ; la plus faible en Hongrie (17 %), en Grèce (18 %), en Slovaquie (19 %) ; États-Unis 25 % (32 % en 2015), France 29 % (38 % en 2015) (Reuters Institute, Digital News Report 2026, pages pays)"
  - "confiance dans l'actualité : 37 %, plus bas niveau depuis 2015 ; évitement de l'actualité : 42 % (Reuters Institute, Digital News Report 2026)"
  - "dénoncer une manipulation en la relayant l'amplifie ; il vaut mieux expliquer le mécanisme et distinguer viralité et effet réel (Viginum et Chloé Debiève, Méta-Media n°25)"
  - "modèle : la défense psychologique nordique (Suède, Finlande : sécurité globale, responsabilité partagée)"
  niveau:
    espace: individu à pays
    temps: années
    vitesse: jours à années
    taille: micro à macro
    objet: information
  traces:
  - {source: "confiance dans l'actualité, médiane des 48 marchés, 2025-2026 (Reuters Institute, Digital News Report 2026)", statut: collecte, fichier: mise_au_point/dnr_confiance.py, adaptateur: "confiance_actualite:mediane"}
  - {source: "confiance dans l'actualité en France : 38 % en 2015, 29 % en 2025 et 2026 (Reuters Institute, Digital News Report 2026)", statut: collecte, fichier: mise_au_point/dnr_confiance.py, adaptateur: "confiance_actualite:FRA"}
  - {source: "confiance dans les institutions (enquête de l'OCDE sur la confiance ; Eurobaromètre) ; à brancher", statut: a_brancher}
- id: politiques_anti_desinformation
  nom: Politiques de lutte contre la désinformation (lois, agences, régulation)
  organisation: statut
  elements:
  - "France : Viginum (2021) ne retient une ingérence numérique étrangère que si quatre critères sont réunis : atteinte possible aux intérêts fondamentaux, contenu inexact ou trompeur, diffusion artificielle et massive, acteur étranger impliqué (décret du 13 juillet 2021) ; stratégie nationale 2026-2030"
  - "78 pays ont adopté 105 lois sur la désinformation entre 2011 et 2022 : 14 entre 2011 et 2015, 91 entre 2016 et 2022, dont 36 en 2020 ; journalistes emprisonnés pour ce motif : 22 (2011-2015), 225 (2016-2022) (CIMA, « Chilling Legislation »)"
  - "moteurs de ces lois relevés sur 177 pays : popularisation du terme « fake news », influence occidentale sur le discours de sécurité, désir de contrôler les flux d'information, révélations sur les plateformes (Citizen Lab, juin 2025)"
  - "divergence transatlantique : l'Europe renforce (règlement sur les services numériques, bouclier européen de la démocratie) ; les États-Unis ferment en avril 2025 le bureau du Département d'État chargé de la désinformation étrangère, accusé de « censurer les Américains » (Times of Israel, 17 avril 2025)"
  - "les mêmes outils protègent un débat public ou servent à faire taire des critiques selon le régime : c'est la tension propre à ce compartiment"
  niveau:
    espace: pays à monde
    temps: années
    vitesse: mois à années
    taille: macro
    objet: normes
  traces:
  - {source: "lois sur la désinformation adoptées par an et par pays (base CIMA / NED) ; à brancher", statut: a_brancher}
