  coupure: lassitude
  statut: a_verifier
  texte: un récit chargé d'émotion capte l'attention
- de: attention
  vers: foules
  effet: +
  retour: +
  forme: mutualisme
  delai: heures
  force: moyenne
  intensite:
    mesure: vitesse de diffusion
    regle: seuil
  coupure: démenti crédible
  statut: a_verifier
  texte: 'propre au niveau psychologique : attention et contagion émotionnelle s''entretiennent jusqu''à l''emballement'
- de: foules
  vers: foules
  effet: +
  delai: minutes
  force: forte
  intensite:
    mesure: part de messages indignés ou paniqués
    regle: seuil
  coupure: fatigue
  statut: a_verifier
