theme: information-cyber
nom: Information et cyber
declaration:
  but: 'comprendre l''information comme un milieu : comment les récits, la censure, les coupures et les cyberattaques modifient ce que les acteurs savent et croient, donc ce qu''ils font'
  limites: dedans les récits et la désinformation, l'attention, la censure et les coupures d'internet, les cyberattaques au niveau de leurs effets publics, les plateformes, les langues et les biais des
    sources, la psychologie des foules ; dehors tout détail technique offensif, et les personnes privées
  observateur: notre bot et nos collectes de médias et de mesures d'internet, regard extérieur ; nos sources sont elles-mêmes biaisées (presse surtout anglophone)
  date: '2026-11-19'
  espace: le monde, par pays et par langue
  temps: de l'heure (une rumeur) à la décennie (une plateforme qui naît ou meurt)
  vitesse: la minute (diffusion), le jour (cycle de l'information), l'année (lois sur internet)
  taille: micro (un message) à macro (l'espace médiatique mondial)
compartiments:
- id: recits
  nom: Récits et désinformation
  organisation: ideologie
  elements:
  - récits officiels
  - contre-récits
  - rumeurs
  - campagnes de désinformation (en agrégat)
  acteurs:
  - nom: un média d'État
    taille: méso
    espace: mondial
    vitesse: heures
    organisation: statut
    facette: collectif
  - nom: un récit nationaliste
    taille: macro
    espace: pays
    vitesse: années
    organisation: ideologie
    facette: ideologie
  niveau:
    espace: médiatique mondial
    temps: jours à années
    vitesse: heures à années
    taille: micro à macro
  traces:
  - source: récit russe (sources officielles et médias d'État)
    statut: collecte
    fichier: collecte_recit_russe.py
  - source: chaînes Telegram publiques
    statut: collecte
    fichier: collecte_telegram.py
  - source: articles des médias d'État russes sur la Moldavie
    statut: collecte
    adaptateur: recit_russe:MD
  - source: articles de vérification des faits sur l'Union européenne (flux RSS)
    statut: collecte
    adaptateur: rss_region:REG_ORG_EUR_EU:verification
- id: attention
  nom: Attention collective
  organisation: psychologique
  elements:
  - pics d'attention
  - lassitude
  - agenda des médias
  niveau:
    espace: médiatique
    temps: cycle de l'information
    vitesse: heures à semaines
    taille: méso à macro
  traces:
  - source: volume d'articles GDELT
    statut: collecte
    fichier: collecte_gdelt.py
  - source: flux RSS de presse et d'institutions
    statut: collecte
    fichier: collecte_rss.py
- id: foules
  nom: Psychologie des foules
  organisation: psychologique
  elements:
  - contagion émotionnelle
  - panique
  - indignation
  - polarisation
  acteurs:
  - nom: une foule en ligne
    taille: méso
    espace: pays
    vitesse: heures
    organisation: psychologique
    facette: psyche
  niveau:
    espace: pays et communautés en ligne
    temps: heures à jours
    vitesse: minutes à jours
    taille: méso
  traces:
  - source: aucune trace directe ; lisible dans les pics d'attention et le ton
    statut: inconnue
- id: censure
  nom: Censure et filtrage
  organisation: statut
  elements:
  - blocage de sites et d'applications
  - filtrage
  - lois sur les contenus
  acteurs:
  - nom: une autorité de régulation d'internet
    taille: méso
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: collectif
  niveau:
    espace: pays
    temps: jours à années
    vitesse: jours
    taille: macro
  traces:
  - source: mesures OONI de censure en Iran
    statut: collecte
    fichier: collecte_ooni.py
    adaptateur: ooni:IR
  - source: mesures OONI de censure en Russie
    statut: collecte
    fichier: collecte_ooni.py
    adaptateur: ooni:RU
- id: coupures
  nom: Coupures d'internet
  organisation: technique
  elements:
  - coupures nationales ou régionales
  - ralentissements
  - pannes de câbles
  niveau:
    espace: pays et régions
    temps: heures à semaines
    vitesse: heures
    taille: méso à macro
  traces:
  - source: coupures d'internet (Cloudflare Radar)
    statut: collecte
    fichier: collecte_radar.py
  - source: coupures d'internet en cours par jour (Cloudflare Radar, tous pays)
    statut: collecte
    adaptateur: radar
- id: cyber
  nom: Cyberattaques (effets publics)
  organisation: technique
  elements:
  - rançongiciels touchant des services publics
  - attaques contre des infrastructures
  - attribution publique à un État
  acteurs:
  - nom: un service public paralysé
    taille: méso
    espace: pays
    vitesse: jours
    organisation: technique
    facette: collectif
  niveau:
    espace: mondial
    temps: jours à mois
    vitesse: heures à semaines
    taille: méso à macro
  traces:
  - source: avis publics des agences de cybersécurité (CERT-FR et autres)
    statut: collecte
    fichier: collecte_rss.py
- id: plateformes
  nom: Plateformes et réseaux sociaux
  organisation: economie
  elements:
  - algorithmes de recommandation
  - modération
  - migrations d'utilisateurs
  - messageries chiffrées
  acteurs:
  - nom: une grande plateforme
    taille: macro
    espace: mondial
    vitesse: mois
    organisation: economie
    facette: collectif
  niveau:
    espace: mondial
    temps: mois à années
    vitesse: jours à années
    taille: macro
  traces:
  - source: certificats émis pour les domaines suivis
    statut: collecte
    fichier: collecte_certificats.py
- id: langues_biais
  nom: Langues et biais des sources
  organisation: convention
  elements:
  - presse surtout anglophone
  - angles morts linguistiques
  - définitions et codages des événements
  niveau:
    espace: aires linguistiques
    temps: durable
    vitesse: années
    taille: macro
  traces:
  - source: trois codeurs des pays cités dans les flux RSS
    statut: collecte
    fichier: collecte_rss.py
- id: infrastructure
  nom: Infrastructure physique d'internet
  organisation: technique
  elements:
  - câbles sous-marins
  - centres de données (refroidis à l'eau)
  - points d'échange
  niveau:
    espace: océans et pays
    temps: décennies
    vitesse: jours (une panne) à années
    taille: macro
  traces:
  - source: cartes publiques des câbles sous-marins
    statut: a_brancher
  - source: nouveaux certificats des laboratoires d'IA (Cert Spotter)
    statut: collecte
    adaptateur: certificats
- id: etats
  nom: États et contrôle de l'information
  organisation: geopolitique
  elements:
  - souveraineté numérique
  - guerre informationnelle
  - sanctions contre des médias
  acteurs:
  - nom: un État qui coupe internet pendant des manifestations
    taille: macro
    espace: pays
    vitesse: heures
    organisation: statut
    facette: statut
  niveau:
    espace: pays
    temps: crises et années
    vitesse: heures à années
    taille: macro
  traces:
  - source: sanctions visant des médias (listes publiques)
    statut: collecte
    fichier: collecte_sanctions.py
relations:
