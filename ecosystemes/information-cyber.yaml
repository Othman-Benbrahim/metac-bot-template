# 0.10.475 (décision de l'auteur, 2026-11-23, 18 h 00) : lecture de Barbara Cassin, La Guerre des mots. Trump, Poutine et
# l'Europe (Flammarion, 2025 ; Champs, 2026). Seuls les mécanismes et les faits datés sont repris, attribués ; les
# jugements et portraits de l'essai ne le sont pas. Les mécanismes valent pour tout émetteur, pas pour deux acteurs.
theme: information-cyber
nom: Information et cyber
declaration:
  but: 'comprendre l''information comme un milieu : comment les récits, la censure, les coupures et les cyberattaques modifient ce que les acteurs savent et croient, donc ce qu''ils font'
  limites: dedans les récits et la désinformation, l'attention, la censure et les coupures d'internet, les cyberattaques au niveau de leurs effets publics, les plateformes, les langues et les biais des
    sources, la psychologie des foules ; dehors tout détail technique offensif, et les personnes privées
  observateur: notre bot et nos collectes de médias et de mesures d'internet, regard extérieur ; nos sources sont elles-mêmes biaisées (presse surtout anglophone)
  date: '2026-11-19'
  espace: le monde, par pays et par langue
  temps: de l'heure (une rumeur) à la décennie (une plateforme qui naît ou meurt)
  vitesse: la minute (diffusion), le jour (cycle de l'information), l'année (lois sur internet)
  taille: micro (un message) à macro (l'espace médiatique mondial)
compartiments:
- id: recits
  nom: Récits et désinformation
  organisation: ideologie
  elements:
  - récits officiels
  - contre-récits
  - rumeurs
  - campagnes de désinformation (en agrégat)
  - "modes opératoires nommés par des rapports publics : Doppelgänger (clonage de sites de médias), Matriochka (saturation des vérificateurs par de faux contenus), Storm-1516, Portal Kombat (réseau « Pravda », au moins 193 sites, Viginum, février 2024), Spamouflage (prochinois) ; « LLM grooming » : contenus produits en masse pour être absorbés par les modèles de langage (glossaire de Méta-Media n°25, France Télévisions, 2026)"
  - "contre-propagande iranienne en vidéos générées par IA, façon Lego et rap, depuis fin mars 2026 : deux groupes (PersiaBoi, Explosive Media, moins de dix personnes, l'État iranien pour « client »), réponse en quelques heures, reprise des récits de l'opposition américaine, relais par les médias d'État iraniens et russes (Arnaud Mercier, The Conversation, repris par Méta-Media n°25)"
  - "France : opérations d'ingérence détectées multipliées par 23 depuis août 2023, plus de 100 faux sites en .fr ; 2e pays européen le plus visé après l'Ukraine (rapport du SEAE, mars 2026) ; mais 7e seulement pour les actions susceptibles de causer des dommages matériels ou humains (Fondation Descartes, août 2026) ; chiffres relayés par Méta-Media n°25, sources primaires non lues"
