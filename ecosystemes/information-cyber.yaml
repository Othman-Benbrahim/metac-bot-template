  - "les plateformes sociales et vidéo dépassent les sites des éditeurs comme porte d'accès à l'information en ligne : 54 % contre 51 % ; 10 % s'informent chaque semaine par un assistant d'IA, contre 7 % en 2025 (Reuters Institute, Digital News Report 2026, 48 marchés, 97 520 personnes)"
