    chrétiens que l'Europe, 30,7 % contre 22,3 % des chrétiens du monde) ; majorités musulmanes - Afrique du Nord,
    Moyen-Orient, Asie centrale, Pakistan, Bangladesh, Indonésie ; hindoue - Inde, Népal ; bouddhistes - Asie du Sud-Est
    continentale, Sri Lanka, Bhoutan, Mongolie ; sans religion - Chine (Pew, 2025)
  - chaque pays abrite des minorités ; les frontières religieuses ne suivent pas les frontières d'États (Nigeria,
