- id: sectes
  nom: Sectes et dérives sectaires (en périphérie de tous les blocs)
  organisation: societe
  elements:
  - France - la Miviludes suit les dérives sectaires, de plus en plus tournées vers la santé et les soins non
    conventionnels (entretien de la Miviludes, Politis, avril 2025)
  - cas historiques - Ordre du Temple solaire (1994-1995), Aum Shinrikyo (attentat au sarin de Tokyo, 1995)
  - statuts différents selon les pays - un même mouvement peut être classé secte dans un pays et reconnu comme religion
    dans un autre (Scientologie, Témoins de Jéhovah)
  niveau:
    espace: local à monde
    temps: années
    vitesse: mois
    taille: micro
