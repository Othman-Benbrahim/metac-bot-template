# 0.10.451 — fiche créée le 2026-11-22 (remarque de l'auteur, 9 h 04 : « autre écosystème structurel : les croyances et la
# religion ; lier les aires géographiques à des blocs religieux sans généraliser (ce sont des agrégats) ; parler des cas
# extrêmes et des sectes ; toutes les religions représentées, y compris les sous-catégories, en plus petit, avec pour
# chaque bloc en périphérie les sectes et les extrêmes ; à lier aux rapports de force, à la culture, à la politique et à
# la géopolitique, et aux personnes publiques selon le contexte (le pape, le dalaï-lama…) »). Les sous-catégories sont
# les acteurs de chaque bloc (petits nœuds sur la carte) ; les extrêmes ont chacun leur compartiment, relié à son bloc.
# Règles : agrégats, jamais une généralisation sur les croyants d'une religion ou d'un pays ; un extrême n'est inscrit que
# s'il est documenté (violences, groupes armés, rapports publics) ; un mouvement classé « secte » dans un pays et reconnu
# ailleurs porte les deux statuts. Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: croyances-religions
nom: Croyances et religions (blocs, sous-courants, extrêmes, sectes)
declaration:
  but: 'situer les grandes familles religieuses comme des agrégats - en 2020, chrétiens 28,8 %, musulmans 25,6 %, sans
    religion 24,2 %, hindous 14,9 %, bouddhistes 4,1 %, juifs 0,2 %, autres 2,2 % (Pew, juin 2025) -, leurs sous-courants,
    leurs franges extrêmes et les sectes, et leurs liens avec les rapports de force, la culture, la politique et la
    géopolitique ; aucun pays n''est uniforme, aucune religion n''est réductible à ses extrêmes'
  limites: dedans les blocs religieux et les sans-religion, les sous-courants, les extrêmes documentés, les sectes, les
    aires géographiques en agrégats, religion et politique, les rapports de force démographiques ; dehors les mécanismes
    psychologiques de la croyance (humain), le patrimoine religieux (culture-memoire), les guerres elles-mêmes (fiches de
    conflit), sauf par les ponts
  observateur: notre carte, regard extérieur et neutre ; sources publiques (Pew Research Center, Saint-Siège, Institut pour
    l'économie et la paix, rapports officiels, presse) ; personnalités religieuses publiques dans leur rôle public
  date: '2026-11-22'
  espace: la communauté locale, le pays, l'aire culturelle, le monde
  temps: de l'année (un mouvement) au millénaire (une religion)
  vitesse: la génération, le siècle
  taille: micro (une communauté) à macro (2,3 milliards de chrétiens)
