# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: canada
nom: Canada
declaration:
  but: comprendre le Canada comme une économie très dépendante des États-Unis, en rupture commerciale avec eux depuis 2025,
    riche en énergie et en minerais, avec un grand Nord arctique
  limites: dedans le commerce avec les États-Unis et l'accord nord-américain (CUSMA), l'énergie, les minerais, la politique
    intérieure, le Québec et l'unité, l'Arctique canadien, les peuples autochtones ; dehors l'Arctique dans son ensemble (arctique),
    sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: dix provinces et trois territoires
  temps: de la saison (feux, récoltes) au cycle électoral
  vitesse: la semaine (droits de douane), l'année (budgets)
  taille: une province, la fédération
