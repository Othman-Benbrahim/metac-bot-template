  vers: economie-entreprises:finance_entreprise
  nature: "introductions en bourse et levées de fonds des laboratoires"
- depuis: calcul
  vers: rivalite-sino-americaine:technologie
  nature: les puces au cœur de la rivalité
  type: meme
- depuis: energie_eau
  vers: oceans-et-fleuves:refroidissement
  nature: l'eau qui refroidit les centres de données
  type: meme
- depuis: energie_eau
