theme: "sciences-techniques"
nom: "Sciences et techniques (dont l'intelligence artificielle)"
declaration:
  but: "comprendre ce qui accélère ou freine la recherche, les lancements de produits et la diffusion des techniques, y compris l'intelligence artificielle ; questions du tournoi sur les lancements de modèles, les offres des laboratoires, la course entre États"
  limites: "dedans la recherche, les laboratoires et les entreprises, les puces et le calcul, l'énergie et l'eau des centres de données, la régulation, la diffusion des innovations, la course entre États ; dehors les usages militaires détaillés"
  observateur: "notre carte, regard extérieur, depuis l'Europe ; un modèle d'IA écrit cette fiche, ce qui est un biais déclaré"
  date: "2026-11-19"
  espace: "un laboratoire, une filière, le monde"
  temps: "du lancement d'un produit à la décennie de recherche"
  vitesse: "la semaine (une annonce), l'année (une génération de puces), la décennie (une science)"
  taille: "micro (une équipe) à macro (une filière mondiale)"
compartiments:
  - id: "ia"
    nom: "Intelligence artificielle (modèles, laboratoires, produits)"
    organisation: "technique"
    elements: ["modèles", "laboratoires", "lancements de produits", "offres et tarifs"]
    acteurs:
      - {nom: "un laboratoire d'IA", taille: "méso", espace: "mondial", vitesse: "semaines", organisation: "economie", facette: "collectif"}
      - {nom: "la conviction d'une course vers une IA générale", taille: "macro", espace: "mondial", vitesse: "années", organisation: "ideologie", facette: "ideologie"}
    niveau: {espace: "mondial", temps: "cycles de lancement de mois", vitesse: "semaines à mois", taille: "méso à macro"}
    traces:
      - {source: "certificats émis pour les domaines des laboratoires (signes de nouveaux services)", statut: "collecte", fichier: "collecte_certificats.py"}
      - {source: "modèles publiés par mois par OpenAI, Anthropic, Google, xAI et Meta (Epoch AI, CC BY ; série déjà collectée, ajoutée ici le 2026-11-25 d'après les priorités de couverture)", statut: "collecte", fichier: "collecte_epoch.py", adaptateur: "epoch:frontiere"}
  - id: "calcul"
    nom: "Puces et calcul"
    organisation: "technique"
    elements: ["puces avancées", "usines de semi-conducteurs", "centres de calcul"]
    acteurs:
      - {nom: "un fondeur de puces", taille: "macro", espace: "mondial", vitesse: "années", organisation: "economie", facette: "collectif"}
    niveau: {espace: "quelques pôles mondiaux", temps: "générations de puces", vitesse: "mois à années", taille: "macro"}
    traces:
      - {source: "IMF PortWatch (détroit de Taïwan, porte-conteneurs)", statut: "collecte", fichier: "collecte_portwatch.py", adaptateur: "portwatch:taiwan:porte_conteneurs"}
  - id: "energie_eau"
    nom: "Énergie et eau des centres de données"
    organisation: "physique"
    elements: ["électricité", "chaleur à évacuer", "eau de refroidissement"]
    niveau: {espace: "site à région", temps: "saisons", vitesse: "jours à années", taille: "méso"}
    traces:
      - {source: "prix du gaz Henry Hub (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DHHNGSP"}
      - {source: "anomalie de température à Houston", statut: "collecte", fichier: "collecte_meteo.py", adaptateur: "meteo:houston"}
  - id: "recherche"
    nom: "Recherche scientifique"
    organisation: "technique"
    elements: ["publications", "universités", "financements publics"]
    niveau: {espace: "mondial", temps: "années", vitesse: "mois à décennies", taille: "micro à macro"}
    traces:
      - {source: "prépublications en apprentissage automatique par jour (arXiv cs.LG)", statut: "collecte", fichier: "collecte_series_publiques.py", adaptateur: "pub:arxiv_cs_lg"}
  - id: "developpement"
    nom: "Développement, essais et autorisation (de la découverte au produit)"
    organisation: "technique"
    elements:
      - "le passage de l'idée au produit prend d'ordinaire des années, voire des décennies ; un nouveau vaccin demande en temps normal environ dix mois d'examen à la FDA (Science News, 2020)"
      - "vaccins contre la covid : génome du virus disponible début janvier 2020, premiers vaccins mis au point, testés et autorisés en urgence en 11 mois ; examen de la FDA en 21 jours (Pfizer) et 19 jours (Moderna) ; environ quatre ans gagnés, surtout sur les attentes, grâce à des décennies de recherche préalable (ARN messager, SARS, MERS), au recrutement rapide des volontaires, à l'examen prioritaire et à la fabrication menée en parallèle des essais (Science News, 2020)"
      - "la durée du cycle dépend de l'urgence, des intérêts économiques et du contexte (financements, régulation, concurrence)"
    niveau: {espace: "mondial", temps: "années", vitesse: "mois à décennies", taille: "méso à macro", objet: "information"}
    traces:
      - {source: "autorisations de mise sur le marché (FDA, EMA) par mois ; à brancher", statut: "a_brancher"}
  - id: "capitaux"
    nom: "Capitaux et valorisations"
    organisation: "economie"
    elements: ["levées de fonds", "investissements dans les centres de calcul", "attentes des marchés"]
    niveau: {espace: "mondial", temps: "trimestres", vitesse: "semaines", taille: "macro"}
    traces:
      - {source: "taux américain à 10 ans (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DGS10"}
  - id: "adoption"
    nom: "Diffusion et adoption"
    organisation: "societe"
    elements: ["premiers utilisateurs", "entreprises clientes", "usages quotidiens", "ChatGPT : 100 millions d'utilisateurs en deux mois environ après son lancement (30 novembre 2022), contre neuf mois pour TikTok et deux ans et demi pour Instagram (UBS, d'après TechSpot, février 2023)"]
    acteurs:
      - {nom: "un utilisateur", taille: "micro", espace: "local", vitesse: "jours", organisation: "psychologique", facette: "psyche"}
    niveau: {espace: "pays à mondial", temps: "années", vitesse: "mois", taille: "micro à macro"}
    traces:
      - {source: "pages vues Wikipédia des produits", statut: "collecte", fichier: "banc_wikipedia.py"}
  - id: "regulation"
    nom: "Régulation"
    organisation: "statut"
    elements: ["lois sur l'IA", "contrôles d'exportation des puces", "autorités de concurrence et de protection des données"]
    acteurs:
      - {nom: "un régulateur national ou européen", taille: "macro", espace: "continent", vitesse: "mois", organisation: "statut", facette: "collectif"}
    niveau: {espace: "juridictions", temps: "textes et décisions datés", vitesse: "mois à années", taille: "macro"}
    traces:
      - {source: "Federal Register (règles et contrôles d'exportation)", statut: "collecte", fichier: "collecte_federal_register.py"}
  - id: "course_etats"
    nom: "Course entre États"
    organisation: "geopolitique"
    elements: ["États-Unis", "Chine", "Europe", "subventions", "contrôles"]
    niveau: {espace: "mondial", temps: "années", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "nombre de gestes des États-Unis envers la Chine (GDELT)", statut: "collecte", fichier: "gdelt_bq.py", adaptateur: "gestes:USA:CHN"}
  - id: "talents"
    nom: "Talents et équipes"
    organisation: "entourage"
    elements: ["chercheurs", "départs et recrutements", "fondateurs"]
    niveau: {espace: "quelques villes", temps: "mois", vitesse: "semaines", taille: "micro à méso"}
    traces:
      - {source: "annonces publiques de recrutement et de départ", statut: "inconnue"}
  - id: "attentes"
    nom: "Attentes et engouement"
    organisation: "psychologique"
    elements: ["engouement", "déception", "peur du retard"]
    niveau: {espace: "mondial", temps: "mois", vitesse: "semaines", taille: "méso à macro"}
    traces:
      - {source: "attention médiatique (GDELT)", statut: "collecte", fichier: "collecte_gdelt.py"}
  - id: sorties_modeles
    nom: "Sorties des modèles de pointe (quand un modèle annoncé devient public)"
    organisation: technique
    elements:
    - "annonce, aperçu restreint, accès payant, accès public, poids ouverts : cinq stades distincts, que les questions ne distinguent pas toujours"
    - "l'annonce d'un laboratoire est déclarative ; la date de sortie publique se mesure laboratoire par laboratoire (tenue des annonces)"
    - "freins : essais de sécurité avant sortie, capacité de calcul pour servir le modèle, contrôles d'exportation, contentieux"
    - "déclencheurs : sortie d'un concurrent, conférences annuelles des laboratoires et des grandes entreprises (dates connues d'avance)"
    - "questions typiques : sortie avant telle date, disponibilité dans un pays, version pour un système d'exploitation"
    acteurs:
    - {nom: OpenAI, taille: méso, espace: mondial, vitesse: semaines, organisation: economie, facette: collectif}
    - {nom: Anthropic, taille: méso, espace: mondial, vitesse: semaines, organisation: economie, facette: collectif}
    - {nom: Google DeepMind, taille: méso, espace: mondial, vitesse: semaines, organisation: economie, facette: collectif}
    - {nom: xAI, taille: méso, espace: mondial, vitesse: semaines, organisation: economie, facette: collectif}
    niveau: {espace: mondial, temps: depuis 2022, vitesse: semaines, taille: méso}
    traces:
    - source: "notes de version et pages de statut des laboratoires (validée par l’auteur le 2026-11-24 à 14 h 35, à brancher)"
      statut: a_brancher
    - {source: "modèles publiés par mois par OpenAI, Anthropic, Google, xAI et Meta (Epoch AI, CC BY) ; complété le 2026-11-24 (carte blanche de l’auteur, 20 h 48)", statut: collecte, fichier: collecte_epoch.py, adaptateur: "epoch:frontiere"}
  - id: bancs_ia
    nom: "Tests de référence de l'IA et leurs seuils"
    organisation: convention
    elements:
    - "un test de référence se sature en courbe en S : progrès rapide, puis plafond (erreurs d'étiquetage, questions ambiguës)"
    - "près du plafond, chaque point coûte plus cher ; un seuil fixé près du plafond est rarement franchi à court terme"
    - "délai de publication : un score n'existe pour la question qu'une fois inscrit au classement public qui la résout"
    - "questions typiques : score au-dessus d'un seuil avant telle date (GPQA, FrontierMath, horizon de tâche)"
    acteurs:
    - {nom: Epoch AI, taille: micro, espace: mondial, vitesse: semaines, organisation: technique, facette: collectif}
    - {nom: METR, taille: micro, espace: mondial, vitesse: mois, organisation: technique, facette: collectif}
    niveau: {espace: mondial, temps: depuis 2023, vitesse: semaines, taille: micro}
    traces:
    - source: "classements publics des tests (Epoch AI, METR ; validés par l’auteur le 2026-11-24 à 14 h 35, à brancher)"
      statut: a_brancher
  - id: gouvernance_labos
    nom: "Statut et gouvernance des laboratoires (structure, introduction en bourse)"
    organisation: statut
    elements:
    - "une introduction en bourse passe par un dépôt public à la SEC (formulaire S-1), visible dans EDGAR"
    - "freins : accord des autorités de l'État de constitution pour les anciennes structures sans but lucratif, contentieux entre fondateurs, conditions de marché"
    - "l'annonce d'une intention d'introduction n'est pas un dépôt"
    niveau: {espace: États-Unis, temps: depuis 2023, vitesse: mois, taille: méso}
    traces:
    - source: "EDGAR (SEC), dépôts S-1 (gratuit ; validée par l’auteur le 2026-11-24 à 14 h 35, à brancher)"
      statut: a_brancher
cycles:
  - id: cycle_innovation
    nom: "Cycle de l'innovation (recherche, développement, diffusion)"
    sorte: endogene
    mecanisme: "une découverte passe par le développement, les essais et l'autorisation, puis se diffuse ; la durée va de quelques mois (urgence, argent abondant, recherche préalable) à plusieurs décennies (sans intérêt économique ni urgence) ; la diffusion elle-même s'accélère (ChatGPT, deux mois pour 100 millions d'utilisateurs)"
    periode: "de quelques mois à plusieurs décennies selon l'urgence et les intérêts économiques"
    phase_vulnerable: "le passage du développement à la diffusion : financement, autorisation, fabrication"
    compartiments: [recherche, developpement, adoption, capitaux, regulation]
    sources: ["Science News, How COVID-19 vaccines were made so quickly without cutting corners (2020)", "UBS, d'après TechSpot (février 2023)"]
    statut: mecanisme
relations:
  - de: recherche
    vers: developpement
    effet: +
    delai: années
    force: forte
    statut: a_verifier
    texte: "une découverte ne devient un produit qu'après des années de développement ; la recherche accumulée avant raccourcit tout (ARN messager et vaccins contre la covid)"
  - de: developpement
    vers: adoption
    effet: +
    delai: mois
    force: forte
    statut: a_verifier
    texte: "un produit autorisé se diffuse ; la vitesse de diffusion s'est accélérée (ChatGPT, 100 millions d'utilisateurs en deux mois)"
  - de: capitaux
    vers: developpement
    effet: +
    delai: mois
    force: forte
    statut: a_verifier
    texte: "l'argent et l'urgence raccourcissent le cycle (essais menés en parallèle, fabrication avant l'autorisation) ; sans intérêt économique, il s'allonge"
  - de: regulation
    vers: developpement
    effet: '-'
    delai: mois
    force: moyenne
    statut: a_verifier
    texte: "l'examen et l'autorisation allongent le cycle ; l'examen prioritaire en cas d'urgence le raccourcit (19 à 21 jours pour les vaccins contre la covid)"
  - de: calcul
    vers: sorties_modeles
    effet: +
    delai: mois
    force: forte
    statut: a_verifier
    texte: "sans capacité de calcul pour servir un modèle, sa sortie publique attend"
  - de: regulation
    vers: sorties_modeles
    effet: "-"
    delai: mois
    force: moyenne
    coupure: "contrôles d'exportation et décisions des autorités (selon les pays)"
    statut: a_verifier
    texte: "la régulation retarde ou restreint géographiquement une sortie (disponibilité par pays)"
  - de: sorties_modeles
    vers: bancs_ia
    effet: +
    delai: semaines
    force: forte
    statut: a_verifier
    texte: "un nouveau modèle fait bouger les classements, avec le délai d'inscription au classement public"
  - de: attentes
    vers: sorties_modeles
    effet: +
    delai: semaines
    force: faible
    statut: a_verifier
    texte: "l'engouement fait annoncer tôt ; l'annonce précède souvent de loin la sortie publique"
  - {de: "calcul", vers: "ia", effet: "+", delai: "mois", force: "forte", intensite: {mesure: "disponibilité des puces avancées", regle: "seuil"}, coupure: "méthodes plus économes en calcul", statut: "a_verifier", texte: "sans assez de calcul, pas de nouveau modèle : la puce borne le produit"}
  - {de: "ia", vers: "calcul", effet: "+", delai: "mois", force: "forte", coupure: "inconnue", statut: "a_verifier", texte: "chaque génération de modèles réclame plus de calcul (boucle propre au niveau technique)"}
  - {de: "calcul", vers: "energie_eau", effet: "+", delai: "mois", force: "forte", intensite: {mesure: "chaleur de l'été, niveau des fleuves", regle: "seuil"}, coupure: "refroidissement à l'air, sites froids", statut: "a_verifier", texte: "le calcul consomme électricité et eau ; une vague de chaleur peut brider un centre"}
  - {de: "energie_eau", vers: "calcul", effet: "-", delai: "jours", force: "moyenne", intensite: {mesure: "tension sur le réseau électrique", regle: "seuil"}, coupure: "production propre sur site", statut: "a_verifier", texte: "le physique borne le technique : sans électricité ni eau, le calcul s'arrête"}
  - {de: "capitaux", vers: "calcul", effet: "+", delai: "mois", force: "forte", coupure: "taux élevés, déception", statut: "a_verifier", texte: "les levées de fonds financent les centres de calcul"}
  - {de: "attentes", vers: "capitaux", effet: "+", delai: "semaines", force: "forte", intensite: {mesure: "engouement médiatique", regle: "hysteresis"}, coupure: "déception des résultats", statut: "a_verifier", texte: "l'engouement attire les capitaux ; la déception les retire plus vite qu'il ne les a attirés"}
  - {de: "ia", vers: "attentes", effet: "+", delai: "jours", force: "moyenne", coupure: "lancement décevant", statut: "a_verifier", texte: "un lancement réussi nourrit l'engouement"}
  - {de: "ia", vers: "adoption", effet: "+", delai: "mois", force: "moyenne", intensite: {mesure: "part d'utilisateurs déjà acquis", regle: "seuil"}, coupure: "coût, méfiance", statut: "a_verifier", texte: "la diffusion suit une courbe en S : lente, puis rapide au-delà d'un seuil d'adoption"}
  - {de: "course_etats", vers: "regulation", effet: "±", delai: "mois", force: "forte", coupure: "accords internationaux", statut: "a_verifier", texte: "la course pousse à des contrôles d'exportation contre le rival et à des règles plus souples chez soi"}
  - {de: "regulation", vers: "calcul", effet: "-", delai: "mois", force: "forte", coupure: "contournement, production locale", statut: "a_verifier", texte: "les contrôles d'exportation privent le rival de puces avancées"}
  - {de: "regulation", vers: "ia", effet: "±", delai: "mois", force: "moyenne", coupure: "juridiction plus souple ailleurs", statut: "a_verifier", texte: "les règles retardent ou orientent certains lancements selon les pays"}
  - {de: "talents", vers: "ia", effet: "±", delai: "mois", force: "moyenne", intensite: {mesure: "départs de chercheurs clés", regle: "seuil"}, coupure: "équipes nombreuses", statut: "a_verifier", texte: "au niveau de l'entourage : une vague de départs peut changer le rythme d'un laboratoire"}
  - {de: "recherche", vers: "ia", effet: "+", delai: "années", force: "moyenne", coupure: "secret industriel", statut: "a_verifier", texte: "la recherche ouverte nourrit les produits, avec retard"}
  - {de: "course_etats", vers: "capitaux", effet: "+", delai: "mois", force: "moyenne", coupure: "inconnue", statut: "a_verifier", texte: "les subventions publiques s'ajoutent aux capitaux privés"}
ponts:
- depuis: sorties_modeles
  vers: observateur-mesure:questionneur_metaculus
  nature: "l'IA de pointe est surreprésentée dans les questions : sorties, tests, statut des laboratoires"
  type: voisinage
- depuis: sorties_modeles
  vers: politique-americaine:commerce
