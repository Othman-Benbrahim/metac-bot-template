theme: ormuz
nom: Détroit d'Ormuz
declaration:
  but: comprendre ce qui ouvre, gêne ou ferme le passage d'Ormuz, et ce que cela transmet aux autres écosystèmes (questions du tournoi sur le trafic, le blocus, les accords États-Unis–Iran)
  limites: dedans le détroit, ses riverains, les flux qui le traversent, les forces qui s'y croisent, les prix qui en dépendent ; dehors le programme nucléaire iranien en lui-même et la guerre au Levant
    (thèmes voisins, reliés par des ponts)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; aucune source privée
  date: 2026-11-19
  espace: le détroit et le golfe Persique, les routes de contournement, les marchés mondiaux de l'énergie
  temps: de la journée (un incident) à la décennie (sanctions, alliances) ; mémoire des crises de 1987-1988, 2019, 2024-2026 (à vérifier)
  vitesse: l'heure (une saisie de navire), la semaine (assurances, fret), le trimestre (prix), l'année (sanctions)
  taille: un navire, une flotte, un État, le marché mondial
compartiments:
- id: milieu
  nom: Milieu physique
  organisation: relief
  elements:
  - goulet étroit et peu profond
  - chaleur extrême
  - mer semi-fermée
  - eau douce rare et dessalement sur les rives
  niveau:
    espace: le détroit et le golfe
    temps: permanent ; saisons de chaleur
    vitesse: très lente (relief) ; jours (tempêtes de chaleur, sable)
    taille: méso
  traces:
  - source: anomalie de température à Bandar Abbas (GHCN-Daily, station au sol)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:bandar_abbas
- id: flux_energie
  nom: Flux d'énergie
  organisation: economie
  elements:
  - pétrole brut
  - produits raffinés
  - gaz naturel liquéfié
  - exportateurs du Golfe
  - routes de contournement par oléoducs (Arabie saoudite vers la mer Rouge
  - Émirats vers Fujaïrah)
  niveau:
    espace: le détroit vers l'Asie, l'Europe
    temps: contrats ; flux quotidiens
    vitesse: jours
    taille: macro
  traces:
