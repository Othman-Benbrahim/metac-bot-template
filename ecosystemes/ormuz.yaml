  - fret
  - signaux AIS
  - flotte « fantôme » des cargaisons sous sanctions
  niveau:
    espace: les couloirs de navigation
    temps: traversée de quelques heures
    vitesse: heures à semaines
    taille: micro (un navire) à méso (une flotte)
  acteurs:
