    taille: micro
    espace: navire
    vitesse: heures
    organisation: economie
    facette: collectif
  - nom: un armateur
    taille: méso
    espace: routes
    vitesse: semaines
    organisation: economie
    facette: collectif
  - nom: les assureurs du risque de guerre
    taille: méso
    espace: mondial
    vitesse: jours
    organisation: economie
    facette: collectif
