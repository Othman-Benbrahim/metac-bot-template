# Liens propres aux acteurs (bot 0.10.387, ombre). Décisions de l'auteur du 2026-11-20 : 14 h 01 (donner aux acteurs
# leurs propres liens, avec des sources : qui contraint qui, qui dépend de qui, et dans quel DOMAINE) ; 14 h 05 (chaque
# lien porte un champ « temps » : structurel, ou conjoncturel sous une phase datée d'un cycle). Ce fichier n'est pas une
# fiche (pas de clé « theme »). Les acteurs sont désignés par « fiche:début du nom dans la fiche ».
# relation : depend_de (A ne peut agir dans ce domaine sans B), peut_bloquer (B peut empêcher ou défaire l'acte de A),
#            nomme (A désigne B), confirme (B doit approuver la désignation), ne_depend_pas_de (A agit sans B),
#            conditionne (l'état de B ouvre ou ferme le domaine de A ; 0.10.394).
# temps.statut : structurel (vaut à travers les cycles, depuis une date si la règle a changé) ou conjoncturel
#                (vaut pendant une phase datée d'un cycle nommé) ; une phase inconnue est écrite « inconnue », jamais devinée.
liens:
  # ---------------------------------------------------------------- lot 1 : politique américaine
  - id: us_loi_depend_du_congres
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la majorité de chaque chambre"
    relation: depend_de
    domaine: loi
    regle: "Une loi doit être adoptée par les deux chambres puis présentée au président ; au Sénat, la clôture du débat sur un texte de loi demande 60 voix (règle us_senat_cloture)."
    temps: {statut: structurel}
    sources:
      - {titre: "Constitution des États-Unis, article I, section 7, clause 2 (Cornell LII)", url: "https://www.law.cornell.edu/constitution-conan/article-1/section-7/clause-2/veto-power", consulte: "2026-11-20"}
      - {titre: "Service de recherche du Congrès, R43331", url: "https://www.everycrsreport.com/reports/R43331.html", consulte: "2026-11-19"}
  - id: us_veto_bloque_le_congres
    de: "politique-americaine:la majorité de chaque chambre"
    vers: "politique-americaine:le président en personne"
    relation: peut_bloquer
    domaine: loi
    regle: "Le président peut renvoyer un texte avec ses objections ; il ne devient loi que s'il est de nouveau adopté par les deux tiers de chaque chambre. De 1789 à aujourd'hui : 2 599 vetos, 112 levés (4,3 %). Premier mandat Trump : 10 vetos, 1 levé ; Biden : 13, aucun ; second mandat Trump (en cours) : 2, aucun."
    parametres: {vetos_total: 2599, leves_total: 112, majorite_pour_lever: "2/3 de chaque chambre"}
    temps: {statut: structurel}
    sources:
      - {titre: "Constitution des États-Unis, article I, section 7, clause 2 (Cornell LII)", url: "https://www.law.cornell.edu/constitution-conan/article-1/section-7/clause-2/veto-power", consulte: "2026-11-20"}
      - {titre: "Sénat des États-Unis, Summary of Bills Vetoed, 1789-present", url: "https://www.senate.gov/legislative/vetoes/vetoCounts.htm", consulte: "2026-11-20"}
  - id: us_decret_sans_le_congres
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la majorité de chaque chambre"
    relation: ne_depend_pas_de
    domaine: décret
    regle: "Aucune loi n'accorde au président un pouvoir général de décret, mais ce pouvoir est admis ; le Congrès ne peut pas modifier ou révoquer directement un décret ; il peut en annuler l'effet juridique par une loi quand le décret repose sur un pouvoir délégué, mais ces abrogations sont rares à cause de la menace de veto."
    temps: {statut: structurel}
    sources:
      - {titre: "Service de recherche du Congrès, Executive Orders: An Introduction, R46738, 2021", url: "https://www.everycrsreport.com/files/2021-03-29_R46738_99ff733be75d877ff2ff38555e5c2cbc0c96fd0b.html", consulte: "2026-11-20"}
  - id: us_tribunaux_bloquent_les_decrets
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:un juge fédéral"
    relation: peut_bloquer
    domaine: décret
    regle: "Les tribunaux contrôlent parfois la légalité des décrets, selon l'analyse en trois temps du juge Jackson (Youngstown) : le pouvoir du président est au plus bas quand il agit contre la volonté exprimée du Congrès."
    temps: {statut: structurel}
    sources:
      - {titre: "Service de recherche du Congrès, R46738, 2021", url: "https://www.everycrsreport.com/files/2021-03-29_R46738_99ff733be75d877ff2ff38555e5c2cbc0c96fd0b.html", consulte: "2026-11-20"}
      - {titre: "National Constitution Center, Defining the president's constitutional powers to issue executive orders", url: "https://constitutioncenter.org/blog/defining-the-presidents-constitutional-powers-to-issue-executive-orders", consulte: "2026-11-20"}
  - id: us_decret_revocable_au_mandat_suivant
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:le président en personne"
    relation: peut_bloquer
    domaine: décret
    regle: "Un président suivant peut en général révoquer ou modifier tout décret antérieur, par un nouveau décret ; c'est la voie la plus courante."
    temps: {statut: conjoncturel, cycle: "mandat présidentiel", phase: "changement de mandat (20 janvier suivant une élection présidentielle)"}
    sources:
      - {titre: "Service de recherche du Congrès, R46738, 2021", url: "https://www.everycrsreport.com/files/2021-03-29_R46738_99ff733be75d877ff2ff38555e5c2cbc0c96fd0b.html", consulte: "2026-11-20"}
  - id: us_nominations_confirmees_par_le_senat
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la majorité de chaque chambre"
    relation: confirme
    domaine: nomination
    regle: "Les nominations passent par l'avis et le consentement du Sénat ; la clôture se vote à la majorité simple pour toutes les nominations depuis le 21 novembre 2013 (Cour suprême exceptée) et pour la Cour suprême depuis le 6 avril 2017 (règle us_senat_cloture)."
    temps: {statut: structurel, depuis: "2013-11-21"}
    sources:
      - {titre: "Service de recherche du Congrès, R43331", url: "https://www.everycrsreport.com/reports/R43331.html", consulte: "2026-11-19"}
      - {titre: "Service de recherche du Congrès, R44819", url: "https://www.everycrsreport.com/reports/R44819.html", consulte: "2026-11-19"}
  - id: us_fed_gouverneurs
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:Réserve fédérale"
    relation: nomme
    domaine: politique monétaire
    regle: "Le président nomme les gouverneurs avec l'avis et le consentement du Sénat, pour quatorze ans ; il ne peut les révoquer que « pour motif » ; le président de la Fed est désigné pour quatre ans. Le président des États-Unis ne décide pas de la politique monétaire."
    parametres: {mandat_gouverneur_ans: 14, mandat_president_fed_ans: 4, revocation: "pour motif seulement"}
    temps: {statut: structurel}
    sources:
      - {titre: "Federal Reserve Act, section 10 (Réserve fédérale)", url: "https://www.federalreserve.gov/aboutthefed/section10.htm", consulte: "2026-11-20"}
  - id: us_119e_congres_gouvernement_uni
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la majorité de chaque chambre"
    relation: depend_de
    domaine: loi
    regle: "Au début du 119e Congrès (3 janvier 2025) : Chambre, 222 républicains et 218 démocrates (délégués compris), un siège vacant ; Sénat, 52 républicains, 45 démocrates et 2 indépendants votant avec eux, un siège vacant. Même parti à la présidence et aux deux chambres : gouvernement uni, mais sans les 60 voix de clôture au Sénat. Phase suivante : lien us_120e_congres."
    parametres: {chambre_r: 222, chambre_d: 218, senat_r: 52, senat_d_et_independants: 47}
    temps: {statut: conjoncturel, cycle: "législature du Congrès (deux ans)", phase: "119e Congrès, gouvernement uni", depuis: "2025-01-03", jusqua: "2027-01-03", phase_suivante: us_120e_congres}
    sources:
      - {titre: "Service de recherche du Congrès, Membership of the 119th Congress: A Profile, R48535, 2025", url: "https://www.everycrsreport.com/reports/R48535.html", consulte: "2026-11-20"}
  - id: us_120e_congres
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la majorité de chaque chambre"
    relation: depend_de
    domaine: loi
    regle: "Élections du 3 novembre 2026, décompte de l'Associated Press au 2026-11-20 (13 h 19-13 h 20 UTC), susceptible d'évoluer : Chambre, démocrates 257 sièges gagnés, républicains 172, 6 sièges attribués à personne dans ce décompte ; Sénat, démocrates 56 au total (dont 2 apparentés, sortants compris), républicains 44 au total. Les mentions « majorité atteinte » de l'outil de résultats ne sont pas des proclamations de l'AP. Président républicain en fonction. Le 120e Congrès entre en fonction le 3 janvier 2027 à midi (XXe amendement, section 1) : la phase change en cours de fenêtre pour toute question qui dépasse cette date. Certification : aucune date fédérale pour les élections non présidentielles ; chaque État fixe la sienne, de moins d'une semaine à plusieurs semaines (par exemple Kansas au plus tard le 1er décembre, Mississippi le 3 décembre pour le Sénat). Décompte à revoir après le 3 décembre 2026, puis le 3 janvier 2027."
    parametres: {chambre_d_gagnes: 257, chambre_r_gagnes: 172, chambre_non_attribues: 6, senat_d_total: 56, senat_r_total: 44, decompte_du: "2026-11-20"}
    temps: {statut: conjoncturel, cycle: "législature du Congrès (deux ans)", phase: "120e Congrès, élu le 3 novembre 2026 (décompte non certifié)", depuis: "2027-01-03", jusqua: "2029-01-03", a_revoir_le: ["2026-12-04", "2027-01-04"]}
    sources:
      - {titre: "Associated Press, résultats des élections du 3 novembre 2026 (Chambre et Sénat), décompte au 2026-11-20", url: "https://apnews.com", consulte: "2026-11-20"}
      - {titre: "Constitution des États-Unis, XXe amendement, section 1 (Cornell LII)", url: "https://www.law.cornell.edu/constitution-conan/amendment-20/presidential-and-congressional-terms", consulte: "2026-11-20"}
      - {titre: "USAFacts, When are election results certified?", url: "https://usafacts.org/articles/the-viz-lab/election-certification/", consulte: "2026-11-20"}

  # ---------------------------------------------------------------- lot 2 : Russie-Ukraine
  - id: ru_loi_martiale_par_decret
    de: "russie-ukraine:le président russe en personne"
    vers: "russie-ukraine:Russie (gouvernement)"
    relation: confirme
    domaine: loi martiale
    regle: "Le président est le commandant suprême des forces armées ; en cas d'agression ou de menace immédiate, il instaure la loi martiale par décret et en informe aussitôt le Conseil de la Fédération et la Douma ; le Conseil de la Fédération approuve ce décret (art. 102, b). Le Conseil de la Fédération n'est pas décrit comme acteur dans la fiche : il est rattaché ici à « Russie (gouvernement) »."
    temps: {statut: structurel}
    sources:
      - {titre: "Constitution de la Fédération de Russie, articles 87 et 102 (Bucknell University)", url: "https://www.departments.bucknell.edu/russian/const/ch4.html", consulte: "2026-11-20"}
      - {titre: "Constitution de la Fédération de Russie, chapitre 5, article 102", url: "https://www.departments.bucknell.edu/russian/const/ch5.html", consulte: "2026-11-20"}
  - id: ru_forces_hors_territoire
    de: "russie-ukraine:le président russe en personne"
    vers: "russie-ukraine:Russie (gouvernement)"
    relation: depend_de
    domaine: emploi des forces armées hors du territoire
    regle: "La décision sur la possibilité d'employer les forces armées hors du territoire de la Fédération relève du Conseil de la Fédération (art. 102, d) ; rattaché à « Russie (gouvernement) »."
    temps: {statut: structurel}
    sources:
      - {titre: "Constitution de la Fédération de Russie, chapitre 5, article 102", url: "https://www.departments.bucknell.edu/russian/const/ch5.html", consulte: "2026-11-20"}
  - id: ua_loi_martiale_prolongee_par_la_rada
    de: "russie-ukraine:le président ukrainien en personne"
    vers: "russie-ukraine:Ukraine (gouvernement)"
    relation: depend_de
    domaine: loi martiale
    regle: "La loi martiale et la mobilisation générale sont prolongées par périodes de 90 jours, sur décret du président voté par la Rada (le Parlement n'est pas décrit comme acteur dans la fiche : il est rattaché ici à « Ukraine (gouvernement) »). Dernière prolongation connue : lois signées le 26 octobre 2026, 90 jours à partir du 31 octobre 2026 à 5 h 30 (fin vers le 29 janvier 2027, calcul de date)."
    temps: {statut: conjoncturel, cycle: "prolongation de la loi martiale (90 jours)", phase: "prolongation du 31 octobre 2026", depuis: "2026-10-31", jusqua: "2027-01-29", a_revoir_le: ["2027-01-30"]}
    sources:
      - {titre: "Interfax-Ukraine, prolongation de la loi martiale et de la mobilisation, 26 octobre 2026", url: "https://en.interfax.com.ua/news/general/1226342.html", consulte: "2026-11-20"}
      - {titre: "Verkhovna Rada, prolongation de 90 jours jusqu'au 4 mai 2026 (phase précédente)", url: "https://www.rada.gov.ua/en/news/News/269952.html", consulte: "2026-11-20"}
  - id: ua_elections_suspendues_sous_loi_martiale
    de: "russie-ukraine:la fonction présidentielle ukrainienne"
    vers: "russie-ukraine:Ukraine (gouvernement)"
    relation: conditionne
    domaine: élection
    regle: "La loi de 2015 sur le régime juridique de la loi martiale interdit de tenir des élections pendant la loi martiale, et le Code électoral de 2019 les suspend ; le président en exercice reste en fonction jusqu'à l'élection et l'investiture de son successeur (Constitution, art. 108, 1) ; les pouvoirs de la Rada sont prolongés jusqu'à la première séance de la Rada élue après la fin de la loi martiale (art. 83, 4). Tant que la loi martiale est prolongée, une élection nationale ne peut pas se tenir."
    temps: {statut: structurel}
    sources:
      - {titre: "Verfassungsblog, Ukraine's Constitution in Wartime, 10 février 2025", url: "https://verfassungsblog.de/ukraines-constitution-in-wartime/", consulte: "2026-11-20"}
  - id: ue_sanctions_renouvelees_tous_les_six_mois
    de: "russie-ukraine:Commission européenne"
    vers: "russie-ukraine:Union européenne"
    relation: depend_de
    domaine: sanctions
    regle: "Les sanctions économiques sectorielles contre la Russie sont renouvelées par le Conseil à l'unanimité (règle ue_sanctions_russie, article 31 du traité sur l'Union européenne) ; un seul État membre peut bloquer un renouvellement. Jusqu'en 2025, renouvellements de six mois (dernier : 22 décembre 2025, jusqu'au 31 juillet 2026). En juin 2026, après le Conseil européen des 18-19 juin, renouvellement pour douze mois, jusqu'au 31 juillet 2027 : le cycle s'est allongé, ce qui réduit les occasions de blocage."
    temps: {statut: conjoncturel, cycle: "renouvellement des sanctions (six mois, puis douze mois depuis juin 2026)", phase: "échéance du 31 juillet 2027", depuis: "2026-06", jusqua: "2027-07-31", a_revoir_le: ["2027-06-30"]}
    sources:
      - {titre: "Service européen pour l'action extérieure, le Conseil prolonge les sanctions économiques de six mois, 22 décembre 2025", url: "https://www.eeas.europa.eu/delegations/ukraine/russia%E2%80%99s-war-aggression-against-ukraine-council-extends-economic-sanctions-further-6-months_en", consulte: "2026-11-20"}
      - {titre: "Service européen pour l'action extérieure, le Conseil prolonge les sanctions économiques d'un an (juin 2026)", url: "https://eeas.europa.eu/delegations/ukraine/russia%E2%80%99s-war-aggression-against-ukraine-council-extends-economic-sanctions-another-year_en", consulte: "2026-11-20"}

  # ---------------------------------------------------------------- lot 3 : rivalité sino-américaine
  - id: us_tarifs_ieepa_annules
    de: "politique-americaine:le président en personne"
    vers: "politique-americaine:la Cour suprême"
    relation: peut_bloquer
    domaine: droits de douane
    regle: "Le 20 février 2026 (Learning Resources c. Trump ; Trump c. V.O.S. Selections, 6 contre 3), la Cour suprême a jugé que la loi IEEPA n'autorise pas le président à imposer des droits de douane. Restent d'autres fondements, non tranchés par l'arrêt : section 232 (acier, aluminium, automobiles), section 301 (droits sur les importations chinoises), section 122 (surtaxe temporaire de 150 jours au plus, 15 % au plus, invoquée par le président après l'arrêt)."
    temps: {statut: structurel, depuis: "2026-02-20"}
    sources:
      - {titre: "Service de recherche du Congrès, Supreme Court Rules Against Tariffs Imposed Under IEEPA, LSB11398, 23 février 2026", url: "https://www.everycrsreport.com/files/2026-02-23_LSB11398_fc8005c048e8dfa7ee66c828dab240a29d0b979e.html", consulte: "2026-11-20"}
  - id: cn_licences_exportation_mineraux
    de: "rivalite-sino-americaine:ministère chinois du Commerce"
    vers: "rivalite-sino-americaine:États-Unis (exécutif)"
    relation: conditionne
    domaine: minerais critiques
    regle: "La Chine exige des licences d'exportation : graphite (2023), gallium et germanium (2023), antimoine (2024), terres rares, tungstène, molybdène et produits liés aux batteries au lithium et aux matières d'anode en graphite artificiel (2025), argent (2026). Ces licences conditionnent l'approvisionnement américain (dépendance de 100 % au graphite importé, chaîne ecosystemes/chaines/graphite.yaml)."
    temps: {statut: structurel, depuis: "2023"}
    sources:
      - {titre: "USGS, Mineral Commodity Summaries 2026, tableau 4 (contrôles des exportations par pays), données au 21 novembre 2025", url: "https://www.usgs.gov/data/mineral-commodity-summaries-2026-data-release", consulte: "2026-11-20"}
  - id: treve_sino_americaine
    de: "rivalite-sino-americaine:Chine (direction du Parti et de l'État)"
    vers: "rivalite-sino-americaine:États-Unis (exécutif)"
    relation: conditionne
    domaine: contrôles à l'exportation
    regle: "Trêve commerciale de novembre 2025, pour un an : la Chine suspend les contrôles du 9 octobre 2025 (terres rares, batteries au lithium, matières d'anode en graphite) ; les États-Unis suspendent la « règle des affiliés » (50 %) du BIS à partir du 10 novembre 2025 et ramènent le droit « fentanyl » de 20 % à 10 %. Prolongée le 24 septembre 2026 jusqu'au 10 janvier 2027 ; formalisée côté américain (règle du BIS publiée le 9 novembre 2026) et côté chinois (avis du ministère du Commerce du 9 novembre 2026, la veille de l'échéance). Toute question qui dépasse le 10 janvier 2027 franchit une échéance de cette phase."
    temps: {statut: conjoncturel, cycle: "trêve commerciale sino-américaine (renouvellements)", phase: "prolongation jusqu'au 10 janvier 2027", depuis: "2025-11-10", jusqua: "2027-01-10", a_revoir_le: ["2027-01-11"]}
    sources:
      - {titre: "Morrison Foerster, United States and China Reach Trade Agreement, 13 novembre 2025", url: "https://www.mofo.com/resources/insights/251113-united-states-and-china-reach-trade-agreement", consulte: "2026-11-20"}
      - {titre: "Crowell & Moring, U.S.-China Trade Truce Extended Two Months, septembre 2026", url: "https://www.cmtradelaw.com/2026/09/u-s-china-trade-truce-extended-two-months-bis-affiliates-rule-suspension-follows/", consulte: "2026-11-20"}
      - {titre: "Nixon Peabody, BIS formally suspends the Affiliates Rule until January 10, 2027, 6 novembre 2026", url: "https://www.nixonpeabody.com/insights/alerts/2026/11/06/bis-formally-suspends-the-affiliates-rule-until-january-10-2027", consulte: "2026-11-20"}
      - {titre: "Benchmark Minerals, China extends pause on rare earth and battery export controls until 2027, 9 novembre 2026", url: "https://source.benchmarkminerals.com/article/china-extends-pause-on-rare-earth-and-battery-export-controls-until-2027", consulte: "2026-11-20"}

