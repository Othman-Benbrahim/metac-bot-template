  - id: gaza_force_de_stabilisation
    de: "guerre-levant:l'Assemblée générale et le Conseil de sécurité de l'ONU"
    vers: "guerre-levant:Israël (État)"
    relation: depend_de
    domaine: cessez-le-feu de Gaza
    regle: "Rapport du Conseil de la paix au Conseil de sécurité, 17 novembre 2026 : le déploiement de la force de stabilisation est retardé faute d'approbation israélienne ; ce déploiement conditionne le retrait des troupes israéliennes, le désarmement du Hamas et la reconstruction. Frappes israéliennes et activité militaire du Hamas continuent ; le rapport avertit que le cessez-le-feu peut s'effondrer et qu'il n'y aurait alors « aucune feuille de route à laquelle revenir »."
    temps: {statut: conjoncturel, cycle: "cessez-le-feu de Gaza (feuille de route)", phase: "mise en œuvre bloquée, rapport du 17 novembre 2026", depuis: "2026-11-17", a_revoir_le: ["2026-12-17"]}
