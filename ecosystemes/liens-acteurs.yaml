    relation: depend_de
    domaine: déclaration d'urgence
    regle: "L'urgence de santé publique de portée internationale est déterminée par le directeur général de l'OMS après avis du comité d'urgence, qui se réunit pour chaque événement ; les recommandations temporaires sont prolongées par périodes de trois mois (exemple : poliomyélite, comité réuni le 30 septembre 2026, prolongation au 12 novembre 2026). Depuis les amendements de 2024, le directeur général dit aussi si l'événement est une « urgence pandémique »."
