  - id: il_formation_du_gouvernement
    de: "guerre-levant:la fonction de Premier ministre (pouvoirs, dépendance à la coalition)"
    vers: "guerre-levant:la coalition gouvernementale israélienne"
    relation: depend_de
    domaine: formation du gouvernement
    regle: "Élection de la Knesset le 27 octobre 2026 ; aucun bloc n'a la majorité (61 sièges sur 120). Le président Herzog a chargé Gadi Eisenkot de former le gouvernement (67 députés l'ont recommandé, 46 pour Netanyahu ; annonce le 7 novembre, mandat remis le 8 novembre). Délai de 28 jours, prolongeable de 14 jours par le président : fin vers le 6 décembre 2026, ou le 20 décembre avec prolongation (calcul de date). En cas d'échec, Netanyahu pourrait être chargé à son tour ; une nouvelle élection début 2027 est possible. D'ici là, le gouvernement Netanyahu reste en fonction."
    temps: {statut: conjoncturel, cycle: "législature de la Knesset (formation du gouvernement)", phase: "mandat d'Eisenkot après l'élection du 27 octobre 2026", depuis: "2026-11-08", jusqua: "2026-12-20", a_revoir_le: ["2026-12-07", "2026-12-21"]}
    sources:
      - {titre: "Service de recherche du Congrès, Israel's 2026 Knesset Election, IN12751, 30 octobre 2026", url: "https://www.everycrsreport.com/reports/IN12751.html", consulte: "2026-11-20"}
