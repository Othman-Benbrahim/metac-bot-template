    regle: "Tout allié peut demander des consultations s'il estime son intégrité territoriale, son indépendance politique ou sa sécurité menacées. Neuf invocations recensées par l'OTAN : 2003, 2012 (deux), 2014, 2015, 2020, 2022 (huit alliés ensemble), 10 septembre 2025 (Pologne, drones russes), 23 septembre 2025 (Estonie, avions russes) ; aucune en 2026 au 20 novembre. Soit 9 en 23 ans depuis 2003 (environ 0,4 par an, calcul), avec deux en septembre 2025 : la fréquence récente est plus haute que la moyenne."
