    sources:
      - {titre: "OMS, déclaration de la 46e réunion du comité d'urgence du RSI sur la poliomyélite, 13 novembre 2026", url: "https://www.who.int/news/item/13-11-2026-statement-of-the-forty-sixth-meeting-of-the-polio-ihr-emergency-committee", consulte: "2026-11-20"}
  - id: oms_urgences_en_vigueur
    de: "epidemies:Organisation mondiale de la santé"
    vers: "epidemies:un variant"
    relation: nomme
    domaine: déclaration d'urgence
    regle: "Urgences de portée internationale en vigueur au 20 novembre 2026 : (1) poliomyélite (poliovirus sauvage de type 1, endémique en Afghanistan et au Pakistan, et poliovirus dérivés de souches vaccinales), maintenue le 12 novembre 2026, recommandations prolongées de trois mois (fin vers le 12 février 2027, calcul de date) ; (2) Ebola, espèce Bundibugyo, en RD Congo, déclarée à partir de mi-mai 2026, maintenue le 18 novembre 2026 (plus de 11 300 cas et 5 500 décès annoncés le 17 novembre ; cas aussi au Kenya, en Ouganda et au Nigeria). Aucune n'est qualifiée d'urgence pandémique. Aucun vaccin homologué contre Bundibugyo (essais en cours)."
