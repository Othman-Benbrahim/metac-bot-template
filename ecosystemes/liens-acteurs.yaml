    regle: "Engagement de La Haye (juin 2025) : 5 % du PIB par an d'ici 2035, dont 3,5 % pour la défense au sens strict et 1,5 % pour les dépenses liées à la sécurité ; l'aide à l'Ukraine compte. En 2025, tous les alliés ont atteint 2 % selon l'OTAN (Islande exclue). Estimations 2026, publiées le 7 juillet 2026 avant le sommet d'Ankara : cinq alliés au-dessus de 3,5 % (Lituanie 5,33 %, Estonie 5,1 %, Lettonie 4,92 %, Pologne 4,68 %, Grèce 3,65 %) ; la Tchéquie, la Hongrie et la Slovénie pouvaient passer sous 2 %. L'OTAN publie ces estimations une fois par an, avant le sommet : une question sur le niveau de dépense d'un allié se résout à cette publication."
