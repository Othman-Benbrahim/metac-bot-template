# 0.10.476 (décision de l'auteur, 2026-11-23, 18 h 16) : une fiche Inde à part entière, reliée à l'Asie du Sud par des
# ponts. « L'Inde, c'est l'équivalent du continent africain, et une puissance nucléaire » ; « le climat est un facteur
# structurel » : l'indicateur météorologique (mousson, chaleur) en est une pièce centrale. Sources : seulement celles qui
# alimentent la fiche, pas de nouveaux flux (consigne de l'auteur). Chiffres sourcés et datés.
theme: inde
nom: Inde
declaration:
  but: comprendre l'Inde de l'intérieur et dans ses rapports de force — un pays de la taille démographique d'un continent, puissance nucléaire, dont l'économie, la politique et la stabilité intérieure restent suspendues à un facteur structurel, la mousson
  limites: dedans la population et la jeunesse, la politique intérieure (Union et États), les conflits intérieurs (Manipur, maoïsme), la défense et la dissuasion, la frontière avec la Chine, l'économie et le commerce extérieur, l'énergie, la mousson, la chaleur et l'agriculture ; dehors la relation avec le Pakistan et l'Afghanistan (asie-du-sud), la dissuasion comme régime mondial (non-proliferation), sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques (IMD, MoSPI, SIPRI, UCDP, Reuters, presse indienne) ; la presse anglophone indienne ne reflète pas toutes les langues du pays
  date: '2026-11-23'
  espace: l'Union indienne (28 États, 8 territoires), ses frontières et l'océan Indien
  temps: de la saison (mousson de juin à septembre) au cycle électoral (cinq ans, élections d'États échelonnées)
  vitesse: le jour (chaleur, violences), la saison (mousson, récoltes), l'année (budgets, élections)
  taille: un district, un État, l'Union
