  - 'élections d''États de mai 2026 (avances au dépouillement du 4 mai, India TV) : BJP en tête au Bengale-Occidental (208 sièges sur 294 ; Mamata Banerjee battue dans sa circonscription), NDA en Assam (102 sur 126), TVK de l''acteur Vijay au Tamil Nadu (108), UDF (Congrès) au Kerala, NDA à Pondichéry (18 sur 30)'
  niveau:
    espace: Union et États
    temps: cycles électoraux
    vitesse: mois à années
    taille: macro
