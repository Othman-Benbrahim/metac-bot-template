- id: maoisme
  nom: Insurrection maoïste (naxalisme)
  organisation: geopolitique
  geopolitique:
    pays: [IND]
  elements:
  - 'le ministre de l''Intérieur Amit Shah déclare l''Inde « libérée du naxalisme » le 30 mars 2026, veille de l''échéance qu''il s''était fixée, tout en annonçant la fin des opérations « plus tard » (Malay Mail, 31 mars 2026)'
  - 'en 2025 : 364 insurgés tués, 1 022 arrêtés, 2 337 redditions ; attaques passées de plus de 1 900 par an à environ 200 (chiffres parlementaires, Malay Mail)'
  - 'foyer principal : le Bastar (Chhattisgarh), région minière'
