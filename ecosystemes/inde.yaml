  - '+202 millions d''habitants prévus de 2026 à 2050, la plus forte hausse au monde (Population Reference Bureau, octobre 2026)'
  - 'chômage des 15-29 ans en ville : 19 % en septembre 2026 (jeunes femmes 26,6 %, jeunes hommes 16,4 %) ; chômage des 15 ans et plus : 5,0 % (MoSPI, enquête PLFS, 15 octobre 2026)'
