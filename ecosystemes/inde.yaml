  - 'octobre 2026 : achats « pas sensiblement réduits » ; une loi américaine permet jusqu''à 100 % de droits sur les biens indiens pour ces achats (Reuters, 7 octobre 2026)'
  - 'un cas d''écart entre l''annoncé et l''exécuté (voir la piste du taux d''exécution des annonces)'
