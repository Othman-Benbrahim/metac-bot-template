  organisation: climat
  geopolitique:
    pays: [IND]
  elements:
  - 'mousson 2026 (juin-septembre) : 87 % de la normale, 759,4 mm contre 868,6 mm ; juin 65 %, juillet 101 %, août 84 %, septembre 92 % ; Sud de la péninsule 76 %, Est et Nord-Est 74 % ; 17 sous-divisions sur 36 déficitaires, 42 % du territoire (IMD, 30 septembre 2026)'
  - 'installation sur le Kerala le 4 juin 2026, trois jours après la date normale (IMD)'
  - 'El Niño faible en juin, fort en fin de saison ; dipôle de l''océan Indien neutre (IMD)'
