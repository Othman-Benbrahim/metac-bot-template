# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: australie
nom: Australie
declaration:
  but: comprendre l'Australie comme puissance moyenne du Pacifique, alliée des États-Unis et dépendante de la Chine pour son
    commerce, exposée à un climat extrême
  limites: dedans l'alliance AUKUS, le commerce avec la Chine, les minerais, le climat (feux, sécheresses, récifs), les peuples
    aborigènes, la politique intérieure, le rôle dans le Pacifique ; dehors les petits États insulaires (insularite), sauf
    par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: le continent australien et ses zones maritimes
  temps: de la saison des feux à la décennie (sous-marins)
  vitesse: le jour (feux), l'année (budgets)
  taille: un État fédéré, la fédération
