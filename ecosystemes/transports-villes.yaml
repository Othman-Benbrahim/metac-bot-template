    espace: ville
    vitesse: jours
    organisation: societe
    facette: collectif
  niveau:
    espace: ville
    temps: années
    vitesse: années
    taille: méso
  traces:
  - source: base de données mondiale des ODD (ONU, unstats.un.org/sdgs/dataportal), indicateur 11.2.1
    statut: a_brancher
    odd: ['11.2.1']
  - *id001
- id: route
  nom: Voitures, camions, trafic routier
  organisation: technique
  elements:
  - parc de véhicules, ventes, trafic
  - les transports dépendent du pétrole pour près de 91 % de leur énergie (AIE, page « Transport », sans date)
  - volumes de passagers et de fret par mode
