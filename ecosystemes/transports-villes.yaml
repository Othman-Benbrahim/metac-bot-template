- id: securite_routiere
  nom: Morts et blessés de la route
  organisation: corps
  elements:
  - 1,19 million de morts par an, environ 5 % de moins qu'en 2010 ; piétons 23 %, cyclistes 6 %, deux- et trois-roues
    motorisés 21 % (OMS, rapport mondial sur la sécurité routière, décembre 2023)
  - neuf morts sur dix dans les pays à revenu faible ou intermédiaire ; première cause de décès des 5-29 ans (même source)
