- id: electrification
  nom: Électrification des véhicules
  organisation: technique
  elements:
  - plus de 20 millions de voitures électriques vendues en 2025 (+20 %), une voiture neuve sur quatre ; près de 55 % des
    ventes en Chine (AIE, Global EV Outlook 2026)
  - 23 millions prévus en 2026, soit 28 % des ventes ; la crise énergétique liée au conflit au Moyen-Orient citée comme
    moteur (même source)
  acteurs:
