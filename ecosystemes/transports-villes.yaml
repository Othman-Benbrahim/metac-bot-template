# 0.10.421 — fiche créée le 2026-11-22 (décision de l'auteur, 4 h 27) : « plus gros trou » suivant de la carte, la ville
# comme système et les transports terrestres et aériens. Le transport maritime (transport-maritime), les réseaux
# (infrastructures-critiques) et l'urbanisation comme migration (migrations-demographie) sont reliés par des ponts.
# Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: transports-villes
nom: Transports et villes (monde)
declaration:
  but: 'comprendre la ville comme système (forme, étalement, gouvernance) et les transports qui la relient et relient le
    monde (route, transports publics, aérien) : 45 % des 8,2 milliards d''humains vivent dans des villes, 33 mégapoles de
    plus de 10 millions d''habitants (ONU, World Urbanization Prospects 2025) ; 1,19 million de morts sur les routes chaque
    année (OMS, 2023)'
  limites: dedans la forme des villes et leur étalement, les transports publics, la route et ses véhicules,
    l'électrification des véhicules, la sécurité routière, le transport aérien, la gouvernance urbaine ; dehors le
    transport maritime (transport-maritime), les réseaux et leurs pannes (infrastructures-critiques), les migrations vers
    les villes (migrations-demographie), le logement (plancher-social), la qualité de l'air (environnement-dechets), sauf
    par les ponts
  observateur: notre carte, regard extérieur, sources publiques (ONU DESA, ONU-Habitat, OMS, AIE, ACI World, OACI) ; aucune
    personne privée
  date: '2026-11-22'
  espace: la ville, le pays, le monde
  temps: de l'heure (un trajet, un embouteillage) à la décennie (étalement, renouvellement du parc)
  vitesse: le jour (trafic, fermeture d'un espace aérien), l'année (ventes de véhicules, réseaux), la décennie (forme urbaine)
  taille: micro (un usager) à macro (le trafic mondial)
compartiments:
- id: forme_urbaine
  nom: Villes, mégapoles, étalement
  organisation: technique
  elements:
  - 45 % des 8,2 milliards d'humains vivent dans des villes ; 33 mégapoles de plus de 10 millions d'habitants (8 en 1975),
    dont 19 en Asie ; Jakarta, Dhaka, Tokyo en tête (ONU DESA, World Urbanization Prospects 2025, décembre 2025 ; première
    édition au « degré d'urbanisation », non comparable directement aux anciennes séries)
  - consommation annuelle de terres urbaines passée de 1,24 % (2015-2020) à 0,83 % (2020-2025), croissance de la
    population de 1,07 % à 0,81 % (rapport des ODD 2026, 781 villes)
  acteurs:
  - nom: une mégapole
    taille: macro
    espace: agglomération
    vitesse: années
    organisation: technique
    facette: non_humain
  - nom: ONU-Habitat
    taille: macro
    espace: monde
    vitesse: années
    organisation: convention
    facette: collectif
  niveau:
    espace: ville à monde
    temps: décennies
    vitesse: années
    taille: méso à macro
  traces:
  - source: base de données mondiale des ODD (ONU, unstats.un.org/sdgs/dataportal), indicateur 11.3.1
    statut: a_brancher
    odd: ['11.3.1']
  - source: ONU DESA, World Urbanization Prospects 2025 (données téléchargeables)
    statut: a_brancher
  - &id001
    source: situations observées (lecteur-local, comptes/situations.jsonl)
    statut: a_brancher
- id: transports_publics
  nom: Transports publics (accès, réseaux)
  organisation: technique
  elements:
  - part des citadins ayant un accès commode aux transports publics passée de 53,2 % (2020) à 61,5 % (2025) (rapport des
    ODD 2026, 412 villes de 127 pays)
  - métros, bus, tramways, trains de banlieue
  acteurs:
  - nom: un réseau de métro
    taille: méso
    espace: ville
    vitesse: années
    organisation: technique
    facette: non_humain
  - nom: des citadins usagers des transports publics (en agrégat)
