# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local).
# 0.10.432 — complétée le 2026-11-22 (décision de l'auteur, 5 h 48) : conjoncture mondiale (FMI), deux compartiments
# (défaillances d'entreprises, investissement dans l'IA), relations à vérifier, ponts. Identifiants d'origine gardés.
# 0.10.433 — remarque de l'auteur du 2026-11-22, 5 h 54 : industrie, agriculture et tertiaire non représentés, liens peu
# visibles. Ajout des secteurs (agriculture, extraction, industrie manufacturière, services, échanges) et de leurs liens.
theme: economie-entreprises
nom: Économie générale et entreprises
declaration:
  but: situer les entreprises, leurs dirigeants et leurs opérations, et la conjoncture générale, quand nos fiches sectorielles
    ne les couvrent pas
  limites: dedans conjoncture générale, finance d'entreprise et fusions, entreprises nommées (industrie automobile, distribution,
    industriels), dirigeants d'entreprise dans leur rôle, immobilier et consommation, règles sectorielles ; dehors l'énergie,
    les mines (dette-emergents:gisements), les banques (crises-bancaires), l'inflation (inflation-mondiale)
  observateur: notre carte, regard extérieur ; termes relevés dans les étiquettes des flux RSS du bot (lecteur-local), émetteurs
    identifiés dans listes/emetteurs.txt ; aucune personne privée
  date: '2026-11-22'
  espace: le monde, par pays
  temps: du trimestre (des résultats) à la décennie (une industrie)
  vitesse: le jour (une annonce), le trimestre, l'année
  taille: micro (une usine) à macro (une économie)
compartiments:
- id: conjoncture
  nom: Conjoncture générale
  organisation: economie
  elements:
  - économie et affaires (en général)
  - industrie
  - croissance mondiale prévue à 3,1 % en 2026 et 3,4 % en 2027 ; inflation mondiale 4,7 % en 2026 puis 4,1 % en 2027 ;
    risques surtout à la baisse - Moyen-Orient, énergie, réévaluation de l'IA, dettes publiques, tensions commerciales
    (FMI, Perspectives de l'économie mondiale, octobre 2026)
  niveau:
    espace: pays
    temps: trimestres
    vitesse: mois
    taille: macro
  traces: &id001
  - source: comptes des termes validés dans les flux RSS (dépôt lecteur-local, listes/valides.txt)
    statut: a_brancher
- id: finance_entreprise
  nom: Finance d'entreprise
  organisation: economie
  elements:
  - investissements et financements
  - fusions et acquisitions (dont minières)
  - crédit public à l'exportation (UK Export Finance)
  niveau:
    espace: monde
    temps: mois
    vitesse: semaines
    taille: méso
  traces: *id001
- id: entreprises
  nom: Entreprises nommées
  organisation: economie
  elements:
  - Volkswagen et Audi (usines comprises)
  - Ikea
  - Emerson
  - sociétés minières encore à identifier
  acteurs:
  - nom: une grande entreprise
    taille: méso
    espace: monde
    vitesse: semaines
    organisation: economie
    facette: collectif
  niveau:
    espace: monde
    temps: années
    vitesse: semaines
    taille: méso
  traces: *id001
- id: dirigeants_entreprise
  nom: Dirigeants d'entreprise (rôle public)
  organisation: statut
  elements:
  - présidents de directoire et de conseil de surveillance
  acteurs:
  - nom: un dirigeant d'entreprise (dans son rôle)
    taille: micro
    espace: monde
    vitesse: semaines
    organisation: statut
    facette: statut
  niveau:
    espace: monde
    temps: mandats
    vitesse: semaines
    taille: micro
  traces: *id001
- id: immobilier_consommation
  nom: Immobilier et consommation
  organisation: economie
  elements:
  - immobilier
  - commerce en ligne
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: méso à macro
  traces: *id001
- id: regles_sectorielles
  nom: Règles sectorielles
  organisation: convention
  elements:
  - réglementation sectorielle (dont minière)
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: méso
  traces: *id001
- id: defaillances
  nom: Défaillances d'entreprises
  organisation: economie
  elements:
  - défaillances mondiales en hausse de 6 % en 2025, puis de 5 % prévus en 2026 et 1 % en 2027, cinquième année de
    hausse ; pic attendu en 2028 ; causes - croissance faible, énergie chère, taux durablement élevés, nombreuses
    entreprises jeunes et fragiles (Allianz Trade, 27 octobre 2026)
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: méso à macro
  traces:
  - source: Allianz Trade, perspectives des défaillances (publiées deux fois par an)
    statut: a_brancher
- id: investissement_ia
  nom: Investissement dans l'IA et les centres de données
  organisation: technique
  elements:
  - l'investissement dans l'IA soutient la croissance ; une réévaluation de sa rentabilité pourrait le couper et
    corriger les marchés d'actions (FMI, octobre 2026)
  - 'centres de données géants aux États-Unis (403 repérés par satellite, mai 2024 à avril 2025) : 68 à 99 TWh par an,
    environ 1,8 % de la consommation électrique du pays, environ 25,7 millions de tonnes de CO2 ; électricité fossile à
    environ 54 % (gaz 38 %, charbon 15 %) ; Virginie, Oregon, Ohio et Iowa font plus de la moitié (Guidi, Dominici et
    al., Nature Sustainability, 16 novembre 2026, doi 10.1038/s41893-026-01985-7)'
  - 'mécanisme : la demande des centres de données se concentre sur quelques réseaux régionaux ; elle y pèse sur les prix
    de l''électricité, les centrales fossiles maintenues et les émissions locales (même source)'
  niveau:
    espace: monde
    temps: années
    vitesse: trimestres
    taille: macro
  traces: *id001
- id: agriculture
  nom: Secteur primaire agricole (cultures, élevage, forêt, pêche)
  organisation: vegetal
  elements:
  - agriculture, sylviculture et pêche - environ 4 % du PIB mondial en 2025 (Banque mondiale, d'après StatisticsTimes)
  - poids bien plus lourd dans l'emploi et le PIB des pays à faible revenu
  niveau:
    espace: pays
    temps: saisons à années
    vitesse: saisons
    taille: micro à macro
  traces:
  - source: Banque mondiale, valeur ajoutée de l'agriculture en % du PIB (NV.AGR.TOTL.ZS, données publiques)
    statut: a_brancher
- id: extraction
  nom: Extraction (mines, pétrole, gaz)
  organisation: mineral
  elements:
  - mines et carrières, hydrocarbures
  - rentes des pays producteurs
  niveau:
    espace: pays
    temps: années à décennies
    vitesse: mois
    taille: macro
  traces: *id001
- id: industrie_manufacturiere
  nom: Industrie manufacturière et construction
  organisation: technique
  elements:
  - industrie au sens large (manufacture, construction, énergie, mines) - environ 25 % du PIB mondial en 2025 (Banque
    mondiale, d'après StatisticsTimes)
  - la Chine revendique plus de 30 % de la croissance manufacturière mondiale sur 2021-2025 (ministre chinois de
    l'Industrie, Xinhua, 9 septembre 2025 ; source officielle chinoise)
  - automobile, chimie, machines, électronique, acier
  niveau:
    espace: pays et monde
    temps: années
    vitesse: mois (indices d'activité) à années (usines)
    taille: méso à macro
  traces:
  - source: Banque mondiale, valeur ajoutée de l'industrie et de la manufacture en % du PIB (données publiques)
    statut: a_brancher
- id: services
  nom: Services (secteur tertiaire)
  organisation: economie
  elements:
  - environ 63 % du PIB mondial en 2024 (Banque mondiale, d'après StatisticsTimes)
  - commerce, finance, transports, tourisme, santé, éducation, numérique
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - source: Banque mondiale, valeur ajoutée des services en % du PIB (NV.SRV.TOTL.ZS, données publiques)
    statut: a_brancher
- id: echanges
  nom: Échanges internationaux de biens et de services
  organisation: economie
  elements:
  - exportations mondiales de marchandises de 26 300 milliards de dollars en 2025 (+7,2 %) ; exportations de services
    au-delà de 9 500 milliards (+8,2 %) (OMC, repris le 20 avril 2026)
  - droits de douane, chaînes de valeur
  - 'mécanisme : dépendance à un seul secteur d''exportation — le textile et la chaussure font 90 % des exportations du Cambodge et le vêtement 80 % de celles du Bangladesh ; toute variation de la demande ou des droits de douane des grands marchés les frappe directement (Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - source: OMC, statistiques du commerce (données publiques)
    statut: a_brancher
