# Ponts transversaux entre fiches (0.10.435, décision de l'auteur du 2026-11-22, 6 h 08 : « l'absence de connexions entre
# les différentes catégories, qui pourtant sont nombreuses […] tout est relié d'une certaine façon, chaque chose à son
# niveau ; mieux établir les liens, pas seulement quand ils sont très directs »).
#
# Ce fichier n'est pas une fiche : ecosystemes.charger() ajoute chaque entrée aux ponts de la fiche de départ. Chaque pont
# passe par un CANAL nommé (le mécanisme qui transmet), pour qu'on puisse lire la dynamique d'ensemble canal par canal :
#   energie · climat · eau · vivant · sante · economie · population · conflit · information · institution · technique ·
#   territoire · comportement
# Tous sont des ponts d'INFLUENCE (transmission partielle, avec retard), sauf mention « meme ». Ce sont des hypothèses
# de liaison, écrites à partir des définitions des compartiments et des mécanismes connus ; comme les relations, ils sont
# à vérifier, et ne portent aucun chiffre.
canaux:
  energie: "prix et disponibilité de l'énergie"
  climat: "climat, météo, extrêmes"
  eau: "quantité et qualité de l'eau"
  vivant: "êtres vivants, espèces, pathogènes"
  sante: "corps, maladies, pollution dans les corps"
  economie: "prix, revenus, emploi, finance, commerce"
  population: "naissances, morts, migrations, villes"
  conflit: "guerres, violences, coercition"
  information: "récits, attention, opinion"
  institution: "règles, droit, décisions publiques"
  technique: "réseaux, machines, savoir-faire"
  territoire: "relief, distances, passages"
  comportement: "ce qui pousse les humains à agir"
ponts:
