# 0.10.415 (2026-11-22, décision de l'auteur 3 h 33) : troisième des « plus gros trous » : pêche et aquaculture, récifs,
# désoxygénation, plastiques, haute mer ajoutés ; récifs et zones mortes sortis du compartiment « vivant aquatique ».
theme: oceans-et-fleuves
nom: Océans et fleuves (l'eau de la Terre)
declaration:
  but: 'comprendre l''eau de la Terre, dont sont faits tous les êtres vivants : comment océans, glaces, fleuves et nappes
    stockent et déplacent l''eau et la chaleur, et ce que cela transmet aux climats, aux cultures, aux villes, à la navigation
    et aux machines'
  limites: dedans les océans (chaleur, courants, acidification, niveau), les glaces, les fleuves (débits, crues, étiages,
    deltas), les nappes, le cycle de l'eau, les usages humains (barrages, irrigation, navigation fluviale, refroidissement
    des centrales et des centres de données) ; dehors la gestion locale de l'eau potable et le dessalement (fiche eau au Moyen-Orient)
  observateur: notre carte, regard extérieur ; sources scientifiques publiques
  date: '2026-11-19'
  espace: de la cellule (eau du vivant) aux bassins versants et aux océans
  temps: de la crue de quelques jours au siècle (niveau de la mer, glaciers)
  vitesse: le jour (crue), la saison (étiage), la décennie (glaciers), le siècle (océan profond)
  taille: micro (cellule) à macro (océans)
