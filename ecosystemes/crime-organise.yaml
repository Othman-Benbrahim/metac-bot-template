# 0.10.511 (2026-11-26, accord de l'auteur 22 h 32) : centres criminels d'Asie du Sud-Est, rapport IISS d'octobre 2026.
# 0.10.453 — fiche créée le 2026-11-22 (angle mort signalé, accord de l'auteur 9 h 23) : crime organisé et économie illicite comme
# écosystème. Agrégats et groupes publiquement documentés seulement. Chiffres vérifiés le 2026-11-22. Relations à vérifier.
theme: crime-organise
nom: Crime organisé et économie illicite
declaration:
  but: 'voir l''économie illicite comme un écosystème mondial relié au reste : 316 millions de consommateurs de drogues en 2023 ; production record de cocaïne, 3 708 tonnes (ONUDC, 2025) ; escroqueries organisées depuis l''Asie du Sud-Est, de 88 à 114 milliards de dollars de pertes en 2025 (ONUDC, 2026) ; blanchiment, traite, trafics d''armes et d''espèces'
  limites: 'dedans les drogues, les cartels et mafias, l''escroquerie et la cybercriminalité, la traite des êtres humains, le blanchiment, les trafics d''armes et d''espèces, la captation d''États, la répression ; dehors la sécurité publique nationale (securite-publique), la corruption (corruption), sauf par les ponts'
  observateur: 'notre carte, regard extérieur ; sources publiques (ONUDC, presse) ; aucune personne privée'
  date: '2026-11-22'
  espace: 'le quartier, la route de trafic, le monde'
  temps: 'du jour à la décennie'
  vitesse: 'le jour, le mois, l''année'
  taille: 'micro (un réseau) à macro (des centaines de milliards)'
compartiments:
- id: drogues
  nom: Marchés des drogues
  organisation: economie
  elements:
  - 316 millions de consommateurs en 2023 (6 % des 15-64 ans) ; cannabis 244 millions, opioïdes 61, amphétamines 30,7, cocaïne 25 millions (ONUDC, Rapport mondial sur les drogues 2025)
  - cocaïne - production de 3 708 tonnes (+34 %), saisies record de 2 275 tonnes ; captagon vers la péninsule Arabique (même source)
  - 'mécanisme (fentanyl) : les précurseurs chimiques, légaux en Chine, sont transformés au Mexique dans de petits ateliers (Sinaloa, Jalisco) ; environ 800 dollars d''ingrédients donnent l''équivalent de 17 000 dollars de pilules ; le fentanyl cause les deux tiers des quelque 100 000 morts par overdose par an aux États-Unis ; la restriction des opioïdes prescrits à partir de 2010 a fait passer les consommateurs à l''héroïne puis au fentanyl, moins cher (CDC et ONUDC, via Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
