- id: terres_rares_uranium
  nom: Terres rares et uranium
  organisation: mineral
  elements:
  - terres rares lourdes, aimants permanents (moteurs, défense)
  - les trois premiers pays font près des trois quarts de l'extraction d'uranium et environ 70 % de la conversion et de
    l'enrichissement (AIE, 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - *id001
- id: zinc_plomb
  nom: Zinc et plomb (métaux porteurs)
  organisation: mineral
  elements:
  - le zinc porte l'indium (presque tout l'indium est un sous-produit du zinc), le cadmium et le thallium ; le plomb
    porte l'antimoine et le bismuth ; plomb, zinc, cuivre et or donnent environ 71 % de l'argent (Nassar, Graedel et
    Harper, Science Advances, 2015)
  - le germanium est récupéré dans des concentrés de zinc (USGS, Mineral Commodity Summaries 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - source: USGS, Mineral Commodity Summaries (zinc, plomb), séries publiques annuelles
    statut: a_brancher
  - *id001
- id: aluminium
  nom: Aluminium et alumine (métal porteur)
  organisation: mineral
  elements:
  - le gallium est récupéré surtout comme sous-produit du traitement de la bauxite, parfois du zinc ; production
    primaire mondiale d'environ 900 tonnes en 2025, dont 99 % en Chine pour le gallium de faible pureté (USGS, Mineral
    Commodity Summaries 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - source: USGS, Mineral Commodity Summaries (bauxite et alumine), séries publiques annuelles
    statut: a_brancher
  - *id001
- id: metaux_compagnons
  nom: Métaux compagnons (sous-produits gallium, germanium, indium, sélénium, tellure, cobalt…)
  organisation: mineral
  elements:
  - un métal compagnon est obtenu surtout ou entièrement comme sous-produit d'un métal porteur ; 38 des 62 métaux étudiés
    dépendent à plus de 50 % d'un porteur ; 27 des 38 compagnons sont recyclés à moins de 1 % en fin de vie (Nassar,
    Graedel et Harper, Science Advances, 2015)
  - l'offre d'un compagnon suit la production de son porteur, pas son propre prix ; exemple du ruthénium, compagnon du
    platine, dont le prix a été multiplié par 9 en un an jusqu'en février 2007 quand sa demande a bondi (Nassar et al.,
    2015)
  - contrôles chinois à l'exportation du gallium et du germanium en août 2023, interdiction vers les États-Unis en
    décembre 2024, levée pour un an en novembre 2025 (USGS, Mineral Commodity Summaries 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
