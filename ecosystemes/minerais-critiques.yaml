- id: terres_rares_uranium
  nom: Terres rares et uranium
  organisation: mineral
  elements:
  - terres rares lourdes, aimants permanents (moteurs, défense)
  - les trois premiers pays font près des trois quarts de l'extraction d'uranium et environ 70 % de la conversion et de
    l'enrichissement (AIE, 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - *id001
- id: investissement
  nom: Investissement et nouvelles mines
  organisation: economie
  elements:
  - investissement dans les minerais critiques en baisse de 9 % en 2025, cuivre en hausse de 8 % (AIE, 2026)
  - délais longs d'ouverture des mines
  niveau:
    espace: monde
    temps: décennies
    vitesse: années
    taille: macro
  traces:
  - *id001
- id: demande
  nom: Demande (électrification, numérique et IA, défense)
  organisation: technique
  elements:
