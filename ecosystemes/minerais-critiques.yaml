cycles:
- id: cycle_du_porteur
  nom: Cycle de production du métal porteur
  sorte: endogene
  mecanisme: 'l''offre d''un métal compagnon suit la production de son porteur (cuivre, zinc, aluminium, nickel), qui
    obéit à ses propres prix et à ses propres cycles d''investissement ; le compagnon ne peut pas accélérer seul'
  phase_vulnerable: les phases de baisse de production du porteur (fermetures de fonderies, prix bas du porteur)
  compartiments: [cuivre, zinc_plomb, aluminium, metaux_compagnons]
  sources: ['Nassar, Graedel et Harper, Science Advances, 2015']
  statut: mecanisme
tensions:
- id: compagnon_porteur
  nom: Demande du compagnon contre production du porteur
  forme: desynchronisation
  entre: [metaux_compagnons, cuivre]
  module_par: [cycle_du_porteur]
  mesure:
    indicateur: écart entre la croissance de la demande d'un compagnon et celle de la production de son porteur (exemple
      indium contre zinc, Nassar et al., 2015)
  tampons:
  - {nom: "stocks d'État et stocks industriels de métaux mineurs", niveau: inconnu}
  - {nom: "taux de récupération à améliorer (parfois 10 % seulement)", niveau: inconnu, mesure: "taux de récupération du compagnon dans les circuits du porteur"}
  - {nom: "recyclage en fin de vie (souvent moins de 1 %)", niveau: faible, mesure: "taux de recyclage en fin de vie"}
  seuil:
    habitus: circuits de raffinage du porteur conçus sans récupérer le compagnon
    indicateurs_lents: [part de la récupération concentrée dans un seul pays, taux de recyclage en fin de vie]
    bascule: flambée du prix du compagnon, contrôle à l'exportation, pénurie pour une industrie (électronique, défense)
    hysteresis: inconnu
  statut: a_verifier
  texte: 'la demande d''un compagnon peut croître bien plus vite que la production de son porteur (production primaire
    d''indium multipliée par près de 18 de 1975 à 2012, zinc par 3,3, Nassar et al., 2015) ; l''écart ne se comble pas par
    le prix'
