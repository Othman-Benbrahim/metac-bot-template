# 0.10.425 — fiche créée le 2026-11-22 (décision de l'auteur, 4 h 34 : « commence dans l'ordre et comble ce qui manque »).
# Les minerais critiques n'étaient que mentionnés dans rivalite-sino-americaine (terres_rares), sciences-techniques et
# dette-emergents (gisements). Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
# 0.10.467 (décision de l'auteur, 2026-11-23, 6 h 26 ; ressource signalée : la « roue des métaux » de M. Reuter, reprise
# par SMS group, SMS insights 2024-2) : métaux PORTEURS et métaux COMPAGNONS (sous-produits). Relations « sous-produit de »
# écrites en commensalisme (le porteur nourrit l'offre du compagnon, sans retour notable) ; tension de désynchronisation :
# l'offre d'un compagnon suit le cycle de son porteur, pas son propre prix. Sources primaires : Nassar, Graedel et Harper,
# « By-product metals are technologically essential but have problematic supply », Science Advances 1(3), e1400180, 2015
# (doi 10.1126/sciadv.1400180) ; USGS, Mineral Commodity Summaries 2026 (gallium, germanium, cobalt).
theme: minerais-critiques
nom: Minerais et métaux critiques (monde)
declaration:
  but: 'comprendre les minerais et métaux dont dépendent l''électrification, le numérique et la défense (cuivre, lithium,
    cobalt, nickel, graphite, terres rares, uranium) : une production et surtout un raffinage très concentrés, en
    moyenne 72 % pour le premier raffineur hors terres rares en 2025 (AIE, Global Critical Minerals Outlook 2026), des
    contrôles à l''exportation devenus une arme commerciale, des prix records pour le cuivre'
  limites: dedans l'extraction, le raffinage, les contrôles à l'exportation, les prix, l'investissement et la demande de
    ces minerais ; dehors la rivalité sino-américaine dans son ensemble (rivalite-sino-americaine), la dette des pays
    producteurs (dette-emergents), les conflits de l'est de la RDC (afrique-subsaharienne), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (AIE, presse spécialisée) ; aucune personne privée
  date: '2026-11-22'
  espace: la mine, le pays producteur, le marché mondial
  temps: du jour (une annonce de contrôle) à la décennie (ouvrir une mine)
  vitesse: le jour (prix, annonces), le mois (quotas, trêves), la décennie (nouvelles mines)
  taille: méso (une mine, une fonderie) à macro (le marché mondial)
compartiments:
- id: concentration
  nom: Concentration de l'extraction et du raffinage
  organisation: economie
  elements:
  - part moyenne du premier raffineur passée de 70 % (2023) à 72 % (2025), hors terres rares ; la Chine première pour la
    plupart des minerais, l'Indonésie pour le nickel (AIE, Global Critical Minerals Outlook 2026)
  - la Chine fait environ la moitié de la fonte mondiale de cuivre, contre 15 % environ en 2005 (AIE, commentaire de 2026)
  - 'RDC : intérêts chinois au capital de 17 des 19 principales opérations de cobalt ; 96 % du cobalt congolais part vers la Chine ; la RDC devient en 2024 le deuxième raffineur de cuivre en cathodes (8 % de l''offre mondiale, Chine 45 %) mais exporte son cobalt en hydroxyde (pureté 20 à 40 %, payé 50 à 60 % du prix du métal) (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026, d''après OCDE 2026 et Deberdt, Le Billon et DiCarlo 2026)'
  - 'mécanisme : la transformation concentrée en Chine limite l''autonomie des chaînes occidentales ; une route « alternative » transporte de fait un minerai en partie sous contrôle chinois (Zijin détient 39,6 % de Kamoa-Kakula, premier client potentiel du corridor de Lobito) (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  niveau:
    espace: monde
    temps: décennies
    vitesse: années
    taille: macro
