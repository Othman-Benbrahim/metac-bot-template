- id: corridors_evacuation
  nom: Corridors d'évacuation des mines africaines
  organisation: technique
  elements:
  - 'mécanisme : extraction concentrée sur quelques territoires souvent enclavés, évacuée par peu de corridors longs, saturés et sans contournement ; la concentration ne crée pas le choc mais l''amplifie, un incident local peut devenir un choc d''offre mondial (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'Guinée : la région de Boké fait 86,4 % de la bauxite guinéenne en 2023, soit 25 % de la production mondiale ; SMB (environ 72 millions de tonnes en 2025, près de 40 % du pays) dépend d''une seule voie ferrée de 130 km puis du Rio Nunez (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'RDC-Zambie : effondrement du pont de Kakoso sur le corridor vers Kasumbalesa (mars 2026) ; attaques contre des transporteurs zambiens (janvier 2026) (relayé par IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'mécanisme : pour les États africains, un corridor est à double sens, il fait sortir le minerai et baisse le coût des intrants importés (agriculture, industrie) (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  niveau:
    espace: région
    temps: années
    vitesse: jours (incident) à années (construction)
    taille: méso
  traces:
  - *id001
- id: energie_hydro
  nom: Dépendance des mines à l'hydroélectricité
  organisation: technique
  elements:
  - 'RDC : 97 % des capacités installées sont hydroélectriques (Inga, Lualaba, Lufira) ; Guinée 80 à 85 % du réseau interconnecté ; Zimbabwe : Kariba South environ 45 % de la production ; Zambie 83 % hydraulique, surtout bassin du Zambèze, et point de passage des échanges RDC-SAPP ; Afrique du Sud exception (près de 80 % charbon) (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'sécheresse El Niño de 2024, la pire depuis quarante ans en Afrique australe : Kariba South tombé à 104 MW pour 1 050 installés fin 2024, production zambienne en baisse de 31 %, arrêts de production minière, exportations d''électricité zambiennes réduites vers la RDC et la Namibie (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'mécanisme : une même ressource en eau (bassin du Zambèze) alimente plusieurs pays, d''où des pénuries simultanées en cas de stress hydrique (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  niveau:
    espace: bassin et région
    temps: saisons à années
    vitesse: mois
    taille: macro
  traces:
  - source: anomalie de température du Pacifique, zone Niño 3.4
    statut: collecte
    adaptateur: pub:nino34_anomalie
  - *id001
