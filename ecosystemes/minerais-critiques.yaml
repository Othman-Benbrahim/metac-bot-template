- id: zinc_plomb
  nom: Zinc et plomb (métaux porteurs)
  organisation: mineral
  elements:
  - le zinc porte l'indium (presque tout l'indium est un sous-produit du zinc), le cadmium et le thallium ; le plomb
    porte l'antimoine et le bismuth ; plomb, zinc, cuivre et or donnent environ 71 % de l'argent (Nassar, Graedel et
    Harper, Science Advances, 2015)
  - le germanium est récupéré dans des concentrés de zinc (USGS, Mineral Commodity Summaries 2026)
