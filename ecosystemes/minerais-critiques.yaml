    statut: a_brancher
- id: controles_export
  nom: Contrôles à l'exportation (terres rares, graphite, matériaux de batteries)
  organisation: geopolitique
  elements:
  - nombre de codes douaniers de minerais soumis aux contrôles chinois triplé depuis 2023 (AIE, 2026)
  - contrôles chinois sur sept terres rares lourdes en avril 2025, élargis en octobre 2025 ; trêve d'un an conclue à
    Busan fin octobre 2025 ; suspension prolongée le 9 novembre 2026 jusqu'au 10 janvier 2027 (The National,
    9 novembre 2026)
  - quotas d'exportation de cobalt de la RDC après la levée de l'interdiction le 16 octobre 2025 ; quota de 96 600 tonnes
    pour 2026, cadre jusqu'en 2027 (Benchmark Mineral Intelligence, 22 septembre 2025)
  - 'mécanisme : les restrictions africaines visent trois buts, faire monter les prix, réorganiser la commercialisation, imposer la transformation locale ; formes graduées : plafond de production aux études de faisabilité (bauxite, Guinée), quotas (cobalt, RDC), interdiction au cas par cas (lithium brut, Zimbabwe, depuis décembre 2022) ; elles ne marchent pas seules, il faut électricité, capitaux et compétences (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'Afrique du Sud : propositions de juin 2026 pour une taxe de 25 % à l''exportation du chrome brut ; 11 fonderies de ferrochrome en activité en 2026 contre 66 à l''apogée ; tarifs d''Eskom multipliés par 10 depuis 2008, allègement tarifaire négocié au printemps 2026 (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
