- id: investissement
  nom: Investissement et nouvelles mines
  organisation: economie
  elements:
  - investissement dans les minerais critiques en baisse de 9 % en 2025, cuivre en hausse de 8 % (AIE, 2026)
  - délais longs d'ouverture des mines
  - 'mines et eau : 65,7 % des plus de 12 000 grands sites miniers et métallurgiques (148 pays et régions) font face à au moins un risque hydrique majeur — stress hydrique 38 %, sécheresse 27 %, forte variabilité d''une année à l''autre 16 %, inondation 14 % ; 81 % des sites d''Afrique et du Moyen-Orient en forte sécheresse (96 % en Afrique du Sud) ; points chauds cumulant les risques : ouest des États-Unis, Chili, Pérou, Afrique australe, nord de la Chine, centre de l''Inde, ouest de l''Australie, soit plusieurs grands bassins du cuivre et du lithium (ICMM, Global Mining and Metals Water Dataset, 22 juillet 2026, via Down To Earth ; l''ICMM est l''association des grands groupes miniers)'
  - 'mines et biodiversité : 22 % des quelque 12 000 grands sites miniers et métallurgiques sont dans des zones d''écosystèmes en bon ou très bon état, dont un tiers (7 % du total) sous forte pression ; 5 % chevauchent une zone clé pour la biodiversité et 4 % une aire protégée ; manganèse (14 %), étain et diamant (12 %) plus de deux fois la moyenne ; 73 % des zones clés touchées ne sont pas entièrement protégées ; petite mine artisanale exclue (ICMM, Global Mining and Metals Biodiversity Dataset, 18 novembre 2026, CC BY 4.0 ; l''ICMM est l''association des grands groupes miniers)'
  - 'stratégie états-unienne « mine to market » de la DFC : prêts, participations, assurance politique, contrats d''enlèvement avec droit de premier refus ; portefeuille minier africain au-delà de 3 milliards de dollars ; prêt de 553 millions pour le rail angolais et le port de Lobito (décembre 2025) ; coentreprise Gécamines-Mercuria soutenue par la DFC (décembre 2025) (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
  - 'mécanisme : les États producteurs créent des entreprises publiques adossées aux grands négociants (Glencore, Mercuria, Trafigura) pour vendre hors des chaînes chinoises intégrées ; EGC (RDC, cobalt artisanal) : 1 000 premières tonnes traçables en novembre 2025, 5 000 visées en 2026, premier accord Mercuria-Trafigura en février 2026 (IRIS, Observatoire de la sécurité des flux et des matières énergétiques (OSFME), « Minerais critiques en Afrique », novembre 2026)'
