- id: batteries
  nom: Métaux des batteries (lithium, cobalt, nickel, graphite)
  organisation: mineral
  elements:
  - investissement dans les métaux des batteries en baisse de plus de 20 % en 2025 (AIE, 2026)
  - cobalt de la RDC, nickel d'Indonésie, graphite et raffinage du lithium en Chine
  - le cobalt est extrait avec le cuivre et le nickel (secteur cuivre-nickel de la roue des métaux, Reuter, reprise par
    SMS group, 2024) ; la RDC fait environ 74 % de la production minière mondiale en 2025, 230 000 tonnes sur 310 000
    (USGS, Mineral Commodity Summaries 2026)
