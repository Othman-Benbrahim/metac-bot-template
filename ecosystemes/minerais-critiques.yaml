- id: cuivre
  nom: Cuivre
  organisation: mineral
  elements:
  - métal porteur du sélénium et du tellure (au moins 90 % de chacun vient du cuivre) et d'un peu moins de la moitié du
    molybdène en 2008 (Nassar, Graedel et Harper, Science Advances, 2015)
  - prix au-delà de 12 000 dollars la tonne en décembre 2025, brièvement au-delà de 14 500 en séance en janvier 2026 ;
    perturbations dans plusieurs grandes mines ; frais de traitement des fonderies fixés à 0 dollar la tonne pour 2026,
    le plus bas jamais convenu (AIE, commentaire de 2026)
