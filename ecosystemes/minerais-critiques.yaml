  nom: Concentration de l'extraction et du raffinage
  organisation: economie
  elements:
  - part moyenne du premier raffineur passée de 70 % (2023) à 72 % (2025), hors terres rares ; la Chine première pour la
    plupart des minerais, l'Indonésie pour le nickel (AIE, Global Critical Minerals Outlook 2026)
  - la Chine fait environ la moitié de la fonte mondiale de cuivre, contre 15 % environ en 2005 (AIE, commentaire de 2026)
  niveau:
    espace: monde
    temps: décennies
    vitesse: années
    taille: macro
