- id: metaux_compagnons
  nom: Métaux compagnons (sous-produits gallium, germanium, indium, sélénium, tellure, cobalt…)
  organisation: mineral
  elements:
  - un métal compagnon est obtenu surtout ou entièrement comme sous-produit d'un métal porteur ; 38 des 62 métaux étudiés
    dépendent à plus de 50 % d'un porteur ; 27 des 38 compagnons sont recyclés à moins de 1 % en fin de vie (Nassar,
    Graedel et Harper, Science Advances, 2015)
  - l'offre d'un compagnon suit la production de son porteur, pas son propre prix ; exemple du ruthénium, compagnon du
    platine, dont le prix a été multiplié par 9 en un an jusqu'en février 2007 quand sa demande a bondi (Nassar et al.,
    2015)
  - contrôles chinois à l'exportation du gallium et du germanium en août 2023, interdiction vers les États-Unis en
    décembre 2024, levée pour un an en novembre 2025 (USGS, Mineral Commodity Summaries 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
