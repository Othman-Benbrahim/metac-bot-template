- id: blocs
  nom: Blocs idéologiques et alliances
  organisation: geopolitique
  elements:
  - BRICS - 11 membres (Brésil, Russie, Inde, Chine, Afrique du Sud, Égypte, Éthiopie, Iran, Arabie saoudite, Émirats
    arabes unis, Indonésie) et 10 pays partenaires ; sommet de New Delhi, 12-13 septembre 2026 (Business Today, 10
    septembre 2026)
  - OTAN, Union européenne, « Sud global », pays non alignés ou multialignés
  niveau:
