- id: afrique_disputee
  nom: L'Afrique disputée entre puissances
  organisation: geopolitique
  elements:
  - retrait militaire français - Mali (2022), Burkina Faso (2023), Niger (2023), Tchad (janvier 2025), Côte d'Ivoire
    (février 2025), Sénégal (juillet 2025) ; restent Djibouti (environ 1 500 soldats) et une présence réduite au Gabon ;
    retour limité au Tchad en avril 2026 (The Rio Times, 7 septembre 2026, article aux chiffres parfois incohérents)
  - Africa Corps russe, héritier de Wagner sous la tutelle du renseignement militaire - jusqu'à 2 500 personnels au Mali,
    environ 1 500 en Centrafrique début 2026 ; petits contingents au Burkina Faso et au Niger (Service de recherche du
    Congrès américain, 8 avril 2026)
  - Chine (prêts, infrastructures, mines), Turquie, pays du Golfe, États-Unis ; beaucoup d'États africains choisissent de
    traiter avec tous (multialignement)
  niveau:
    espace: continent
    temps: années à décennies
    vitesse: mois
    taille: macro
  traces:
  - source: Service de recherche du Congrès américain, Russia's Security Operations in Africa (IF12389)
    statut: a_brancher
- id: frontieres_contestees
  nom: Frontières contestées
  organisation: geopolitique
  elements:
  - lignes de front et revendications - Ukraine, Cachemire, Taïwan, Sahara occidental, Corne de l'Afrique, Golan
  - 'mécanisme (Haut-Karabagh) : le garant de sécurité russe n''a pas protégé l''Arménie (soldats de maintien de la paix restés spectateurs lors de l''offensive azerbaïdjanaise du 19 septembre 2023 ; environ 100 000 Arméniens déplacés ; dissolution de la république le 1er janvier 2024), ce qui pousse Erevan à s''éloigner de Moscou ; l''Azerbaïdjan, appuyé par la Turquie et Israël, réexporte des hydrocarbures russes et veut un corridor vers le Nakhitchevan (Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  - 'situation : déclaration conjointe Pachinian-Aliev à la Maison-Blanche le 8 août 2025, cadre provisoire et non traité ; Bakou exige une révision de la Constitution arménienne ; le parti de Pachinian a gagné les législatives de juin 2026 sans la majorité des deux tiers ; route TRIPP à travers l''Arménie en études, travaux non commencés, l''Iran s''y oppose (Eurasianet, 10 août 2026)'
  niveau:
    espace: régions frontalières
    temps: décennies
    vitesse: mois
    taille: macro
