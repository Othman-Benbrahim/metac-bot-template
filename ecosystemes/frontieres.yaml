# 0.10.449 — fiche créée le 2026-11-22 (remarque de l'auteur, 8 h 45 : « l'écosystème passe aussi par la notion de
# frontière (conventionnelle) : entre États, continents, à l'intérieur d'un pays, blocs idéologiques ; la position
# particulière de l'Afrique, partagée entre différents acteurs qui essaient de se la réapproprier ; frontières
# administratives à l'intérieur d'un pays ; et finalement le local (donc gigogne), avec ses particularismes et ses
# traditions, maillon encore plus fin de l'écosystème »). Chiffres vérifiés le 2026-11-22. Relations à vérifier.
theme: frontieres
nom: Frontières emboîtées (continents, blocs, États, divisions internes, local)
declaration:
  but: 'voir les frontières comme des conventions emboîtées, comme les écosystèmes - continent ⊃ bloc ⊃ État ⊃ région ⊃
    commune ⊃ village ou quartier -, chacune avec ses règles, ses passages et ses disputes : 193 États membres de l''ONU ;
    des blocs (OTAN, Union européenne, BRICS à 11 membres et 10 partenaires en 2026) ; une Afrique disputée (retrait
    militaire français de six pays entre 2022 et 2025, Africa Corps russe au Mali et en Centrafrique, Chine, Turquie,
    Golfe) ; en France, 34 875 communes au 1er janvier 2026 ; plus de 7 000 langues vivantes dans le monde'
  limites: dedans les continents, les États et leurs frontières, les blocs, l'Afrique disputée, les frontières contestées,
    les passages, les divisions administratives, le local (langues, traditions) ; dehors la défense des frontières
    (militaire), les migrations elles-mêmes (migrations-demographie), le détail du Sahel (afrique-subsaharienne), sauf par
    les ponts
  observateur: notre carte, regard extérieur ; sources publiques (ONU, Business Today, Rio Times, Service de recherche du
    Congrès américain, ministère français des collectivités, Our World in Data)
  date: '2026-11-22'
  espace: du village au continent
  temps: de la décennie (un bloc) au siècle (une frontière, une langue)
  vitesse: l'année, la décennie, le siècle
  taille: micro (un village) à macro (un continent)
