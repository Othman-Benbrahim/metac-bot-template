theme: migrations-demographie
nom: Migrations et démographie
declaration:
  but: comprendre ce qui fait naître, vieillir, mourir et se déplacer les populations, et ce que ces mouvements lents ou brusques transmettent aux économies, aux politiques et aux frontières
  limites: dedans la natalité, le vieillissement, la mortalité, les migrations (climatiques, économiques, de guerre), l'urbanisation, les diasporas et leurs transferts d'argent, les politiques migratoires
    et la psychologie de l'exil et de l'accueil ; dehors les épidémies (fiche voisine) et le détail des marchés du travail
  observateur: notre carte, regard extérieur, à partir de statistiques publiques et de faits publics, toujours en agrégat
  date: '2026-11-19'
  espace: du village à la planète, avec les grands corridors migratoires
  temps: de la journée (un exode) à la génération (la natalité) ; mémoire des grands exodes du XXe siècle
  vitesse: jours (fuite devant une guerre), années (migrations économiques), décennies (vieillissement)
  taille: micro (un ménage) à macro (une population)
compartiments:
- id: natalite_vieillissement
  nom: Natalité et vieillissement
  organisation: societe
  elements:
  - fécondité
  - âge moyen
  - pyramide des âges
  - dépendance des plus âgés
  acteurs:
  - nom: un ménage qui décide d'avoir ou non un enfant
    taille: micro
    espace: local
    vitesse: années
    organisation: personne
    facette: collectif
  - nom: la population d'un pays
    taille: macro
    espace: pays
    vitesse: décennie
    organisation: societe
    facette: collectif
  niveau:
    espace: pays
    temps: générations
    vitesse: décennie
    taille: macro
  traces:
  - source: perspectives démographiques de l'ONU (données publiques)
    statut: a_brancher
- id: mortalite
  nom: Mortalité
  organisation: societe
  elements:
  - espérance de vie
  - mortalité infantile
  - surmortalité (chaleur, guerre, famine)
  niveau:
    espace: pays
    temps: années
    vitesse: mois à décennies
    taille: macro
  traces:
  - source: statistiques publiques de décès (ONU, instituts nationaux)
    statut: a_brancher
- id: migrations
  nom: Migrations
  organisation: societe
  elements:
  - migrations économiques
  - exodes de guerre
  - déplacements climatiques
  - routes et passeurs (en agrégat)
  acteurs:
  - nom: une personne qui part (en agrégat, jamais nommée)
    taille: micro
    espace: local
    vitesse: jours
    organisation: personne
    facette: collectif
  - nom: un flux de réfugiés
    taille: méso
    espace: région
    vitesse: semaines
    organisation: societe
    facette: collectif
  - nom: le HCR et l'OIM
    taille: macro
    espace: mondial
    vitesse: mois
    organisation: statut
    facette: collectif
  niveau:
    espace: corridors et régions
    temps: jours à années
    vitesse: jours à années
    taille: micro à macro
  traces:
  - source: statistiques publiques du HCR et de l'OIM (matrice de suivi des déplacements)
    statut: a_brancher
  - source: risques humanitaires ouverts pour l'Ukraine (ACAPS)
    statut: collecte
    adaptateur: acaps_risques:UA
  - source: morts de violence organisée au Soudan par jour (UCDP)
    statut: collecte
    adaptateur: ucdp:Sudan
- id: urbanisation
  nom: Urbanisation
  organisation: technique
  elements:
  - exode rural
  - bidonvilles
  - mégapoles
  - logement
  niveau:
    espace: villes
    temps: décennies
    vitesse: années
    taille: méso à macro
  traces:
  - source: données publiques d'urbanisation (ONU-Habitat)
    statut: a_brancher
- id: diasporas
  nom: Diasporas et transferts d'argent
  organisation: economie
  elements:
  - envois de fonds des émigrés
  - réseaux familiaux
  - influence politique des diasporas
  acteurs:
  - nom: une diaspora
    taille: méso
    espace: mondial
    vitesse: années
    organisation: societe
    facette: collectif
  niveau:
    espace: mondial
    temps: mensuel (envois)
    vitesse: mois
    taille: méso à macro
  traces:
  - source: données publiques de la Banque mondiale sur les envois de fonds
    statut: a_brancher
- id: politiques_migratoires
  nom: Politiques migratoires
  organisation: statut
  elements:
  - visas
  - quotas
  - accords de réadmission
  - contrôles aux frontières
  acteurs:
  - nom: un gouvernement d'accueil
    taille: macro
    espace: pays
    vitesse: mois
    organisation: statut
    facette: statut
  - nom: une doctrine d'ouverture ou de fermeture
    taille: macro
    espace: pays
    vitesse: années
    organisation: ideologie
    facette: ideologie
  niveau:
    espace: pays
    temps: lois et décrets datés
    vitesse: mois à années
    taille: macro
  traces:
  - source: Federal Register (textes américains sur l'immigration)
    statut: collecte
    fichier: collecte_federal_register.py
- id: convention
  nom: Statuts et frontières (convention)
  organisation: convention
  elements:
  - statut de réfugié
  - apatridie
