# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local).
# 0.10.432 — complétée le 2026-11-22 (décision de l'auteur, 5 h 48) : état des régimes dans le monde (V-Dem, Freedom
# House), trois compartiments (élections, contestation, coups et transitions), relations à vérifier, ponts. Identifiants
# d'origine gardés (termes validés rattachés).
theme: politique-interieure
nom: Politique intérieure (partis, élus, gouvernements, procédures), par pays
declaration:
  but: situer les acteurs et les procédures de la politique intérieure des pays que nos sources couvrent (d'abord l'Allemagne
    et la France), qui pèsent sur les élections, les coalitions et les questions de régime, et l'état des régimes dans le
    monde (liberté en baisse pour la 20e année de suite en 2025, Freedom House)
  limites: dedans partis et mouvements, dirigeants et élus dans leur rôle public, gouvernements et administrations, procédures
    (interdiction, exclusion) et affaires publiques, qualité du régime ; dehors la politique américaine (fiche politique-americaine),
    l'Amérique latine (elections-amerique-latine), le Liban (liban-institutions) et les échéances (calendriers-echeances)
  observateur: notre carte, regard extérieur ; termes relevés dans les étiquettes des flux RSS du bot (lecteur-local), émetteurs
    identifiés dans listes/emetteurs.txt ; aucune personne privée
  date: '2026-11-22'
  espace: par pays, puis par région (Land, département)
  temps: du jour (une affaire) à la décennie (un parti qui naît ou meurt)
  vitesse: le jour (une déclaration), le mois (un sondage), l'année (une élection)
  taille: micro (un élu) à macro (l'État)
compartiments:
- id: partis
  nom: Partis et mouvements
  organisation: ideologie
  elements:
  - AfD
  - CDU
  - Grüne
  - NPD
  - DKP
  - SDAJ
  - Die Linke
  - partis politiques (en général)
  acteurs:
  - nom: un parti politique (en agrégat)
    taille: méso
    espace: pays
    vitesse: mois
    organisation: ideologie
    facette: collectif
  niveau:
    espace: pays et régions
    temps: années
    vitesse: mois
    taille: méso à macro
  traces: &id001
  - source: comptes des termes validés dans les flux RSS (dépôt lecteur-local, listes/valides.txt)
    statut: a_brancher
- id: dirigeants
  nom: Dirigeants et élus (rôle public)
  organisation: statut
  elements:
  - dirigeants de partis
  - parlementaires nationaux et européens
  - élus régionaux
  - anciens dirigeants
  - chefs d'État hors fiches (Azerbaïdjan, Guinée)
  acteurs:
  - nom: un dirigeant ou élu public (dans son rôle)
    taille: micro
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: statut
  niveau:
    espace: pays
    temps: mandats
    vitesse: semaines
    taille: micro à méso
  traces: *id001
- id: gouvernement
  nom: Gouvernement et administration
  organisation: statut
  elements:
  - gouvernement fédéral et chancelier
  - ministères
  - administrations
  - fédéralisme
  - cour constitutionnelle (nominations)
  acteurs:
  - nom: un gouvernement national
    taille: macro
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: collectif
  niveau:
    espace: pays
    temps: législatures
    vitesse: semaines à mois
    taille: macro
  traces: *id001
- id: procedures
  nom: Procédures et affaires publiques
  organisation: convention
  elements:
  - procédure d'interdiction d'un parti
  - exclusions de parti
  - fuites de documents
  - affaires de dons
  - enquêtes de presse sur des réunions politiques
  niveau:
    espace: pays
    temps: mois à années
    vitesse: semaines
    taille: méso
  traces: *id001
- id: regime
  nom: Régime et démocratie
  organisation: convention
  elements:
  - démocratie et gouvernance
  - politique (en général)
  - régimes autoritaires (répression, système de pouvoir personnel)
  - liberté dans le monde en baisse pour la 20e année de suite en 2025 - 54 pays en recul, 35 en progrès ; États-Unis
    81/100 (−3) (Freedom House, 19 mars 2026)
  - environ un quart des pays en voie d'autocratisation en 2025, dont six des dix nouveaux en Europe et en Amérique du
    Nord (Italie, Royaume-Uni, États-Unis) ; indice de démocratie libérale des États-Unis en baisse de 24 % en un an,
    passés du 20e au 51e rang sur 179 (V-Dem, Democracy Report 2026, 17 mars 2026)
  niveau:
    espace: pays
    temps: décennies
    vitesse: années
    taille: macro
  traces:
  - source: V-Dem (indices de démocratie par pays, données publiques)
    statut: a_brancher
  - source: Freedom House, Freedom in the World (scores par pays)
    statut: a_brancher
- id: elections
  nom: Élections et alternances
  organisation: convention
  elements:
  - scrutins nationaux et locaux, alternances, coalitions
  - participation, contestation des résultats
  niveau:
    espace: pays
    temps: mandats
    vitesse: jours (scrutin) à mois (coalition)
    taille: macro
  traces: *id001
- id: contestation
  evenements:
    - {"type": "manifestations massives ou soulèvement dans un pays", "termes": ["protest", "protests", "uprising", "riots", "mass protests", "demonstrations", "anti-government"], "serie": "manifestations:{ISO2}", "seuil": "q99", "pas": "jour", "occurrence": "jour au-dessus du 99e centile des 365 jours précédents (GDELT)", "statut": "valide_auteur_2026-11-24_15h03"}
  nom: Contestation et mouvements de rue
  organisation: societe
  elements:
  - manifestations, grèves politiques, mouvements de jeunes
  - chutes de gouvernements sous la pression de la rue
  niveau:
    espace: pays
    temps: semaines à mois
    vitesse: jours
    taille: méso à macro
  traces: *id001
- id: coups_transitions
  nom: Coups d'État et transitions
  organisation: geopolitique
  elements:
  - coups d'État militaires, transitions annoncées et prolongées
  - plus fortes baisses de liberté en 2025 - Guinée-Bissau (−8), Tanzanie (−7), Burkina Faso, Madagascar, Salvador
    (−5) (Freedom House, 19 mars 2026)
  niveau:
    espace: pays
    temps: années
    vitesse: jours (le coup) à années (la transition)
    taille: macro
  traces: *id001
relations:
- de: contestation
  fondement: causalite_sociale
  vers: gouvernement
  effet: '-'
  delai: semaines
  force: moyenne
  coupure: répression efficace ou concessions
  statut: a_verifier
  texte: une contestation massive peut faire tomber un gouvernement (le compartiment cible lit ici sa stabilité)
- de: elections
  fondement: lien
  vers: gouvernement
  effet: +
  delai: mois
  force: forte
  coupure: résultats contestés ou coalition impossible
  statut: a_verifier
  texte: une élection désigne ou renouvelle le gouvernement, avec le délai des coalitions
- de: procedures
  fondement: causalite_sociale
  vers: partis
  effet: '-'
  delai: semaines
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: une affaire ou une procédure fait baisser le soutien d'un parti
- de: regime
  fondement: definition
  vers: elections
  effet: +
  delai: années
  force: forte
  coupure: aucune
  statut: a_verifier
  texte: la qualité du régime fait la liberté des élections ; l'autocratisation les vide (le compartiment cible lit ici
    leur liberté)
- de: coups_transitions
  fondement: evenement
  vers: regime
  effet: '-'
  delai: jours
  force: forte
  coupure: retour rapide à l'ordre constitutionnel
  statut: a_verifier
  texte: un coup d'État fait chuter les libertés et suspend les élections
ponts:
- depuis: elections
  vers: calendriers-echeances:elections
  nature: le calendrier des scrutins
  type: voisinage
- depuis: contestation
  vers: humain:passage_acte
  nature: le passage à l'acte collectif
  type: voisinage
- depuis: partis
  vers: humain:polarisation
  nature: la polarisation entre camps
  type: voisinage
- depuis: procedures
  vers: corruption:grande_corruption
  nature: les affaires de corruption au sommet
  type: voisinage
- depuis: gouvernement
  vers: union-europeenne:institutions
  nature: les gouvernements siègent au Conseil de l'Union
  type: voisinage
- depuis: coups_transitions
  vers: afrique-subsaharienne:juntes_sahel
  nature: les juntes du Sahel
  type: meme
- depuis: regime
  vers: politique-americaine:executif
  nature: le recul démocratique américain mesuré par V-Dem et Freedom House
  type: voisinage
- depuis: elections
  vers: asie-du-sud:bangladesh
  nature: une alternance après un soulèvement
  type: voisinage
