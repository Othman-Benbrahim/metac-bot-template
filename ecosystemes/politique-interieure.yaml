# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local). Compartiments seulement ; relations et ponts à établir sur sources.
theme: politique-interieure
nom: Politique intérieure (partis, élus, gouvernements, procédures), par pays
declaration:
  but: situer les acteurs et les procédures de la politique intérieure des pays que nos sources couvrent (d'abord l'Allemagne
    et la France), qui pèsent sur les élections, les coalitions et les questions de régime
  limites: dedans partis et mouvements, dirigeants et élus dans leur rôle public, gouvernements et administrations, procédures
    (interdiction, exclusion) et affaires publiques, qualité du régime ; dehors la politique américaine (fiche politique-americaine),
    l'Amérique latine (elections-amerique-latine), le Liban (liban-institutions) et les échéances (calendriers-echeances)
  observateur: notre carte, regard extérieur ; termes relevés dans les étiquettes des flux RSS du bot (lecteur-local), émetteurs
    identifiés dans listes/emetteurs.txt ; aucune personne privée
  date: '2026-11-22'
  espace: par pays, puis par région (Land, département)
  temps: du jour (une affaire) à la décennie (un parti qui naît ou meurt)
  vitesse: le jour (une déclaration), le mois (un sondage), l'année (une élection)
  taille: micro (un élu) à macro (l'État)
compartiments:
- id: partis
  nom: Partis et mouvements
  organisation: ideologie
  elements:
  - AfD
  - CDU
  - Grüne
  - NPD
  - DKP
  - SDAJ
  - Die Linke
  - partis politiques (en général)
  acteurs:
  - nom: un parti politique (en agrégat)
    taille: méso
    espace: pays
    vitesse: mois
    organisation: ideologie
    facette: collectif
  niveau:
    espace: pays et régions
    temps: années
    vitesse: mois
    taille: méso à macro
  traces: &id001
  - source: comptes des termes validés dans les flux RSS (dépôt lecteur-local, listes/valides.txt)
    statut: a_brancher
- id: dirigeants
  nom: Dirigeants et élus (rôle public)
  organisation: statut
  elements:
  - dirigeants de partis
  - parlementaires nationaux et européens
  - élus régionaux
  - anciens dirigeants
  - chefs d'État hors fiches (Azerbaïdjan, Guinée)
  acteurs:
  - nom: un dirigeant ou élu public (dans son rôle)
    taille: micro
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: statut
  niveau:
    espace: pays
    temps: mandats
    vitesse: semaines
    taille: micro à méso
  traces: *id001
- id: gouvernement
  nom: Gouvernement et administration
  organisation: statut
  elements:
  - gouvernement fédéral et chancelier
  - ministères
  - administrations
  - fédéralisme
  - cour constitutionnelle (nominations)
  acteurs:
  - nom: un gouvernement national
    taille: macro
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: collectif
  niveau:
    espace: pays
    temps: législatures
    vitesse: semaines à mois
    taille: macro
  traces: *id001
- id: procedures
  nom: Procédures et affaires publiques
  organisation: convention
  elements:
  - procédure d'interdiction d'un parti
  - exclusions de parti
  - fuites de documents
  - affaires de dons
  - enquêtes de presse sur des réunions politiques
  niveau:
    espace: pays
    temps: mois à années
    vitesse: semaines
    taille: méso
  traces: *id001
- id: regime
  nom: Régime et démocratie
  organisation: convention
  elements:
  - démocratie et gouvernance
  - politique (en général)
  - régimes autoritaires (répression, système de pouvoir personnel)
  niveau:
    espace: pays
    temps: décennies
    vitesse: années
    taille: macro
  traces: *id001
relations: []
