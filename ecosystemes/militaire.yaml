# 0.10.438 — fiche créée le 2026-11-22 (remarque de l'auteur, 6 h 48 : « il manque une catégorie militaire […] elle est
# sous-entendue au travers des conflits, mais c'est un écosystème à part entière, à relier aux écosystèmes connexes »).
# Les forces armées comme système en temps de paix comme de guerre : budgets, effectifs, armes nucléaires, industrie,
# commerce des armes, alliances, technologies, doctrines, bases. Les guerres en cours restent dans leurs fiches (ponts).
# Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: militaire
nom: Militaire (forces armées, armements, dépenses, monde)
declaration:
  but: 'comprendre l''écosystème militaire mondial pour lui-même : 2 887 milliards de dollars de dépenses militaires en
    2025, 2,5 % du PIB mondial, le plus haut depuis 2009 (SIPRI, avril 2026) ; 12 187 têtes nucléaires en janvier 2026
    (SIPRI, juin 2026) ; un commerce des armes en hausse de 9,2 % sur 2021-2025 ; un objectif de l''OTAN à 5 % du PIB en
    2035'
  limites: dedans les dépenses, les forces et leurs effectifs, les armes nucléaires (arsenaux), l'industrie de l'armement,
    le commerce des armes, les alliances et leurs engagements, les technologies militaires, les doctrines, les bases et
    la projection ; dehors les guerres en cours (russie-ukraine, guerre-levant, soudan, afrique-subsaharienne…), le régime
    de non-prolifération (non-proliferation), la défense européenne détaillée (securite-europeenne), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (SIPRI, OTAN, presse) ; aucune personne privée
  date: '2026-11-22'
  espace: le pays, l'alliance, le monde
  temps: du jour (un tir d'essai, un exercice) à la décennie (un programme d'armement, une doctrine)
  vitesse: le jour (incidents), l'année (budgets, livraisons), la décennie (programmes, arsenaux)
  taille: méso (une base, une unité) à macro (une alliance, le monde)
compartiments:
- id: depenses
  nom: Dépenses militaires
  organisation: economie
  elements:
  - 2 887 milliards de dollars en 2025, +2,9 % en termes réels (après +9,7 % l'année précédente) ; 2,5 % du PIB mondial,
    le plus haut depuis 2009 ; États-Unis, Chine et Russie font 51 % du total (SIPRI, repris le 28 avril 2026)
  - Europe +14 %, à 864 milliards ; États-Unis −7,5 %, à 954 milliards, faute de nouvelle aide militaire à l'Ukraine en
    2025 (même source)
  niveau:
    espace: pays et monde
    temps: années
    vitesse: années
    taille: macro
  traces:
  - {source: "flux RSS Defense One, famille « defense » (0.10.455, en ombre)", statut: collecte, fichier: collecte_rss.py}
