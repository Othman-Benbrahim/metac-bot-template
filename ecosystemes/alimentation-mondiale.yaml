  - nom: les contrats à terme sur le blé
    taille: macro
    espace: mondial
    vitesse: minutes
    organisation: economie
    facette: collectif
  niveau:
    espace: mondial
    temps: séances ; indices mensuels
    vitesse: jours à mois
    taille: macro
