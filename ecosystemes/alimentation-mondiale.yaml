theme: alimentation-mondiale
nom: Alimentation mondiale (cultures, engrais, prix)
declaration:
  but: comprendre ce qui fait les récoltes, les stocks et les prix alimentaires dans le monde, et ce qu'ils transmettent (inflation, tensions sociales, exportations interdites)
  limites: dedans les sols, l'eau, les cultures et leurs ravageurs, les engrais, les stocks, le commerce des grains, les prix ; l'élevage y entre comme fait écologique (pâturage, fumier, méthane, zoonoses)
    ; dehors la pêche en détail, la nutrition
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement
  date: '2026-11-19'
  espace: les grands bassins céréaliers (mer Noire, Amériques, Inde, Chine) et les pays importateurs
  temps: de la saison de culture à la décennie ; mémoire des crises de 2007-2008, 2010-2011 et 2022 (à vérifier)
  vitesse: la semaine (météo, marchés), la saison (récolte), l'année (stocks)
  taille: une parcelle, un bassin de production, le marché mondial
compartiments:
- id: sols
  organisation: mineral
  nom: Sols et terres cultivées
  elements:
  - fertilité
  - matière organique
  - érosion
  - salinisation
  - surfaces cultivées
  acteurs:
  - nom: une parcelle
    taille: micro
    espace: parcelle
    vitesse: saisons
    organisation: vegetal
    facette: non_humain
  - nom: un grand bassin céréalier
    taille: méso
    espace: région
    vitesse: années
    organisation: mineral
    facette: non_humain
  niveau:
    espace: parcelle à continent
    temps: saisons ; décennies
    vitesse: saisons à décennies
    taille: micro à macro
  traces:
  - source: indices de végétation par satellite (NDVI, données publiques)
    statut: a_brancher
- id: eau_agricole
  organisation: eau
  nom: Eau agricole
  elements:
  - pluie utile
  - irrigation
  - nappes
  - humidité du sol
  acteurs:
  - nom: une nappe phréatique
    taille: méso
    espace: bassin
    vitesse: années
    organisation: eau
    facette: non_humain
  niveau:
    espace: bassin versant
    temps: saison des pluies
    vitesse: semaines à années
    taille: méso
  traces:
  - source: humidité du sol et indices de sécheresse (données publiques)
    statut: a_brancher
- id: cultures
  organisation: vegetal
  nom: Cultures et récoltes
  elements:
  - blé
  - maïs
  - riz
  - soja
  - oléagineux
  - rendements
  acteurs:
