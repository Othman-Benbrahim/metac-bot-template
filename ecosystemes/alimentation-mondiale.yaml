    statut: a_brancher
relations:
- de: climat
  vers: eau_agricole
  effet: ±
  delai: semaines
  force: forte
  intensite:
    mesure: anomalie de pluie et de température de la saison
    regle: seuil
  coupure: irrigation
  statut: a_verifier
  texte: la saison décide de l'eau disponible ; une sécheresse ne compte qu'au-delà d'un seuil
- de: eau_agricole
  vers: cultures
  effet: +
  delai: semaines à saison
  force: forte
  intensite:
    mesure: déficit d'humidité du sol
    regle: seuil
  coupure: irrigation et variétés résistantes
  statut: a_verifier
  texte: sous un seuil d'eau, les rendements chutent d'un coup
- de: climat
  vers: cultures
  effet: '-'
  delai: jours à semaines
  force: moyenne
  intensite:
    mesure: jours de chaleur extrême pendant la floraison
    regle: seuil
  coupure: hors des stades sensibles
  statut: a_verifier
  texte: quelques jours de chaleur au mauvais moment suffisent à abîmer une récolte
- de: climat
  vers: ravageurs
  effet: +
  delai: semaines
  force: moyenne
  coupure: lutte précoce
  statut: a_verifier
  texte: chaleur et humidité favorisent criquets et maladies
- de: ravageurs
  vers: cultures
  effet: '-'
  retour: +
  delai: semaines
  force: moyenne
  coupure: traitements, veille
  statut: a_verifier
  texte: 'prédation : les ravageurs vivent des cultures'
- de: sols
  vers: cultures
  effet: +
  delai: saisons à décennies
  force: moyenne
  coupure: engrais compensant en partie
  statut: a_verifier
  texte: la fertilité des sols porte les rendements sur la durée
- de: cultures
  vers: sols
  effet: '-'
  delai: années
  force: faible
  intensite:
    mesure: intensité de l'exploitation
    regle: hysteresis
  coupure: rotations, jachères
  statut: a_verifier
  texte: une exploitation intensive épuise les sols, qui ne se refont pas au même rythme
- de: engrais
  vers: cultures
  effet: +
  delai: saison
  force: moyenne
  intensite:
    mesure: prix des engrais par rapport au prix des grains
    regle: seuil
  coupure: sols déjà riches
  statut: a_verifier
  texte: des engrais trop chers font moins épandre, et la récolte suivante baisse
- de: cultures
  vers: stocks
  effet: +
  delai: mois
  force: forte
  coupure: consommation en hausse
  statut: a_verifier
  texte: les récoltes remplissent les stocks
- de: stocks
  vers: prix
  effet: '-'
  delai: semaines
  force: forte
  intensite:
    mesure: rapport stocks sur consommation
    regle: saturation
  coupure: 'stocks bas : plus rien n''amortit'
  statut: a_verifier
  texte: des stocks abondants amortissent les chocs ; bas, chaque nouvelle fait bondir les prix
- de: commerce
  vers: prix
  effet: ±
  delai: jours à semaines
  force: forte
  intensite:
    mesure: nombre de pays qui restreignent leurs exportations
    regle: proportionnelle
  coupure: stocks des importateurs
  statut: a_verifier
  texte: les interdictions d'export s'entraînent l'une l'autre et font monter les prix mondiaux
- de: prix
  vers: commerce
  effet: ±
  retour: ±
  delai: semaines
  force: moyenne
  coupure: accords commerciaux
  statut: a_verifier
  texte: quand les prix montent, des exportateurs ferment leurs frontières pour protéger leur marché intérieur
- de: prix
  vers: importateurs
  effet: '-'
  delai: semaines à mois
  force: forte
  intensite:
    mesure: écart des prix à leur moyenne
    regle: seuil
  coupure: subventions, aide alimentaire
  statut: a_verifier
  texte: au-delà d'un seuil de prix, les ménages pauvres et les budgets publics décrochent (lien documenté avec les émeutes, à vérifier)
- de: prix
  vers: cultures
  effet: +
  delai: saison à année
  force: faible
  coupure: surfaces disponibles
  statut: a_verifier
  texte: des prix hauts font semer plus la saison suivante
- de: chimie_sols
  vers: cultures
  effet: +
  delai: saison
  force: forte
  intensite:
    mesure: élément le plus limitant (azote, phosphore ou potasse)
    regle: seuil
  coupure: apports d'engrais
  statut: a_verifier
  texte: 'le rendement suit l''élément qui manque le plus : abondants partout sauf un, il plafonne quand même'
- de: engrais
  vers: chimie_sols
  effet: +
  delai: saison
  force: forte
  intensite:
    mesure: doses épandues
    regle: saturation
  coupure: lessivage vers les rivières
  statut: a_verifier
  texte: les engrais remplissent le sol en nutriments, jusqu'à saturation ; l'excès part dans l'eau
- de: elevage
  vers: chimie_sols
  effet: +
  retour: +
  forme: mutualisme
  delai: saisons
  force: moyenne
  coupure: élevage hors-sol séparé des cultures
  statut: a_verifier
  texte: le fumier rend au sol l'azote et le phosphore que l'herbe a pris
- de: elevage
  vers: cultures
  effet: '-'
  retour: +
  delai: mois
  force: moyenne
  coupure: élevage à l'herbe
  statut: a_verifier
  texte: les troupeaux nourris aux grains entrent en concurrence avec l'alimentation humaine pour les récoltes
- de: pathogenes
  vers: elevage
  effet: '-'
  retour: +
  delai: semaines
  force: forte
  intensite:
    mesure: foyers déclarés
    regle: seuil
  coupure: abattages et vaccination
  statut: a_verifier
  texte: une épizootie décime les troupeaux ; au-delà d'un seuil de foyers, les abattages massifs coupent l'offre
- de: pathogenes
  vers: cultures
  effet: '-'
  retour: +
  delai: semaines
  force: moyenne
  intensite:
    mesure: humidité et chaleur de la saison
    regle: seuil
  coupure: variétés résistantes
  statut: a_verifier
  texte: une nouvelle souche de rouille ou de mildiou peut contourner les résistances d'une région entière
- de: pollinisateurs
  vers: cultures
  effet: +
  retour: +
  forme: mutualisme
  delai: saison
  force: moyenne
  coupure: céréales pollinisées par le vent
  statut: a_verifier
  texte: les pollinisateurs font les fruits et les oléagineux, et vivent des fleurs (au sein du vivant, entre animal et végétal)
