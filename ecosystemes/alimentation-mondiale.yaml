    vertébrés menacés d'extinction, 30 % sur les îles (IPBES, évaluation des pollinisateurs, février 2016 ; ajout du
    2026-11-22, fiche biodiversite-sols)
  acteurs:
  - nom: une colonie d'abeilles
    taille: micro
    espace: site
    vitesse: saisons
    organisation: animal
    facette: non_humain
  niveau:
