    taille: micro
    espace: parcelle
    vitesse: saison
    organisation: vegetal
    facette: non_humain
  - nom: la récolte d'un grand exportateur
    taille: macro
    espace: pays
    vitesse: saison
    organisation: vegetal
    facette: non_humain
  niveau:
    espace: parcelle à continent
    temps: calendriers culturaux
    vitesse: saison
    taille: micro à macro
  traces:
  - source: stocks mondiaux de blé prévus en fin de campagne (USDA PSD, comme le WASDE)
    statut: collecte
    fichier: collecte_series_publiques.py
    adaptateur: pub:psd_ble_stocks
  - source: production mondiale de maïs prévue (USDA PSD)
    statut: collecte
    fichier: collecte_series_publiques.py
    adaptateur: pub:psd_mais_production
- id: ravageurs
