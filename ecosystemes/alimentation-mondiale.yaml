    temps: saisons
    vitesse: semaines à saisons
    taille: méso à macro
  traces:
  - source: anomalie de température à Delhi (GHCN-Daily, station au sol)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:delhi
  - source: anomalie de température à Shanghai (GHCN-Daily, station au sol)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:shanghai
- id: importateurs
