theme: eau-moyen-orient
nom: Eau au Moyen-Orient
declaration:
  but: comprendre ce qui rend l'eau douce rare au Moyen-Orient, comment elle circule entre fleuves, nappes, barrages et usines de dessalement, et ce que sa rareté transmet (récoltes, contestation, tensions
    entre États d'amont et d'aval)
  limites: dedans les pluies, les fleuves (Tigre, Euphrate, Nil, Jourdain), les nappes, les barrages, le dessalement, l'irrigation, les villes ; dehors la qualité sanitaire de l'eau en détail et l'Afrique
    hors du Nil
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement
  date: '2026-11-19'
  espace: le Croissant fertile, le plateau iranien, la péninsule Arabique, la vallée du Nil
  temps: de la saison des pluies à la décennie (épuisement des nappes) ; mémoire de la sécheresse syrienne de 2006-2010 (à vérifier)
  vitesse: la saison (pluies, crues), l'année (remplissage des barrages), la décennie (nappes fossiles)
  taille: un puits, un bassin versant, une région
