# Codes officiels des indicateurs des Objectifs de développement durable (ODD) cités dans les traces des fiches
# (décision de l'auteur du 2026-11-22, 4 h 16 : « étape 1 », étiquetage seulement, aucune collecte).
# Libellés recopiés du cadre mondial d'indicateurs en vigueur : Global indicator framework for the Sustainable
# Development Goals, A/RES/71/313, mis à jour jusqu'à E/CN.3/2025/6 (revue complète de 2025),
# https://unstats.un.org/sdgs/indicators/Global-Indicator-Framework-after-2025-review-English.pdf, consulté le 2026-11-22.
# Les libellés longs sont abrégés à la fin (« … »). Un code n'entre ici qu'après vérification dans ce document ;
# le validateur des fiches refuse un code de trace absent de ce fichier.
source: Global indicator framework for the SDGs, A/RES/71/313 (mis à jour par E/CN.3/2025/6)
consulte: '2026-11-22'
indicateurs:
  "1.1.1": "Proportion of the population living below the international poverty line by sex, age, employment status and geographic location (urban/rural)"
  "1.3.1": "Proportion of population covered by social protection floors/systems, by sex, distinguishing children, unemployed persons, older persons, persons with disabilities, pregnant women, newborns, work-injury victims and the poor and the vulnerable"
  "2.1.1": "Prevalence of undernourishment"
  "2.1.2": "Prevalence of moderate or severe food insecurity in the population, based on the Food Insecurity Experience Scale (FIES)"
  "3.6.1": "Death rate due to road traffic injuries"
  "3.8.1": "Coverage of essential health services"
  "3.9.1": "Mortality rate attributed to household and ambient air pollution"
  "6.1.1": "Proportion of population using safely managed drinking water services"
  "6.2.1": "Proportion of population using (a) safely managed sanitation services and (b) a hand-washing facility with soap and water"
  "7.1.1": "Proportion of population with access to electricity"
  "7.1.2": "Proportion of population with primary reliance on clean fuels and technology"
  "8.3.1": "Proportion of informal employment in total employment, by sector and sex"
  "8.5.2": "Unemployment rate, by sex, age and persons with disabilities"
  "8.6.1": "Proportion of youth (aged 15–24 years) not in education, employment or training"
  "9.1.2": "Passenger and freight volumes, by mode of transport"
  "10.1.1": "Growth rates of household expenditure or income per capita among the bottom 40 per cent of the population and the total population"
  "10.4.2": "Redistributive impact of fiscal policy on the Gini index"
  "11.1.1": "Proportion of urban population living in slums, informal settlements or inadequate housing"
  "11.2.1": "Proportion of population that has convenient access to public transport, by sex, age and persons with disabilities"
  "11.3.1": "Ratio of land consumption rate to population growth rate"
  "11.6.2": "Annual mean levels of fine particulate matter (e.g. PM2.5 and PM10) in cities (population weighted)"
  "14.4.1": "Proportion of fish stocks within biologically sustainable levels"
  "14.5.1": "Coverage of protected areas in relation to marine areas"
  "15.1.2": "Proportion of important sites for terrestrial and freshwater biodiversity that are covered by protected areas, by ecosystem type"
  "15.3.1": "Proportion of land that is degraded over total land area"
  "15.5.1": "Red List Index"
  "15.8.1": "Proportion of countries adopting relevant national legislation and adequately resourcing the prevention or control of invasive alien species"
