# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: asie-centrale
nom: Asie centrale
declaration:
  but: comprendre l'Asie centrale comme un espace enclavé entre la Russie, la Chine, l'Afghanistan et l'Iran, riche en uranium,
    gaz et minerais, qui diversifie ses partenaires
  limites: dedans le Kazakhstan, l'Ouzbékistan, le Turkménistan, le Kirghizistan, le Tadjikistan, leurs partenaires (Russie,
    Chine, États-Unis, Turquie, Union européenne), l'eau, l'énergie et les minerais, les migrations de travail ; dehors l'Afghanistan
    (asie-du-sud), sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: les cinq républiques, de la Caspienne au Pamir
  temps: de la saison (eau d'irrigation) à la décennie
  vitesse: le mois (sommets), l'année (récoltes de coton)
  taille: une vallée, un État, la région
