theme: "crises-bancaires"
nom: "Banques, entreprises et finance (crises, faillites, confiance)"
declaration:
  but: "comprendre comment une banque, une entreprise ou un actif financier bascule de la confiance à la panique, et ce que la crise transmet ; questions du tournoi au niveau du mécanisme : une banque en difficulté au Paraguay, une faillite d'enseigne de distribution, le cours d'une société détentrice de bitcoins"
  limites: "dedans les dépôts et les ruées, les bilans des banques, les faillites et leurs créanciers, les marchés et les cryptomonnaies, les régulateurs et les prêteurs en dernier ressort, la psychologie de la confiance ; dehors la politique monétaire générale et la dette des États (fiches inflation-mondiale et dette-emergents)"
  observateur: "notre carte, regard extérieur, données publiques seulement ; aucune personne privée"
  date: "2026-11-19"
  espace: "une agence, une banque, un pays, le marché mondial"
  temps: "de la séance au cycle de crédit ; mémoire des crises de 1929, 2008, 2023 (à vérifier)"
  vitesse: "l'heure (une ruée en ligne), la semaine (une faillite), l'année (un cycle de crédit)"
  taille: "micro (un déposant, une enseigne) à macro (le système financier)"
compartiments:
  - id: "depots"
    nom: "Dépôts et liquidité des banques"
    organisation: "economie"
    elements: ["dépôts à vue", "retraits", "réserves de liquidité", "garantie des dépôts"]
    acteurs:
      - {nom: "un déposant", taille: "micro", espace: "local", vitesse: "heures", organisation: "economie", facette: "personne"}
      - {nom: "une banque régionale", taille: "méso", espace: "pays", vitesse: "jours", organisation: "economie", facette: "collectif"}
    niveau: {espace: "banque à pays", temps: "jours", vitesse: "heures à semaines", taille: "micro à méso"}
    traces:
      - {source: "dépôts des banques commerciales américaines (FRED DPSACBW027SBOG), variation sur un an", statut: "collecte", adaptateur: "fred:DPSACBW027SBOG:var52"}
  - id: "confiance"
    nom: "Confiance et panique"
    organisation: "psychologique"
    elements: ["peur de perdre", "rumeur", "imitation", "aversion à la perte"]
    acteurs:
      - {nom: "la foule des déposants", taille: "méso", espace: "pays", vitesse: "heures", organisation: "psychologique", facette: "psyche"}
    niveau: {espace: "pays", temps: "heures à semaines", vitesse: "heures", taille: "micro à méso"}
    traces:
      - {source: "volatilité implicite du S&P 500 (VIX, FRED VIXCLS) : la peur qui se lit sur les marchés", statut: "collecte", adaptateur: "fred:VIXCLS"}
      - {source: "attention médiatique et recherches en ligne sur une banque", statut: "a_brancher"}
  - id: "bilans"
    nom: "Bilans et pertes"
    organisation: "economie"
    elements: ["prêts douteux", "pertes sur obligations quand les taux montent", "fonds propres"]
    niveau: {espace: "banque", temps: "trimestres", vitesse: "mois", taille: "méso"}
    traces:
      - {source: "taux américain à 10 ans (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DGS10"}
  - id: "faillites"
    nom: "Faillites d'entreprises"
    organisation: "statut"
    elements: ["procédures collectives", "comités de créanciers", "liquidation ou reprise"]
    acteurs:
      - {nom: "une enseigne de distribution en difficulté", taille: "méso", espace: "pays", vitesse: "semaines", organisation: "economie", facette: "collectif"}
      - {nom: "un tribunal des faillites", taille: "méso", espace: "juridiction", vitesse: "semaines", organisation: "statut", facette: "collectif"}
    niveau: {espace: "juridiction", temps: "procédures de mois", vitesse: "semaines à mois", taille: "méso"}
    traces:
      - {source: "dossiers judiciaires publics (CourtListener)", statut: "collecte", fichier: "collecte_tribunaux.py"}
  - id: "creanciers"
    nom: "Créanciers"
    organisation: "economie"
    elements: ["prêteurs", "fournisseurs impayés", "porteurs d'obligations"]
    niveau: {espace: "pays à mondial", temps: "procédures", vitesse: "semaines", taille: "méso"}
    traces:
      - {source: "dossiers judiciaires publics (CourtListener)", statut: "collecte", fichier: "collecte_tribunaux.py"}
  - id: "marches"
    nom: "Marchés financiers"
    organisation: "economie"
    elements: ["actions", "obligations", "écarts de crédit", "volatilité"]
    acteurs:
      - {nom: "les fonds et les investisseurs", taille: "méso", espace: "mondial", vitesse: "minutes", organisation: "economie", facette: "collectif"}
    niveau: {espace: "mondial", temps: "séances", vitesse: "minutes à jours", taille: "macro"}
    traces:
      - {source: "indice large du dollar (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DTWEXBGS"}
  - id: "cryptomonnaies"
    nom: "Cryptomonnaies et sociétés exposées"
    organisation: "economie"
    elements: ["bitcoin", "sociétés qui en détiennent en réserve", "effet de levier", "plateformes d'échange"]
    acteurs:
      - {nom: "une société cotée détentrice de bitcoins", taille: "méso", espace: "mondial", vitesse: "jours", organisation: "economie", facette: "collectif"}
    niveau: {espace: "mondial", temps: "continu, sans fermeture", vitesse: "minutes", taille: "méso"}
    traces:
      - {source: "cours du bitcoin (Coinbase, via FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:CBBTCUSD"}
  - id: "regulateurs"
    nom: "Régulateurs et prêteurs en dernier ressort"
    organisation: "statut"
    elements: ["superviseurs bancaires", "banque centrale", "garantie des dépôts", "plans de sauvetage"]
    acteurs:
      - {nom: "la banque centrale d'un pays", taille: "macro", espace: "pays", vitesse: "jours", organisation: "statut", facette: "collectif"}
      - {nom: "la doctrine du sauvetage (« trop gros pour faire faillite »)", taille: "macro", espace: "mondial", vitesse: "années", organisation: "ideologie", facette: "ideologie"}
    niveau: {espace: "pays", temps: "réunions et décisions datées", vitesse: "jours à semaines", taille: "macro"}
    traces:
      - {source: "taux effectif de la Réserve fédérale (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DFF"}
  - id: "convention"
    nom: "Conventions (définition du défaut, notations, règles comptables)"
    organisation: "convention"
    elements: ["déclaration de faillite", "notation", "règles de valorisation"]
    niveau: {espace: "juridiction", temps: "décisions datées", vitesse: "jours", taille: "méso à macro"}
    traces:
      - {source: "communiqués publics des agences de notation", statut: "a_brancher"}
  - id: "recits"
    nom: "Récits et réseaux sociaux"
    organisation: "ideologie"
    elements: ["rumeurs en ligne", "articles de presse", "messages de dirigeants"]
    niveau: {espace: "médiatique", temps: "heures", vitesse: "heures", taille: "micro à macro"}
    traces:
      - {source: "flux RSS de presse", statut: "collecte", fichier: "collecte_rss.py"}
relations:
  - {de: "confiance", vers: "depots", effet: "-", delai: "heures", force: "forte", intensite: {mesure: "vitesse des retraits", regle: "seuil"}, coupure: "garantie des dépôts crédible", statut: "a_verifier", texte: "au-delà d'un seuil de peur, les déposants retirent tous ensemble : la ruée"}
  - {de: "depots", vers: "confiance", effet: "+", delai: "heures", force: "forte", coupure: "fermeture temporaire des guichets", statut: "a_verifier", texte: "les retraits des autres font peur à leur tour : boucle de la panique, propre au niveau psychologique et économique"}
  - {de: "recits", vers: "confiance", effet: "-", delai: "heures", force: "moyenne", intensite: {mesure: "volume de rumeurs sur une banque", regle: "seuil"}, coupure: "démenti crédible d'une autorité", statut: "a_verifier", texte: "une rumeur ne déclenche la peur que si elle dépasse un seuil de diffusion"}
  - {de: "bilans", vers: "confiance", effet: "-", delai: "jours", force: "moyenne", coupure: "recapitalisation", statut: "a_verifier", texte: "des pertes révélées entament la confiance"}
  - {de: "marches", vers: "bilans", effet: "-", delai: "semaines", force: "moyenne", intensite: {mesure: "montée des taux longs", regle: "proportionnelle"}, coupure: "titres conservés jusqu'à l'échéance", statut: "a_verifier", texte: "quand les taux montent, les obligations détenues perdent de la valeur"}
  - {de: "regulateurs", vers: "depots", effet: "+", delai: "jours", force: "forte", coupure: "manque de crédibilité ou de moyens", statut: "a_verifier", texte: "le prêteur en dernier ressort et la garantie des dépôts arrêtent la ruée"}
  - {de: "depots", vers: "regulateurs", effet: "+", delai: "jours", force: "forte", intensite: {mesure: "taille de la banque menacée", regle: "seuil"}, coupure: "petite banque laissée à la liquidation", statut: "a_verifier", texte: "l'autorité n'intervient qu'au-delà d'un seuil de risque pour le système"}
  - {de: "faillites", vers: "creanciers", effet: "-", retour: "±", delai: "semaines", force: "forte", coupure: "reprise de l'entreprise", statut: "a_verifier", texte: "une faillite répartit les pertes entre créanciers selon leur rang (relation propre au niveau statut et économie)"}
  - {de: "creanciers", vers: "faillites", effet: "±", delai: "semaines", force: "moyenne", coupure: "décision du tribunal", statut: "a_verifier", texte: "le comité des créanciers pèse sur l'issue : liquidation ou plan de reprise"}
  - {de: "cryptomonnaies", vers: "marches", effet: "±", delai: "jours", force: "faible", intensite: {mesure: "chute du bitcoin", regle: "seuil"}, coupure: "faible exposition des banques", statut: "a_verifier", texte: "une forte chute ne déborde sur les marchés que si l'exposition dépasse un seuil"}
  - {de: "marches", vers: "cryptomonnaies", effet: "+", delai: "jours", force: "moyenne", intensite: {mesure: "appétit pour le risque", regle: "proportionnelle"}, coupure: "inconnue", statut: "a_verifier", texte: "les cryptomonnaies suivent l'appétit général pour le risque, en l'amplifiant"}
  - {de: "convention", vers: "creanciers", effet: "-", delai: "jours", force: "forte", intensite: {mesure: "franchissement d'une note ou d'une définition", regle: "seuil"}, coupure: "inconnue", statut: "a_verifier", texte: "une déclaration de défaut ou une dégradation déclenche des ventes forcées : la convention agit sans que rien de matériel n'ait changé"}
  - {de: "depots", vers: "marches", effet: "-", delai: "jours", force: "moyenne", intensite: {mesure: "nombre de banques touchées", regle: "seuil"}, coupure: "isolement de la banque fautive", statut: "a_verifier", texte: "contagion : quand plusieurs banques vacillent, la crise passe au système"}
  - {de: "regulateurs", vers: "confiance", effet: "+", delai: "jours", force: "moyenne", coupure: "doute sur les moyens de l'autorité", statut: "a_verifier", texte: "une parole d'autorité crédible rassure, une parole hésitante aggrave"}
ponts:
  - {depuis: "depots", vers: "dette-emergents:banques", nature: "les banques des pays endettés en devises", type: "meme"}
  - {depuis: "regulateurs", vers: "inflation-mondiale:banques_centrales", nature: "la banque centrale prête en dernier ressort et fixe les taux"}
  - {depuis: "marches", vers: "politique-americaine:reserve_federale", nature: "les marchés réagissent à la Réserve fédérale"}
  - {depuis: "cryptomonnaies", vers: "sciences-techniques:calcul", nature: "le minage consomme du calcul et de l'énergie"}
  - {depuis: "recits", vers: "information-cyber:cyber", nature: "rumeurs en ligne et attaques informatiques contre les banques"}
  - {depuis: "faillites", vers: "calendriers-echeances:publications", nature: "les échéances de procédure et de publication des comptes"}
