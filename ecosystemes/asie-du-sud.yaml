theme: asie-du-sud
nom: Asie du Sud (Inde, Pakistan, Afghanistan, Bangladesh)
declaration:
  but: 'comprendre les rivalités et les équilibres de l''Asie du Sud : deux puissances nucléaires en conflit ouvert en mai
    2025 (Inde et Pakistan), un front ouvert entre le Pakistan et l''Afghanistan des talibans depuis février 2026, le
    traité des eaux de l''Indus suspendu en partie par l''Inde, l''Inde première croissance des grandes économies,
    l''alternance au Bangladesh'
  limites: dedans l'Inde, le Pakistan, l'Afghanistan, le Bangladesh, leurs conflits, leurs eaux partagées, leurs
    puissances alliées vues depuis la région ; dehors la dissuasion vue comme régime mondial (non-proliferation), la Chine
    vue de l'intérieur (economie-chinoise), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (USIP, presse, Long War Journal, statistiques officielles)
    ; aucune personne privée
  date: '2026-11-22'
  espace: le pays, la frontière, la région
  temps: du jour (une frappe, un attentat) à la décennie (Cachemire, nappes, croissance)
  vitesse: le jour (frappes, accrochages), le mois (cessez-le-feu, élections), l'année (croissance, eaux)
  taille: micro (un poste-frontière) à macro (la région)
