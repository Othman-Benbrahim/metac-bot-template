# Acteurs nommés et leurs réseaux (bot 0.10.444, ombre). Décision de l'auteur du 2026-11-22, 7 h 41 et 7 h 49 :
# « nommer les acteurs conjoncturels qui changent de façon cyclique, à côté des mécanismes durables » (chefs d'État,
# grands patrons, autres acteurs importants), leurs réseaux (hypothèse de l'auteur : réseau et influence), le niveau des
# liens (1 proche, 2 voisin, 3 éloigné, au sens de la distance dans le graphe : calculé sur la carte, jamais écrit à la
# main) et ce qui les relie à la population (pouvoir, hiérarchie, gouvernance par une institution, information). Premier
# lot choisi par l'auteur (7 h 50) : dirigeants et patrons.
#
# Règles (permanentes du dépôt) : personnalités publiques dans leur rôle public seulement ; aucune inférence
# psychologique ou médicale ; chaque acteur et chaque lien a au moins une source avec adresse ; « lecture » dit si la
# source a été lue (lu) ou seulement repérée par son titre dans une recherche (titre : à recouper). Une allégation (procès
# en cours, accusation) est écrite comme telle, jamais comme un fait établi. « influence_documentee » (manipulation) n'est
# admise qu'avec une source officielle, judiciaire ou une enquête nommée.
#
# Un acteur nommé est CONJONCTUREL : il occupe une fonction pendant une phase d'un cycle (mandat, direction d'entreprise) ;
# le rôle durable reste l'acteur générique de la fiche (« role_generique », facultatif) et le compartiment de rattachement.
#
# relations entre acteurs : nomme (A désigne B à une fonction), commande (A est au-dessus de B dans une hiérarchie),
#   allie (soutien public réciproque), rival (concurrence ouverte pour un même pouvoir), negocie_avec (rencontres,
#   accords), finance (argent déclaré ou rapporté de A vers B ou son camp), associe (cofondateurs, partenaires d'affaires),
#   fournit (contrats de l'entreprise de A avec l'administration de B), desaccord_public (désaccord exprimé publiquement).
# relations vers la population (le « vers » est un compartiment) : gouverne (par une institution, champ « via »),
#   elu_par (désigné ou jugé par le vote ou l'opinion), informe (possède ou dirige un média ou une plateforme),
#   influence_documentee (campagne d'influence établie par une autorité, une justice ou une enquête nommée).
