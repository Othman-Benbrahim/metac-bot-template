  # ---------------------------------------------------------------- lot 7 : calendriers et humain (piste écosystémique)
  - id: effet_d_echeance_negociation
    ecosysteme: "Négociations à échéance (accords, contrats, compromis)"
    espace: monde
    echelle: {axe: temps, tranche: "dernière part du délai"}
    structure: contexte
    objet: "conclusion d'un accord négocié avant une date limite"
    perimetre: [monde]
    compartiments: [calendriers-echeances:dates_limites, calendriers-echeances:anticipations]
    regle: "Effet d'échéance : les accords se concentrent juste avant la date limite. En laboratoire, 41 % des accords tombent dans les derniers 10 % du temps quand le délai est long (10 minutes), 73 % quand il est court (90 secondes) ; sous forte pression, la moitié des accords se fait dans les cinq dernières secondes, mais les désaccords sont aussi plus nombreux. Les accords de dernière minute sont fréquents dans les négociations internationales et salariales (affirmé sans chiffre de terrain). Pour une question « accord avant telle date » : l'absence d'accord loin de l'échéance dit peu ; l'approche de l'échéance est le moment décisif, et l'issue reste souvent le désaccord."
    parametres: {part_accords_derniers_10pct_delai_long: 0.41, part_accords_derniers_10pct_delai_court: 0.73, terrain: non_chiffre}
    sources:
      - {titre: "Karagözoğlu et Kocher, Bargaining under time pressure from deadlines, Experimental Economics 22(2), 2019", url: "https://www.cambridge.org/core/journals/experimental-economics/article/bargaining-under-time-pressure-from-deadlines/F388EC46629F094DDB48A96AE00F8DCC", consulte: "2026-11-21"}
      - {titre: "Roth, Murnighan et Schoumaker, The deadline effect in bargaining: some experimental evidence, American Economic Review 78(4), 1988 (référence fondatrice ; résumé non consulté)", url: "https://ideas.repec.org/a/aea/aecrev/v78y1988i4p806-23.html", consulte: "2026-11-21"}
    statut: source

  - id: referendums_retour_statu_quo
    ecosysteme: "Référendums · dynamique de campagne"
    espace: monde
    echelle: {axe: temps, tranche: "campagne référendaire"}
    structure: contexte
    objet: "victoire du changement à un référendum"
    perimetre: [monde]
    compartiments: [humain:risque_percu, calendriers-echeances:elections]
    regle: "Le soutien au changement baisse en général pendant la campagne : dans 28 des 37 référendums anglophones étudiés depuis 1990, avec une moyenne de 62 % dans les premiers sondages, 57 % dans les derniers et 52 % au résultat ; chez LeDuc, 17 référendums sur 23 voient l'opinion s'éloigner du oui, avec des déplacements moyens de 17 points ; les reculs du changement sont plus grands que ses progrès. Exception : quand le non devient l'option risquée (le « point de retour » est jugé dangereux), le mouvement peut s'inverser. Les campagnes très liées aux positions des partis sont moins volatiles."
    parametres: {cas_baisse_changement: "28/37", soutien_moyen: {premiers_sondages: 62, derniers_sondages: 57, resultat: 52}, leduc_cas: "17/23", deplacement_moyen_points: 17}
    sources:
