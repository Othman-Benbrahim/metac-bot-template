    regle: "Mesuré sur 240 élections législatives depuis 2000 (ParlGov) : le premier en voix est aussi premier en sièges dans 95% des cas ; à la proportionnelle de liste, 98.2% (164 élections) : 95.3% quand les deux premiers sont à moins de 3 points (43 cas), 99.2% au-delà (121 cas). Quand ils divergent, le premier en sièges est le deuxième en voix dans 11 cas sur 12. Mixte compensatoire : 19 élections, aucun désaccord, mais moins de 30 cas par tranche : on applique les taux de l'ensemble. Système de l'élection lu dans le relevé IPU de 2026 (approximation : un pays peut avoir changé de système depuis 2000)."
