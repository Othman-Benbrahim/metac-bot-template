  - id: schengen_controles_interieurs
    ecosysteme: "Union européenne · contrôles temporaires aux frontières intérieures de Schengen"
    espace: europe
    echelle: {axe: temps, tranche: "semestre"}
    structure: procedure
    objet: "levée ou prolongation d'un contrôle temporaire aux frontières intérieures de Schengen"
    perimetre: [europe]
    compartiments: [securite-publique:frontieres]
    regle: "Code frontières Schengen : pour un événement imprévisible, contrôle immédiat d'un mois au plus, prolongeable jusqu'à 3 mois ; pour un événement prévisible, 6 mois renouvelables par périodes de 6 mois au plus, jusqu'à 2 ans (3 ans en situation exceptionnelle majeure), avec notification 4 semaines à l'avance et évaluation des risques après 6 mois. Un contrôle se lève à l'échéance d'une période ou par une décision de l'État ; l'échéance de la période notifiée est la date à regarder."
    parametres: {imprevisible_mois: [1, 3], previsible_periode_mois: 6, previsible_max_ans: 2, exceptionnel_max_ans: 3}
    sources:
      - {titre: "Commission européenne (DG HOME), Temporary reintroduction of border control", url: "https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/temporary-reintroduction-border-control_en", consulte: "2026-11-21"}
    statut: source

