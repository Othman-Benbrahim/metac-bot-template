# Règles coutumières par écosystème et par échelle (lot 1 : élections américaines, inertie des régimes fermés ;
# lot 2 : Europe et erreur des sondages comparée).
# Décisions de l'auteur du 2026-11-19 (22 h 43 à 22 h 59) : ne pas déduire ; écrire les règles telles qu'elles existent,
# chacune avec sa source ; sans source, la case reste vide (« absence ») et la brique s'abstient. Pour les régimes
# opaques : privilégier la règle d'inertie. Ce fichier n'est pas une fiche (pas de clé « theme ») : regles_coutumieres.py
# le lit et le valide.
#
# Champs : id · ecosysteme · espace · echelle {axe, tranche} · structure (course | seuil | procedure | evenement_rare |
# maintien) · regle (texte) · parametres (lisibles par le programme) · sources [{titre, url, consulte}] · statut
# (source | auteur | absence) · aide (ce que l'auteur pourrait apporter quand la règle manque).
regles:

  # ---------------------------------------------------------------- États-Unis : élections
  - id: us_president_college
    ecosysteme: "États-Unis · élection présidentielle"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: national}
    structure: course
    regle: "Le président est élu par le collège électoral : 270 voix sur 538. Dans 48 États et à Washington DC, le candidat arrivé en tête prend toutes les voix de l'État ; le Maine et le Nebraska répartissent une partie de leurs voix par circonscription."
    parametres: {voix_total: 538, voix_pour_gagner: 270, repartition_par_circonscription: [ME, NE]}
    sources:
      - {titre: "National Archives, What is the Electoral College?", url: "https://www.archives.gov/electoral-college/about", consulte: "2026-11-19"}
    statut: source

  - id: us_primaires_second_tour
    ecosysteme: "États-Unis · primaires d'État (Congrès, gouverneur, offices d'État)"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: primaire}
    structure: course
    regle: "Second tour entre les deux premiers si personne n'atteint le seuil de l'État : majorité (plus de 50 %) en Alabama, Arkansas, Géorgie, Mississippi, Oklahoma, Caroline du Sud et Texas ; 30 % plus une voix en Caroline du Nord ; plus de 35 % au Dakota du Sud, seulement pour le Congrès et le gouverneur et seulement avec au moins trois candidats ; en Louisiane, à partir de 2026, majorité pour le Congrès, la Cour suprême de l'État, le BESE et la Public Service Commission. Ailleurs, la majorité relative suffit (le premier gagne)."
    parametres:
      seuil_second_tour: {AL: 50, AR: 50, GA: 50, MS: 50, OK: 50, SC: 50, TX: 50, NC: 30, SD: 35, LA: 50}
      conditions: {SD: "au moins 3 candidats ; Congrès et gouverneur seulement", LA: "depuis 2026 ; Congrès, Cour suprême de l'État, BESE, Public Service Commission", NC: "30 % plus une voix"}
      defaut: majorite_relative
    sources:
      - {titre: "Ballotpedia, Runoff election (primary runoffs by state)", url: "https://ballotpedia.org/Runoff_primary", consulte: "2026-11-19"}
      - {titre: "Ballotpedia, Primary election vote requirements by state", url: "https://ballotpedia.org/Primary_election_vote_requirements_by_state", consulte: "2026-11-19"}
    statut: source

  - id: us_primaires_systemes_speciaux
    ecosysteme: "États-Unis · primaires non partisanes et vote préférentiel"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: primaire}
    structure: course
    regle: "Californie et État de Washington : primaire à deux qualifiés (les deux premiers, tous partis confondus, vont à l'élection générale). Alaska : primaire à quatre qualifiés, puis élection générale au vote préférentiel. Maine : vote préférentiel. Nebraska : deux qualifiés pour la seule législature d'État. Dans ces systèmes, « gagner la primaire » ne veut pas dire la même chose qu'ailleurs : la brique s'abstient tant que la règle de calcul propre (qualification, transferts de voix) n'est pas écrite."
    parametres: {deux_qualifies: [CA, WA], quatre_qualifies: [AK], vote_preferentiel: [ME, AK], deux_qualifies_legislature: [NE]}
    sources:
      - {titre: "Ballotpedia, Primary election vote requirements by state", url: "https://ballotpedia.org/Primary_election_vote_requirements_by_state", consulte: "2026-11-19"}
    statut: source

  - id: us_erreur_sondages_par_echelle
    ecosysteme: "États-Unis · sondages électoraux"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: "toutes (par type d'élection)"}
    structure: course
    regle: "Erreur moyenne des sondages sur l'ÉCART entre les deux premiers, sondages des 21 derniers jours, 1998-2018 : présidentielle générale 4,0 points ; primaires présidentielles 8,7 ; Sénat 5,4 ; gouverneur 5,4 ; Chambre 6,2 ; ensemble 5,9. Cycle 2023-2024 : présidentielle générale 3,4, Sénat 4,1, ensemble 4,5 ; les primaires présidentielles sont le seul type au-dessus de la moyenne. Conversion pour une PART de candidat (hypothèse écrite, pas une source) : erreur sur l'écart ≈ 2 × erreur sur la part ; erreur moyenne absolue ≈ 0,8 σ ; donc σ(part) ≈ erreur sur l'écart / 1,6."
    parametres:
      erreur_ecart_points: {presidentielle_generale: 4.0, primaire_presidentielle: 8.7, senat: 5.4, gouverneur: 5.4, chambre: 6.2, ensemble: 5.9}
      erreur_ecart_points_2024: {presidentielle_generale: 3.4, senat: 4.1, ensemble: 4.5}
      fenetre_jours: 21
      conversion_sigma_part: 1.6
    sources:
      - {titre: "FiveThirtyEight, The Polls Are All Right (2018), table des erreurs par type d'élection 1998-2018", url: "https://www.goodreads.com/author_blog_posts/16871327-the-polls-are-all-right", consulte: "2026-11-19"}
      - {titre: "Nate Silver, So, how did the polls do in 2024? It's complicated", url: "https://www.natesilver.net/p/so-how-did-the-polls-do-in-2024-its", consulte: "2026-11-19"}
    statut: source

  - id: us_erreur_primaires_d_etat
    ecosysteme: "États-Unis · sondages des primaires d'État (gouverneur, Sénat, Chambre)"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: primaire_infranationale}
    structure: course
    regle: "Erreur habituelle des sondages de primaires d'État : aucune source chiffrée trouvée. Les primaires présidentielles (8,7 points sur l'écart) ne sont pas homologues (échelle nationale, sondages plus nombreux)."
    parametres: {}
    sources: []
    statut: absence
    aide: "une étude ou une base qui chiffre l'erreur des sondages de primaires de gouverneur, de Sénat ou de Chambre"

  - id: us_erreur_selon_temps_restant
    ecosysteme: "Élections nationales (45 pays, dont les États-Unis) · sondages, éloignement du scrutin"
    espace: monde
    echelle: {axe: temps, tranche: "jours avant le vote"}
    structure: course
    regle: "Erreur absolue moyenne par parti ou candidat, sondages nationaux : près de 4 points entre 150 et 200 jours avant le vote, environ 3 points à 50 jours, moins de 2 points la veille. À 200 jours : 3,3 points pour les législatives, 5,9 pour les présidentielles ; l'écart se réduit sans disparaître. Remplace la formule σ·√(1 + t/30) du préenregistrement etalon-scrutin, qui était une invention de Claude (lot 1). Ne vaut pas pour les primaires ni pour les scrutins locaux (sondages nationaux seulement)."
    parametres: {erreur_part_points: {j150_200: 4.0, j50: 3.0, veille: 2.0}, erreur_part_j200: {legislatives: 3.3, presidentielles: 5.9}}
    sources:
      - {titre: "Jennings et Wlezien, Election polling errors across time and space, Nature Human Behaviour 2(4), 2018, figure 1", url: "https://eprints.soton.ac.uk/421260/1/JenningsWlezien_PollingErrors.pdf", consulte: "2026-11-19"}
    statut: source

  - id: us_avantage_sortant_congres
    ecosysteme: "États-Unis · Congrès, sortants qui se représentent"
    espace: amerique_du_nord
    echelle: {axe: taille, tranche: "national (Chambre, Sénat)"}
    structure: maintien
    regle: "Part des sortants réélus parmi ceux qui se représentent, 2000-2022 : Chambre 93,9 % en moyenne (de 85,4 % en 2010 à 97,8 %) ; Sénat 86,9 % (de 78,6 % à 100 %). Défaites en primaire : 72 à la Chambre et 6 au Sénat sur ces douze cycles."
    parametres: {reelection_chambre: 0.939, reelection_senat: 0.869, defaites_primaires_chambre_2000_2022: 72, defaites_primaires_senat_2000_2022: 6, cycles: 12}
    sources:
      - {titre: "Brookings, Vital Statistics on Congress, table 2-7 (Chambre)", url: "https://www.brookings.edu/wp-content/uploads/2024/11/2-7-Full.pdf", consulte: "2026-11-19"}
      - {titre: "Brookings, Vital Statistics on Congress, table 2-8 (Sénat)", url: "https://www.brookings.edu/wp-content/uploads/2024/11/2-8-Full.pdf", consulte: "2026-11-19"}
    statut: source

  # ---------------------------------------------------------------- régimes fermés : la règle d'inertie
  - id: regimes_fermes_inertie
    ecosysteme: "Régimes autoritaires et fermés · maintien du dirigeant"
    espace: monde
    echelle: {axe: temps, tranche: "fenêtre d'une question (semaines à mois)"}
    structure: maintien
    regle: "Règle d'inertie : dans un régime fermé, le dirigeant reste au pouvoir et les manifestations sont étouffées ; les basculements (alternances inattendues) sont des cas limites. La probabilité de départ dans la fenêtre d'une question part donc de très bas et ne monte qu'avec des faits datés (mort, coup d'État en cours, défection de l'armée)."
    parametres: {a_priori: tres_bas}
    sources:
      - {titre: "Règle de l'auteur du projet (2026-11-19, 22 h 59)", url: "", consulte: "2026-11-19"}
    statut: auteur

  - id: regimes_fermes_contestation
    ecosysteme: "Régimes autoritaires et fermés · succès des campagnes de contestation"
    espace: monde
    echelle: {axe: temps, tranche: "décennie 2010"}
    structure: evenement_rare
    regle: "Les campagnes de résistance non violente qui visaient un changement de régime ou l'expulsion d'une occupation ont réussi dans plus de 40 % des cas des années 1960 à 2010, jusqu'à 65 % dans les années 1990, mais dans moins de 34 % des cas dans les années 2010 ; les campagnes violentes, dans 8 % des cas. Cohérent avec la règle d'inertie : la contestation réussit de moins en moins."
    parametres: {succes_non_violent_2010s_max: 0.34, succes_violent_2010s: 0.08, succes_non_violent_1990s_max: 0.65}
    sources:
      - {titre: "Erica Chenoweth, The Future of Nonviolent Resistance, Journal of Democracy 31(3), 2020", url: "https://www.journalofdemocracy.org/articles/the-future-of-nonviolent-resistance/", consulte: "2026-11-19"}
    statut: source

  - id: afrique_limites_de_mandat
    ecosysteme: "Afrique · durée au pouvoir et limites de mandat"
    espace: afrique
    echelle: {axe: temps, tranche: "durée au pouvoir"}
    structure: maintien
    regle: "14 pays africains ont des dirigeants restés plus de deux mandats après avoir contourné les limites ; 30 pays sur 54 n'ont pas de limite qui fonctionne. Durée au pouvoir : 5 ans en moyenne là où les limites sont respectées, 16 ans (médiane) chez les dirigeants qui les ont contournées. 8 pays ont connu un coup d'État militaire depuis 2015, dont 5 dirigés par un dirigeant ayant contourné les limites (médiane de 30 ans au pouvoir)."
    parametres: {pays_contournement: 14, pays_sans_limite_effective: 30, pays_total: 54, duree_limites_respectees_ans: 5, duree_mediane_contournement_ans: 16, coups_depuis_2015_pays: 8}
    sources:
      - {titre: "Africa Center for Strategic Studies, Term Limit Evasions and Coups in Africa: Two Sides of the Same Coin (date non indiquée sur la page)", url: "https://africacenter.org/spotlight/term-limit-evasions-coups-africa-same-coin/", consulte: "2026-11-19"}
    statut: source

  - id: afrique_reelection_sortants
    ecosysteme: "Afrique · élections présidentielles, sortant candidat"
    espace: afrique
    echelle: {axe: taille, tranche: national}
    structure: course
    regle: "Taux de victoire des présidents sortants candidats : aucune source chiffrée relevée dans ce lot."
    parametres: {}
    sources: []
    statut: absence
    aide: "une base ou une étude sur la part des sortants réélus aux présidentielles africaines (par exemple Posner et Young, ou les travaux sur l'avantage du sortant en Afrique)"

  # ---------------------------------------------------------------- lot 2 : Europe (et erreur des sondages comparée)
  - id: sondages_erreur_comparee
    ecosysteme: "Élections nationales · sondages de la dernière semaine (220 élections, 32 pays)"
    espace: monde
    echelle: {axe: taille, tranche: "national, selon le système électoral et la taille du parti"}
    structure: course
    regle: "Erreur absolue moyenne sur la part d'un parti ou d'un candidat, sondages de la dernière semaine : 2,03 points au total (2,1 dans les années 1940-1970, 2,0 depuis 2000 ; pas de tendance d'ensemble). Présidentielles 2,70, législatives 1,83 ; proportionnelle 1,62, scrutin uninominal 2,28 ; grands partis (plus de 20 %) 2,28, petits partis 1,29 ; partis au pouvoir 2,05, opposition 1,71. Pour une erreur normale, σ ≈ erreur moyenne / 0,8."
    parametres:
      erreur_part_points: {ensemble: 2.03, presidentielles: 2.70, legislatives: 1.83, proportionnelle: 1.62, uninominal: 2.28, grands_partis: 2.28, petits_partis: 1.29, au_pouvoir: 2.05, opposition: 1.71}
      conversion_sigma: 0.8
    sources:
      - {titre: "Jennings et Wlezien, Election polling errors across time and space, Nature Human Behaviour 2(4), 2018, table 2", url: "https://eprints.soton.ac.uk/421260/1/JenningsWlezien_PollingErrors.pdf", consulte: "2026-11-19"}
    statut: source

  - id: france_legislatives
    ecosysteme: "France · élections législatives (scrutin uninominal à deux tours)"
    espace: europe
    echelle: {axe: taille, tranche: circonscription}
    structure: course
    regle: "Élu au premier tour : majorité absolue des suffrages exprimés ET au moins le quart des inscrits. Au second tour, la majorité relative suffit. Pour se maintenir au second tour : au moins 12,5 % des inscrits ; si un seul candidat atteint ce seuil, le suivant peut se maintenir ; si aucun, les deux premiers."
    parametres: {premier_tour: {majorite_exprimes: 50, quart_inscrits: 25}, qualification_inscrits: 12.5}
    sources:
      - {titre: "Code électoral, articles L. 126 et L. 162 (reproduits par le Sénat)", url: "https://www.senat.fr/reglement/pouvoirs_publics31.html", consulte: "2026-11-19"}
    statut: source

  - id: seuils_parlements_nationaux_europe
    ecosysteme: "Europe · élection des parlements nationaux (proportionnelle)"
    espace: europe
    echelle: {axe: taille, tranche: national}
    structure: course
    regle: "Seuil légal pour obtenir des sièges : Allemagne 5 % ; Pays-Bas 0,67 % (une voix pour un siège) ; Pologne 5 % (partis), 8 % (alliances) ; Tchéquie 5 %, 8 % (alliance de deux), 11 % (plus) ; Hongrie 5 %, 10 %, 15 % ; Roumanie 5 %, 10 % ; Slovaquie 5 %, 7 % (2 à 3 partis), 10 % (4 et plus) ; Suède 4 % ; Autriche 4 % ; Norvège 4 % (sièges compensatoires seulement) ; Bulgarie 4 % ; Lettonie 5 % ; Italie 3 % ; Grèce 3 % ; Espagne 3 % par circonscription ; Belgique 5 % par circonscription ; Danemark 2 % ; Portugal aucun seuil légal."
    parametres:
      seuil_parti: {DE: 5, NL: 0.67, PL: 5, CZ: 5, HU: 5, RO: 5, SK: 5, SE: 4, AT: 4, NO: 4, BG: 4, LV: 5, IT: 3, GR: 3, ES: 3, BE: 5, DK: 2, PT: 0}
      seuil_alliance: {PL: 8, CZ: [8, 11], HU: [10, 15], RO: 10, SK: [7, 10]}
    sources:
      - {titre: "Electoral threshold, table des seuils nationaux (Wikiwand, reprise de Wikipédia)", url: "https://wikiwand.com/en/Electoral_threshold", consulte: "2026-11-19"}
    statut: source

  - id: seuils_elections_europeennes
    ecosysteme: "Union européenne · élections au Parlement européen"
    espace: europe
    echelle: {axe: taille, tranche: "national (liste par État)"}
    structure: course
    regle: "Le droit de l'UE plafonne le seuil à 5 % des suffrages exprimés. Seuils de 2024 : 5 % en Tchéquie, France, Croatie, Lettonie, Lituanie (7 % pour les listes communes), Hongrie, Pologne, Roumanie et Slovaquie ; 4 % en Italie, Autriche et Suède ; 3 % en Grèce ; 1,8 % à Chypre ; les autres États n'ont pas de seuil légal."
    parametres: {plafond_ue: 5, seuil: {CZ: 5, FR: 5, HR: 5, LV: 5, LT: 5, HU: 5, PL: 5, RO: 5, SK: 5, IT: 4, AT: 4, SE: 4, GR: 3, CY: 1.8}}
    sources:
      - {titre: "EPRS, Electoral thresholds in European Parliament elections, PE 749.770, avril 2024, tableau 1", url: "https://www.europarl.europa.eu/RegData/etudes/BRIE/2023/749770/EPRS_BRI(2023)749770_EN.pdf", consulte: "2026-11-19"}
    statut: source

  - id: ue_majorite_qualifiee
    ecosysteme: "Union européenne · décisions du Conseil à la majorité qualifiée"
    espace: europe
    echelle: {axe: espace, tranche: "UE à 27"}
    structure: procedure
    regle: "Majorité qualifiée : au moins 55 % des États (15 sur 27) représentant au moins 65 % de la population. Une minorité de blocage doit compter au moins 4 États. Les abstentions comptent comme des votes contre. Majorité qualifiée renforcée (proposition qui ne vient ni de la Commission ni du Haut Représentant) : 72 % des États (20 sur 27) et 65 % de la population."
    parametres: {etats_min: 15, population_min: 65, minorite_blocage_etats: 4, renforcee_etats_min: 20}
    sources:
      - {titre: "Conseil de l'UE, Qualified majority", url: "https://www.consilium.europa.eu/en/council-eu/voting-system/qualified-majority/", consulte: "2026-11-19"}
    statut: source

  - id: ue_sanctions_russie
    ecosysteme: "Union européenne · sanctions contre la Russie"
    espace: europe
    echelle: {axe: temps, tranche: "cycle de renouvellement"}
    structure: procedure
    regle: "Les sanctions économiques contre la Russie sont renouvelées par périodes de six mois depuis juillet 2016. Échéances indiquées en juillet 2026 : sanctions économiques au 31 juillet 2027 ; listes individuelles (intégrité territoriale de l'Ukraine) au 15 septembre 2026 ; Crimée et Sébastopol au 23 juin 2027 ; Donetsk, Louhansk, Zaporijjia et Kherson au 24 février 2027 ; détournement de fonds publics ukrainiens au 6 mars 2027. 21 paquets de sanctions adoptés à cette date. Ces actes relèvent de la politique étrangère et de sécurité commune, où le Conseil décide à l'unanimité sauf disposition contraire : un seul État peut bloquer un paquet ou un renouvellement."
    parametres: {periode_renouvellement_mois: 6, echeances: {economiques: "2027-07-31", listes_individuelles: "2026-09-15", crimee: "2027-06-23", oblasts_occupes: "2027-02-24", fonds_detournes: "2027-03-06"}, paquets_adoptes: 21, unanimite: true}
    sources:
      - {titre: "Conseil de l'UE, EU sanctions against Russia (page revue le 23 juillet 2026)", url: "https://www.consilium.europa.eu/en/policies/sanctions-against-russia", consulte: "2026-11-19"}
      - {titre: "Traité sur l'Union européenne, article 31 (unanimité en politique étrangère et de sécurité commune)", url: "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12016M031", consulte: "2026-11-19"}
    statut: source

  - id: europe_formation_gouvernement
    ecosysteme: "Europe · formation des gouvernements de coalition"
    espace: europe
    echelle: {axe: temps, tranche: "jours entre l'élection et l'investiture"}
    structure: procedure
    regle: "Durée habituelle de formation d'un gouvernement de coalition, par pays : aucune moyenne chiffrée relevée dans ce lot (la source consultée couvre 153 coalitions de dix pays, 1978-2017, mais ne donne pas de durée moyenne)."
    parametres: {}
    sources: []
    statut: absence
    aide: "les durées de formation par pays (bases ParlGov ou Representative Democracy Data Archive, ou une étude comparée)"
