    ecosysteme: "États-Unis · ouragans touchant le continent"
    espace: amerique_du_nord
    echelle: {axe: temps, tranche: "saison"}
    structure: evenement_rare
    objet: "atterrissage d'un ouragan sur le territoire continental des États-Unis"
    perimetre: ["États-Unis"]
    compartiments: [climat-extremes:tempetes, climat-extremes:saisons]
    regle: "De 1950 à 2005, 43 saisons sur 56 ont vu au moins un ouragan toucher le continent américain (77 %), et 29 sur 56 en ont vu un avant le 1er septembre (52 %) : premier atterrissage en juin 4 fois, en juillet 7, en août 18, en septembre 11, en octobre 3 ; aucune saison sans ouragan au continent 13 fois. Le premier ouragan atlantique de la saison se forme en moyenne le 11 août (normales 1991-2020). Pour une question « avant le 1er septembre », le point de départ est donc environ une chance sur deux."
    parametres: {saisons: 56, avec_atterrissage: 43, avant_1er_septembre: 29, premier_ouragan_moyen: "08-11"}
    sources:
      - {titre: "NOAA AOML, Continental United States Hurricane Impacts/Landfalls 1851-2005 (révision de mai 2006)", url: "https://www.aoml.noaa.gov/hrd/hurdat/ushurrlist.htm", consulte: "2026-11-21"}
      - {titre: "NOAA National Hurricane Center, Tropical Cyclone Climatology (normales 1991-2020)", url: "https://www.nhc.noaa.gov/climo/", consulte: "2026-11-21"}
    statut: source

  - id: bolides_frequence
    ecosysteme: "Espace · petits objets frappant l'atmosphère terrestre"
    espace: monde
    echelle: {axe: taille, tranche: "énergie de l'impact"}
    structure: evenement_rare
    objet: "explosion dans l'atmosphère d'un bolide d'une énergie donnée"
    perimetre: [monde]
    compartiments: [soleil-espace:meteorites]
    regle: "D'après 8,5 ans d'enregistrements satellitaires des explosions de bolides, la Terre reçoit en moyenne chaque année un objet d'environ 5 kilotonnes d'énergie ; un événement de la classe Toungouska (10 mégatonnes) survient environ une fois tous les 1 000 ans. La fréquence croît quand l'énergie baisse : un seuil d'énergie plus bas que 5 kilotonnes est franchi plus d'une fois par an en moyenne, mais seulement s'il est détecté et publié par la source désignée."
    parametres: {par_an_5kt: 1, par_an_10mt: 0.001, annees_de_donnees: 8.5}
    sources:
      - {titre: "Brown et al., The flux of small near-Earth objects colliding with the Earth, Nature 420, 2002", url: "https://www.nature.com/articles/nature01238", consulte: "2026-11-21"}
    statut: source

  - id: records_temperature_persistance
    ecosysteme: "Climat · records mensuels de température (ERA5)"
    espace: monde
    echelle: {axe: temps, tranche: "mois"}
    structure: maintien
    objet: "record mensuel ou journalier de température de l'air ou de la mer"
    perimetre: [monde]
    compartiments: [climat-extremes:tendance, climat-extremes:oceans]
    regle: "Les records se suivent en séries : chaque mois de juin 2023 à juin 2024 a été le plus chaud jamais mesuré pour ce mois (13 mois d'affilée, Copernicus ERA5) ; la température de surface de la mer (60° S-60° N) a battu le record de son mois 15 mois d'affilée jusqu'en juin 2024 (20,85 °C en juin 2024). Les 12 mois de juillet 2023 à juin 2024 ont été en moyenne 1,64 °C au-dessus de 1850-1900. Une série s'arrête quand la variabilité naturelle se retourne (une Niña se formait mi-2024) ; un record d'un mois précis dépend donc de l'écart du mois précédent au record, pas seulement de la tendance."
    parametres: {mois_records_consecutifs: 13, mois_records_mer: 15, anomalie_12_mois: 1.64}
    sources:
      - {titre: "Organisation météorologique mondiale, Record temperature streak continues in June (juillet 2024, données Copernicus ERA5)", url: "https://wmo.int/media/news/record-temperature-streak-continues-june", consulte: "2026-11-21"}
    statut: source

  - id: coupe_du_monde_vainqueurs_hotes
    ecosysteme: "Football · Coupe du monde masculine"
    espace: monde
    echelle: {axe: temps, tranche: "édition"}
