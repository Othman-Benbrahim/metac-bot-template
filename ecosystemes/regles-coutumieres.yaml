    objet: "vainqueur ou parcours d'une équipe à la Coupe du monde de football"
    perimetre: [monde]
    compartiments: [competitions-culture:forme, competitions-culture:public]
    regle: "De 1930 à 2022, 22 éditions, 8 pays vainqueurs (Brésil 5, Allemagne et Italie 4, Argentine 3, Uruguay et France 2, Angleterre et Espagne 1). Premier titre d'un pays : 8 éditions sur 22, 6 sur 18 depuis 1950 (1954, 1958, 1966, 1978, 1998, 2010), aucun depuis 2010. Pays hôte : demi-finale ou mieux dans 13 éditions sur 22, titre 6 fois ; depuis 1982 (au moins 24 équipes), demi-finale dans 5 éditions sur 11 (1990, 1998, 2002, 2006, 2014), sortie dès le premier tour en 2010 et 2022."
    parametres: {editions: 22, vainqueurs_distincts: 8, premier_titre: 8, premier_titre_depuis_1950: 6, hote_demi: 13, hote_titre: 6, hote_demi_depuis_1982: 5, editions_depuis_1982: 11}
    sources:
      - {titre: "Al Jazeera, Which teams have won the FIFA World Cup? (octobre 2023)", url: "https://www.aljazeera.com/sports/2023/10/25/which-teams-have-won-the-fifa-world-cup", consulte: "2026-11-21"}
      - {titre: "The Analyst (Opta), World Cup host nations: how have they performed?", url: "https://theanalyst.com/articles/world-cup-host-nations-how-have-they-performed", consulte: "2026-11-21"}
