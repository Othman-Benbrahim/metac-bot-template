  - id: anciens_dirigeants_sort
    ecosysteme: "Monde · sort des dirigeants après leur sortie du pouvoir"
    espace: monde
    echelle: {axe: temps, tranche: "année après la sortie"}
    structure: evenement_rare
    objet: "exil, emprisonnement ou poursuite d'un ancien chef d'État ou de gouvernement"
    perimetre: [monde]
    compartiments: [humain:hierarchie, securite-publique:justice]
    regle: "Sur 1 802 dirigeants sortis du pouvoir de 1919 à 2003 (base Archigos, 164 pays), 7,6 % de ceux partis de façon régulière (élection, fin de mandat, démission) ont été exilés, emprisonnés ou tués dans l'année (98 sur 1 298, dont 32 emprisonnés), contre 80 % de ceux chassés irrégulièrement (380 sur 473). Pour un ancien dirigeant parti régulièrement, une arrestation dans un délai de quelques mois est donc un événement rare, plus rare encore longtemps après la sortie."
    parametres: {regulier_puni: 98, regulier_total: 1298, irregulier_puni: 380, irregulier_total: 473, regulier_emprisonne: 32}
    sources:
      - {titre: "Goemans, Which Way Out? The Manner and Consequences of Losing Office, Journal of Conflict Resolution 52(6), 2008 (tableau 1, données Archigos)", url: "https://www.rochester.edu/college/faculty/hgoemans/Publications/WhichWayOut.pdf", consulte: "2026-11-21"}
    statut: source

