    perimetre: ["Royaume-Uni"]
    compartiments: [securite-publique:alertes]
    regle: "Du 1er août 2006 au 1er mars 2018, 16 changements du niveau de menace international : un niveau stable dure d'ordinaire de 6 mois à 2 ans ; le niveau « critique » n'a duré que 2 à 4 jours chaque fois (2006, 2007, mai et septembre 2017) avant de redescendre à « grave ». Les baisses de « grave » à « substantiel » sont venues après 1 à 2 ans (2009, 2011, 2016). Pour une question de baisse dans les quelques mois, le maintien est le point de départ."
