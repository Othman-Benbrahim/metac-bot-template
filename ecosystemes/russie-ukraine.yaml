theme: russie-ukraine
nom: "Guerre Russie–Ukraine"
declaration:
  but: "comprendre ce qui fait durer, s'intensifier ou s'arrêter la guerre, et ce qu'elle transmet (sanctions, énergie, alimentation, sécurité européenne) — questions du tournoi sur un cessez-le-feu, des rencontres, des sanctions"
  limites: "dedans le front, les capacités militaires, les soutiens extérieurs, les sanctions, les économies de guerre, les négociations, les opinions ; dehors l'histoire longue de la région (seulement comme mémoire) et la politique intérieure des soutiens (thèmes voisins)"
  observateur: "notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; aucune source privée"
  date: "2026-11-19"
  espace: "le front et l'arrière en Ukraine et en Russie, la mer Noire, les capitales des soutiens, les marchés de l'énergie et du blé"
  temps: "de la frappe (heures) à la guerre d'usure (années) ; mémoire de 2014, de 2022, des négociations successives"
  vitesse: "l'heure (frappes), la semaine (front), la saison (offensives, boue, hiver énergétique), l'année (budgets, sanctions)"
  taille: "une unité, une armée, un État, une coalition"
compartiments:
  - id: front
    nom: "Front et opérations"
    elements: ["ligne de front", "offensives et défenses", "frappes de drones et de missiles", "fortifications"]
    acteurs:
      - {nom: "une unité ou un drone", taille: "micro", espace: "site", vitesse: "heures"}
      - {nom: "les forces armées ukrainiennes", taille: "macro", espace: "pays", vitesse: "semaines"}
      - {nom: "les forces armées russes", taille: "macro", espace: "pays", vitesse: "semaines"}
    niveau: {espace: "théâtre", temps: "saisons de combat", vitesse: "heures à semaines", taille: "micro à macro"}
    traces:
      - {source: "feux actifs en Ukraine (FIRMS, combats et frappes)", statut: "collecte", fichier: "collecte_feux.py", adaptateur: "feux:UA"}
      - {source: "feux actifs en Russie (frappes sur l'arrière)", statut: "collecte", fichier: "collecte_feux.py", adaptateur: "feux:RU"}
  - id: capacites
    nom: "Capacités militaires et industrie"
    elements: ["munitions", "production de drones", "effectifs et mobilisation", "défense aérienne"]
    niveau: {espace: "pays", temps: "cycles de production ; vagues de mobilisation", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "budgets et annonces industrielles publiques", statut: "a_brancher"}
  - id: soutiens
    nom: "Soutiens extérieurs"
    elements: ["aide militaire et financière occidentale", "Union européenne", "OTAN", "soutiens de la Russie (Iran, Corée du Nord, Chine en agrégat)"]
    acteurs:
      - {nom: "États-Unis", taille: "macro", espace: "mondial", vitesse: "mois"}
      - {nom: "Union européenne", taille: "macro", espace: "continent", vitesse: "mois"}
      - {nom: "Corée du Nord", taille: "méso", espace: "pays", vitesse: "mois"}
    niveau: {espace: "mondial", temps: "votes budgétaires ; sommets", vitesse: "semaines à mois", taille: "macro"}
    traces:
      - {source: "GDELT, ton des gestes des États-Unis envers l'Ukraine", statut: "collecte", fichier: "gdelt_bq.py", adaptateur: "dyade:USA:UKR"}
      - {source: "Congrès américain (réunions, textes)", statut: "collecte", fichier: "collecte_congres.py"}
  - id: sanctions
    nom: "Sanctions"
    elements: ["paquets de sanctions européens", "sanctions américaines", "plafond de prix sur le pétrole russe", "avoirs gelés", "sanctions secondaires"]
    acteurs:
      - {nom: "Commission européenne", taille: "macro", espace: "continent", vitesse: "mois"}
      - {nom: "Trésor américain (OFAC)", taille: "macro", espace: "mondial", vitesse: "semaines"}
    niveau: {espace: "juridictions", temps: "paquets datés", vitesse: "semaines à mois", taille: "macro"}
    traces:
      - {source: "désignations de sanctions visant la Russie", statut: "collecte", fichier: "collecte_sanctions.py", adaptateur: "sanctions:RU"}
  - id: economie_russe
    nom: "Économie de guerre russe"
    elements: ["recettes pétrolières et gazières", "budget militaire", "inflation et taux de la banque centrale russe", "main-d'œuvre"]
    acteurs:
      - {nom: "Banque centrale de Russie", taille: "macro", espace: "pays", vitesse: "semaines"}
    niveau: {espace: "Russie", temps: "budget annuel ; décisions mensuelles", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "prix du Brent (FRED), base des recettes russes", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DCOILBRENTEU"}
  - id: economie_ukraine
    nom: "Économie et infrastructures ukrainiennes"
    elements: ["réseau électrique", "exportations par la mer Noire", "aide budgétaire", "population déplacée"]
    niveau: {espace: "Ukraine", temps: "hivers énergétiques", vitesse: "jours (coupures) à années", taille: "macro"}
    traces:
      - {source: "coupures d'internet en Ukraine (OONI, signe des coupures électriques)", statut: "collecte", fichier: "collecte_ooni.py", adaptateur: "ooni:UA"}
      - {source: "anomalies de température (froid et demande d'énergie)", statut: "a_brancher"}
  - id: negociations
    nom: "Négociations et diplomatie"
    elements: ["médiations", "rencontres au sommet", "échanges de prisonniers", "conditions posées par chaque camp"]
    acteurs:
      - {nom: "Russie (gouvernement)", taille: "macro", espace: "pays", vitesse: "semaines"}
      - {nom: "Ukraine (gouvernement)", taille: "macro", espace: "pays", vitesse: "semaines"}
      - {nom: "médiateurs (Turquie, pays du Golfe, Vatican, États-Unis — en agrégat)", taille: "méso", espace: "mondial", vitesse: "semaines"}
    niveau: {espace: "capitales et lieux neutres", temps: "rencontres datées", vitesse: "semaines", taille: "macro"}
    traces:
      - {source: "GDELT, ton des gestes de la Russie envers l'Ukraine", statut: "collecte", fichier: "gdelt_bq.py", adaptateur: "dyade:RUS:UKR"}
      - {source: "routines officielles (Kremlin)", statut: "collecte", fichier: "collecte_routines.py"}
  - id: opinions
    nom: "Opinions et cohésion"
    elements: ["lassitude dans les pays soutiens", "cohésion intérieure en Russie et en Ukraine", "récits officiels"]
    niveau: {espace: "pays", temps: "élections ; sondages", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "récit officiel russe", statut: "collecte", fichier: "collecte_recit_russe.py"}
      - {source: "Telegram (chaînes publiques)", statut: "collecte", fichier: "collecte_telegram.py"}
  - id: mer_noire
    nom: "Mer Noire et exportations"
    elements: ["corridor maritime ukrainien", "Bosphore", "ports d'Odessa", "flotte russe"]
    niveau: {espace: "mer Noire et détroits turcs", temps: "saisons de récolte", vitesse: "jours", taille: "méso"}
    traces:
      - {source: "IMF PortWatch, navires au Bosphore", statut: "collecte", fichier: "collecte_portwatch.py", adaptateur: "portwatch:bosphore:navires"}
relations:
  - {de: "capacites", vers: "front", effet: "+", delai: "mois", force: "forte", intensite: {mesure: "écart entre munitions produites et consommées", regle: "seuil"}, coupure: "fortifications qui figent le front", statut: "a_verifier", texte: "les capacités décident de ce que le front peut faire ; une pénurie fait basculer"}
  - {de: "soutiens", vers: "capacites", effet: "+", delai: "mois", force: "forte", intensite: {mesure: "volume de l'aide votée récemment", regle: "proportionnelle"}, coupure: "blocages politiques chez les soutiens", statut: "a_verifier", texte: "l'aide extérieure alimente les capacités ukrainiennes (et, en face, les livraisons de munitions et de drones à la Russie)"}
  - {de: "sanctions", vers: "economie_russe", effet: "-", delai: "mois à années", force: "moyenne", intensite: {mesure: "nombre de désignations récentes", regle: "saturation"}, coupure: "contournement par des pays tiers et la flotte fantôme", statut: "a_verifier", texte: "les sanctions érodent l'économie russe lentement ; chaque paquet ajoute moins"}
  - {de: "economie_russe", vers: "capacites", effet: "+", delai: "mois", force: "moyenne", coupure: "goulets de main-d'œuvre et de composants", statut: "a_verifier", texte: "les recettes financent la production militaire"}
  - {de: "front", vers: "economie_ukraine", effet: "-", delai: "jours", force: "forte", intensite: {mesure: "frappes récentes sur le réseau électrique", regle: "proportionnelle"}, coupure: "défense aérienne", statut: "a_verifier", texte: "les frappes sur l'énergie pèsent surtout en hiver"}
  - {de: "front", vers: "negociations", effet: "±", delai: "semaines", force: "moyenne", coupure: "objectifs maximalistes", statut: "a_verifier", texte: "chaque camp négocie selon ce qu'il croit pouvoir encore gagner sur le terrain"}
  - {de: "negociations", vers: "front", effet: "-", retour: "±", style: "inconnu", delai: "semaines", force: "faible", coupure: "méfiance, violations", statut: "a_verifier", texte: "une négociation sérieuse peut geler des secteurs ; style de la relation à mesurer (paire RUS–UKR au banc de la réciprocité)"}
  - {de: "opinions", vers: "soutiens", effet: "±", delai: "mois", force: "moyenne", intensite: {mesure: "durée de la guerre et coût perçu", regle: "hysteresis"}, coupure: "menace perçue comme directe", statut: "a_verifier", texte: "la lassitude des opinions use le soutien ; une fois installée, elle ne recule pas facilement"}
  - {de: "soutiens", vers: "sanctions", effet: "+", delai: "semaines à mois", force: "forte", coupure: "unanimité requise dans l'Union européenne", statut: "a_verifier", texte: "les soutiens décident des sanctions"}
  - {de: "mer_noire", vers: "economie_ukraine", effet: "+", delai: "semaines", force: "moyenne", coupure: "attaques sur les ports et les navires", statut: "a_verifier", texte: "le corridor maritime fait vivre les exportations agricoles"}
  - {de: "front", vers: "mer_noire", effet: "-", delai: "jours", force: "moyenne", intensite: {mesure: "frappes récentes sur les ports", regle: "seuil"}, coupure: "défense des ports", statut: "a_verifier", texte: "les frappes sur Odessa et les navires réduisent les passages"}
  - {de: "soutiens", vers: "negociations", effet: "±", retour: "±", delai: "semaines", force: "moyenne", coupure: "divergences entre soutiens", statut: "a_verifier", texte: "les soutiens pèsent sur les conditions et le calendrier des négociations"}
ponts:
  - {depuis: "sanctions", vers: "energie-mondiale:decisions", nature: "sanctions et plafond de prix sur le pétrole russe"}
  - {depuis: "economie_russe", vers: "energie-mondiale:production", nature: "la Russie est un grand producteur de pétrole et de gaz"}
  - {depuis: "mer_noire", vers: "alimentation-mondiale:prix", nature: "le blé et le maïs ukrainiens et russes"}
  - {depuis: "sanctions", vers: "transport-maritime:droit", nature: "la flotte fantôme"}
  - {depuis: "soutiens", vers: "politique-americaine:budget", nature: "l'aide votée par le Congrès"}
  - {depuis: "soutiens", vers: "securite-europeenne:defense", nature: "le réarmement européen et l'OTAN"}
  - {depuis: "soutiens", vers: "rivalite-sino-americaine:alliances", nature: "le soutien chinois à la Russie et les sanctions secondaires"}
