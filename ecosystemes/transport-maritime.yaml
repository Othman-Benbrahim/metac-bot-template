  - 'route maritime du Nord : de 21 000 à 12 800 km entre l''Asie de l''Est et l''Europe de l''Ouest, soit 39 % de moins que par Suez (J.-P. Rodrigue, The Geography of Transport Systems, 2024) — IHEDN « près de 40 % » : confirmé'
  - 'navigation saisonnière (juillet à novembre) ; face-à-face entre la Russie et les États-Unis (IHEDN, 2026)'
