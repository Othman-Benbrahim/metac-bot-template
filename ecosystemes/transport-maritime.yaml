- id: detroit_ormuz
  nom: Détroit d'Ormuz
  organisation: relief
  geopolitique:
    pays: [IRN, OMN, ARE]
  elements:
  - 'pétrole : 20,9 millions de barils par jour au premier semestre 2025, environ 20 % de la consommation mondiale et un quart du pétrole échangé par mer (EIA, 2026) ; 19,9 Mb/j en 2025, 25 % du commerce maritime de pétrole (AIE, 2026) — IHEDN 20-21 Mb/j : confirmé'
  - 'gaz naturel liquéfié : un peu plus de 20 % du commerce mondial (EIA, 1er semestre 2025) ; 19-20 %, 112 milliards de m3 en 2025 (AIE) — IHEDN « un tiers » : diverge'
  - 'largeur : 54 km au plus étroit, deux chenaux de 3,7 km (AIE, 2026) — IHEDN 39 km : diverge (39 km correspond à 21 milles marins, valeur souvent citée)'
  - 'contournement par oléoducs saoudien et émirien : 3,5 à 5,5 Mb/j disponibles (AIE, 2026)'
  - 'guerre de 2026 : transits en baisse de plus de 90 % pendant la phase aiguë (28 février - 8 avril) ; primes de risque de guerre très élevées, couvertures annulées ; après le cessez-le-feu, blocus américain des ports iraniens et de 5 à 10 Mb/j repassés par le détroit à la mi-septembre, sous escorte (transits de nuit, transpondeurs coupés) (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
  - 'oléoduc saoudien Est-Ouest : voie de contournement et donc cible ; suspendu à la mi-septembre 2026 après des attaques de drones lancées depuis l''Irak, pétrole au-dessus de 100 dollars (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
  - 'fragilité : la réouverture dépend de la volonté américaine de maintenir le blocus, donc d''un décideur ; un taux de base peut se casser sur une annonce (IISS, The Gulf at War, octobre 2026, faits jusqu''à mi-septembre)'
  - 'endurance navale américaine, contrainte sur la durée du blocus : le porte-avions Abraham Lincoln est rentré le 8 octobre 2026 après 321 jours de déploiement, dont 265 dans le golfe Persique sans escale (8 tentatives de suicide à bord) ; le secrétaire par intérim de la Navy attribue l''allongement des déploiements au manque de navires (relayé : Center for Maritime Strategy, parrainé par la Navy League, novembre 2026, et Task & Purpose ; non vérifié à la source)'
  niveau:
    espace: goulet
    temps: permanent ; incidents datés
    vitesse: heures à jours
    taille: méso
- id: detroit_bab_el_mandeb
  nom: Détroit de Bab-el-Mandeb
  organisation: relief
  geopolitique:
    pays: [YEM, DJI, ERI]
  elements:
  - 'pétrole : 9,3 Mb/j en 2023, 4,1 en 2024, 4,2 au premier semestre 2025 (EIA, 2026)'
  - 'part du commerce : le canal de Suez, dont c''est l''accès sud, porte environ 10 % du volume du commerce maritime mondial et 22 % des conteneurs (CNUCED, 2024) — IHEDN 10-12 % : confirmé'
  - 'détour par le cap de Bonne-Espérance : Shenzhen-Rotterdam passe de 31 à 41 jours et de 10 000 à 13 000 milles marins (CNUCED, 2024) — IHEDN 10 à 14 jours : proche (bas de la fourchette)'
  - 'Atlas 2025 : environ 9 jours de plus entre Djebel Ali et Rotterdam par le Cap, tarifs presque doublés sur les lignes Asie-Europe, droits de passage de Suez relevés de 5 à 15 % ; recettes du canal 9,4 milliards de dollars en 2023 pour l''Égypte (Atlas géopolitique mondial 2025, Carto/Areion, rédigé de mai 2023 à avril 2024) — cohérent avec la CNUCED'
  - 'mécanisme voisin : protocole Éthiopie-Somaliland du 1er janvier 2024 (accès de l''Éthiopie à la mer contre une reconnaissance), rejeté par la Somalie au nom de son intégrité territoriale : une autre source de tension sur la rive africaine (Atlas géopolitique mondial 2025, Carto/Areion, rédigé de mai 2023 à avril 2024 ; suite à vérifier)'
  niveau:
    espace: goulet
    temps: permanent ; incidents datés
    vitesse: heures à jours
    taille: méso
- id: canal_suez
  nom: Canal de Suez
  organisation: relief
  geopolitique:
    pays: [EGY]
  elements:
  - 'environ 10 % du volume du commerce maritime mondial, 22 % des conteneurs ; transits en baisse de 70 % en juin 2024 par rapport à mi-décembre 2023 (CNUCED, 2024)'
  - 'pétrole, canal et oléoduc SUMED : 8,8 Mb/j en 2023, 4,8 en 2024, 4,9 au premier semestre 2025 (EIA, 2026)'
  niveau:
    espace: goulet
    temps: permanent ; incidents datés
    vitesse: heures à jours
    taille: méso
- id: detroit_malacca
  nom: Détroit de Malacca
  organisation: relief
  geopolitique:
    pays: [MYS, IDN, SGP]
  elements:
  - 'navires : environ 94 300 en 2024 et 102 500 en 2025 (Département de la marine de Malaisie, cité par Reuters, avril 2026) — IHEDN « plus de 85 000 » : diverge (chiffre ancien)'
  - 'part du commerce : près de 22 % du commerce maritime mondial (CSIS, cité par Reuters) — IHEDN 25 % : proche'
  - 'pétrole : 23,2 Mb/j au premier semestre 2025, 29 % des flux maritimes de pétrole, premier goulet pétrolier du monde (EIA, 2026)'
  - 'largeur : 2,7 km au plus étroit (chenal Phillips, détroit de Singapour ; Reuters)'
  - '« dilemme de Malacca » : la Chine craint un blocus en cas de conflit autour de Taïwan (IHEDN, 2026)'
  niveau:
    espace: goulet
    temps: permanent ; incidents datés
    vitesse: heures à jours
    taille: méso
- id: canal_panama
  nom: Canal de Panama
  organisation: relief
  geopolitique:
    pays: [PAN]
  elements:
  - 'environ 3 % du volume du commerce maritime mondial ; transits divisés par plus de deux de fin 2021 à juin 2024, faute d''eau (CNUCED, 2024)'
  - 'pétrole : 2,3 Mb/j sur l''exercice 2025 (EIA, 2026)'
  - 'mécanisme : le canal fonctionne à l''eau douce (lac Gatun, qui alimente aussi 1,3 million d''habitants de la capitale) ; en sécheresse, l''Autorité réduit le tirant d''eau (15,09 m au 1er mars 2023, 13,26 m le 19 juillet) et le nombre de passages quotidiens (abaissé jusqu''à 25) ; le canal pèse près de 20 % de la richesse du Panama, 30 % avec la logistique (Panama Canal Authority, 2023, via Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  niveau:
    espace: goulet
    temps: permanent ; incidents datés
    vitesse: heures à jours
    taille: méso
