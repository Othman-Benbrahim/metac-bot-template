- {de: droit, vers: flottes, effet: '-', delai: semaines à mois, force: moyenne, coupure: flotte fantôme et changements de pavillon, statut: a_verifier, texte: les sanctions retirent des navires du marché officiel et en créent un parallèle}
- {de: flottes, vers: securite, effet: ±, retour: ±, style: inconnu, delai: jours, force: faible, coupure: inconnue, statut: a_verifier, texte: 'les compagnies et les forces armées s''ajustent l''une à l''autre (escortes demandées, routes choisies)'}
- {de: recits, vers: assurances, effet: +, delai: heures à jours, force: faible, coupure: absence d'incident physique, statut: a_verifier, texte: une menace annoncée suffit parfois à relever le risque perçu}
- {de: detroits, vers: ports, effet: ±, delai: semaines, force: moyenne, coupure: étalement des arrivées, statut: a_verifier, texte: un passage rouvert après une crise envoie des vagues de navires dans les ports}
