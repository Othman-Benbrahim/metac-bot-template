# 0.10.518 (2026-11-27, accord de l'auteur 14 h 52) : endurance navale américaine et durée du blocus d'Ormuz (relayé).
# 0.10.512 (2026-11-26, accord de l'auteur 22 h 42) : apports du dossier IISS « The Gulf at War » (octobre 2026).
# 0.10.474 (décision de l'auteur, 2026-11-23, 17 h 42) : veille IHEDN « Les verrous du monde » (23 novembre 2026) ;
# un compartiment par détroit majeur (pays riverains sous « geopolitique »), chiffres de l'IHEDN recoupés avec des
# sources primaires (EIA, AIE, CNUCED, Département de la marine de Malaisie, Direction générale des affaires maritimes
# de Turquie, MCA britannique, CNES, Britannica, Rodrigue). Recoupement : « confirmé », « proche », « diverge » ou
# « non recoupé ». Les formulations de l'IHEDN (perspective française et européenne) ne sont pas reprises.
theme: transport-maritime
nom: Transport maritime mondial
declaration:
  but: comprendre comment le système des routes maritimes, des détroits et des ports absorbe ou transmet un choc (fermeture d'un passage, attaque, sanction, sécheresse d'un canal) et ce qu'il transmet aux
    prix, à l'énergie et aux chaînes d'approvisionnement
  limites: dedans les détroits et canaux, les routes de contournement, les flottes, le fret, les assurances, les ports, les marines qui sécurisent les routes ; dehors la construction navale, le transport
    aérien et terrestre (sauf comme alternative)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement
  date: '2026-11-19'
  espace: les océans et leurs goulets (Ormuz, Bab-el-Mandeb, Suez, Malacca, Panama, Bosphore et Dardanelles, Taïwan, Gibraltar,
    Pas de Calais, Béring, cap de Bonne-Espérance)
  temps: de la traversée (heures) au cycle du fret (années) ; mémoire de l'Ever Given (2021), des attaques en mer Rouge (depuis 2023), de la sécheresse de Panama (2023-2024) — à vérifier
  vitesse: l'heure (incident), la semaine (déroutement, fret spot), le mois (contrats), l'année (flottes)
  taille: un navire, une compagnie, une route, le système mondial
