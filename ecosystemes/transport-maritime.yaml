theme: transport-maritime
nom: Transport maritime mondial
declaration: {but: 'comprendre comment le système des routes maritimes, des détroits et des ports absorbe ou transmet un choc (fermeture d''un passage, attaque, sanction, sécheresse d''un canal) et ce qu''il transmet aux prix, à l''énergie et aux chaînes d''approvisionnement', limites: 'dedans les détroits et canaux, les routes de contournement, les flottes, le fret, les assurances, les ports, les marines qui sécurisent les routes ; dehors la construction navale, le transport aérien et terrestre (sauf comme alternative)', observateur: 'notre bot et nos sources ouvertes, regard extérieur, depuis l''Europe ; données publiques seulement', date: '2026-11-19', espace: 'les océans et leurs goulets (Ormuz, Bab-el-Mandeb, Suez, Malacca, Panama, Bosphore, Taïwan, cap de Bonne-Espérance)', temps: 'de la traversée (heures) au cycle du fret (années) ; mémoire de l''Ever Given (2021), des attaques en mer Rouge (depuis 2023), de la sécheresse de Panama (2023-2024) — à vérifier', vitesse: 'l''heure (incident),
    la semaine (déroutement, fret spot), le mois (contrats), l''année (flottes)', taille: 'un navire, une compagnie, une route, le système mondial'}
compartiments:
- id: detroits
  nom: Détroits et canaux
  organisation: relief
  elements: [Ormuz, Bab-el-Mandeb, canal de Suez, Malacca, canal de Panama, Bosphore, détroit de Taïwan]
  acteurs:
  - {nom: Autorité du canal de Suez, taille: méso, espace: site, vitesse: jours, organisation: statut, facette: collectif}
  - {nom: Autorité du canal de Panama, taille: méso, espace: site, vitesse: jours, organisation: statut, facette: collectif}
  niveau: {espace: goulets régionaux, temps: permanent ; incidents datés, vitesse: heures à jours, taille: méso}
  traces:
  - {source: 'IMF PortWatch, porte-conteneurs à Suez', statut: collecte, fichier: collecte_portwatch.py, adaptateur: 'portwatch:suez:porte_conteneurs'}
  - {source: 'IMF PortWatch, navires à Bab-el-Mandeb', statut: collecte, fichier: collecte_portwatch.py, adaptateur: 'portwatch:bab_el_mandeb:navires'}
  - {source: 'IMF PortWatch, navires à Panama', statut: collecte, fichier: collecte_portwatch.py, adaptateur: 'portwatch:panama:navires'}
- id: contournement
  nom: Routes de contournement
  organisation: technique
  elements: [cap de Bonne-Espérance, oléoducs terrestres, ponts ferroviaires, route maritime du Nord]
  niveau: {espace: routes mondiales, temps: semaines de traversée supplémentaires, vitesse: jours à semaines, taille: macro}
  traces:
  - {source: 'IMF PortWatch, navires au cap de Bonne-Espérance', statut: collecte, fichier: collecte_portwatch.py, adaptateur: 'portwatch:bonne_esperance:navires'}
- id: flottes
  nom: Flottes et armateurs
  organisation: economie
  elements: [porte-conteneurs, pétroliers, vraquiers, méthaniers, flotte « fantôme » sous sanctions]
  acteurs:
  - {nom: un navire et son équipage, taille: micro, espace: navire, vitesse: heures, organisation: economie, facette: collectif}
  - {nom: une grande compagnie de conteneurs, taille: méso, espace: mondial, vitesse: semaines, organisation: economie, facette: collectif}
  - {nom: les alliances de compagnies, taille: macro, espace: mondial, vitesse: mois, organisation: economie, facette: collectif}
  niveau: {espace: mondial, temps: rotations ; renouvellement des flottes sur des années, vitesse: semaines à années, taille: micro à macro}
  traces:
  - {source: 'IMF PortWatch, pétroliers à Malacca', statut: collecte, fichier: collecte_portwatch.py, adaptateur: 'portwatch:malacca:petroliers'}
- id: fret
  nom: Prix du fret
  organisation: economie
  elements: [fret conteneur au comptant, fret pétrolier, contrats annuels, surcharges]
  acteurs:
  - {nom: un chargeur (importateur ou exportateur), taille: micro, espace: local, vitesse: semaines, organisation: economie, facette: collectif}
  niveau: {espace: mondial, temps: indices hebdomadaires, vitesse: jours à semaines, taille: macro}
  traces:
  - {source: indices publics de fret conteneur (publications hebdomadaires gratuites), statut: a_brancher}
- id: assurances
  nom: Assurances et risque de guerre
  organisation: economie
  elements: [primes de risque de guerre, zones à haut risque déclarées, réassurance]
  acteurs:
  - {nom: les assureurs maritimes, taille: méso, espace: mondial, vitesse: jours, organisation: economie, facette: collectif}
  niveau: {espace: mondial, temps: révisions des zones à risque, vitesse: jours, taille: méso}
  traces:
  - {source: primes de risque de guerre, statut: fermee}
- id: ports
  nom: Ports et terminaux
  organisation: technique
  elements: [grands ports à conteneurs, terminaux pétroliers et gaziers, engorgement, grèves]
  acteurs:
  - {nom: un port et ses dockers, taille: méso, espace: site, vitesse: jours, organisation: technique, facette: collectif}
  niveau: {espace: sites, temps: temps d'attente quotidiens, vitesse: jours, taille: méso}
  traces:
  - {source: 'statistiques portuaires publiques (temps d''attente, volumes)', statut: a_brancher}
- id: securite
  nom: Sécurité des routes
  organisation: geopolitique
  elements: [marines d'escorte, attaques de drones et de missiles, piraterie, mines, saisies de navires]
  acteurs:
  - {nom: les forces houthies (en agrégat), taille: méso, espace: région, vitesse: jours, organisation: geopolitique, facette: collectif}
  - {nom: les missions navales internationales, taille: méso, espace: région, vitesse: semaines, organisation: geopolitique, facette: collectif}
  - {nom: 'une vedette, un drone ou une mine', taille: micro, espace: site, vitesse: heures, organisation: technique, facette: non_humain}
  niveau: {espace: abords des détroits, temps: incidents ; campagnes, vitesse: heures à semaines, taille: micro à méso}
  traces:
  - {source: avis aux navigateurs (NGA), statut: collecte, fichier: collecte_avis_navigation.py}
  - {source: avions d'État (patrouilles visibles), statut: collecte, fichier: collecte_avions_etat.py}
- id: climat
  nom: Climat et eau des canaux
  organisation: meteo
  elements: [niveau des lacs du canal de Panama, tempêtes et typhons, glaces de l'Arctique]
  niveau: {espace: régional, temps: saisons ; années sèches, vitesse: jours (tempêtes) à saisons (sécheresse), taille: méso}
  traces:
  - {source: niveau du lac Gatún (publication publique de l'autorité du canal), statut: a_brancher}
- id: droit
  nom: Droit, sanctions et règles
  organisation: convention
  elements: [liberté de navigation et passage en transit, sanctions sur les navires et les cargaisons, règles environnementales (carburants), pavillons de complaisance]
  niveau: {espace: juridictions et haute mer, temps: textes durables ; désignations datées, vitesse: semaines à années, taille: macro}
  traces:
  - {source: listes de sanctions, statut: collecte, fichier: collecte_sanctions.py}
- id: recits
  nom: Récits et attention
  organisation: societe
  elements: [alertes des compagnies, communiqués militaires, couverture médiatique]
  niveau: {espace: médiatique mondial, temps: cycle de l'information, vitesse: heures, taille: micro à macro}
  traces:
  - {source: GDELT, statut: collecte, fichier: collecte_gdelt.py}
- id: fleuves
  nom: Fleuves et lacs navigables
  organisation: eau
  elements: [lacs qui alimentent les écluses du canal de Panama, 'Rhin, Mississippi, Yangtsé', étiages et crues]
  acteurs:
  - {nom: le lac qui alimente les écluses de Panama, taille: méso, espace: bassin, vitesse: saisons, organisation: eau, facette: non_humain}
  - {nom: un grand fleuve navigable, taille: macro, espace: bassin, vitesse: saisons, organisation: eau, facette: non_humain}
  niveau: {espace: bassins fluviaux, temps: saisons ; années sèches, vitesse: semaines à saisons, taille: méso}
  traces:
  - {source: niveaux publics des lacs du canal (Autorité du canal de Panama) et des grands fleuves, statut: a_brancher}
- id: oceans
  nom: Océans (courants, glaces, niveau de la mer)
  organisation: ocean
  elements: [glace de mer arctique, courants et houles, niveau de la mer dans les ports]
  acteurs:
  - {nom: la banquise arctique, taille: macro, espace: océan, vitesse: saisons, organisation: ocean, facette: non_humain}
  niveau: {espace: océans, temps: saisons à décennies, vitesse: saisons à décennies, taille: macro}
  traces:
  - {source: 'étendue de la glace de mer (NSIDC, données publiques)', statut: a_brancher}
- id: epidemies_ports
  nom: Épidémies et quarantaines
  organisation: microbiologique
  elements: [virus qui circulent avec les équipages, quarantaines portuaires, fermetures de ports]
  acteurs:
  - {nom: un virus, taille: micro, espace: mondial, vitesse: jours, organisation: microbiologique, facette: non_humain}
  niveau: {espace: ports, temps: vagues de semaines à mois, vitesse: jours à mois, taille: micro}
  traces:
  - {source: alertes publiques de l'OMS, statut: a_brancher}
relations:
- de: securite
  vers: detroits
  effet: '-'
  delai: heures à jours
  force: forte
  intensite: {mesure: attaques et incidents récents près des goulets, regle: seuil}
  coupure: escortes navales efficaces
  statut: a_verifier
  texte: au-delà de quelques attaques, les compagnies évitent le passage entier
- {de: detroits, vers: contournement, effet: '-', retour: '0', forme: commensalisme, delai: jours, force: forte, coupure: capacité des routes alternatives, statut: a_verifier, texte: ce que perd un détroit se reporte sur le contournement (le cap de Bonne-Espérance pour la mer Rouge)}
- de: contournement
  vers: fret
  effet: +
  delai: semaines
  force: forte
  intensite: {mesure: part du trafic dérouté, regle: proportionnelle}
  coupure: surcapacité des flottes
  statut: a_verifier
