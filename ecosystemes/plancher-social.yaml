# 0.10.419 — fiche créée le 2026-11-22 (décision de l'auteur, 4 h 05) : « plus gros trou » suivant de la carte, le plancher
# social (cadre de référence : plancher social du « donut » de Raworth). Ne reprend que ce qui manquait (pauvreté, travail,
# inégalités, logement, protection sociale, accès à l'énergie) ; le reste du plancher (faim, santé, eau, éducation, genre,
# voix politique, justice, liens) est relié par des ponts. Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: plancher-social
nom: Plancher social (monde)
declaration:
  but: 'comprendre ce qui manque aux personnes sous le plancher social, à l''échelle du monde : revenu, travail, logement,
    protection, énergie, et l''écart entre les plus riches et les plus pauvres ; 824 millions de personnes sous le seuil
    de 3 $ par jour en 2024, environ 10,1 % du monde (Banque mondiale, septembre 2026)'
  limites: dedans la pauvreté monétaire, le travail (chômage, informalité, travailleurs pauvres), les inégalités de revenu
    et de patrimoine, le logement, la protection sociale, l'accès à l'électricité et à une cuisson propre ; dehors la faim
    et la santé (corps-humain), l'eau (eau-douce-potable), l'éducation et le genre (societe-droits), la voix politique
    (politique-interieure), la justice (securite-publique), les liens (humain), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (Banque mondiale, OIT, ONU-Habitat, Laboratoire sur les
    inégalités mondiales, AIE et agences du suivi de l'ODD 7) ; toujours en agrégat, aucune personne privée
  date: '2026-11-22'
  espace: le monde, par pays, par ville
  temps: du mois (perte d'un emploi) à la génération (inégalités de patrimoine)
  vitesse: le mois (chômage), l'année (pauvreté, logement, prestations), la décennie (inégalités)
  taille: micro (un ménage) à macro (le monde)
compartiments:
