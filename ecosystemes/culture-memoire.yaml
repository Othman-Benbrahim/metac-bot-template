# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local). Compartiments seulement ; relations et ponts à établir sur sources.
theme: culture-memoire
nom: Culture et mémoire
declaration:
  but: situer la création, l'histoire et la mémoire collective, et le tourisme, qui portent récits et symboles
  limites: dedans création (arts, cinéma, musique, littérature, photographie), histoire et mémoire, tourisme ; dehors les
    compétitions et prix (fiche competitions-culture), les dates de mémoire (calendriers-echeances:memoire)
  observateur: notre carte, regard extérieur ; termes relevés dans les étiquettes des flux RSS du bot (lecteur-local), émetteurs
    identifiés dans listes/emetteurs.txt ; aucune personne privée
  date: '2026-11-22'
  espace: par pays et par langue
  temps: de l'année au siècle
  vitesse: l'année (une œuvre), la décennie, le siècle
  taille: méso à macro
compartiments:
