# 0.10.412 — fiche créée le 2026-11-22 (décision de l'auteur, 0 h 28 - 0 h 32) pour classer les termes conservés des flux RSS
# que nos fiches ne couvraient pas (dépôt lecteur-local).
# 0.10.431 — complétée le 2026-11-22 (remarque de l'auteur, 5 h 35 : « culture et mémoire à compléter ») : éléments
# sourcés, acteurs, trois compartiments (patrimoine, patrimoine en guerre, restitutions) et un quatrième (usages
# politiques de la mémoire), relations à vérifier, ponts. Identifiants d'origine gardés (termes validés rattachés).
theme: culture-memoire
nom: Culture et mémoire
declaration:
  but: 'situer la création, le patrimoine, l''histoire et la mémoire collective, et le tourisme, qui portent récits et
    symboles ; 25 sites ajoutés au patrimoine mondial et 6 placés en péril en juillet 2026 (UNESCO, 48e session) ;
    1,52 milliard d''arrivées de touristes internationaux en 2025, un record (ONU Tourisme)'
  limites: dedans la création (arts, cinéma, musique, littérature, photographie), le patrimoine et sa protection, le
    patrimoine touché par les guerres, les restitutions, l'histoire et la mémoire et leurs usages politiques, le tourisme ;
    dehors les compétitions et prix (competitions-culture), les dates de mémoire (calendriers-echeances:memoire), les
    symboles comme moteurs d'action (humain:symboles), sauf par les ponts
  observateur: notre carte, regard extérieur ; sources publiques (UNESCO, ONU Tourisme, ICOMOS, lois publiées) ; termes
    relevés dans les étiquettes des flux RSS du bot (lecteur-local) ; aucune personne privée
  date: '2026-11-22'
  espace: par pays et par langue
  temps: de l'année au siècle
  vitesse: le jour (une destruction), l'année (une œuvre, une inscription), la décennie, le siècle
  taille: méso à macro
