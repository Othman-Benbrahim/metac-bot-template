    2026)
  acteurs:
  - nom: ONU Tourisme
    taille: macro
    espace: monde
    vitesse: années
    organisation: convention
    facette: collectif
  niveau:
    espace: monde
    temps: saisons
    vitesse: mois
    taille: méso à macro
  traces: *id001
- id: patrimoine
  nom: Patrimoine et sa protection
  organisation: convention
  elements:
  - 48e session du Comité du patrimoine mondial (Busan, 19-29 juillet 2026) - 25 sites inscrits (19 culturels, 5
    naturels, 1 mixte), dont les plages du Débarquement en Normandie (The Art Newspaper, 29 juillet 2026)
  - convention du patrimoine mondial, listes indicatives, patrimoine immatériel
  acteurs:
  - nom: UNESCO (Comité du patrimoine mondial)
    taille: macro
    espace: monde
    vitesse: années
    organisation: convention
    facette: collectif
  niveau:
    espace: pays et monde
    temps: décennies
    vitesse: années (une session par an)
    taille: macro
  traces:
  - source: Liste du patrimoine mondial (whc.unesco.org, données publiques)
    statut: a_brancher
- id: patrimoine_en_guerre
  nom: Patrimoine touché par les guerres
  organisation: geopolitique
  elements:
  - six sites placés sur la Liste du patrimoine mondial en péril en juillet 2026, dont Sébastia (Palestine), les châteaux
    du Jabal Amel et Tyr (Liban), Chersonèse taurique (Ukraine) (The Art Newspaper, 29 juillet 2026)
  - destructions de monuments, de musées et de bibliothèques en Ukraine, à Gaza, au Liban, au Soudan
  niveau:
    espace: pays
    temps: années
    vitesse: jours
    taille: méso à macro
  traces:
  - source: Liste du patrimoine mondial en péril (UNESCO)
    statut: a_brancher
- id: restitutions
  nom: Restitutions de biens culturels
  organisation: convention
  elements:
  - loi française de 2026 sur la restitution - objets pris entre juin 1815 et avril 1972, sur demande d'un État, après
    avis d'un comité d'experts commun, par décret ; vote final unanime (The Art Newspaper, 14 avril 2026)
  niveau:
    espace: pays (anciennes puissances coloniales et pays d'origine)
    temps: décennies
    vitesse: années
    taille: macro
  traces: *id001
- id: usages_memoire
  nom: Usages politiques de la mémoire (lois mémorielles, récits concurrents)
  organisation: ideologie
  elements:
  - lois mémorielles, statues et noms de lieux, manuels scolaires
  - mémoires concurrentes entre États (guerres, colonisation, génocides)
  niveau:
    espace: pays et relations entre États
    temps: décennies
    vitesse: mois
    taille: macro
  traces: *id001
