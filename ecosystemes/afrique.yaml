- id: ressources_continent
  nom: Ressources et minerais
  organisation: mineral
  elements:
  - cobalt et cuivre (RD Congo, Zambie), uranium (Niger), platine et chrome (Afrique du Sud), bauxite (Guinée), phosphates
    (Maroc), hydrocarbures (Nigeria, Algérie, Libye, Angola)
  - voir la fiche des minerais critiques
  - 'dépendance minière (indice de contribution de la mine aux économies) : RD Congo 1re (minerais 88 % des exportations, production minière 33,5 % du PIB), Mali 2e, Mongolie 3e, Zimbabwe, Mauritanie, Liberia, Burkina Faso 7e, Sierra Leone, Tadjikistan, Nouvelle-Calédonie ; Guinée 11e, Niger 16e ; plus des deux tiers des 25 premiers sont des pays à revenu faible ou intermédiaire inférieur ; les trois juntes du Sahel (Mali, Burkina Faso, Niger) sont toutes dans les 16 premiers (ICMM, Mining Contribution Index, 7e édition, 2025, données de 2022)'
  niveau:
    espace: gisements
    temps: décennies
    vitesse: années
    taille: macro
