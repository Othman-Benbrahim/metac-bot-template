# 0.10.477 (décision de l'auteur, 2026-11-23, 18 h 43 - 18 h 49) : régions manquantes de la carte (Afrique comme
# continent, Antarctique, Australie, insularité, Asie du Sud-Est, Asie centrale, Arctique, Canada, Amérique latine).
# Indicateurs du bot d'abord (Banque mondiale, UCDP, collectes existantes), faits récents sourcés et datés ensuite ;
# aucune nouvelle source. Pays sous « geopolitique » proposés par Claude, acceptés par défaut.
theme: afrique
nom: Afrique (le continent)
declaration:
  but: 'voir l''Afrique comme un continent de la taille démographique de l''Inde : ses institutions communes, son marché,
    l''Afrique du Nord jusque-là absente de la carte, ses conflits et ses ressources ; la fiche Afrique subsaharienne en détaille
    le sud du Sahara'
  limites: dedans l'Union africaine, la zone de libre-échange continentale, l'Afrique du Nord (Maghreb, Égypte, Libye), le
    Sahara occidental, la démographie, les conflits vus à l'échelle du continent, les ressources, le climat, les puissances
    extérieures ; dehors le détail du sud du Sahara (afrique-subsaharienne) et du Soudan (soudan), sauf par les ponts
  observateur: notre carte, regard extérieur, depuis l'Europe ; sources publiques et indicateurs du bot (Banque mondiale,
    UCDP, GDELT)
  date: '2026-11-23'
  espace: 54 États membres de l'ONU, de la Méditerranée au cap de Bonne-Espérance
  temps: de la saison (pluies, récoltes) à la génération (démographie)
  vitesse: le jour (violences), l'année (budgets, sommets)
  taille: un district, un État, le continent
compartiments:
- id: demographie_continent
  nom: Démographie du continent
  organisation: societe
  elements:
  - environ 1,55 milliard d'habitants en 2025 pour 60 États et territoires (Banque mondiale, WDI, 2025) ; à peu près autant
    que l'Inde
  - la plus forte croissance démographique du monde ; populations très jeunes au sud du Sahara (voir afrique-subsaharienne)
  niveau:
    espace: continent
    temps: décennies
    vitesse: années
    taille: macro
- id: union_africaine
  nom: Union africaine et zone de libre-échange (ZLECAf)
  organisation: convention
  elements:
  - 'Union africaine : 55 membres, sommet annuel à Addis-Abeba ; comité des chefs d''État pour la mise en œuvre de la ZLECAf
    (sommet de février 2026)'
  - la ZLECAf, marché continental en construction, avance par étapes (règles d'origine, listes tarifaires)
  niveau:
    espace: continent
    temps: années
    vitesse: mois
    taille: macro
- id: afrique_nord
  nom: Afrique du Nord (Maghreb, Égypte, Libye)
  organisation: geopolitique
  geopolitique:
    pays:
    - DZA
    - EGY
    - LBY
    - MAR
    - TUN
    - MRT
  elements:
  - 'environ 229 millions d''habitants : Égypte 118 millions, Algérie 47, Maroc 38, Tunisie 12, Libye 7,5, Mauritanie 5 (Banque
    mondiale, WDI, 2025)'
  - 'chômage des 15-24 ans : Libye 50 %, Tunisie 38 %, Algérie 29 %, Maroc 22 %, Égypte 18 % (Banque mondiale, WDI, 2025,
    estimations OIT)'
  - tous classés « calme » par l'UCDP en octobre 2026 (UCDP, octobre 2026)
  - 'mécanisme : le Maroc se présente comme un pôle stable sur le détroit de Gibraltar ; Tanger-Med, premier complexe industriel et portuaire d''Afrique, 24e port à conteneurs mondial en 2022 ; cette image de stabilité sert sa diplomatie (Tanger Med Port Authority et CNUCED, via Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  - 'mécanisme : en Égypte, l''armée est un pilier de l''économie et les monarchies du Golfe financent un État surendetté, ce qui leur donne de l''influence (la nouvelle capitale administrative est construite sur ce modèle) (Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  niveau:
    espace: Méditerranée et Sahara
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - source: GDELT, manifestations par jour (Égypte)
    statut: collecte
    fichier: gdelt_bq.py
    adaptateur: manifestations:EG
  - source: GDELT, manifestations par jour (Algérie)
    statut: collecte
    fichier: gdelt_bq.py
    adaptateur: manifestations:DZ
  - source: GDELT, manifestations par jour (Maroc)
    statut: collecte
    fichier: gdelt_bq.py
