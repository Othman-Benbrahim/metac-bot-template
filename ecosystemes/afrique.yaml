  - source: GDELT, manifestations par jour (Tunisie)
    statut: collecte
    fichier: gdelt_bq.py
    adaptateur: manifestations:TN
- id: libye
  nom: Libye divisée
  organisation: geopolitique
  geopolitique:
    pays:
    - LBY
  elements:
  - 'deux autorités rivales : à l''ouest le gouvernement d''union nationale d''Abdul Hamid Dbeibah (Tripoli, reconnu par l''ONU),
    à l''est les forces de Khalifa Haftar (Benghazi)'
  - 'août 2026 : frappes de drones sur les installations énergétiques de Zaouïa (plus de 700 MW indisponibles), assassinat
    du chef du renseignement militaire de l''Est à Benghazi, démission non acceptée du gouverneur de la banque centrale (The
    National, 18 août 2026)'
  - les États-Unis cherchent un partage du pouvoir entre Dbeibah et Saddam Haftar ; aucune date d'élection
  - '20 octobre 2026 : la Chambre des représentants (Est), qui l''avait rejeté en 2019, approuve le mémorandum maritime turco-libyen
    de 2019, soutenu aussi par Dbeibah ; rejet par l''Égypte, la Grèce, Chypre et l''UE (Al-Ahram ; Daily Sabah ; Agenzia Nova,
    octobre 2026). La délimitation coupe les zones revendiquées par la Grèce autour de la Crète (Méditerranée orientale)'
  niveau:
    espace: pays
    temps: années
    vitesse: jours à mois
    taille: méso
  traces:
  - source: UCDP, morts par mois (Libye, carte lue chaque mois)
    statut: collecte
    fichier: lecture_cartes.py
    adaptateur: ucdp_mois:LBY
- id: sahara_occidental
  nom: Sahara occidental
  organisation: geopolitique
  geopolitique:
    pays:
    - MAR
    - DZA
    - ESH
  elements:
  - 'octobre 2025 : le Conseil de sécurité retient le plan d''autonomie marocain comme la solution « la plus réalisable »'
  - '2026 : veto russe à une résolution américaine, rejet d''une résolution russe ; la MINURSO s''arrête après 35 ans, phase
    de liquidation depuis le 1er novembre 2026 ; l''Algérie dénonce un « parti pris » américain, le Front Polisario s''inquiète
    (Reuters, 2 novembre 2026)'
  - 'mécanisme : le Maroc obtient des soutiens à son plan d''autonomie en se présentant comme partenaire stable dans la lutte antiterroriste et le contrôle des migrations vers l''Europe, et en investissant dans les provinces du Sud ; l''Algérie soutient le Front Polisario et accueille environ 175 000 réfugiés sahraouis (Atlas géopolitique mondial 2025, rédigé de mai 2023 à avril 2024)'
  niveau:
    espace: Sahara occidental et Maghreb
    temps: décennies
    vitesse: mois
    taille: macro
- id: conflits_continent
  nom: Conflits à l'échelle du continent
  organisation: geopolitique
  geopolitique:
    pays:
    - NGA
    - SDN
    - ETH
    - COD
    - BFA
    - MLI
    - SOM
    - SSD
    - ZAF
    - TCD
    - CMR
    - MOZ
  elements:
  - 'douze pays en état « moyen » (25 à 999 morts dans le mois) en octobre 2026 : Nigeria 970, Soudan 730, Éthiopie 612, RD
    Congo 345, Burkina Faso 174, Mali 168, Somalie 158, Soudan du Sud 87, Afrique du Sud 53, Tchad 49, Cameroun 36, Mozambique
    29 (UCDP, octobre 2026)'
  - aucun en état « haut » ce mois-là ; l'Afrique du Nord est calme
