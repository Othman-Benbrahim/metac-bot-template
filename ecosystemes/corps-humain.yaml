  traces:
  - source: aucune trace directe
    statut: inconnue
  - &id001
    source: situations observées (lecteur-local, comptes/situations.jsonl)
    statut: a_brancher
- id: nutrition
  nom: Nutrition et faim (sous-nutrition, carences, obésité)
  organisation: corps
  elements:
  - environ 673 millions de personnes ayant souffert de la faim en 2024, soit 8,2 % (SOFI 2025)
  - 2,6 milliards ne pouvant s'offrir une alimentation saine (SOFI 2025)
  - carences
  - obésité
  acteurs:
  - nom: des populations sous-nourries (en agrégat)
    taille: macro
    espace: pays
    vitesse: mois
    organisation: corps
    facette: collectif
  niveau:
    espace: pays
    temps: années
    vitesse: mois à années
    taille: macro
  traces:
  - source: SOFI (FAO, FIDA, UNICEF, PAM, OMS), faim par pays
    statut: a_brancher
  - source: alertes de famine IPC
    statut: a_brancher
  - *id001
- id: maladies_chroniques
  nom: Maladies non transmissibles (cœur et vaisseaux, cancers, diabète, poumons)
  organisation: corps
  elements:
  - au moins 43 millions de décès en 2021, environ 75 % des décès hors pandémie, dont 18 millions avant 70 ans (OMS)
  - tension artérielle, tabac, alimentation, alcool, sédentarité
  - 'pollution de l''air : environ 5,6 millions de décès par ces maladies (OMS)'
  niveau:
    espace: pays
    temps: années à décennies
    vitesse: années
    taille: macro
  traces:
  - source: estimations sanitaires mondiales de l'OMS (Global Health Estimates)
    statut: a_brancher
  - *id001
- id: sante_mentale
  nom: Santé mentale et suicide
  organisation: psychologique
  elements:
  - plus d'un milliard de personnes vivant avec un trouble mental (OMS, 2025)
  - environ 727 000 suicides en 2021 (OMS)
  niveau:
    espace: pays
    temps: années
    vitesse: années
    taille: macro
  traces:
  - source: OMS, Atlas de la santé mentale et World mental health today
    statut: a_brancher
  - *id001
- id: chaleur_froid
  nom: Chaleur, froid et corps (régulation thermique, morts de chaleur)
  organisation: physique
  elements:
  - coups de chaleur
  - vagues de chaleur et mortalité
  - froid extrême
  niveau:
    espace: lieux et villes
    temps: heures à saisons
    vitesse: jours
    taille: micro à méso
  traces:
  - source: ERA5-Land, températures maximales aux points suivis (collecte_agro.py)
    statut: a_brancher
  - *id001
- id: pollution
  nom: Pollution et corps (air, eau, substances chimiques)
  organisation: chimique
  elements:
  - environ 7 millions de décès prématurés par an liés à l'air extérieur et domestique (OMS)
  - 99 % de l'humanité respire un air au-dessus de la valeur guide de l'OMS pour les particules fines
  - substances chimiques et métaux
  niveau:
    espace: villes et pays
    temps: jours à années
    vitesse: jours à années
    taille: micro à macro
  traces:
  - source: OMS, exposition à la pollution de l'air
    statut: a_brancher
  - source: mesures de la qualité de l'air (OpenAQ, licence à vérifier)
    statut: a_brancher
  - *id001
- id: antimicrobiens
  nom: Immunité et résistance aux antimicrobiens
  organisation: microbiologique
  elements:
  - 1,14 million de décès directement attribuables en 2021, 4,71 millions associés (étude GRAM, The Lancet, 2024)
  - environ 1,91 million de décès directs par an prévus en 2050 sans nouvelles mesures
  acteurs:
