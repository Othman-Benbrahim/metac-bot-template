# 0.10.414 — fiche créée le 2026-11-22 (décision de l'auteur, 3 h 26) : deuxième des « plus gros trous » de la carte (le corps
# humain, en agrégat). Relations à vérifier sur sources.
theme: corps-humain
nom: Le corps humain (en agrégat, monde)
declaration:
  but: 'comprendre le corps humain comme milieu et comme force, en agrégat : besoins vitaux, nutrition, maladies non transmissibles
    (au moins 43 millions de décès en 2021, OMS), santé mentale (plus d''un milliard de personnes, OMS 2025), chaleur, pollution
    (environ 7 millions de décès prématurés par an, OMS), résistance aux antimicrobiens, vieillissement, soins, reproduction'
  limites: dedans le corps humain en population (jamais une personne privée), ses besoins, ses maladies non infectieuses,
    ses expositions et les systèmes qui le soignent ; dehors les épidémies infectieuses (fiche epidemies), les ressorts du
    comportement (fiche humain), l'eau (fiche eau-douce-potable), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (OMS, FAO, ONU, IHME, The Lancet) ; aucune personne privée
  date: '2026-11-22'
  espace: le monde, par pays
  temps: de l'heure (un coup de chaleur) à la vie entière (le vieillissement)
  vitesse: l'heure (soif, chaleur), l'année (faim, maladies), la décennie (espérance de vie, résistance aux antimicrobiens)
  taille: micro (le corps, en agrégat) à macro (la population mondiale)
compartiments:
- id: besoins_vitaux
  nom: Besoins vitaux (eau, énergie, oxygène, sommeil, température du corps)
  organisation: corps
  elements:
  - besoins en eau et en énergie
  - oxygène
  - sommeil
  - maintien de la température du corps
  niveau:
    espace: la personne, en agrégat
    temps: heures à jours
    vitesse: heures
