relations:
- de: energie
  vers: prix_conso
  effet: +
  delai: semaines à mois
  force: forte
  intensite:
    mesure: écart du Brent à sa moyenne récente
    regle: proportionnelle
  coupure: boucliers tarifaires et subventions
  statut: a_verifier
  texte: l'énergie passe vite dans les prix, d'abord par les carburants
- de: alimentation
  vers: prix_conso
  effet: +
  delai: mois
  force: moyenne
  intensite:
    mesure: écart de l'indice alimentaire à sa moyenne
    regle: proportionnelle
  coupure: part de l'alimentation dans le panier (forte dans les pays pauvres)
  statut: a_verifier
  texte: les prix alimentaires pèsent plus lourd dans les pays pauvres
- de: prix_conso
  vers: salaires
  effet: +
  retour: +
  forme: mutualisme
  delai: mois à années
  force: moyenne
  intensite:
    mesure: tension sur le marché du travail
    regle: seuil
  coupure: chômage élevé, salaires non indexés
  statut: a_verifier
  texte: 'boucle prix-salaires : chacun nourrit l''autre quand le travail manque'
- de: prix_conso
  vers: anticipations
  effet: +
  delai: mois
  force: moyenne
  intensite:
    mesure: durée de l'inflation au-dessus de la cible
    regle: hysteresis
  coupure: banque centrale crédible
  statut: a_verifier
  texte: une inflation qui dure désancre les anticipations ; elles ne redescendent pas par le même chemin
- de: anticipations
  vers: prix_conso
  effet: +
  delai: mois
  force: moyenne
  coupure: crédibilité retrouvée
  statut: a_verifier
  texte: des anticipations hautes font fixer des prix et des salaires plus hauts
- de: prix_conso
  vers: banques_centrales
  effet: +
  retour: '-'
  delai: semaines
  force: forte
  coupure: contraintes politiques sur la banque centrale
  statut: a_verifier
  texte: 'boucle de régulation : l''inflation fait monter les taux, les taux freinent l''inflation'
- de: banques_centrales
  vers: salaires
  effet: '-'
  delai: mois à années
  force: moyenne
  coupure: politique budgétaire expansive
  statut: a_verifier
  texte: la hausse des taux refroidit l'activité et le marché du travail, avec un long retard
- de: banques_centrales
  vers: monnaies
  effet: +
  delai: jours
  force: forte
  coupure: si les autres banques centrales suivent
  statut: a_verifier
  texte: des taux américains plus hauts renforcent le dollar
- de: monnaies
  vers: prix_conso
  effet: ±
  delai: mois
  force: moyenne
  intensite:
    mesure: variation du dollar
    regle: proportionnelle
  coupure: économies peu importatrices
  statut: a_verifier
  texte: un dollar fort importe de l'inflation chez les autres et en exporte peu aux États-Unis
- de: approvisionnement
  vers: prix_conso
  effet: +
  delai: mois
  force: moyenne
  intensite:
    mesure: perturbations des détroits et du fret
    regle: seuil
  coupure: stocks des entreprises
  statut: a_verifier
  texte: des chaînes bloquées font monter les prix des biens
- de: budget
  vers: prix_conso
  effet: ±
  delai: mois
  force: moyenne
  coupure: économie en sous-emploi
  statut: a_verifier
  texte: subventions et boucliers baissent les prix mesurés ; déficits et droits de douane les montent
- de: budget
  vers: banques_centrales
  effet: '-'
  retour: '-'
  forme: competition
  delai: mois
  force: faible
  coupure: coordination
  statut: a_verifier
  texte: quand le budget relance et la banque centrale freine, chacun réduit l'effet de l'autre
- de: statistiques
  vers: banques_centrales
  effet: ±
  delai: jours
  force: moyenne
  coupure: révisions ultérieures
  statut: a_verifier
  texte: les décisions suivent le chiffre publié, convention qui peut être révisée ou contestée
- de: epidemies
  vers: elevage_cultures
  effet: '-'
  delai: semaines
  force: forte
  intensite:
    mesure: nombre de foyers déclarés
    regle: seuil
  coupure: vaccination, biosécurité
  statut: a_verifier
  texte: 'une épizootie (grippe aviaire, peste porcine) décime des élevages : l''effet passe du microbe à l''animal'
- de: elevage_cultures
  vers: alimentation
  effet: ±
  delai: semaines à mois
  force: moyenne
  intensite:
    mesure: part du cheptel ou de la récolte perdue
    regle: seuil
  coupure: importations, stocks
  statut: a_verifier
  texte: des pertes d'élevage ou de récolte font monter certains prix alimentaires (œufs, porc, céréales)
- de: epidemies
  vers: approvisionnement
  effet: '-'
  delai: semaines
  force: forte
  intensite:
    mesure: mesures de fermeture en vigueur
    regle: seuil
  coupure: fin des restrictions
  statut: a_verifier
  texte: une épidémie humaine ferme usines, ports et frontières
- de: epidemies
  vers: statistiques
  effet: ±
  delai: jours à mois
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: 'un virus existe, mais ce qui en est compté dépend de conventions : définition d''un cas, déclaration d''urgence, méthode des indices de prix'
- de: climat_regime
  vers: elevage_cultures
  effet: '-'
  delai: années
  force: moyenne
  intensite:
    mesure: dérive annuelle de la température
    regle: proportionnelle
  coupure: irrigation, variétés adaptées
  statut: a_verifier
  texte: un climat plus chaud et plus sec réduit rendements et pâturages
- de: monnaies
  vers: energie
  effet: ±
  delai: jours à semaines
  force: moyenne
  coupure: pays exportateurs d'énergie
  statut: a_verifier
  texte: 'au sein du niveau économique : un dollar fort renchérit l''énergie, payée en dollars, pour les autres pays'
- de: budget
  vers: statistiques
  effet: ±
  delai: mois
  force: faible
  coupure: indépendance de l'institut
  statut: a_verifier
  texte: 'au croisement du statut et de la convention : subventions et boucliers changent le chiffre mesuré sans changer la cause'
