theme: inflation-mondiale
nom: Inflation mondiale
declaration:
  but: "comprendre ce qui fait monter ou baisser les prix à la consommation, comment les banques centrales y répondent, et ce que cela transmet (questions du tournoi sur l'inflation, les taux, les monnaies, la dette)"
  limites: "dedans les prix de l'énergie et de l'alimentation, les salaires, les anticipations, les banques centrales, les monnaies, les chaînes d'approvisionnement, les statistiques officielles ; dehors la croissance de long terme et la démographie (thèmes voisins)"
  observateur: "notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement"
  date: "2026-11-19"
  espace: "les grandes économies (États-Unis, zone euro, Chine) et le monde par les prix des matières premières et le dollar"
  temps: "du relevé mensuel au cycle de plusieurs années ; mémoire des années 1970, de 2008 et de 2021-2023"
  vitesse: "la séance (marchés), le mois (statistiques, décisions), l'année (salaires, contrats)"
  taille: "un ménage, une entreprise, une économie nationale, le monde"
compartiments:
  - id: energie
    nom: "Prix de l'énergie"
    elements: ["carburants", "gaz et électricité des ménages", "coûts de production"]
    niveau: {espace: "mondial", temps: "séances ; factures mensuelles", vitesse: "jours à mois", taille: "macro"}
    traces:
      - {source: "prix du Brent (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DCOILBRENTEU"}
  - id: alimentation
    nom: "Prix alimentaires"
    elements: ["céréales", "huiles", "engrais", "récoltes", "interdictions d'export"]
    niveau: {espace: "mondial", temps: "saisons ; récoltes", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "indice mondial des prix alimentaires du FMI (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:PFOODINDEXM"}
  - id: prix_conso
    nom: "Prix à la consommation"
    elements: ["inflation totale", "inflation sous-jacente", "loyers", "services"]
    acteurs:
      - {nom: "un ménage", taille: "micro", espace: "local", vitesse: "mois"}
    niveau: {espace: "pays", temps: "publication mensuelle", vitesse: "mois", taille: "macro"}
    traces:
      - {source: "indice des prix américain (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:CPIAUCSL"}
      - {source: "prévision immédiate de l'inflation (Réserve fédérale de Cleveland)", statut: "collecte", fichier: "collecte_nowcast_inflation.py", adaptateur: "nowcast:variation_mensuelle:CPI"}
  - id: salaires
    nom: "Salaires et emploi"
    elements: ["négociations salariales", "chômage", "tensions sur le marché du travail", "indexation"]
    acteurs:
      - {nom: "une entreprise", taille: "micro", espace: "local", vitesse: "mois"}
      - {nom: "les syndicats et les branches", taille: "méso", espace: "pays", vitesse: "année"}
    niveau: {espace: "pays", temps: "contrats annuels", vitesse: "mois à années", taille: "méso à macro"}
    traces:
      - {source: "salaire horaire moyen américain (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:CES0500000003"}
      - {source: "taux de chômage américain (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:UNRATE"}
  - id: anticipations
    nom: "Anticipations d'inflation"
    elements: ["inflation anticipée par les marchés", "enquêtes auprès des ménages", "crédibilité des banques centrales"]
    niveau: {espace: "pays", temps: "séances ; enquêtes mensuelles", vitesse: "jours à mois", taille: "macro"}
    traces:
      - {source: "inflation anticipée à 10 ans (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:T10YIE"}
  - id: banques_centrales
    nom: "Banques centrales"
    elements: ["taux directeurs", "bilans", "communication", "indépendance"]
    acteurs:
      - {nom: "Réserve fédérale", taille: "macro", espace: "mondial", vitesse: "semaines"}
      - {nom: "Banque centrale européenne", taille: "macro", espace: "continent", vitesse: "semaines"}
      - {nom: "Banque populaire de Chine", taille: "macro", espace: "pays", vitesse: "semaines"}
    niveau: {espace: "pays et zones monétaires", temps: "réunions datées", vitesse: "semaines", taille: "macro"}
    traces:
      - {source: "taux effectif de la Réserve fédérale (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DFF"}
      - {source: "taux de dépôt de la BCE (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:ECBDFR"}
  - id: monnaies
    nom: "Monnaies et dollar"
    elements: ["dollar", "monnaies des pays émergents", "prix des importations"]
    niveau: {espace: "mondial", temps: "séances", vitesse: "jours", taille: "macro"}
    traces:
      - {source: "indice large du dollar (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DTWEXBGS"}
  - id: approvisionnement
    nom: "Chaînes d'approvisionnement"
    elements: ["fret maritime", "délais de livraison", "détroits", "droits de douane"]
    niveau: {espace: "routes mondiales", temps: "semaines à mois", vitesse: "semaines", taille: "méso à macro"}
    traces:
      - {source: "IMF PortWatch (porte-conteneurs à Suez)", statut: "collecte", fichier: "collecte_portwatch.py", adaptateur: "portwatch:suez:porte_conteneurs"}
  - id: budget
    nom: "Politique budgétaire"
    elements: ["déficits", "subventions et boucliers tarifaires", "droits de douane", "dette publique"]
    acteurs:
      - {nom: "un gouvernement national", taille: "macro", espace: "pays", vitesse: "mois"}
    niveau: {espace: "pays", temps: "lois de finances ; échéances électorales", vitesse: "mois à années", taille: "macro"}
    traces:
      - {source: "taux américain à 10 ans (FRED)", statut: "collecte", fichier: "collecte_fred.py", adaptateur: "fred:DGS10"}
  - id: statistiques
    nom: "Statistiques officielles (convention)"
    elements: ["méthodes de calcul", "calendriers de publication", "révisions", "confiance dans les chiffres"]
    acteurs:
      - {nom: "un institut statistique national", taille: "méso", espace: "pays", vitesse: "mois"}
    niveau: {espace: "pays", temps: "calendriers de publication", vitesse: "mois", taille: "méso"}
    traces:
      - {source: "calendrier des statistiques chinoises", statut: "collecte", fichier: "collecte_calendrier_nbs.py"}
relations:
  - {de: "energie", vers: "prix_conso", effet: "+", delai: "semaines à mois", force: "forte", intensite: {mesure: "écart du Brent à sa moyenne récente", regle: "proportionnelle"}, coupure: "boucliers tarifaires et subventions", statut: "a_verifier", texte: "l'énergie passe vite dans les prix, d'abord par les carburants"}
  - {de: "alimentation", vers: "prix_conso", effet: "+", delai: "mois", force: "moyenne", intensite: {mesure: "écart de l'indice alimentaire à sa moyenne", regle: "proportionnelle"}, coupure: "part de l'alimentation dans le panier (forte dans les pays pauvres)", statut: "a_verifier", texte: "les prix alimentaires pèsent plus lourd dans les pays pauvres"}
  - {de: "prix_conso", vers: "salaires", effet: "+", retour: "+", forme: "mutualisme", delai: "mois à années", force: "moyenne", intensite: {mesure: "tension sur le marché du travail", regle: "seuil"}, coupure: "chômage élevé, salaires non indexés", statut: "a_verifier", texte: "boucle prix-salaires : chacun nourrit l'autre quand le travail manque"}
  - {de: "prix_conso", vers: "anticipations", effet: "+", delai: "mois", force: "moyenne", intensite: {mesure: "durée de l'inflation au-dessus de la cible", regle: "hysteresis"}, coupure: "banque centrale crédible", statut: "a_verifier", texte: "une inflation qui dure désancre les anticipations ; elles ne redescendent pas par le même chemin"}
  - {de: "anticipations", vers: "prix_conso", effet: "+", delai: "mois", force: "moyenne", coupure: "crédibilité retrouvée", statut: "a_verifier", texte: "des anticipations hautes font fixer des prix et des salaires plus hauts"}
  - {de: "prix_conso", vers: "banques_centrales", effet: "+", retour: "-", delai: "semaines", force: "forte", coupure: "contraintes politiques sur la banque centrale", statut: "a_verifier", texte: "boucle de régulation : l'inflation fait monter les taux, les taux freinent l'inflation"}
  - {de: "banques_centrales", vers: "salaires", effet: "-", delai: "mois à années", force: "moyenne", coupure: "politique budgétaire expansive", statut: "a_verifier", texte: "la hausse des taux refroidit l'activité et le marché du travail, avec un long retard"}
  - {de: "banques_centrales", vers: "monnaies", effet: "+", delai: "jours", force: "forte", coupure: "si les autres banques centrales suivent", statut: "a_verifier", texte: "des taux américains plus hauts renforcent le dollar"}
  - {de: "monnaies", vers: "prix_conso", effet: "±", delai: "mois", force: "moyenne", intensite: {mesure: "variation du dollar", regle: "proportionnelle"}, coupure: "économies peu importatrices", statut: "a_verifier", texte: "un dollar fort importe de l'inflation chez les autres et en exporte peu aux États-Unis"}
  - {de: "approvisionnement", vers: "prix_conso", effet: "+", delai: "mois", force: "moyenne", intensite: {mesure: "perturbations des détroits et du fret", regle: "seuil"}, coupure: "stocks des entreprises", statut: "a_verifier", texte: "des chaînes bloquées font monter les prix des biens"}
  - {de: "budget", vers: "prix_conso", effet: "±", delai: "mois", force: "moyenne", coupure: "économie en sous-emploi", statut: "a_verifier", texte: "subventions et boucliers baissent les prix mesurés ; déficits et droits de douane les montent"}
  - {de: "budget", vers: "banques_centrales", effet: "-", retour: "-", forme: "competition", delai: "mois", force: "faible", coupure: "coordination", statut: "a_verifier", texte: "quand le budget relance et la banque centrale freine, chacun réduit l'effet de l'autre"}
  - {de: "statistiques", vers: "banques_centrales", effet: "±", delai: "jours", force: "moyenne", coupure: "révisions ultérieures", statut: "a_verifier", texte: "les décisions suivent le chiffre publié, convention qui peut être révisée ou contestée"}
ponts:
  - {depuis: "energie", vers: "energie-mondiale:prix", type: "meme", nature: "le prix de l'énergie vient du marché mondial"}
  - {depuis: "energie", vers: "ormuz:prix", type: "meme", nature: "un choc sur Ormuz passe par les prix de l'énergie"}
  - {depuis: "approvisionnement", vers: "transport-maritime:detroits", nature: "les détroits et le fret"}
  - {depuis: "alimentation", vers: "alimentation-mondiale:prix", nature: "récoltes, engrais, interdictions d'export"}
  - {depuis: "monnaies", vers: "dette-emergents:monnaies", nature: "un dollar fort serre les pays endettés en dollars"}
  - {depuis: "budget", vers: "politique-americaine:budget", nature: "droits de douane, déficits, pression sur la Réserve fédérale"}
  - {depuis: "statistiques", vers: "economie-chinoise:statistiques", nature: "fiabilité des chiffres officiels chinois"}
