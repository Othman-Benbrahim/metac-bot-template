  - source: "décisions des régulateurs (FTC, CNIL) contre des courtiers ; à brancher"
    statut: a_brancher
- id: biometrie
  nom: Surveillance biométrique et vidéo
  organisation: technique
  elements:
  - "Union européenne : la loi sur l'IA interdit, depuis le 2 février 2025, l'identification biométrique à distance en temps réel dans l'espace public par la police, sauf exceptions encadrées (Commission européenne, cadre réglementaire de l'IA)"
  niveau:
    espace: pays à monde
    temps: années
    vitesse: mois
    taille: macro
    objet: information
  traces:
