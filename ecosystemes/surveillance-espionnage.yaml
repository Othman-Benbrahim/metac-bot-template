# Fiche créée le 2026-11-25 (angle mort signalé par l'auteur, 7 h 04 : « quand on surveille on observe, c'est la partie
# passive, mais elle permet aussi d'agir » ; trois niveaux : États, entreprises spécialisées, individus). Chiffres vérifiés
# le 2026-11-25 sur les sources citées. Relations à vérifier par les séries.
theme: surveillance-espionnage
nom: Surveillance et espionnage
declaration:
  but: "voir la surveillance comme un écosystème à double face : observer (passif) et agir sur ce qu'on observe (actif) ; trois niveaux : les États (renseignement, interceptions, espionnage entre États), le privé (vendeurs de logiciels espions et d'outils d'intrusion, courtiers en données), les individus (cibles : journalistes, élus, opposants ; et surveillance entre particuliers) ; le droit qui l'encadre, et la résistance qu'elle suscite (chiffrement, alertes, contentieux)"
  limites: "dedans le renseignement d'État et ses lois, l'espionnage entre États, l'industrie commerciale de l'intrusion, les courtiers en données, la surveillance biométrique, les cibles et les contre-mesures ; dehors la cybercriminalité ordinaire (information-cyber:cyber), la censure (information-cyber:censure), les armées (militaire), sauf par les ponts ; aucune personne privée nommée"
  observateur: "notre carte, regard extérieur ; sources publiques (presse, rapports d'ONG et d'instituts, documents officiels) ; seuls les faits publics et les figures publiques dans leur rôle public"
  date: '2026-11-25'
  espace: le monde
  temps: du jour (une intrusion) à la décennie (une loi, une doctrine)
  vitesse: l'heure (une alerte, une fuite), le mois (une loi prorogée), l'année (un marché, une campagne d'espionnage)
  taille: de l'individu ciblé à l'appareil d'État
compartiments:
- id: renseignement_etats
  nom: Renseignement d'État et lois de surveillance
  organisation: geopolitique
  elements:
  - "États-Unis : la section 702 du FISA (interceptions de communications d'étrangers hors du territoire) a expiré le 12 juin 2026 après plusieurs prorogations courtes, dont une de 45 jours votée le 30 avril 2026 (261 voix contre 111 à la Chambre) ; la collecte continue sous les autorisations annuelles du tribunal FISC, valables jusqu'en mars 2027 (NPR, 12 juin 2026 ; Washington Times, 30 avril 2026 ; RealClearDefense, 18 novembre 2026)"
  - "toujours expirée au 18 novembre 2026 ; sans nouvelle loi, les autorisations tombent en mars 2027 (RealClearDefense, 18 novembre 2026)"
  acteurs:
  - nom: Congrès des États-Unis
    taille: macro
    espace: pays
    vitesse: mois
    organisation: geopolitique
    facette: collectif
  niveau:
    espace: pays à monde
    temps: années
    vitesse: mois
    taille: macro
    objet: information
  traces:
  - {source: "articles qui nomment les interceptions légales (FISA, section 702, écoutes, surveillance de masse), par jour ; flux suivis : Citizen Lab, EFF, The Record, Google TAG, CISA, CERT-FR, Intelligence Online, Rest of World, Defense One (comptes seulement ; 2026-11-25, demande de l’auteur)", statut: collecte, fichier: collecte_rss.py, adaptateur: "rss_matiere:interceptions"}
  - source: "échéances législatives (prorogations, expiration, autorisations du FISC) ; relevé manuel sourcé"
    statut: a_brancher
- id: espionnage_etats
  nom: Espionnage entre États
  organisation: geopolitique
  elements:
  - "Salt Typhoon (groupe lié au renseignement chinois) : intrusions dans les réseaux de télécommunications, plus de 80 pays touchés selon le FBI, menace « toujours très en cours » (CyberScoop, 19 février 2026)"
  - "attributions publiques d'opérations d'espionnage d'un État par un autre"
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
    objet: information
  traces:
  - {source: "articles qui nomment l'espionnage d'État (espionnage, Salt Typhoon, Volt Typhoon, groupes APT), par jour ; flux suivis : Citizen Lab, EFF, The Record, Google TAG, CISA, CERT-FR, Intelligence Online, Rest of World, Defense One (comptes seulement ; 2026-11-25, demande de l’auteur)", statut: collecte, fichier: collecte_rss.py, adaptateur: "rss_matiere:espionnage"}
  - source: "attributions publiques et avis conjoints des agences (CISA, FBI, ANSSI, NCSC) ; via les flux déjà collectés des CERT"
    statut: a_brancher
- id: industrie_intrusion
  nom: Industrie commerciale de l'intrusion (logiciels espions)
  organisation: economie
  elements:
  - "vendeurs de logiciels espions et d'outils d'intrusion vendus aux États ; marché concentré en Israël, en Inde et en Italie ; les vendeurs sanctionnés reviennent sous d'autres noms et par des filiales (Dark Reading, 6 septembre 2024, d'après le DFRLab de l'Atlantic Council)"
  - "sanctions américaines : NSO Group et Candiru (2021), Intellexa (2023), sept entités au Trésor (mars 2024) (Dark Reading, 2024)"
  - "processus de Pall Mall (France, Royaume-Uni) : code de pratique pour les États (2024) soutenu par 27 pays ; lignes directrices volontaires pour l'industrie adoptées par 14 gouvernements au Forum de Paris sur la paix ; l'IA abaisse les barrières d'entrée (Stimson Center, 19 novembre 2026)"
  - "alertes de menace d'Apple envoyées dans 99 pays (Stimson Center, 2026)"
  acteurs:
  - nom: un vendeur de logiciel espion
    taille: méso
    espace: monde
    vitesse: mois
    organisation: economie
    facette: collectif
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: méso
    objet: argent
  traces:
  - {source: "articles qui nomment un logiciel espion ou un vendeur (Pegasus, Predator, Paragon, NSO, Intellexa, Candiru, sans clic), par jour ; flux suivis : Citizen Lab, EFF, The Record, Google TAG, CISA, CERT-FR, Intelligence Online, Rest of World, Defense One (comptes seulement ; 2026-11-25, demande de l’auteur)", statut: collecte, fichier: collecte_rss.py, adaptateur: "rss_matiere:spyware"}
  - source: "rapports publics de laboratoires (Citizen Lab, Amnesty Tech, Google TAG) : nombre par mois"
    statut: a_brancher
- id: courtiers_donnees
  nom: Courtiers en données et surveillance commerciale
  organisation: economie
  elements:
  - "achat et revente de données de localisation et de navigation ; un moyen pour des agences d'obtenir sans mandat ce qu'une loi encadrerait"
  niveau:
