  - source: "cas publics documentés par des laboratoires indépendants"
    statut: a_brancher
- id: contre_mesures
  nom: Contre-mesures (chiffrement, alertes, contentieux, contrôle parlementaire)
  organisation: technique
  elements:
  - "chiffrement de bout en bout et moindre privilège, recommandés par le FBI face à Salt Typhoon (CyberScoop, 2026)"
  - "alertes de menace des fabricants ; contentieux contre les vendeurs ; déclassification de décisions du tribunal FISC obtenue au Sénat en avril 2026 (Washington Times, 30 avril 2026)"
  niveau:
