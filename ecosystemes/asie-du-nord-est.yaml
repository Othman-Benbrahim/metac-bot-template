theme: asie-du-nord-est
nom: Asie du Nord-Est (Corées, Japon, voisinage de la Chine)
declaration:
  but: 'comprendre les équilibres de l''Asie du Nord-Est : une Corée du Nord qui refuse de dénucléariser et reçoit l''aide
    militaire de la Russie, une Corée du Sud et un Japon alliés des États-Unis, un Japon qui réarme (budget de défense
    record pour 2026) et une relation Chine-Japon tendue depuis novembre 2025'
  limites: dedans les deux Corées, le Japon, leurs alliances, leurs différends avec la Chine et la Russie vus depuis la
    région ; dehors Taïwan et le détroit (rivalite-sino-americaine), la Chine vue de l'intérieur (economie-chinoise), la
    guerre en Ukraine (russie-ukraine), le régime mondial de non-prolifération (non-proliferation), sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (Service de recherche du Congrès américain, Long War
    Journal, presse) ; aucune personne privée
  date: '2026-11-22'
  espace: le pays, la péninsule, la mer du Japon et la mer de Chine orientale
  temps: du jour (un tir de missile, un verrouillage radar) à la décennie (programmes nucléaires, réarmement)
  vitesse: le jour (tirs, incidents), le mois (sommets, sanctions), l'année (budgets, alliances)
  taille: méso (une base, un navire) à macro (la région)
