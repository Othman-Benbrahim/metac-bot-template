theme: economie-chinoise
nom: Économie chinoise
declaration:
  but: comprendre ce qui fait l'activité chinoise, sa demande de matières premières, ses exportations et la fiabilité de ses chiffres, et ce que cela transmet aux autres écosystèmes (questions du tournoi
    sur la croissance, le chômage des jeunes, l'immobilier, les échanges)
  limites: dedans l'activité, l'immobilier et les collectivités locales, l'industrie et les exportations, la consommation, l'emploi, la politique monétaire et budgétaire, les statistiques officielles, la
    demande de matières premières ; dehors la politique militaire et Taïwan (thème voisin, relié par un pont)
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; chiffres officiels lus comme des conventions
  date: '2026-11-19'
  espace: la Chine, ses provinces, ses partenaires commerciaux et les marchés mondiaux des matières premières
  temps: du relevé mensuel au plan quinquennal ; mémoire de 2008, 2015 et de la crise immobilière ouverte en 2021 (à vérifier)
  vitesse: la semaine (annonces), le mois (statistiques), l'année (plans, objectifs de croissance)
  taille: un ménage, une entreprise, une province, l'économie nationale
