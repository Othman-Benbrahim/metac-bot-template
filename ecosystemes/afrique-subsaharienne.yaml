- id: acces_electricite
  nom: Accès à l'électricité
  organisation: technique
  elements:
  - 563 millions de personnes sans électricité en Afrique subsaharienne en 2024, 86 % du manque mondial (Suivi de l'ODD 7,
    rapport 2026, AIE, IRENA, Banque mondiale)
  - baisse record de 8 millions des personnes sans électricité en 2025 ; environ 9 millions raccordées par des kits
    solaires domestiques (AIE, 2026)
  - Mission 300 (Banque mondiale, Banque africaine de développement) - plus de 50 millions de personnes raccordées dans
    40 pays, objectif 300 millions en 2030 ; 30 pacs énergétiques nationaux (Banque mondiale, 16 juin 2026)
  niveau:
    espace: pays
    temps: années
    vitesse: mois
    taille: micro (un foyer) à macro
