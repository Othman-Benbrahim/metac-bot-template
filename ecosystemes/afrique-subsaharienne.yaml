- id: argent_mobile
  nom: Argent mobile et paiements numériques
  organisation: technique
  elements:
  - dans le monde, plus de 2 000 milliards de dollars de transactions en 2025, 2,3 milliards de comptes (+268 millions),
    593 millions de comptes actifs à 30 jours (+15 %) ; l'Afrique subsaharienne fournit l'essentiel des nouveaux comptes
    (GSMA, rapport sur l'état de l'argent mobile 2026, 24 mars 2026)
  niveau:
