    Botswana), à Maurice et au Ghana ; l'ANC perd sa majorité absolue en Afrique du Sud pour la première fois en 30 ans
    (Al Jazeera, 11 décembre 2024)
  - contestations postélectorales ailleurs (Mozambique, octobre 2024) (même source)
