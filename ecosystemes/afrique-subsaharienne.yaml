    terrorisme 2026, IEP, 19 mars 2026)
  - blocus du carburant imposé par le JNIM au Mali à partir du 3 septembre 2025 ; écoles fermées et coupures à Bamako à
    l'automne 2025 ; blocus total de Bamako annoncé le 28 avril 2026 (presse et Wikipédia, à recouper)
