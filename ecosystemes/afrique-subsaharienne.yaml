# 0.10.422 — fiche créée le 2026-11-22 (décision de l'auteur, 4 h 34 : « commence dans l'ordre et comble ce qui manque »,
# régions absentes en premier). Le Soudan a sa propre fiche (soudan), reliée par un pont. Chiffres vérifiés le
# 2026-11-22. Relations à vérifier sur sources. Acteurs publics dans leur rôle public seulement.
theme: afrique-subsaharienne
nom: Afrique subsaharienne et Sahel
declaration:
  but: 'comprendre les dynamiques politiques et sécuritaires de l''Afrique subsaharienne, centrées sur le Sahel, les
    Grands Lacs et la Corne : juntes, groupes armés, médiations, puissances extérieures, déplacements ; le Sahel concentre
    près de la moitié des morts du terrorisme dans le monde en 2025, pour la troisième année de suite (Indice mondial du
    terrorisme, Institut pour l''économie et la paix, mars 2026) ; près de 45 millions d''Africains déplacés de force
    (Centre d''études stratégiques de l''Afrique, septembre 2026)'
  limites: dedans le Sahel central (Mali, Burkina Faso, Niger) et ses voisins côtiers, les Grands Lacs (RDC, Rwanda, M23),
    la Corne (Somalie, Éthiopie, Érythrée), les institutions régionales, les puissances extérieures, les déplacements,
    les ressources du sous-sol ; dehors le Soudan (soudan), la dette (dette-emergents), les minerais vus comme marché
    mondial, sauf par les ponts
  observateur: notre carte, regard extérieur, sources publiques (IEP, ACSS, HCR, ACLED, presse) ; aucune personne privée
  date: '2026-11-22'
  espace: le pays, la région (Sahel, Grands Lacs, Corne), le continent
  temps: du jour (une attaque, un blocus) à la décennie (insurrections installées)
  vitesse: le jour (attaques), le mois (médiations, coups d'État), l'année (déplacements, alliances)
  taille: micro (un convoi, un village) à macro (le continent)
