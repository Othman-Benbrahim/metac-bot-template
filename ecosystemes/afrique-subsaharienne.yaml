    Soudan 12,3 millions, RDC 6,5, Somalie 4,4, Nigeria 4,1, Burkina Faso 4,0 (probablement sous-compté), Mali 0,87
    (ACSS d'après le HCR et l'OIM, 15 septembre 2026)
  - sept pays font environ 85 % du total ; le conflit en est le moteur dominant (même source)
