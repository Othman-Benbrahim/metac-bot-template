- id: independants
  nom: Médias indépendants (plus petits réseaux)
  organisation: societe
  elements:
  - médias financés par leurs lecteurs, des fondations ou des dons, sans grand actionnaire industriel ; audience plus
    réduite, réseau de diffusion plus petit
  - fin de l'aide américaine au journalisme indépendant à l'étranger avec la suppression de l'USAID (Carnegie, avril 2026)
  niveau:
    espace: pays
    temps: années
    vitesse: jours
    taille: micro à méso
