# 0.10.447 — fiche créée le 2026-11-22 (remarque de l'auteur, 8 h 20 : « après les dirigeants, introduire les moyens de
# diffusion de l'information : internet (réseaux sociaux, liés aux MANGO), jeux vidéo, presse et littérature (exemple
# français, où l'on a déjà des noms de patrons et leur lien avec les journaux), télévision et cinéma (Hollywood, Bollywood,
# etc.), liés aux grandes chaînes de diffusion internationales, opposés aux diffuseurs indépendants, qui ont un plus petit
# réseau ; nommer les dirigeants de ces médias quand c'est possible »). Les dirigeants sont dans acteurs-nommes.yaml.
# Déclaration d'intérêt : l'une des deux définitions de MANGO inclut Anthropic, qui développe le modèle d'IA qui a écrit
# cette fiche. Chiffres vérifiés le 2026-11-22. Relations à vérifier sur sources.
theme: medias-diffusion
nom: Moyens de diffusion de l'information (plateformes, presse, télévision, cinéma, jeux vidéo)
declaration:
  but: 'comprendre par où passent l''information et les récits, et qui possède ces canaux : les réseaux sociaux et vidéo
    sont devenus la première source d''information (54 % des personnes interrogées, devant la télévision à 52 % et les
    sites d''information à 51 %, Reuters Institute, juin 2026) ; Meta touche 3,64 milliards de personnes par jour ; les
    jeux vidéo pèsent 213,9 milliards de dollars et 3,7 milliards de joueurs ; en France, une poignée de grandes fortunes
    possède l''essentiel des médias privés ; face à eux, les médias indépendants ont de plus petits réseaux'
  limites: dedans les plateformes sociales et vidéo, les géants de la technologie et de l'IA, les créateurs et
    influenceurs, les jeux vidéo, la presse, l'édition, la télévision, le cinéma et les séries, les diffuseurs
    internationaux et agences, les médias indépendants, la propriété des médias ; dehors les récits et la désinformation
    eux-mêmes, la censure et les coupures (information-cyber), les mécanismes psychologiques de l'opinion (humain), sauf
    par les ponts
  observateur: notre carte, regard extérieur, sources publiques (Reuters Institute, résultats publiés des entreprises,
    Newzoo, RSF, presse) ; personnalités publiques dans leur rôle public seulement ; déclaration d'intérêt ci-dessus
  date: '2026-11-22'
  espace: le pays, la langue, le monde
  temps: de l'heure (une publication virale) à la décennie (une concentration, un empire médiatique)
  vitesse: l'heure, le jour, l'année
  taille: micro (un créateur) à macro (une plateforme mondiale)
compartiments:
- id: plateformes_sociales
  nom: Réseaux sociaux et plateformes vidéo
  organisation: technique
  elements:
  - Meta (Facebook, Instagram, WhatsApp, Messenger) - 3,64 milliards de personnes actives par jour en moyenne en
    septembre 2026, +3 % sur un an (Meta, résultats du troisième trimestre, 21 octobre 2026)
  - TikTok - activité américaine confiée en janvier 2026 à une coentreprise majoritairement américaine (ByteDance 19,9 %,
    Oracle 15 %, Silver Lake 15 %, MGX d'Abou Dhabi 15 %), dirigée par Adam Presser (Fortune, 24 janvier 2026)
  - YouTube (Google), X (Elon Musk)
  - réseaux sociaux et vidéo, première source d'information - 54 % des sondés dans 48 pays ; 30 % en font leur source
    principale (22 % cinq ans plus tôt) ; 12 % ne s'informent que par eux (Reuters Institute, Digital News Report 2026)
  acteurs:
