    statut: a_brancher
- id: proprietaires
  nom: Propriétaires des médias (concentration, l'exemple français)
  organisation: economie
  elements:
  - Vincent Bolloré - Canal+, CNews, Europe 1, Le Journal du dimanche, Paris Match, Prisma Media ; Bernard Arnault - Les
    Échos, Le Parisien, L'Opinion, L'Agefi ; Daniel Kretinsky - Elle, Marianne, Franc-Tireur, part du Monde et de TF1 ;
    Xavier Niel - Le Monde, Nice-Matin ; Rodolphe Saadé - La Provence, La Tribune, BFMTV et RMC (depuis 2024), Brut ;
    famille Dassault - Le Figaro ; François Pinault - Le Point ; Bouygues - TF1 (Boursorama, 2023 ; JDN pour BFMTV et
    RMC ; carte « Médias français, qui possède quoi ? », Le Monde diplomatique et Acrimed)
  - liberté de la presse - la France 25e, les États-Unis 64e (−7) ; plus de la moitié des pays en situation « difficile »
    ou « très grave », une première (RSF, classement 2026)
  niveau:
    espace: pays
    temps: décennies
    vitesse: années
    taille: macro
