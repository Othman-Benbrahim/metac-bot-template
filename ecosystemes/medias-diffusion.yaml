- id: television
  nom: Télévision
  organisation: societe
  elements:
  - télévision comme source d'information - 52 % des sondés, −13 points depuis 2020 (Reuters Institute, 2026)
  - en France, TF1 (Bouygues), M6, BFMTV (Saadé), CNews (Bolloré), et l'audiovisuel public
  niveau:
