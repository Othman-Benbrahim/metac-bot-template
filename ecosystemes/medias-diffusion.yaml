- id: diffuseurs_internationaux
  nom: Diffuseurs internationaux et agences de presse
  organisation: geopolitique
  elements:
  - agences mondiales (AFP, Reuters, AP) qui alimentent les autres médias
  - diffuseurs publics ou d'État tournés vers l'étranger - BBC World Service, France Médias Monde, CGTN (65 langues,
    RSF), RT, Al Jazeera ; arrêt de Voice of America par l'administration Trump pendant que la Russie et la Chine
    maintiennent leurs diffuseurs (Business Insider)
  niveau:
    espace: monde
    temps: années
