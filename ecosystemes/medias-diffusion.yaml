- id: cinema_series
  nom: Cinéma et séries (Hollywood, Bollywood, Nollywood…)
  organisation: ideologie
  elements:
  - Hollywood - Paramount a finalisé le rachat de Warner Bros. Discovery pour 81 milliards de dollars le 6 octobre 2026,
    le groupe prenant le nom de Skydance (AP) ; Josh D'Amaro patron de Disney depuis le 18 mars 2026 (Fox Business)
  - Inde - 13 395 crores de roupies au box-office en 2025, dont 5 504 pour Bollywood (41 %), un record (Ormax, repris par
    The Hollywood Reporter India)
  - Nigeria (Nollywood) - 1 185 films classés par l'office national de classification en 2025 (Premium Times)
  niveau:
