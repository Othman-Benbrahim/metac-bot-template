    statut: a_brancher
  - &id001
    source: situations observées (lecteur-local, comptes/situations.jsonl)
    statut: a_brancher
- id: geants_mango
  nom: Géants de la technologie et de l'IA (« MANGO »)
  organisation: economie
  elements:
  - MANGO, sigle de 2025-2026 qui succède à FAANG ; deux définitions circulent - Microsoft, Anthropic, Nvidia, Google
    DeepMind, OpenAI (Axios) ; Meta, Apple, Nvidia, Google, OpenAI (autres analystes)
  - agents conversationnels (IA) utilisés chaque semaine pour s'informer par 10 % des sondés (16 % des moins de 35 ans) ;
    20 % font confiance à leurs réponses (Reuters Institute, 2026)
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: macro
  traces:
  - *id001
- id: createurs
  nom: Créateurs et influenceurs
  organisation: societe
  elements:
  - 27 % s'informent auprès de créateurs ou d'influenceurs centrés sur l'actualité, 46 % auprès de créateurs de tout type
    (Reuters Institute, 2026)
  niveau:
    espace: pays et langues
    temps: mois
    vitesse: heures
    taille: micro à méso
  traces:
  - *id001
- id: jeux_video
  nom: Jeux vidéo
  organisation: technique
  elements:
  - 213,9 milliards de dollars de revenus prévus en 2026 (+6,1 %), 3,70 milliards de joueurs ; mobile 57 % ; Chine 58,1
    milliards, États-Unis 53,5 milliards (Newzoo, 11 septembre 2026)
  - Tencent, premier éditeur mondial - 241,6 milliards de yuans de revenus de jeux en 2025 (résultats annuels de Tencent,
    repris par la presse financière, à recouper)
  - les jeux, aussi canaux de récits, de communautés et de diffusion en direct
  niveau:
    espace: monde
    temps: années
    vitesse: mois
    taille: micro à macro
