theme: energie-mondiale
nom: Énergie mondiale (pétrole et gaz)
declaration:
  but: comprendre ce qui fait le prix et la disponibilité du pétrole et du gaz dans le monde, et ce qu'ils transmettent aux autres écosystèmes (questions du tournoi sur le Brent, l'inflation, les sanctions,
    les détroits)
  limites: dedans la production, la demande, les stocks, le transport, le raffinage, les marchés, les décisions des producteurs et les sanctions ; dehors l'électricité et les renouvelables (seulement comme
    tendance de fond), le charbon, la géologie des gisements
  observateur: notre bot et nos sources ouvertes, regard extérieur, depuis l'Europe ; données publiques seulement
  date: 2026-11-19
  espace: le monde, avec ses points de passage (détroits, oléoducs, terminaux de gaz liquéfié)
  temps: de la séance de marché à la décennie (cycles d'investissement, transition énergétique) ; mémoire des chocs de 1973, 1979, 1990, 2008, 2020, 2022
  vitesse: la minute (marchés), la semaine (stocks publiés), le mois (décisions des producteurs), l'année (investissements)
  taille: une raffinerie, un pays producteur, le marché mondial
compartiments:
- id: production
  nom: Production
  organisation: economie
  elements:
  - pays de l'OPEP+ et leurs quotas
  - pétrole de schiste américain
  - Russie
  - capacité de production inutilisée (surtout dans le Golfe)
  niveau:
    espace: bassins producteurs
    temps: décisions mensuelles ; forages sur des mois
    vitesse: mois
    taille: macro
  acteurs:
  - nom: un puits de schiste
    taille: micro
    espace: site
    vitesse: mois
    organisation: technique
    facette: non_humain
  - nom: Arabie saoudite
    taille: macro
    espace: mondial
    vitesse: mois
    organisation: geopolitique
    facette: collectif
  - nom: OPEP+
    taille: macro
    espace: mondial
    vitesse: mois
    organisation: geopolitique
    facette: collectif
  traces:
  - source: production de brut américaine (EIA WCRFPUS2)
    statut: collecte
    adaptateur: eia:WCRFPUS2
  - source: communiqués des réunions de l'OPEP+
    statut: a_brancher
  - source: nombre de forages actifs (publication hebdomadaire publique)
    statut: a_brancher
- id: demande
  nom: Demande
  organisation: economie
  elements:
  - Chine
  - Inde
  - pays de l'OCDE
  - saisons (conduite estivale
  - chauffage hivernal)
  - activité économique
  niveau:
    espace: grandes économies
    temps: saisons ; cycles économiques
    vitesse: mois
    taille: macro
  traces:
  - source: produits pétroliers livrés aux États-Unis, demande apparente (EIA WRPUPUS2)
    statut: collecte
    adaptateur: eia:WRPUPUS2
  - source: prévision immédiate de l'inflation et indicateurs d'activité
    statut: collecte
    fichier: collecte_nowcast_inflation.py
  - source: calendrier des statistiques chinoises
    statut: collecte
    fichier: collecte_calendrier_nbs.py
- id: stocks
  nom: Stocks
  organisation: economie
  elements:
  - stocks commerciaux
  - réserves stratégiques (américaines et autres)
  - stockage flottant
  niveau:
    espace: pays consommateurs
    temps: publication hebdomadaire
    vitesse: semaines
    taille: macro
  acteurs:
  - nom: réserve stratégique américaine
    taille: macro
    espace: pays
    vitesse: semaines
    organisation: statut
    facette: collectif
  traces:
  - source: stocks de brut américains hors réserve stratégique (EIA WCESTUS1), variation sur un an
    statut: collecte
    adaptateur: eia:WCESTUS1:var52
  - source: réserve stratégique américaine (EIA WCSSTUS1)
    statut: collecte
    adaptateur: eia:WCSSTUS1
- id: transport
  nom: Transport
  organisation: technique
  elements:
  - détroits (Ormuz
  - Bab-el-Mandeb
  - Malacca)
  - canal de Suez
  - oléoducs
  - méthaniers
  - fret
  niveau:
    espace: routes mondiales
    temps: traversées de jours à semaines
    vitesse: jours
    taille: méso à macro
  traces:
  - source: IMF PortWatch (pétroliers à Bab-el-Mandeb)
    statut: collecte
    fichier: collecte_portwatch.py
    adaptateur: portwatch:bab_el_mandeb:petroliers
  - source: avis aux navigateurs
    statut: collecte
    fichier: collecte_avis_navigation.py
- id: raffinage
  nom: Raffinage
  organisation: technique
  elements:
  - capacités de raffinage
  - marges
  - arrêts (incidents
  - maintenance
  - attaques de drones)
  niveau:
    espace: grands pôles de raffinage
    temps: maintenance saisonnière
    vitesse: jours à mois
    taille: méso
  traces:
  - source: feux actifs sur les sites industriels (FIRMS)
    statut: collecte
    fichier: collecte_feux.py
- id: prix
  nom: Prix et marchés
  organisation: economie
  elements:
  - Brent
  - WTI
  - prix du gaz (Europe
  - Asie)
  - contrats à terme
  - positions des fonds
  - dollar
  niveau:
    espace: marchés mondiaux
    temps: séances quotidiennes
    vitesse: minutes à semaines
    taille: macro
  acteurs:
  - nom: un fonds spéculatif
    taille: méso
    espace: mondial
    vitesse: minutes
    organisation: economie
    facette: collectif
  - nom: les contrats à terme sur le Brent
    taille: macro
    espace: mondial
    vitesse: minutes
    organisation: convention
    facette: non_humain
  traces:
  - source: prix quotidien du Brent (FRED)
    statut: collecte
    fichier: collecte_fred.py
    adaptateur: fred:DCOILBRENTEU
- id: decisions
  nom: Décisions et conventions
  organisation: convention
  elements:
  - quotas de l'OPEP+
  - sanctions et plafonds de prix
  - ventes de réserves stratégiques
  - taxes et subventions
  niveau:
    espace: États et cartels
    temps: réunions et textes datés
    vitesse: semaines à mois
    taille: macro
  traces:
  - source: listes de sanctions visant la Russie
    statut: collecte
    fichier: collecte_sanctions.py
    adaptateur: sanctions:RU
  - source: Federal Register
    statut: collecte
    fichier: collecte_federal_register.py
- id: conflits
  nom: Conflits et sécurité des approvisionnements
  organisation: geopolitique
  elements:
  - guerres touchant producteurs ou routes
  - frappes sur les infrastructures
  - saisies de navires
  niveau:
    espace: régions productrices et routes
    temps: incidents
    vitesse: heures à jours
    taille: méso
  traces:
  - source: GDELT, paires d'États
    statut: collecte
    fichier: gdelt_bq.py
  - source: avions d'État
    statut: collecte
    fichier: collecte_avions_etat.py
- id: climat
  nom: Climat et saisons
  organisation: meteo
  elements:
  - hivers froids ou doux
  - ouragans dans le golfe du Mexique
  - vagues de chaleur
  niveau:
    espace: régionale
    temps: saisons
    vitesse: jours (tempêtes) à saisons
    taille: méso à macro
  traces:
  - source: anomalie de température à Berlin (chauffage européen, GHCN-Daily)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:berlin
  - source: anomalie de température à Houston (golfe du Mexique, GHCN-Daily)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: meteo:houston
- id: recits
  nom: Récits et anticipations
  organisation: societe
  elements:
  - déclarations des producteurs
  - prévisions des agences
  - couverture médiatique
  - sentiment des marchés
  niveau:
    espace: médiatique mondial
    temps: cycle de l'information
    vitesse: heures
    taille: micro à macro
  traces:
  - source: GDELT
    statut: collecte
    fichier: collecte_gdelt.py
  - source: routines officielles
    statut: collecte
    fichier: collecte_routines.py
  - source: pages vues de l'article Petroleum
    statut: collecte
    adaptateur: wikipedia:Petroleum
- id: chimie_combustion
  nom: Chimie de la combustion
  organisation: chimique
  elements:
  - carbone rejeté
  - soufre des carburants
  - méthane des fuites
  acteurs:
  - nom: le carbone accumulé dans l'atmosphère
    taille: macro
    espace: mondial
    vitesse: décennie
    organisation: chimique
    facette: non_humain
  niveau:
    espace: mondial
    temps: accumulation sur des décennies
    vitesse: années à décennies
    taille: macro
  traces:
  - source: émissions mondiales de CO2 (Global Carbon Project, données publiques)
    statut: a_brancher
- id: nucleaire_civil
  nom: Nucléaire civil
  organisation: atomique
  elements:
  - centrales nucléaires
  - disponibilité des réacteurs
  - combustible (uranium)
  - décisions d'arrêt ou de relance
  acteurs:
  - nom: un réacteur
    taille: méso
    espace: site
    vitesse: mois
    organisation: atomique
    facette: non_humain
  niveau:
    espace: pays producteurs d'électricité nucléaire
    temps: décennies d'exploitation ; arrêts de quelques mois
    vitesse: mois à décennies
    taille: méso à macro
  traces:
  - source: base publique des réacteurs de l'AIEA (PRIS)
    statut: a_brancher
- id: climat_regime
  nom: Climat (régime de long terme)
  organisation: climat
  elements:
  - réchauffement moyen
  - hivers plus doux, étés plus chauds
  - fréquence des extrêmes
  niveau:
    espace: mondial
    temps: décennies
    vitesse: décennie
    taille: macro
  traces:
  - source: dérive annuelle de la température à Berlin (GHCN-Daily, station au sol)
    statut: collecte
    fichier: collecte_meteo.py
    adaptateur: climat:berlin
relations:
- de: production
  vers: prix
  effet: '-'
  delai: semaines à mois
  force: forte
  intensite:
    mesure: capacité inutilisée restante
    regle: seuil
  coupure: tant qu'il reste une capacité inutilisée, un arrêt est compensé
  statut: a_verifier
  texte: plus de production fait baisser les prix ; quand la capacité inutilisée s'épuise, le moindre arrêt fait bondir les prix
- de: demande
  vers: prix
  effet: +
  delai: mois
  force: forte
  coupure: récession
  statut: a_verifier
  texte: une demande forte fait monter les prix
- de: stocks
  vers: prix
  effet: '-'
  delai: semaines
  force: moyenne
  intensite:
    mesure: niveau des stocks par rapport à la moyenne saisonnière
    regle: saturation
  coupure: stocks bas
  statut: a_verifier
  texte: les stocks amortissent les chocs ; bas, ils n'amortissent plus
- de: transport
  vers: prix
  effet: ±
  delai: jours
  force: forte
  intensite:
    mesure: incidents récents sur les détroits
    regle: seuil
  coupure: routes de contournement
  statut: a_verifier
  texte: un goulet fermé ou menacé fait monter les prix
- de: conflits
  vers: transport
  effet: '-'
  delai: heures à jours
  force: forte
  coupure: escortes, contournements
  statut: a_verifier
  texte: attaques et menaces sur les routes
- de: conflits
  vers: raffinage
  effet: '-'
  delai: jours
  force: moyenne
  coupure: réparations
  statut: a_verifier
  texte: frappes sur les raffineries et terminaux (drones)
- de: raffinage
  vers: prix
  effet: ±
  delai: semaines
  force: moyenne
  coupure: marges et importations de produits
  statut: a_verifier
  texte: un arrêt de raffinage fait monter les produits plus que le brut
- de: decisions
  vers: production
  effet: ±
  delai: mois
  force: forte
  coupure: tricherie sur les quotas
  statut: a_verifier
  texte: les quotas de l'OPEP+ et les sanctions décident de la production réelle
- de: prix
  vers: decisions
  effet: ±
  retour: ±
  delai: semaines à mois
  force: moyenne
  coupure: désaccords entre membres
  statut: a_verifier
  texte: les producteurs réagissent aux prix (baisse de quotas quand les prix chutent) ; boucle de régulation
- de: prix
  vers: demande
  effet: '-'
  delai: mois à années
  force: faible
  coupure: besoins incompressibles
  statut: a_verifier
  texte: des prix hauts finissent par freiner la demande
- de: climat
  vers: demande
  effet: ±
  delai: jours à saisons
  force: moyenne
  intensite:
    mesure: anomalie de température par rapport à la saison
    regle: proportionnelle
  coupure: stocks pleins
  statut: a_verifier
  texte: un hiver froid fait monter la demande de gaz et de fioul
- de: climat
  vers: production
  effet: '-'
  delai: jours
  force: moyenne
  coupure: hors saison des ouragans
  statut: a_verifier
  texte: ouragans dans le golfe du Mexique, arrêts de plateformes
- de: recits
  vers: prix
  effet: ±
  delai: heures
  force: moyenne
  intensite:
    mesure: tension géopolitique du moment
    regle: proportionnelle
  coupure: démenti
  statut: a_verifier
  texte: annonces et menaces bougent les prix avant les flux
- de: demande
  vers: chimie_combustion
  effet: +
  delai: jours
  force: forte
  coupure: électrification, captage
  statut: a_verifier
  texte: brûler plus d'énergie fossile rejette plus de carbone et de soufre
- de: chimie_combustion
  vers: climat_regime
  effet: +
  delai: décennies
  force: forte
  intensite:
    mesure: concentration accumulée de carbone
    regle: hysteresis
  coupure: inconnue
  statut: a_verifier
  texte: le carbone accumulé réchauffe le climat ; l'effet traverse les niveaux, du chimique au climat, par accumulation lente
- de: climat_regime
  vers: climat
  effet: +
  delai: années
  force: moyenne
  intensite:
    mesure: dérive annuelle de la température
    regle: proportionnelle
  coupure: inconnue
  statut: a_verifier
  texte: le régime climatique rend plus fréquents les hivers anormaux, les vagues de chaleur et les ouragans de la saison
- de: nucleaire_civil
  vers: demande
  effet: '-'
  delai: mois
  force: moyenne
  intensite:
    mesure: part des réacteurs à l'arrêt
    regle: seuil
  coupure: inconnue
  statut: a_verifier
  texte: des réacteurs disponibles réduisent le besoin de gaz pour l'électricité ; des arrêts imprévus le font bondir
- de: decisions
  vers: nucleaire_civil
  effet: ±
  delai: mois à années
  force: moyenne
  coupure: inconnue
  statut: a_verifier
  texte: autorisations, sorties ou relances du nucléaire décident du parc disponible (une convention qui agit sur l'atomique)
- de: transport
  vers: raffinage
  effet: +
  delai: jours
  force: moyenne
  coupure: stocks de brut des raffineries
  statut: a_verifier
  texte: 'au sein du niveau technique : un transport interrompu prive les raffineries de brut'
- de: decisions
  vers: prix
  effet: ±
  delai: jours
  force: moyenne
  intensite:
    mesure: écart de la décision aux attentes
    regle: proportionnelle
  coupure: inconnue
  statut: a_verifier
  texte: une décision ou une sanction publiée bouge le prix avant tout flux physique (convention vers économie)
ponts:
- depuis: transport
  vers: ormuz:navigation
  type: meme
  nature: Ormuz est le premier goulet du système
- depuis: prix
  vers: inflation-mondiale:energie
  type: meme
  nature: l'énergie entre dans l'inflation et dans les décisions des banques centrales
- depuis: decisions
  vers: russie-ukraine:sanctions
  nature: sanctions et plafond de prix sur le pétrole russe
- depuis: demande
  vers: economie-chinoise:activite
  nature: la Chine est le premier importateur
- depuis: climat
  vers: climat-extremes:saisons
  nature: hivers, ouragans, vagues de chaleur
- depuis: transport
  vers: transport-maritime:detroits
  nature: le système des passages maritimes
- depuis: decisions
  vers: politique-americaine:energie
  nature: réserves stratégiques, sanctions, prix à la pompe et élections
identites:
- total: stocks
  termes:
    production: 1
    demande: -1
  texte: 'variation des stocks = production − demande (Schelling, ch. 2 : une identité tient quels que soient les motifs)'
